.filter-select{padding:.55rem .85rem;cursor:pointer;appearance:none;-webkit-appearance:none;padding-right:2rem;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%238892A3' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right .75rem center}
.filters{display:flex;gap:.85rem;flex-wrap:wrap;align-items:center;padding-top:.85rem;border-top:1px dashed var(--line);position:relative;z-index:1}
.filters label{font-family:var(--font-mono);font-size:.66rem;color:var(--tdim);text-transform:uppercase;letter-spacing:.09em;font-weight:500}
.hidden{display:none!important}

.btn,.search-btn{background:linear-gradient(180deg, color-mix(in oklab, var(--accent), white 6%) 0%, var(--accent) 100%);color:var(--s0);padding:.7rem 1.35rem;border:none;border-radius:var(--r-sm);font-family:var(--font-body);font-size:.85rem;font-weight:600;cursor:pointer;text-align:center;letter-spacing:-.005em;transition:all var(--tf) var(--ease);box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 0 0 1px color-mix(in oklab, var(--accent), black 15%), var(--shadow-sm)}

.btn:hover,.search-btn:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 0 0 1px color-mix(in oklab, var(--accent), black 15%), 0 8px 20px -6px color-mix(in oklab, var(--accent), transparent 40%)}
.btn-secondary{background:var(--s3);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 0 0 1px var(--line-strong), var(--shadow-sm)}
.btn-secondary:hover{background:var(--s4)}
.btn-danger{background:linear-gradient(180deg, color-mix(in oklab, var(--error), white 6%) 0%, var(--error) 100%);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

#editorBtn{background:linear-gradient(180deg, color-mix(in oklab, var(--accent-2), white 6%) 0%, var(--accent-2) 100%);color:var(--s0);border:none;border-radius:var(--r-sm);padding:.7rem 1.2rem;font-family:var(--font-body);font-size:.85rem;font-weight:600;cursor:pointer;display:none;align-items:center;gap:.5rem;letter-spacing:-.005em;transition:all var(--tf) var(--ease);white-space:nowrap}
#randomBtn{background:var(--s3);color:var(--text);border:none;border-radius:var(--r-sm);padding:.7rem 1.2rem;font-family:var(--font-body);font-size:.85rem;font-weight:600;cursor:pointer;display:none;align-items:center;gap:.5rem;white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(268px, 1fr));gap:1rem;margin-bottom:2rem}
.card{background:var(--bg-card);border:var(--border-w) solid var(--line);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative;transition:transform var(--tn) var(--ease), border-color var(--tn) var(--ease), box-shadow var(--tn) var(--ease);box-shadow:var(--shadow-md);animation:fadeUp .45s var(--ease-out) both;will-change:transform}
.card:hover{transform:translateY(-3px);border-color:color-mix(in oklab, var(--line-strong), var(--accent) 25%);box-shadow:var(--shadow-lg)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card-image{width:100%;height:170px;object-fit:cover;background:var(--s4);border-bottom:var(--border-w) solid var(--line);display:block}
.card-image.skin{object-fit:contain;padding:1rem .5rem;background:radial-gradient(ellipse at center, var(--s3) 0%, var(--s4) 100%);image-rendering:pixelated}
.card-content{padding:.95rem 1.1rem 1.15rem;flex:1;display:flex;flex-direction:column;position:relative}
.card-title{font-family:var(--font-display);font-size:.98rem;font-weight:600;letter-spacing:-.015em;line-height:1.3;margin-bottom:.4rem;word-break:break-word;padding-right:1.5rem;color:var(--text)}
.card:hover .card-title::after{content:'→';position:absolute;top:.95rem;right:1.1rem;font-family:var(--font-mono);font-size:.9rem;color:var(--accent);animation:arrowIn .25s var(--ease-out)}
.card-description{color:var(--tdim);font-size:.82rem;line-height:1.5;margin-bottom:.9rem;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-flex;align-items:center;align-self:flex-start;gap:.4rem;background:color-mix(in oklab, var(--s0), var(--s2) 30%);color:var(--tdim);border:1px solid var(--line);font-family:var(--font-mono);font-size:.62rem;font-weight:500;text-transform:uppercase;letter-spacing:.09em;padding:.25rem .55rem;border-radius:var(--r-sm);margin-bottom:.85rem}
.tag::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);flex-shrink:0}
.card-stats{display:flex;justify-content:space-between;gap:.5rem;font-family:var(--font-mono);font-size:.68rem;color:var(--tdim2);padding-top:.7rem;border-top:1px dashed var(--line);letter-spacing:.01em}

.skeleton-card{cursor:default!important;pointer-events:none}
.skeleton-shimmer{background:linear-gradient(90deg, var(--s3) 25%, var(--s4) 50%, var(--s3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:1000;overflow-y:auto;animation:fadeIn .2s var(--ease)}

.modal-content{background:var(--s2);border:var(--border-w) solid var(--line-strong);border-radius:var(--r-xl);max-width:900px;width:100%;max-height:90vh;overflow-y:auto;animation:fadeUp .3s var(--ease-out);box-shadow:var(--shadow-lg)}

.modal-header{padding:1.5rem 2rem;border-bottom:var(--border-w) solid var(--line);display:flex;justify-content:space-between;gap:1rem;align-items:center;background:color-mix(in oklab, var(--s2), var(--s0) 25%)}
.modal-title{font-family:var(--font-display);font-size:1.5rem;font-weight:700;line-height:1.3;word-break:break-word}
.modal-close{background:none;border:none;color:var(--tdim);font-size:2rem;cursor:pointer;width:40px;height:40px;border-radius:50%;flex-shrink:0;transition:all var(--tf) var(--ease);display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--s3);color:var(--text);transform:rotate(90deg)}
.modal-body{padding:2rem}
.modal-3d-viewport{width:100%;height:400px;background:linear-gradient(135deg, var(--s3), var(--s4));border-radius:var(--r);margin-bottom:1.5rem;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;border:var(--border-w) solid var(--line)}

.modal-description{color:var(--tdim);line-height:1.7;margin-bottom:1.5rem;white-space:pre-line}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.version-picker{background:var(--s3);border-radius:var(--r);padding:1rem 1.25rem;margin-bottom:1.5rem;display:flex;flex-direction:column;gap:.75rem;border:var(--border-w) solid var(--line)}
.version-picker-title{font-size:.9rem;color:var(--tdim);display:flex;justify-content:space-between;align-items:center;gap:.75rem}
.version-picker-row{display:flex;gap:.75rem;flex-wrap:wrap}
.version-picker select{flex:1;min-width:140px}
#toggleVersionMode{background:var(--s3)!important;border:1px solid var(--line-strong)!important;color:var(--text)!important;font-family:var(--font-mono)!important;font-size:.7rem!important;padding:.35rem .7rem!important;border-radius:var(--r-sm)!important;cursor:pointer;white-space:nowrap}

.error{text-align:center;padding:2rem;font-size:1.1rem;color:var(--error);background:var(--s2);border-radius:var(--r);border:var(--border-w) solid color-mix(in oklab, var(--error), transparent 70%)}

.settings-panel{position:fixed;bottom:1.5rem;left:1.5rem;z-index:3000;display:flex;flex-direction:column;gap:.5rem;align-items:flex-start}

.settings-menu{background:var(--s2);padding:1.25rem;border-radius:var(--r-lg);border:var(--border-w) solid var(--line-strong);opacity:0;transform:translateY(10px) scale(.97);pointer-events:none;transition:all var(--tn) var(--ease);min-width:340px;max-width:90vw;box-shadow:var(--shadow-lg);max-height:80vh;overflow-y:auto}

.settings-label{font-family:var(--font-mono);font-size:.66rem;color:var(--tdim);text-transform:uppercase;letter-spacing:.1em;font-weight:500;margin-bottom:.6rem;display:flex;align-items:center;gap:.4rem}

.style-grid{display:grid;grid-template-columns:repeat(5, 1fr);gap:.4rem;margin-bottom:.65rem}
.style-opt{background:var(--s0);border:var(--border-w) solid var(--line);border-radius:var(--r-sm);padding:.55rem .3rem .45rem;cursor:pointer;transition:all var(--tf) var(--ease);display:flex;flex-direction:column;align-items:center;gap:.3rem;font-family:var(--font-mono);font-size:.56rem;color:var(--tdim);text-transform:lowercase;letter-spacing:0;min-width:0;position:relative;overflow:hidden}
.style-opt:hover{background:var(--s3);color:var(--text)}
.style-opt.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 2px color-mix(in oklab, var(--accent), transparent 70%)}
.style-preview{width:24px;height:24px;display:block;background:var(--s3);border:1px solid var(--line-strong);position:relative;flex-shrink:0}

.style-opt[data-style="terminal"] .style-preview{border-radius:0;background:#4ADE80;border-color:#4ADE80}

.style-opt[data-style="dev"] .style-preview{border-radius:2px;background:var(--s4)}

.theme-grid{display:grid;grid-template-columns:repeat(5, 1fr);gap:.4rem;margin-bottom:.65rem}

.theme-opt.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

.theme-opt[data-theme="dark"]{background:linear-gradient(135deg,#04060A 50%,#38BDF8)}
.theme-opt[data-theme="midnight"]{background:linear-gradient(135deg,#02030A 50%,#818CF8)}

.theme-opt[data-theme="ocean"]{background:linear-gradient(135deg,#03101C 50%,#06B6D4)}

.add-theme-btn{width:100%;background:var(--s3);color:var(--text);border:2px dashed var(--s4);border-radius:var(--r-sm);padding:.6rem;cursor:pointer;font-size:.85rem;font-weight:600;transition:all var(--tf) var(--ease)}
.add-theme-btn:hover{background:var(--s4);border-color:var(--accent);color:var(--accent)}
.settings-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:.5rem 0;color:var(--text);font-size:.9rem;cursor:pointer;user-select:none}
.switch{position:relative;width:42px;height:24px;background:var(--s4);border-radius:var(--r-sm);transition:background var(--tn) var(--ease);flex-shrink:0;border:var(--border-w) solid var(--line)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:var(--text);border-radius:var(--r-sm);transition:transform var(--tn) var(--ease)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px);background:var(--s0)}
.color-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.5rem}
.color-row label{color:var(--tdim);font-size:.85rem;flex:1}

.confirm-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:4000;align-items:center;justify-content:center;padding:2rem}

.editor-header-actions{display:flex;gap:.5rem;flex-wrap:wrap}

.editor-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:2rem;align-items:start}
@media(max-width:1000px){.editor-layout{grid-template-columns:1fr}}
.editor-canvas-area{position:relative;border-radius:var(--r);min-height:560px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:1rem;flex-direction:column;background-size:100% 100%;image-rendering:pixelated;border:var(--border-w) solid var(--line-strong);transition:background .3s ease}
.editor-canvas-area[data-editor-bg="theme"]{background:radial-gradient(ellipse at 30% 20%, color-mix(in oklab, var(--accent), transparent 55%) 0%, transparent 60%),radial-gradient(ellipse at 70% 80%, color-mix(in oklab, var(--accent-2), transparent 60%) 0%, transparent 60%),linear-gradient(180deg, var(--s3), var(--s4))!important;background-size:100% 100%!important}

.editor-canvas-area[data-editor-bg="sunset"]{background:radial-gradient(ellipse 140px 50px at 30% 20%, rgba(255,255,255,.3) 48%, transparent 50%),radial-gradient(ellipse 100px 40px at 70% 28%, rgba(255,255,255,.25) 48%, transparent 50%),linear-gradient(to bottom, #FF7E5F 0%, #FEB47B 40%, #6A3093 75%, #2D1B4E 100%)}
.editor-canvas-area[data-editor-bg="night"]{background:radial-gradient(circle at 15% 15%, #fff 1.5px, transparent 2px),radial-gradient(circle at 32% 22%, #fff 1px, transparent 2px),radial-gradient(circle at 58% 12%, #fff 2px, transparent 2.5px),radial-gradient(circle at 78% 28%, #fff 1.5px, transparent 2px),radial-gradient(circle at 45% 38%, #fff 1px, transparent 2px),radial-gradient(circle at 88% 18%, #fff 1.5px, transparent 2px),radial-gradient(circle at 22% 45%, #fff 1px, transparent 2px),linear-gradient(to bottom, #0B1026 0%, #1B2346 50%, #2D1B4E 100%)}
.editor-canvas-area[data-editor-bg="sakura"]{background:radial-gradient(ellipse 110px 40px at 25% 15%, rgba(255,255,255,.4) 48%, transparent 50%),radial-gradient(ellipse 80px 30px at 80% 25%, rgba(255,255,255,.35) 48%, transparent 50%),linear-gradient(to bottom, #F5B7C1 0%, #FADADD 40%, #C7A8C4 75%, #8B6D93 100%)}
.editor-canvas-area[data-editor-bg="none"]{background:linear-gradient(135deg, var(--s3), var(--s4))}
.editor-canvas-area[data-editor-bg="custom"]{background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important}
.editor-canvas-area::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0,0,0,.04) 3px 4px),repeating-linear-gradient(to right, transparent 0 3px, rgba(0,0,0,.04) 3px 4px);mix-blend-mode:multiply}
.editor-bg-picker-bar{display:flex;gap:.4rem;align-items:center;background:var(--s3);padding:.5rem .75rem;border-radius:var(--r-sm);border:1px solid var(--line);margin-bottom:1rem;width:fit-content;flex-wrap:wrap}
.editor-bg-label{font-family:var(--font-mono);font-size:.7rem;color:var(--tdim);letter-spacing:.1em;padding-right:.35rem}
.editor-bg-picker-bar .editor-bg-btn{width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--line);cursor:pointer;padding:0;position:relative;transition:all var(--tf) var(--ease);background:transparent}
.editor-bg-picker-bar .editor-bg-btn:hover{transform:scale(1.08);border-color:var(--accent)}
.editor-bg-picker-bar .editor-bg-btn.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.editor-bg-picker-bar .editor-bg-btn[data-bg="theme"]{background:linear-gradient(135deg, color-mix(in oklab, var(--accent), white 15%) 0%, color-mix(in oklab, var(--accent-2), white 15%) 100%)}
.editor-bg-picker-bar .editor-bg-btn[data-bg="biome"]{background:linear-gradient(to bottom,#4FA8DE 0%,#6FC0EA 45%,#5EAE3E 56%,#4A9030 62%,#7A4C24 65%,#5E3A1A 100%)}

function safeUrl(u){try{const x=new URL(u);return x.protocol==='https:'||x.protocol==='http:'?x.href:''}catch{return ''}}
const safeId = v => /^[\w-]{1,64}$/.test(String(v)) ? String(v) : '';

function safeSetLocalStorage(key, val){
  try{

function safeGetLocalStorage(key){try{return localStorage.getItem(key)}catch{return null}}

const pageCache = new Map();
const CACHE_TTL = 5 * 60 * 1000;
function cacheGet(k){
  const e = pageCache.get(k);
  if(!e) return null;
  if(Date.now() - e.ts > CACHE_TTL){ pageCache.delete(k); return null; }
  return e.data;
}
function cacheSet(k,v){
  if(pageCache.size >= 120){ pageCache.delete(pageCache.keys().next().value); }
  pageCache.set(k,{data:v,ts:Date.now()});
}

/* Быстрый fetch с таймаутом 6 сек и 1 попыткой */
async function fetchJson(url, timeoutMs = 6000){
  const ctrl = new AbortController();
  const tm = setTimeout(() => ctrl.abort(), timeoutMs);
  try{
    const r = await fetch(url, {signal: ctrl.signal});
    clearTimeout(tm);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  }catch(e){
    clearTimeout(tm);
    throw e;
  }
}

};

function toast(msg, kind='info', ms=4000){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind==='error'?'error':kind==='ok'?'ok':'');
  el.textContent = msg;
  const container = $('toasts');
  if(!container) return;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity .3s';

const trCache = new Map();
try{
  const raw = safeGetLocalStorage('trCache');
  if(raw) Object.entries(JSON.parse(raw)).forEach(([k,v]) => trCache.set(k,v));
}catch{}

let cacheSaveTimer = null;
function scheduleCacheSave(){
  if(cacheSaveTimer) return;
  cacheSaveTimer = setTimeout(() => {
    try{
      const entries = [...trCache].slice(-300);
      safeSetLocalStorage('trCache', JSON.stringify(Object.fromEntries(entries)));
    }catch{}
    cacheSaveTimer = null;
  }, 2000);
}

const needsTranslation = t => t && t.length > 2 && (t.match(/[а-яё]/gi)||[]).length < t.length * 0.2;

async function translate(text){
  if(!needsTranslation(text)) return text;
  const cut = text.slice(0, 450);
  if(trCache.has(cut)) return trCache.get(cut);
  try{
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q=' + encodeURIComponent(cut));
    if(r.status === 429){
      await new Promise(res => setTimeout(res, 1500));
      throw new Error('rate limited');
    }
    if(!r.ok) throw new Error('translate http ' + r.status);
    const d = await r.json();
    const out = d[0].map(p => p[0]).join('');
    trCache.set(cut, out);
    scheduleCacheSave();
    return out;
  }catch{return text}
}

async function translateQueue(elements, token){
  let idx = 0;
  const worker = async () => {
    while(idx < elements.length && token === reqId){
      const el = elements[idx++];
      if(!el || !el.dataset || !el.dataset.orig) continue;
      const ru = await translate(el.dataset.orig);
      if(token === reqId && document.contains(el)) el.textContent = ru;
      await new Promise(res => setTimeout(res, 80));
    }
  };
  await Promise.all([worker(), worker()]);
}

const STYLE_LIST = [

];

function applyStyle(styleId){
  const valid = STYLE_LIST.some(s => s.id === styleId);
  const id = valid ? styleId : 'default';
  document.documentElement.setAttribute('data-style', id);
  safeSetLocalStorage('mch-style', id);
  $$('.style-opt').forEach(b => b.classList.toggle('active', b.dataset.style === id));
}

function initStyles(){
  const saved = safeGetLocalStorage('mch-style') || 'default';
  applyStyle(saved);
  $$('.style-opt').forEach(b => {
    b.addEventListener('click', () => {
      applyStyle(b.dataset.style);
      toast('Стиль: ' + b.dataset.style, 'ok', 1500);
    });
  });
}

let customThemes = [];
try{
  const raw = safeGetLocalStorage('mch-custom-themes');
  if(raw){
    const arr = JSON.parse(raw);
    if(Array.isArray(arr)){
      customThemes = arr.filter(t =>
        t && typeof t === 'object' &&
        typeof t.id === 'string' &&
        /^custom_[a-z0-9]+$/.test(t.id) &&
        /^[\w\s\-А-Яа-яЁё]{1,24}$/.test(t.name||'') &&
        t.colors && typeof t.colors === 'object'

  }
}catch{customThemes = []}

function saveCustomThemes(){ safeSetLocalStorage('mch-custom-themes', customThemes); }
function hexToRgb(hex){
  const h = hex.replace('#','');
  return {r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16)};
}

function applyTheme(themeId){
  document.documentElement.setAttribute('data-theme', themeId);
  const custom = customThemes.find(t => t.id === themeId);
  if(custom){
    for(const [k,v] of Object.entries(custom.colors)){
      if(isValidHex(v)) document.documentElement.style.setProperty('--' + k, v);
    }
    if(custom.colors.accent){
      const rgb = hexToRgb(custom.colors.accent);
      document.documentElement.style.setProperty('--glow', `rgba(${rgb.r},${rgb.g},${rgb.b},.18)`);
    }
  }else{
    THEME_COLORS.forEach(c => document.documentElement.style.removeProperty('--' + c.key));
    document.documentElement.style.removeProperty('--glow');
  }
}

function renderThemeGrid(){
  const grid = $('themeGrid');

  let html = BUILTIN_THEMES.map(t =>
    `<button class="theme-opt" data-theme="${t.id}" title="${esc(t.name)}"></button>`
  ).join('');

    const c = t.colors;
    const bg = `background:linear-gradient(135deg,${esc(c.s0||'#000')} 50%,${esc(c.accent||'#fff')})`;
    return `<button class="theme-opt custom" data-theme="${t.id}" title="${esc(t.name)}" style="${bg}"><span class="del-badge" data-del="${t.id}">×</span></button>`;

}

  };
  themeEditState = {id: existing ? existing.id : null, colors: {...defaults}, name: existing ? existing.name : ''};
  $('themeModalTitle').textContent = existing ? 'Редактировать тему' : 'Своя тема';

function saveCustomTheme(){
  if(!themeEditState) return;
  const name = ($('ct-name').value || '').trim().slice(0, 24);
  if(!name){ toast('Введи название темы','error'); return; }
  if(!/^[\w\s\-А-Яа-яЁё]{1,24}$/.test(name)){ toast('Только буквы, цифры, пробелы, дефис','error'); return; }
  const id = themeEditState.id || ('custom_' + Math.random().toString(36).slice(2,10));
  if(customThemes.some(t => t.id !== id && t.name.toLowerCase() === name.toLowerCase())){
    toast('Такое имя уже есть','error'); return;
  }
  const colors = {};
  for(const [k,v] of Object.entries(themeEditState.colors)){
    if(isValidHex(v)) colors[k] = v;
  }
  if(Object.keys(colors).length < THEME_COLORS.length){
    toast('Некорректные цвета','error'); return;
  }
  if(themeEditState.id){
    const idx = customThemes.findIndex(t => t.id === id);
    if(idx >= 0) customThemes[idx] = {id, name, colors};
    else customThemes.push({id, name, colors});
  }else{
    customThemes.push({id, name, colors});
  }
  saveCustomThemes();
  renderThemeGrid();
  applyTheme(id);
  safeSetLocalStorage('mch-theme', id);
  toast('Тема сохранена: ' + name,'ok');
  closeThemeEditor(false);
}

function buildModrinthQuery(){
  const cfg = TAB_CONFIG[currentTab];

  const loader = $('loaderSelect').value;
  const facets = [['project_type:' + cfg.type]];

  const qs = new URLSearchParams({query:currentQuery, facets:JSON.stringify(facets), limit:LIMIT, offset, index:sort});
  return {qs, key:['mr',currentTab,currentQuery,sort,mc,loader,offset].join('|')};
}
function buildCurseForgeQuery(){
  const cfg = TAB_CONFIG[currentTab];
  const sort = $('sortSelect').value;
  const sortField = sort === 'downloads' ? '6' : sort === 'updated' ? '3' : sort === 'newest' ? '11' : '2';
  const qs = new URLSearchParams({gameId:'432', classId:cfg.cf, searchFilter:currentQuery, pageSize:LIMIT, index:offset, sortField, sortOrder:'desc'});
  return {qs, key:['cf',currentTab,currentQuery,sort,offset].join('|')};
}

/* ЗЕРКАЛА ПЕРВЫМИ */
async function fetchModrinthPage(){
  const {qs, key} = buildModrinthQuery();
  const cached = cacheGet(key);
  if(cached) return cached;
  const endpoint = `${MR_API}/search?${qs}`;
  const proxies = [
    `${MCIM_MR}/search?${qs}`,
    endpoint,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(endpoint)}`,
    `https://api.cors.lol/?url=${encodeURIComponent(endpoint)}`
  ];
  for(const url of proxies){
    try{
      const data = await fetchJson(url, 6000);
      if(data && data.hits && data.hits.length){
        const result = {list:data.hits.map(i => ({source:'modrinth', ...i})), total:data.total_hits ?? 0};
        cacheSet(key, result);
        return result;
      }
    }catch(e){ console.warn('MR failed:', url.split('/')[2], e.message); }
  }
  return {list: [], total: 0};
}

async function fetchCurseForgePage(){
  const {qs, key} = buildCurseForgeQuery();
  const cached = cacheGet(key);
  if(cached) return cached;
  const endpoints = [
    `${MCIM_API}/mods/search?${qs}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(`${CURSE_TOOLS}/mods/search?${qs}`)}`,
    `${CURSE_TOOLS}/mods/search?${qs}`,
    `${CFPROXY}/v1/mods/search?${qs}`
  ];
  for(const url of endpoints){
    try{
      const data = await fetchJson(url, 6000);
      if(data && data.data && data.data.length){
        const result = {
          list: data.data.map(i => ({source:'curseforge', ...i})),
          total: data.pagination?.totalCount ?? data.data.length
        };
        cacheSet(key, result);
        return result;
      }
    }catch(e){ console.warn('CF failed:', url.split('/')[2], e.message); }
  }
  return {list: [], total: 0};
}

async function loadMore(){
  if(isLoading || !hasMore) return;
  isLoading = true;
  const token = reqId;
  try{
    if(currentTab === 'skins'){
      showSkeletons(8);
      let list = [];
      if(currentQuery && isValidNick(currentQuery)){
        list = [{source:'skin', name:currentQuery}];
        hasMore = false;
      }else if(randomMode){
        list = Array.from({length:SKIN_LIMIT}, () => ({source:'skin', name: randomNick() + Math.floor(Math.random()*999)}));
        hasMore = true;
      }else{
        const page = Math.floor(offset / SKIN_LIMIT) + 1;
        const names = await fetchSkinPage(page);
        list = names.map(n => ({source:'skin', name:n}));
        hasMore = true;
      }
      removeSkeletons();
      if(token !== reqId) return;
      if(!list.length){ hasMore = false; setSentinel('end'); return; }
      appendCards(list, token);
      offset += list.length;
      setSentinel(hasMore ? 'idle' : 'end');
      return;
    }

    showSkeletons(8);
    setSentinel('loading');
    let mrResult = null, cfResult = null, rendered = false;

    const handleMr = async () => {
      try{
        const r = await fetchModrinthPage();
        if(token !== reqId) return null;
        mrResult = r;
        if(r.list.length){
          if(!rendered){ removeSkeletons(); rendered = true; }
          appendCards(r.list, token);
        }
        return r;
      }catch(e){ console.warn('Modrinth:', e.message); return null; }
    };
    const handleCf = async () => {
      try{
        const r = await fetchCurseForgePage();
        if(token !== reqId) return null;
        cfResult = r;
        if(r.list.length){
          if(!rendered){ removeSkeletons(); rendered = true; }
          appendCards(r.list, token);
        }
        return r;
      }catch(e){ console.warn('CurseForge:', e.message); return null; }
    };

    await Promise.all([handleMr(), handleCf()]);
    if(token !== reqId) return;

    removeSkeletons();
    if(!mrResult && !cfResult) throw new Error('Оба источника недоступны');
    const mrTotal = mrResult?.total ?? 0;
    const cfTotal = cfResult?.total ?? 0;
    hasMore = (offset + LIMIT) < Math.max(mrTotal, cfTotal);
    offset += LIMIT;
    setSentinel(hasMore ? 'idle' : 'end');
  }catch(e){
    if(token !== reqId) return;
    console.error(e);
    removeSkeletons();
    hasMore = false;
    const errEl = document.createElement('div');
    errEl.className = 'error';
    errEl.innerHTML = `Не удалось загрузить.<div class="error-detail">${esc(e.message||'')}</div>`;
    $('content').appendChild(errEl);
    setSentinel('');
  }finally{
    if(token === reqId) isLoading = false;
  }
}

const NICK_A = ['Dark','Shadow','Craft','Mine','Sky','Fire','Ice','Dia','Ruby','Pixel','Block','Red','Blue','Gold','Iron','Nether','End','Void','Star','Moon','Sun','Wolf','Dragon','Ninja','Pro','Mega','Ultra','Super','Epic','Frost','Lava','Storm','Thunder','Light','Cyber'];
const NICK_B = ['Killer','Master','Lord','King','Queen','Hunter','Slayer','Warrior','Mage','Wizard','Knight','Sniper','Gamer','Player','Creeper','Zombie','Wolf','Cat','Fox','Bear','Eagle','Falcon','Phoenix','Titan','Hero','Boss','Legend','Miner','Crafter','Builder'];
const NICK_C = ['X','YT','TTV','HD','PRO','GG','MVP','OP','TV','RU','MC','XD','LOL','EQ','PVP'];
function randomNick(){
  const r = Math.random();
  if(r < 0.4) return NICK_A[Math.floor(Math.random()*NICK_A.length)] + NICK_B[Math.floor(Math.random()*NICK_B.length)];
  if(r < 0.7) return NICK_A[Math.floor(Math.random()*NICK_A.length)] + Math.floor(Math.random()*999);
  if(r < 0.9) return NICK_B[Math.floor(Math.random()*NICK_B.length)] + Math.floor(Math.random()*99);
  return NICK_A[Math.floor(Math.random()*NICK_A.length)] + NICK_C[Math.floor(Math.random()*NICK_C.length)];
}

async function fetchSkinPage(page){
  let names = [];
  try{
    const r = await fetch(`${WORKER_URL}/skins/trending?page=${page}`);
    if(r.ok){
      const d = await r.json();
      if(d && Array.isArray(d.names) && d.names.length) names = d.names;
    }
  }catch(e){ console.warn('worker trending failed:', e.message); }

  if(!names.length){
    try{
      const r2 = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent('https://minecraft-api.vercel.app/api/skins')}`);
      if(r2.ok){
        const d2 = await r2.json();
        if(Array.isArray(d2) && d2.length){
          const start = (page - 1) * SKIN_LIMIT;
          for(let i = 0; i < SKIN_LIMIT; i++){
            const item = d2[(start + i) % d2.length];
            const n = (item && (item.name || item.uuid)) ? String(item.name || item.uuid) : '';
            if(n && isValidNick(n)) names.push(n);
          }
        }
      }
    }catch(e){ console.warn('allorigins skins failed:', e.message); }
  }

  if(!names.length){
    for(let i = 0; i < SKIN_LIMIT; i++){
      names.push(randomNick() + Math.floor(Math.random()*99));
    }
  }
  names = names.filter(n => n && typeof n === 'string' && isValidNick(n));
  return names;
}

async function loadSkinDataUrl(sources){
  for(const url of sources){
    if(!url) continue;
    try{
      const dataUrl = await new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          try{
            const cv = document.createElement('canvas');
            cv.width = 64; cv.height = 64;
            const cx = cv.getContext('2d');
            cx.imageSmoothingEnabled = false;
            cx.drawImage(img, 0, 0, 64, 64);
            resolve(cv.toDataURL('image/png'));
          }catch(e){ reject(e); }
        };
        img.onerror = () => reject(new Error('load failed'));
        img.src = url;
      });
      return dataUrl;
    }catch(e){ console.warn('skin source failed:', url.split('?')[0], e.message); }
  }
  return null;
}

function trapFocus(e){
  if(e.key !== 'Tab') return;
  const activeModal = $$('.modal.active').pop();
  if(!activeModal) return;
  const focusables = [...activeModal.querySelectorAll('button:not([disabled]), [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(el => el.offsetParent !== null);
  if(!focusables.length) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}

function createSkinViewer(container, skinUrl, opts = {}){
  if(typeof skinview3d === 'undefined' || typeof THREE === 'undefined') return null;
  try{
    const viewer = new skinview3d.SkinViewer({
      canvas: document.createElement('canvas'),
      width: container.clientWidth || 400,
      height: container.clientHeight || 400,
      skin: skinUrl
    });
    viewer.controls.enableZoom = opts.zoom !== false;
    viewer.controls.enableRotate = true;
    viewer.controls.enablePan = false;
    viewer.camera.position.z = 60;
    if(opts.animation){
      viewer.animation = new skinview3d.WalkingAnimation();
      viewer.animation.speed = 1;
    }
    try{
      viewer.renderer.setClearColor(0x000000, 0);
      viewer.renderer.setClearAlpha(0);
    }catch{}
    viewer.canvas.style.background = 'transparent';
    container.appendChild(viewer.canvas);
    viewer.renderer.setAnimationLoop(() => {
      if(typeof viewer.draw === 'function') viewer.draw();
      else viewer.renderer.render(viewer.scene, viewer.camera);
    });
    return viewer;
  }catch(e){
    console.warn('skinview3d failed:', e);
    return null;
  }
}

let versionMode = 'mod';

async function loadVersions(item){
  const vSel = $('modalVersion');
  const lSel = $('modalLoader');
  if(!vSel) return;
  const id = safeId(item.source === 'modrinth' ? (item.project_id || item.slug) : item.id);
  if(!id) return;
  try{
    let versions = [];
    if(item.source === 'modrinth'){
      const v = await fetchJson(`${MR_API}/project/${id}/version`, 6000);
      versions = (v || []).map(x => ({
        id: x.id, name: x.version_number || x.name || 'unknown',
        type: x.version_type || 'release', date: x.date_published || '',
        mc: x.game_versions || [], loaders: x.loaders || []
      }));
    }else{
      const bases = [MCIM_API, CURSE_TOOLS, CFPROXY];
      for(const base of bases){
        try{
          let idx = 0, guard = 0;
          const collected = [];
          while(guard++ < 20){
            const f = await fetchJson(`${base}/mods/${id}/files?pageSize=50&index=${idx}`, 6000);
            const chunk = f.data || [];
            if(!chunk.length) break;
            collected.push(...chunk.map(x => ({
              id: x.id, name: x.displayName || x.fileName || 'unknown',
              type: (x.releaseType === 1 ? 'release' : x.releaseType === 2 ? 'beta' : 'alpha'),
              date: x.fileDate || '', mc: (x.gameVersions || []).filter(g => /^\d/.test(g)),
              loaders: x.modLoader ? [x.modLoader] : []
            })));
            if(chunk.length < 50 || collected.length >= VERSIONS_MAX) break;
            idx += 50;
          }
          if(collected.length){ versions = collected; break; }
        }catch(e){ console.warn('CF versions failed:', base, e.message); }
      }
    }

    versions.sort((a,b) => (b.date || '').localeCompare(a.date || ''));

    if(!versions.length){
      vSel.innerHTML = '<option value="">Нет версий</option>';
      lSel.innerHTML = '<option value="">—</option>';
      return;
    }

    const mcSet = new Set();
    const loaderSet = new Set();
    versions.forEach(v => {
      v.mc.forEach(m => mcSet.add(m));
      v.loaders.forEach(l => loaderSet.add(l));
    });
    const mcs = [...mcSet].sort((a,b) => compareVersions(b, a));
    const loaders = [...loaderSet].sort();

    renderVersionOptions(versions, mcs, loaders);

    const toggleBtn = $('toggleVersionMode');
    if(toggleBtn && !toggleBtn.__bound){
      toggleBtn.__bound = true;
      toggleBtn.addEventListener('click', () => {
        versionMode = versionMode === 'mod' ? 'game' : 'mod';
        toggleBtn.dataset.mode = versionMode;
        toggleBtn.textContent = versionMode === 'mod' ? 'Режим: версия мода' : 'Режим: версия игры';
        renderVersionOptions(versions, mcs, loaders);
      });
    }
  }catch(e){
    console.warn('loadVersions failed:', e);
    vSel.innerHTML = '<option value="">Ошибка</option>';
    lSel.innerHTML = '<option value="">—</option>';
  }
}

function renderVersionOptions(versions, mcs, loaders){
  const vSel = $('modalVersion');
  const lSel = $('modalLoader');
  if(!vSel) return;
  if(versionMode === 'mod'){
    vSel.innerHTML = versions.map(v => {
      const tag = v.type === 'release' ? '' : v.type === 'beta' ? ' (beta)' : ' (alpha)';
      return `<option value="${esc(v.id)}">${esc(v.name)}${tag}</option>`;
    }).join('');
    const updateMcList = () => {
      const picked = versions.find(v => String(v.id) === String(vSel.value)) || versions[0];
      if(picked && picked.mc.length){
        lSel.innerHTML = picked.mc.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
      }else{
        lSel.innerHTML = '<option value="">—</option>';
      }
    };
    updateMcList();
    vSel.onchange = updateMcList;
  }else{
    vSel.innerHTML = mcs.length ? mcs.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('') : '<option value="">—</option>';
    lSel.innerHTML = '<option value="">Любой</option>' + loaders.map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join('');
    vSel.onchange = null;
  }
}

function compareVersions(a, b){
  const pa = String(a).split('.').map(Number);
  const pb = String(b).split('.').map(Number);
  for(let i = 0; i < Math.max(pa.length, pb.length); i++){
    const d = (pa[i] || 0) - (pb[i] || 0);
    if(d) return d;
  }
  return 0;
}

async function downloadDirect(source, id, btn){
  if(!id){ toast('Некорректный ID','error'); return; }
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Подготовка...';
  try{
    let url = '', filename = 'download';
    if(source === 'skin'){
      url = skinDownloadUrl(id);
      filename = id + '.png';
    }else if(source === 'modrinth'){
      const v = await fetchJson(`${MR_API}/project/${id}/version`);
      if(!v?.length){ toast('Файлы не найдены','error'); return; }
      let pick = null;
      if(versionMode === 'mod'){
        const wantId = $('modalVersion')?.value || '';
        pick = v.find(x => String(x.id) === String(wantId));
      }else{
        const wantMc = $('modalVersion')?.value || '';
        const wantLoader = $('modalLoader')?.value || '';
        pick = v.find(x => (!wantMc || (x.game_versions || []).includes(wantMc)) && (!wantLoader || (x.loaders || []).includes(wantLoader)));
      }
      if(!pick){ toast('Беру последнюю версию','info'); pick = v[0]; }
      const file = (pick.files || []).find(x => x.primary) || (pick.files || [])[0];
      if(!file){ toast('Файл не найден','error'); return; }
      url = file.url;
      filename = file.filename || 'mod.jar';
    }else{
      let pick = null;
      const bases = [MCIM_API, CURSE_TOOLS, CFPROXY];
      if(versionMode === 'mod'){
        const wantId = $('modalVersion')?.value || '';
        for(const base of bases){
          try{
            const f = await fetchJson(`${base}/mods/${id}/files/${wantId}`);
            if(f && f.data){ pick = f.data; break; }
          }catch{}
        }
      }
      if(!pick){
        const wantMc = versionMode === 'game' ? ($('modalVersion')?.value || '') : '';
        const wantLoader = versionMode === 'game' ? ($('modalLoader')?.value || '') : '';
        for(const base of bases){
          try{
            let idx = 0, guard = 0;
            while(guard++ < 20){
              const f = await fetchJson(`${base}/mods/${id}/files?pageSize=50&index=${idx}`);
              const chunk = f.data || [];
              if(!chunk.length) break;
              const found = chunk.find(x => {
                const mcOk = !wantMc || (x.gameVersions || []).includes(wantMc);
                const ldOk = !wantLoader || x.modLoader === wantLoader;
                return mcOk && ldOk;
              });
              if(found){ pick = found; break; }
              if(chunk.length < 50) break;
              idx += 50;
            }
            if(pick) break;
          }catch{}
        }
      }
      if(!pick){
        for(const base of bases){
          try{
            const f0 = await fetchJson(`${base}/mods/${id}/files?pageSize=1&index=0`);
            pick = (f0.data || [])[0];
            if(pick) break;
          }catch{}
        }
      }
      if(!pick){ toast('Файлы не найдены','error'); return; }
      const fid = safeId(pick.id);
      if(!fid){ toast('Некорректный ID','error'); return; }
      filename = pick.fileName || 'mod.jar';
      let dlData = null;
      for(const base of bases){
        try{
          const dl = await fetchJson(`${base}/mods/${id}/files/${fid}/download-url`);
          if(dl && dl.data){ dlData = dl.data; break; }
        }catch(e){ console.warn('download-url failed:', base, e.message); }
      }
      if(!dlData){ toast('Автор запретил скачивание','error'); return; }
      url = dlData;
    }
    const safe = safeUrl(url);
    if(!safe){ toast('Некорректная ссылка','error'); return; }
    const a = document.createElement('a');
    a.href = safe;
    a.download = filename;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('Скачивание: ' + filename,'ok');
  }catch(e){
    console.error(e);
    toast('Ошибка: ' + (e.message || 'не удалось'),'error');
  }finally{
    btn.disabled = false;
    btn.textContent = old;
  }
}

function formatNumber(n){
  n = Number(n) || 0;
  if(n >= 1e6){
    const v = n / 1e6;
    return (v >= 100 ? Math.round(v) : (Math.round(v*10)/10).toString().replace(/\.0$/,'')) + 'M';
  }
  if(n >= 1000){
    const v = n / 1000;
    return (v >= 999.5 ? (Math.round(n/1e5)/10).toString().replace(/\.0$/,'') + 'M' : (Math.round(v*10)/10).toString().replace(/\.0$/,'') + 'K');
  }
  return String(n);
}

              <button class="btn btn-secondary" id="ed-blank" type="button">⬜ Чистое тело</button>
              <button class="btn btn-secondary" id="ed-steve" type="button">👕 Steve</button>
            </div>
          </div>
        </div>
      </div>
      <input type="file" id="ed-file" accept="image/png" hidden>
    </div>`;

  const canvas = document.createElement('canvas');
  canvas.width = SKIN_SIZE;
  canvas.height = SKIN_SIZE;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = false;

  editorState = {
    canvas, ctx,
    activeLayer: 'base',
    tool: 'pencil',
    color: '#38BDF8',
    drawing: false,
    lastPx: null, lastPy: null,
    viewer: null,
    raycaster: null,
    mouseVec: null,
    history: [], historyIdx: -1,
    refreshTimer: null,
    flatCanvas: null,
    flatCtx: null,
    mousemoveThrottle: null,
    _resizeHandler: null
  };

  const palette = [
    '#000000','#3F3F3F','#7F7F7F','#BFBFBF','#FFFFFF',
    '#7F0000','#FF0000','#FF7F00','#FFBF00','#FFFF00',
    '#007F00','#00FF00','#00FF7F','#00FFFF','#007FFF',
    '#0000FF','#7F00FF','#FF00FF','#FF007F','#7F3F00',
    '#D2B48C','#8B4513','#F5DEB3','#FFE4B5','#FFD700',
    '#38BDF8','#6EE7B7','#A78BFA','#F472B6','#FB923C',
    '#1E3A5F','#0F131C','#161D2B','#1E2636','#05070C',
    '#10B981','#EF4444','#F59E0B','#8B5CF6','#EC4899'
  ];
  const palEl = $('ed-palette');
  palette.forEach(c => {
    const b = document.createElement('button');
    b.style.background = c;
    b.type = 'button';
    b.setAttribute('aria-label', 'Color ' + c);
    b.addEventListener('click', () => {

  function setColor(c){
    editorState.color = c;

    $('ed-color-label').textContent = c;
  }

  $('ed-color').addEventListener('input', e => {
    setColor(e.target.value);
    palEl.querySelectorAll('button').forEach(x => x.classList.remove('active'));
  });

  $$('[data-tool]').forEach(b => b.addEventListener('click', () => {
    editorState.tool = b.dataset.tool;
    $$('[data-tool]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  }));

  /* === ФОН === */
  const canvasArea = document.querySelector('.editor-canvas-area');
  const savedBg = safeGetLocalStorage('mch-editor-bg') || 'theme';

  function applyBg(bg){
    if(!canvasArea) return;
    canvasArea.style.backgroundImage = '';
    canvasArea.setAttribute('data-editor-bg', bg);
    if(bg === 'custom'){
      const cur = safeGetLocalStorage('mch-editor-bg-custom');
      if(cur) canvasArea.style.backgroundImage = `url(${cur})`;
    }
    $$('#ed-bg-picker [data-bg]').forEach(x => x.classList.toggle('active', x.dataset.bg === bg));
    safeSetLocalStorage('mch-editor-bg', bg);
  }

  applyBg(savedBg);

  $$('#ed-bg-picker [data-bg]').forEach(b => {
    b.addEventListener('click', (e) => {
      e.preventDefault();
      applyBg(b.dataset.bg);
      toast('Фон: ' + b.dataset.bg, 'ok', 1200);
    });
  });

  const bgUploadBtn = $('ed-bg-upload');
  const bgUploadInput = document.createElement('input');
  bgUploadInput.type = 'file';
  bgUploadInput.accept = 'image/*';
  bgUploadInput.style.display = 'none';
  document.body.appendChild(bgUploadInput);

  bgUploadBtn.addEventListener('click', (e) => {
    e.preventDefault();
    bgUploadInput.click();
  });

  bgUploadInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      if(typeof dataUrl === 'string' && dataUrl.startsWith('data:image/')){
        try{ localStorage.setItem('mch-editor-bg-custom', dataUrl); }
        catch{ toast('Фон слишком большой для сохранения','error'); }
        applyBg('custom');
        toast('Свой фон загружен','ok');
      }
    };
    reader.readAsDataURL(file);
  });

  /* === 3D VIEWER === */
  const ed3d = $('ed-3d');
  let viewer = null;

  const initialSkinUrl = skinName
    ? `https://minotar.net/skin/${encodeURIComponent(skinName)}`
    : 'https://minotar.net/skin/Steve';

  if(typeof skinview3d !== 'undefined' && typeof THREE !== 'undefined'){
    try{
      viewer = new skinview3d.SkinViewer({
        canvas: document.createElement('canvas'),
        width: 400,
        height: 400,
        skin: initialSkinUrl
      });
      viewer.controls.enableZoom = true;
      viewer.controls.enableRotate = true;
      viewer.controls.enablePan = false;
      try{
        viewer.controls.mouseButtons = {
          LEFT: -1,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.ROTATE
        };
        viewer.controls.touches = {
          ONE: -1,
          TWO: THREE.TOUCH.DOLLY_ROTATE
        };
      }catch(e){ console.warn('mouseButtons config failed:', e); }
      viewer.camera.position.z = 70;
      try{
        viewer.renderer.setClearColor(0x000000, 0);
        viewer.renderer.setClearAlpha(0);
      }catch{}
      viewer.canvas.style.background = 'transparent';
      viewer.canvas.style.cursor = 'crosshair';
      viewer.canvas.addEventListener('contextmenu', e => e.preventDefault());
      ed3d.appendChild(viewer.canvas);
      editorState.viewer = viewer;
      editorState.raycaster = new THREE.Raycaster();
      editorState.mouseVec = new THREE.Vector2();
    }catch(e){
      console.warn('viewer failed:', e);
      ed3d.innerHTML = '<p style="color:#fff;padding:2rem;text-align:center;text-shadow:0 2px 4px rgba(0,0,0,.8)">3D недоступно. Работай в режиме «Сетка».</p>';
    }
  }else{
    ed3d.innerHTML = '<p style="color:#fff;padding:2rem;text-align:center;text-shadow:0 2px 4px rgba(0,0,0,.8)">3D недоступно.</p>';
  }

  /* === RESIZE === */
  const doResize = () => {
    if(!editorState?.viewer) return;
    try{
      const r = ed3d.getBoundingClientRect();
      const w = Math.max(300, Math.floor(r.width));
      const h = Math.max(400, Math.floor(r.height));
      editorState.viewer.setSize(w, h);
      if(editorState.viewer.camera){
        editorState.viewer.camera.aspect = w / h;
        editorState.viewer.camera.updateProjectionMatrix();
      }
    }catch(e){ console.warn('setSize failed:', e); }
  };
  setTimeout(doResize, 200);
  setTimeout(doResize, 600);
  window.addEventListener('resize', doResize);
  editorState._resizeHandler = doResize;

  /* ============================================================
     ШЕЙДЕР СЕТКИ — попиксельно 64×64 на UV оверлея
     ============================================================ */
  const GRID_SHADER_KEY = '__gridShaderOn';

  function applyGridShader(mat, on){
    if(!mat) return;
    if(on && !mat.userData[GRID_SHADER_KEY]){
      mat.userData[GRID_SHADER_KEY] = true;
      mat.userData.__origOBC = mat.onBeforeCompile;
      mat.userData.__cacheKey = mat.customProgramCacheKey;

      mat.onBeforeCompile = function(shader){
        if(typeof mat.userData.__origOBC === 'function'){
          mat.userData.__origOBC.call(this, shader);
        }
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <dithering_fragment>',
          `#include <dithering_fragment>
          #ifdef USE_MAP
            vec2 __gUV = vMapUv * 64.0;
            vec2 __gF = abs(fract(__gUV - 0.5) - 0.5);
            vec2 __gD = fwidth(__gUV);
            vec2 __gL = __gF / max(__gD, vec2(0.0001));
            float __gA = 1.0 - min(min(__gL.x, __gL.y), 1.0);
            gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(0.22, 0.85, 1.0), __gA * 0.95);
          #endif
          `
        );
      };
      mat.customProgramCacheKey = function(){
        let base = 'grid-on';
        if(typeof mat.userData.__cacheKey === 'function'){
          try{ base += '_' + mat.userData.__cacheKey(); }catch{}
        }
        return base;
      };
      mat.needsUpdate = true;
    }else if(!on && mat.userData[GRID_SHADER_KEY]){
      mat.userData[GRID_SHADER_KEY] = false;
      mat.onBeforeCompile = mat.userData.__origOBC || function(){};
      mat.customProgramCacheKey = mat.userData.__cacheKey || function(){ return ''; };
      mat.needsUpdate = true;
    }
  }

  /* Применяем/снимаем сетку. showGrid=true — на ОВЕРЛЕЙ материал (index>0 или outer-меш), false — снять со всех */
  function applyOverlayGrid(showGrid){
    const v = editorState.viewer;
    if(!v || !v.playerObject) return;

    v.playerObject.traverse(obj => {
      if(!obj.isMesh) return;
      const n = (obj.name || '').toLowerCase();
      const p = (obj.parent && obj.parent.name || '').toLowerCase();
      const combined = n + ' ' + p;
      if(combined.includes('cape') || combined.includes('elytra')) return;

      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      const isMulti = mats.length >= 2;

      mats.forEach((mat, idx) => {
        if(!mat) return;
        let isOuter;
        if(isMulti) isOuter = idx > 0;
        else isOuter = /outer|hat|jacket|sleeve|overlay|second/i.test(combined);

        if(showGrid && isOuter) applyGridShader(mat, true);
        else applyGridShader(mat, false);
      });
    });
  }

  /* === LOAD SKIN === */
  async function loadSkinToCanvas(url, fallbackUrl){
    const draw = (img) => {
      ctx.clearRect(0, 0, SKIN_SIZE, SKIN_SIZE);
      ctx.drawImage(img, 0, 0, SKIN_SIZE, SKIN_SIZE);
      pushHistory();
      redrawFlat();
      refresh3D();
    };
    const tryLoad = (u) => new Promise(res => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => { draw(img); res(true); };
      img.onerror = () => res(false);
      img.src = u;
    });
    if(await tryLoad(url)) return true;
    if(fallbackUrl && await tryLoad(fallbackUrl)) return true;
    pushHistory(); redrawFlat(); refresh3D();
    return false;
  }

  const primarySkin = skinName ? skinTextureUrl(skinName) : skinTextureUrl('Steve');
  const fallbackSkin = skinName
    ? `https://minotar.net/skin/${encodeURIComponent(skinName)}`
    : 'https://minotar.net/skin/Steve';
  const loaded = await loadSkinToCanvas(primarySkin, fallbackSkin);
  if(!loaded) toast('Скин не загрузился, используется пустой холст','error');

  if(viewer){
    viewer.renderer.setAnimationLoop(() => {
      viewer.renderer.render(viewer.scene, viewer.camera);
    });
    applyOverlayGrid(editorState.activeLayer === 'overlay');
  }

  /* === СЛОИ === */
  $$('[data-layer]').forEach(b => b.addEventListener('click', () => {
    editorState.activeLayer = b.dataset.layer;
    $$('[data-layer]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    applyOverlayGrid(editorState.activeLayer === 'overlay');
    toast(b.dataset.layer === 'base' ? 'Слой: базовый' : 'Слой: оверлей (попиксельная сетка)', 'info', 1400);
  }));

  /* === PAINT === */
  function paintPx(px, py){
    if(px < 0 || py < 0 || px >= SKIN_SIZE || py >= SKIN_SIZE) return;
    if(editorState.tool === 'fill'){
      floodFill(px, py, editorState.color);
      redrawFlat();
      return;
    }
    if(editorState.tool === 'picker'){
      const d = ctx.getImageData(px, py, 1, 1).data;
      if(d[3] > 0){
        setColor('#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2,'0')).join(''));
      }
      return;
    }
    const S = SKIN_PIXEL;
    const flatBg = ((px + py) % 2 === 0) ? '#1a1f2b' : '#252b38';

    if(editorState.tool === 'eraser'){
      ctx.clearRect(px, py, 1, 1);
      if(editorState.flatCtx){
        editorState.flatCtx.fillStyle = flatBg;
        editorState.flatCtx.fillRect(px*S, py*S, S, S);
      }
    }else{
      ctx.fillStyle = editorState.color;
      ctx.fillRect(px, py, 1, 1);
      if(editorState.flatCtx){
        editorState.flatCtx.fillStyle = editorState.color;
        editorState.flatCtx.fillRect(px*S, py*S, S, S);
      }
    }
  }

  function bresenhamLine(x0, y0, x1, y1){
    const dx = Math.abs(x1 - x0);
    const dy = Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1;
    const sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;
    let x = x0, y = y0;
    let safety = 0;
    while(safety++ < 300){
      paintPx(x, y);
      if(x === x1 && y === y1) break;
      const e2 = 2 * err;
      if(e2 > -dy){ err -= dy; x += sx; }
      if(e2 < dx){ err += dx; y += sy; }
    }
  }

  function floodFill(sx, sy, color){
    const img = ctx.getImageData(0, 0, SKIN_SIZE, SKIN_SIZE);
    const d = img.data;
    const idx = (sy * SKIN_SIZE + sx) * 4;
    const tgt = [d[idx], d[idx+1], d[idx+2], d[idx+3]];
    const fill = [
      parseInt(color.slice(1,3), 16),
      parseInt(color.slice(3,5), 16),
      parseInt(color.slice(5,7), 16),
      255
    ];
    if(tgt[0] === fill[0] && tgt[1] === fill[1] && tgt[2] === fill[2] && tgt[3] === fill[3]) return;
    const stack = [[sx, sy]];
    const visited = new Set();
    while(stack.length){
      const [x, y] = stack.pop();
      if(x < 0 || y < 0 || x >= SKIN_SIZE || y >= SKIN_SIZE) continue;
      const k = x + ',' + y;
      if(visited.has(k)) continue;
      visited.add(k);
      const i = (y * SKIN_SIZE + x) * 4;
      if(d[i] !== tgt[0] || d[i+1] !== tgt[1] || d[i+2] !== tgt[2] || d[i+3] !== tgt[3]) continue;
      d[i] = fill[0]; d[i+1] = fill[1]; d[i+2] = fill[2]; d[i+3] = fill[3];
      stack.push([x+1, y], [x-1, y], [x, y+1], [x, y-1]);
    }
    ctx.putImageData(img, 0, 0);
  }

  function schedule3DRefresh(){
    if(editorState.refreshTimer) return;
    editorState.refreshTimer = setTimeout(() => {
      editorState.refreshTimer = null;
      refresh3D();
    }, 120);
  }

  function refresh3D(){
    const v = editorState.viewer;
    if(!v) return;
    try{
      const dataUrl = editorState.canvas.toDataURL('image/png');
      v.loadSkin(dataUrl).catch(() => {});
    }catch(e){ console.warn('refresh3D failed:', e); }
  }

  /* === 3D DRAW — с разделением по слоям через materialIndex === */
  function handle3DDraw(clientX, clientY){
    const v = editorState.viewer;
    const ray = editorState.raycaster;
    const mv = editorState.mouseVec;
    if(!v || !ray || !mv) return;
    const wantOverlay = editorState.activeLayer === 'overlay';

    const rect = v.canvas.getBoundingClientRect();
    mv.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mv.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    ray.setFromCamera(mv, v.camera);

    const hits = ray.intersectObject(v.playerObject, true);
    if(!hits.length){
      editorState.lastPx = null;
      editorState.lastPy = null;
      return;
    }

    let hit = null;
    for(const h of hits){
      if(!h.object.visible) continue;
      if(!h.uv) continue;
      if(h.object.isLine || h.object.isLineSegments) continue;

      const obj = h.object;
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];

      let isOuterHit;
      if(mats.length >= 2){
        const matIdx = (h.face && typeof h.face.materialIndex === 'number') ? h.face.materialIndex : 0;
        isOuterHit = matIdx > 0;
      }else{
        const n = (obj.name || '').toLowerCase();
        const p = (obj.parent && obj.parent.name || '').toLowerCase();
        isOuterHit = /outer|hat|jacket|sleeve|overlay|second/i.test(n + ' ' + p);
      }

      // базовый слой — только базовые меши, оверлей — только оверлейные
      if(wantOverlay && !isOuterHit) continue;
      if(!wantOverlay && isOuterHit) continue;

      hit = h;
      break;
    }

    if(!hit){
      editorState.lastPx = null;
      editorState.lastPy = null;
      return;
    }

    let px = Math.floor(hit.uv.x * SKIN_SIZE);
    let py = Math.floor((1 - hit.uv.y) * SKIN_SIZE);
    px = Math.max(0, Math.min(SKIN_SIZE - 1, px));
    py = Math.max(0, Math.min(SKIN_SIZE - 1, py));

    if(editorState.lastPx !== null && editorState.lastPy !== null){
      bresenhamLine(editorState.lastPx, editorState.lastPy, px, py);
    }else{
      paintPx(px, py);
    }
    editorState.lastPx = px;
    editorState.lastPy = py;
    schedule3DRefresh();
  }

  if(viewer){
    viewer.canvas.addEventListener('mousedown', e => {
      if(e.button !== 0) return;
      editorState.drawing = true;
      editorState.lastPx = null;
      editorState.lastPy = null;
      handle3DDraw(e.clientX, e.clientY);
    });
    viewer.canvas.addEventListener('mousemove', e => {
      if(!editorState.drawing) return;
      if(editorState.mousemoveThrottle) return;
      editorState.mousemoveThrottle = setTimeout(() => { editorState.mousemoveThrottle = null; }, 16);
      handle3DDraw(e.clientX, e.clientY);
    });
    const stop = () => {
      if(editorState.drawing){
        editorState.drawing = false;
        editorState.lastPx = null;
        editorState.lastPy = null;
        pushHistory();
        schedule3DRefresh();
      }
    };
    viewer.canvas.addEventListener('mouseup', stop);
    viewer.canvas.addEventListener('mouseleave', stop);
    viewer.canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if(e.touches.length !== 1) return;
      editorState.drawing = true;
      editorState.lastPx = null;
      editorState.lastPy = null;
      const t = e.touches[0];
      handle3DDraw(t.clientX, t.clientY);
    }, {passive:false});
    viewer.canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if(!editorState.drawing) return;
      const t = e.touches[0];
      handle3DDraw(t.clientX, t.clientY);
    }, {passive:false});
    viewer.canvas.addEventListener('touchend', stop);
  }

  /* === 2D === */
  function initFlatCanvas(){
    const wrap = $('ed-2d');
    wrap.innerHTML = '';
    const cv = document.createElement('canvas');
    cv.width = SKIN_SIZE * SKIN_PIXEL;
    cv.height = SKIN_SIZE * SKIN_PIXEL;
    cv.className = 'editor-flat-canvas';
    const cx = cv.getContext('2d');
    cx.imageSmoothingEnabled = false;
    wrap.appendChild(cv);
    editorState.flatCanvas = cv;
    editorState.flatCtx = cx;
    redrawFlat();

    cv.addEventListener('mousedown', e => {
      editorState.drawing = true;
      editorState.lastPx = null;
      editorState.lastPy = null;
      handleFlatDraw(e.clientX, e.clientY);
    });
    cv.addEventListener('mousemove', e => {
      if(!editorState.drawing) return;
      handleFlatDraw(e.clientX, e.clientY);
    });
    const stop = () => {
      if(editorState.drawing){
        editorState.drawing = false;
        editorState.lastPx = null;
        editorState.lastPy = null;
        pushHistory();
        schedule3DRefresh();
      }
    };
    cv.addEventListener('mouseup', stop);
    cv.addEventListener('mouseleave', stop);
    cv.addEventListener('contextmenu', e => e.preventDefault());
  }

  function drawCheckerboard(cx, w, h, size){
    for(let y = 0; y < h; y += size){
      for(let x = 0; x < w; x += size){
        cx.fillStyle = ((x/size + y/size) % 2 === 0) ? '#1a1f2b' : '#252b38';
        cx.fillRect(x, y, size, size);
      }
    }
  }

  function redrawFlat(){
    const cv = editorState.flatCanvas;
    const cx = editorState.flatCtx;
    if(!cv || !cx) return;
    cx.clearRect(0, 0, cv.width, cv.height);
    drawCheckerboard(cx, cv.width, cv.height, SKIN_PIXEL);
    cx.drawImage(editorState.canvas, 0, 0, cv.width, cv.height);
  }

  function handleFlatDraw(clientX, clientY){
    const cv = editorState.flatCanvas;
    if(!cv) return;
    const r = cv.getBoundingClientRect();
    let px = Math.floor((clientX - r.left) * (SKIN_SIZE / r.width));
    let py = Math.floor((clientY - r.top) * (SKIN_SIZE / r.height));
    px = Math.max(0, Math.min(SKIN_SIZE - 1, px));
    py = Math.max(0, Math.min(SKIN_SIZE - 1, py));

    if(editorState.lastPx !== null && editorState.lastPy !== null){
      bresenhamLine(editorState.lastPx, editorState.lastPy, px, py);
    }else{
      paintPx(px, py);
    }
    editorState.lastPx = px;
    editorState.lastPy = py;
    schedule3DRefresh();
  }

  /* === HISTORY === */
  function pushHistory(){
    try{
      const snap = {url: editorState.canvas.toDataURL('image/png')};
      editorState.history = editorState.history.slice(0, editorState.historyIdx + 1);
      editorState.history.push(snap);
      editorState.historyIdx++;
      if(editorState.history.length > 20){
        editorState.history.shift();
        editorState.historyIdx--;
      }
    }catch{}
  }
  function restoreFromSnapshot(snap){
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, SKIN_SIZE, SKIN_SIZE);
        ctx.drawImage(img, 0, 0);
        redrawFlat();
        refresh3D();
        resolve();
      };
      img.onerror = resolve;
      img.src = snap.url;
    });
  }

  $('ed-undo').addEventListener('click', async () => {
    if(editorState.historyIdx <= 0) return;
    editorState.historyIdx--;
    await restoreFromSnapshot(editorState.history[editorState.historyIdx]);
  });
  $('ed-redo').addEventListener('click', async () => {
    if(editorState.historyIdx >= editorState.history.length - 1) return;
    editorState.historyIdx++;
    await restoreFromSnapshot(editorState.history[editorState.historyIdx]);
  });

  $('ed-save').addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = (skinName || 'my-skin') + '.png';
    a.href = editorState.canvas.toDataURL('image/png');
    a.click();
    toast('Скин скачан','ok');
  });

  $('ed-upload').addEventListener('click', () => $('ed-file').click());
  $('ed-file').addEventListener('change', async e => {
    const file = e.target.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    await loadSkinToCanvas(url, fallbackSkin);
    URL.revokeObjectURL(url);
    toast('Скин загружен','ok');
  });

  $('ed-blank').addEventListener('click', () => {
    ctx.clearRect(0, 0, SKIN_SIZE, SKIN_SIZE);
    pushHistory();
    redrawFlat();
    refresh3D();
    toast('Чистое тело','info');
  });

  $('ed-steve').addEventListener('click', async () => {
    await loadSkinToCanvas('https://minotar.net/skin/Steve', skinTextureUrl('Steve'));
    toast('Steve загружен','ok');
  });

  $$('[data-mode]').forEach(b => b.addEventListener('click', () => {
    const mode = b.dataset.mode;
    $$('[data-mode]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    $('ed-3d').style.display = mode === '3d' ? 'flex' : 'none';
    $('ed-2d').style.display = mode === '2d' ? 'flex' : 'none';
    $('ed-hint').textContent = mode === '3d'
      ? 'Рисуй прямо на 3D-модели. ЛКМ рисует, ПКМ вращает.'
      : 'Рисуй на сетке 64×64 — плоская развёртка скина.';
    if(mode === '2d'){
      if(!editorState.flatCanvas) initFlatCanvas();
      else redrawFlat();
    }
  }));

  const keyHandler = e => {
    if(!editorState) return;
    if((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey){
      e.preventDefault(); $('ed-undo').click();
    }else if((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))){
      e.preventDefault(); $('ed-redo').click();
    }else if((e.ctrlKey || e.metaKey) && e.key === 's'){
      e.preventDefault(); $('ed-save').click();
    }
  };
  document.addEventListener('keydown', keyHandler);

  const cleanup = () => {
    document.body.classList.remove('editor-lock');
    document.removeEventListener('keydown', keyHandler);
    if(bgUploadInput && bgUploadInput.parentNode) bgUploadInput.parentNode.removeChild(bgUploadInput);
    if(editorState?.refreshTimer) clearTimeout(editorState.refreshTimer);
    if(editorState?._resizeHandler) window.removeEventListener('resize', editorState._resizeHandler);
    if(editorState?.mousemoveThrottle) clearTimeout(editorState.mousemoveThrottle);
    if(editorState?.viewer){
      try{
        editorState.viewer.renderer.setAnimationLoop(null);
        editorState.viewer.dispose();
      }catch{}
    }
    editorState = null;
  };
  window._editorCleanup = cleanup;

  $('ed-close').addEventListener('click', () => {
    cleanup();
    editorActive = false;
    window._editorCleanup = null;
    $$('.tab').forEach(t => { if(t.classList.contains('active')) t.click(); });
  });
}

/* ============================================================
   РЕДАКТОР РЕСУРСПАКОВ
   ============================================================ */
let packEditorState = null;

function openPackEditor(){
  editorActive = true;
  document.body.classList.add('editor-lock');
  $('searchContainer').classList.add('hidden');
  sentinel.classList.add('hidden');
  $('content').innerHTML = '';

  $('content').innerHTML = `
    <div class="editor-wrap">
      <div class="editor-header">
        <h2>📦 Редактор ресурспаков</h2>
        <div class="editor-header-actions">
          <button class="btn" id="rp-save" disabled>💾 Скачать ZIP</button>
          <button class="btn btn-secondary" id="rp-close">← К списку</button>
        </div>
      </div>
      <p style="color:var(--tdim);margin-bottom:1.5rem;font-size:.9rem">Загрузи .zip ресурспака, посмотри содержимое, замени текстуры, скачай обратно.</p>
      <div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1.5rem">
        <button class="btn" id="rp-upload">📁 Загрузить .zip</button>
        <button class="btn btn-secondary" id="rp-new-pack">🆕 Создать с нуля</button>
      </div>
      <input type="file" id="rp-file" accept=".zip,application/zip" hidden>
      <input type="file" id="rp-imgfile" accept="image/png" hidden>
      <div class="editor-layout">
        <div>
          <div class="editor-section-title">Файлы в паке</div>
          <div class="rp-file-list" id="rp-file-list"><p style="color:var(--tdim);text-align:center;padding:2rem">Пак не загружен</p></div>
        </div>
        <div>
          <div class="editor-section-title">Предпросмотр</div>
          <div class="rp-preview-area" id="rp-preview"><p style="color:var(--tdim)">Выбери файл слева</p></div>
          <div style="margin-top:.75rem"><button class="btn btn-secondary" id="rp-replace" disabled>✏️ Заменить текстуру</button></div>
        </div>
      </div>
    </div>`;

  packEditorState = {zip: null, selectedPath: null};

  $('rp-upload').addEventListener('click', () => $('rp-file').click());
  $('rp-file').addEventListener('change', async e => {
    const file = e.target.files[0];
    if(!file) return;
    if(typeof JSZip === 'undefined'){ toast('JSZip не загрузился','error'); return; }
    try{
      const zip = await JSZip.loadAsync(file);
      packEditorState.zip = zip;
      const names = Object.keys(zip.files).filter(p => !zip.files[p].dir).sort();
      renderPackFiles(names);
      $('rp-save').disabled = false;
      toast('Пак загружен: ' + file.name, 'ok');
    }catch(err){ toast('Ошибка: ' + err.message, 'error'); }
  });

  $('rp-new-pack').addEventListener('click', () => {
    packEditorState.zip = new JSZip();
    packEditorState.zip.file('pack.mcmeta', JSON.stringify({pack:{pack_format:15, description:'My Resource Pack'}}, null, 2));
    renderPackFiles(['pack.mcmeta']);
    $('rp-save').disabled = false;
    toast('Новый пак создан','ok');
  });

  $('rp-save').addEventListener('click', async () => {
    if(!packEditorState.zip) return;
    const blob = await packEditorState.zip.generateAsync({type:'blob', compression:'DEFLATE'});
    const a = document.createElement('a');
    a.download = 'my-resource-pack.zip';
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Пак скачан','ok');
  });

  $('rp-close').addEventListener('click', () => {
    editorActive = false;
    document.body.classList.remove('editor-lock');
    packEditorState = null;
    $$('.tab').forEach(t => { if(t.classList.contains('active')) t.click(); });
  });

  $('rp-replace').addEventListener('click', () => {
    if(!packEditorState.selectedPath){ toast('Сначала выбери файл','error'); return; }
    $('rp-imgfile').click();
  });

  $('rp-imgfile').addEventListener('change', async e => {
    const file = e.target.files[0];
    if(!file || !packEditorState.selectedPath) return;
    try{
      packEditorState.zip.file(packEditorState.selectedPath, file);
      const buf = await file.arrayBuffer();
      showPackPreview(buf, packEditorState.selectedPath);
      toast('Файл заменён: ' + packEditorState.selectedPath, 'ok');
    }catch(err){ toast('Ошибка: ' + err.message, 'error'); }
  });
}

function renderPackFiles(names){
  const list = $('rp-file-list');
  if(!names.length){ list.innerHTML = '<p style="color:var(--tdim);text-align:center;padding:2rem">Пусто</p>'; return; }
  list.innerHTML = names.map(f => `<div class="file-item" data-path="${esc(f)}">${esc(f)}</div>`).join('');
  list.querySelectorAll('.file-item').forEach(el => {
    el.addEventListener('click', async () => {
      const path = el.dataset.path;
      packEditorState.selectedPath = path;
      list.querySelectorAll('.file-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      $('rp-replace').disabled = false;
      try{
        const buf = await packEditorState.zip.file(path).async('arraybuffer');
        showPackPreview(buf, path);
      }catch{
        $('rp-preview').innerHTML = '<p style="color:var(--error)">Не удалось прочитать файл</p>';
      }
    });
  });
}

function showPackPreview(arrayBuffer, path){
  const ext = path.split('.').pop().toLowerCase();
  const prev = $('rp-preview');
  if(!['png','jpg','jpeg','gif','webp'].includes(ext)){
    let text;
    try{ text = new TextDecoder().decode(arrayBuffer).slice(0, 3000); }
    catch{ text = '[бинарный файл]'; }
    prev.innerHTML = `<pre>${esc(text)}</pre>`;
    return;
  }
  const blob = new Blob([arrayBuffer], {type:'image/' + ext});
  const url = URL.createObjectURL(blob);
  prev.innerHTML = `<img src="${url}" alt="preview"><p style="color:var(--tdim);font-size:.8rem;font-family:var(--font-mono)">${esc(path)}</p>`;
}

/* ============================================================
   INIT
   ============================================================ */
try{
  initStyles();
  initThemes();
}catch(e){
  console.error('init failed:', e);
}

try {
  const srcEl = document.getElementById('skinSources');
  if (srcEl) {
    srcEl.querySelectorAll('.skin-source-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.source === skinSource);
    });
    srcEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.skin-source-btn');
      if (!btn) return;
      const src = btn.dataset.source;
      if (!src || src === skinSource) return;
      skinSource = src;
      safeSetLocalStorage('mch-skin-source', src);
      srcEl.querySelectorAll('.skin-source-btn').forEach(b => b.classList.toggle('active', b === btn));
      toast('Источник: ' + btn.textContent.trim(), 'ok', 1500);
      if (currentTab === 'skins') {
        resetAndLoad();
      }
    });
  }
} catch (e) { console.error('skin source init:', e); }

io.observe(sentinel);
resetAndLoad();
</script>
