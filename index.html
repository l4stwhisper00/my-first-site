<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src https://cdn.modrinth.com https://media.forgecdn.net https://minotar.net https://crafatar.com https://mc-heads.net data: blob:; connect-src https://api.modrinth.com https://mod.mcimirror.top https://translate.googleapis.com https://api.allorigins.win https://api.cors.lol https://cors.eu.org https://proxy.cors.sh https://api.curse.tools https://cfproxy.fly.dev https://cdn.jsdelivr.net; base-uri 'none'; form-action 'none'">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>Minecraft Hub</title>
<style>
/* ============================================================
   RESET
   ============================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

/* ============================================================
   ТОКЕНЫ
   ============================================================ */
:root{
  --s0:#04060A;
  --s2:#0C1018;
  --s3:#131924;
  --s4:#1A2130;
  --s5:#232B3D;
  --accent:#38BDF8;
  --accent-2:#6EE7B7;
  --dim:#1E3A5F;
  --text:#E8EDF4;
  --tdim:#8892A3;
  --tdim2:#5A6478;
  --error:#F87171;
  --ok:#34D399;
  --warn:#FBBF24;
  --line:rgba(255,255,255,.055);
  --line-strong:rgba(255,255,255,.11);
  --r-xs:6px;
  --r-sm:8px;
  --r:10px;
  --r-lg:14px;
  --r-xl:18px;
  --tf:.14s;
  --tn:.22s;
  --ts:.4s;
  --ease:cubic-bezier(.25,.46,.45,.94);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --glow:rgba(56,189,248,.14);
  --a1:rgba(56,189,248,.28);
  --a2:rgba(110,231,183,.22);
  --font-display:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.4'/></svg>");
}
[data-theme="midnight"]{
  --s0:#02030A;--s2:#080B16;--s3:#0E1220;--s4:#161C30;--s5:#1F2740;
  --accent:#818CF8;--accent-2:#A78BFA;--dim:#1E1B4B;
  --text:#E0E7FF;--tdim:#8890B8;--tdim2:#5A6084;
  --line:rgba(200,210,255,.06);--line-strong:rgba(200,210,255,.12);
  --glow:rgba(129,140,248,.18);--a1:rgba(129,140,248,.32);--a2:rgba(167,139,250,.26);
}
[data-theme="light"]{
  --s0:#F5F7FA;--s2:#FFFFFF;--s3:#EEF1F6;--s4:#E2E7EE;--s5:#D4DAE3;
  --accent:#0284C7;--accent-2:#059669;--dim:#DBEAFE;
  --text:#0B1220;--tdim:#5A6478;--tdim2:#8892A3;
  --line:rgba(0,0,0,.06);--line-strong:rgba(0,0,0,.12);
  --glow:rgba(2,132,199,.14);--a1:rgba(2,132,199,.18);--a2:rgba(5,150,105,.14);
}
[data-theme="ocean"]{
  --s0:#03101C;--s2:#071828;--s3:#0C2336;--s4:#132F47;--s5:#1A3B58;
  --accent:#06B6D4;--accent-2:#22D3EE;--dim:#0E4D64;
  --text:#DBEEF7;--tdim:#7BA3B8;--tdim2:#4E7389;
  --line:rgba(140,200,230,.06);--line-strong:rgba(140,200,230,.12);
  --glow:rgba(6,182,212,.18);--a1:rgba(6,182,212,.32);--a2:rgba(34,211,238,.24);
}
[data-theme="sunset"]{
  --s0:#0F0510;--s2:#1A0A16;--s3:#260F1E;--s4:#34152A;--s5:#421E37;
  --accent:#FB7185;--accent-2:#FBBF24;--dim:#5B1F3A;
  --text:#FDE4EC;--tdim:#C99AAB;--tdim2:#8E6076;
  --line:rgba(255,200,210,.06);--line-strong:rgba(255,200,210,.12);
  --glow:rgba(251,113,133,.2);--a1:rgba(251,113,133,.34);--a2:rgba(251,191,36,.26);
}
[data-theme="forest"]{
  --s0:#051208;--s2:#0A1C12;--s3:#0F281A;--s4:#163425;--s5:#1E4230;
  --accent:#10B981;--accent-2:#84CC16;--dim:#14532D;
  --text:#DCFCE7;--tdim:#7FA089;--tdim2:#506857;
  --line:rgba(180,230,190,.06);--line-strong:rgba(180,230,190,.12);
  --glow:rgba(16,185,129,.2);--a1:rgba(16,185,129,.34);--a2:rgba(132,204,22,.22);
}
[data-theme="cyber"]{
  --s0:#08030F;--s2:#10071C;--s3:#1A0D2A;--s4:#251437;--s5:#321C4A;
  --accent:#D946EF;--accent-2:#22D3EE;--dim:#4A1060;
  --text:#F5E4FF;--tdim:#B096C5;--tdim2:#7A5F91;
  --line:rgba(230,150,255,.07);--line-strong:rgba(230,150,255,.14);
  --glow:rgba(217,70,239,.22);--a1:rgba(217,70,239,.36);--a2:rgba(34,211,238,.28);
}
[data-theme="nord"]{
  --s0:#20252E;--s2:#2A303A;--s3:#363D4A;--s4:#414958;--s5:#4C566A;
  --accent:#88C0D0;--accent-2:#A3BE8C;--dim:#4C566A;
  --text:#ECEFF4;--tdim:#A0A8B6;--tdim2:#6E7686;
  --line:rgba(220,230,240,.06);--line-strong:rgba(220,230,240,.12);
  --glow:rgba(136,192,208,.18);--a1:rgba(136,192,208,.26);--a2:rgba(163,190,140,.2);
}
[data-theme="rose"]{
  --s0:#150710;--s2:#220C1A;--s3:#311323;--s4:#3F1A2C;--s5:#4E2338;
  --accent:#F472B6;--accent-2:#FCD34D;--dim:#5E1F41;
  --text:#FFE4F1;--tdim:#C493AD;--tdim2:#8C6178;
  --line:rgba(255,190,220,.06);--line-strong:rgba(255,190,220,.12);
  --glow:rgba(244,114,182,.2);--a1:rgba(244,114,182,.34);--a2:rgba(252,211,77,.26);
}

/* ============================================================
   БАЗА
   ============================================================ */
html{
  background:var(--s0);
  scrollbar-gutter:stable;
  transition:background var(--ts) var(--ease);
}
body{
  min-height:100vh;
  background:var(--s0);
  color:var(--text);
  font-family:var(--font-body);
  font-feature-settings:'cv11','ss01','tnum';
  font-size:14px;
  line-height:1.55;
  letter-spacing:-.008em;
  transition:color var(--ts) var(--ease);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body.lock{ overflow:hidden; }
body.editor-lock{ overflow:hidden; }
body.editor-lock .wrap{
  position:fixed;inset:0;
  overflow-y:auto;overflow-x:hidden;
  padding:2rem;
  max-width:100%;
  z-index:2;
}
body.no-bg .aurora{ opacity:0; }
body.no-bg::before{ display:none; }

/* Тонкая сетка фона */
body::before{
  content:'';
  position:fixed;inset:0;
  pointer-events:none;z-index:0;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:radial-gradient(ellipse 100% 70% at 50% 0%, #000 20%, transparent 85%);
  mask-image:radial-gradient(ellipse 100% 70% at 50% 0%, #000 20%, transparent 85%);
  opacity:.6;
}

/* Aurora */
.aurora{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  overflow:hidden;opacity:.85;
  transition:opacity var(--ts) var(--ease);
}
.aurora::before,
.aurora::after{
  content:'';position:absolute;
  width:80vmax;height:80vmax;border-radius:50%;
  filter:blur(100px);will-change:transform;
}
.aurora::before{
  background:radial-gradient(circle, var(--a1) 0%, transparent 60%);
  top:-30vmax;left:-25vmax;
  animation:aA 32s ease-in-out infinite;
}
.aurora::after{
  background:radial-gradient(circle, var(--a2) 0%, transparent 60%);
  bottom:-30vmax;right:-25vmax;
  animation:aB 38s ease-in-out infinite;
}
@keyframes aA{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(18vmax,10vmax) scale(1.12)}
  66%{transform:translate(6vmax,22vmax) scale(.92)}
}
@keyframes aB{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(-14vmax,-12vmax) scale(1.08)}
  66%{transform:translate(-22vmax,6vmax) scale(1.04)}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
@keyframes shimmer{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}
@keyframes slideIn{
  from{transform:translateX(110%);opacity:0}
  to{transform:translateX(0);opacity:1}
}
@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.4}
}

/* ============================================================
   LAYOUT
   ============================================================ */
.wrap{
  position:relative;z-index:1;
  max-width:1440px;margin:0 auto;
  padding:2rem 2rem 3rem;
}

/* ШАПКА */
header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:1.5rem;
  padding-bottom:1.25rem;
  border-bottom:1px solid var(--line);
  margin-bottom:1.75rem;
  position:relative;
  animation:fadeUp .5s var(--ease-out);
}
header::after{
  content:'';position:absolute;
  bottom:-1px;left:0;width:64px;height:1px;
  background:linear-gradient(90deg,var(--accent),transparent);
}
.header-left{ display:flex; flex-direction:column; gap:.5rem; }
.header-right{
  display:flex;gap:.5rem;align-items:center;
  font-family:var(--font-mono);font-size:.68rem;
  color:var(--tdim2);letter-spacing:.03em;
}
.status-dot{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.35rem .7rem;
  border:1px solid var(--line);
  border-radius:var(--r-xs);
  background:color-mix(in oklab, var(--s2), var(--s0) 30%);
}
.status-dot::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 8px var(--ok);
  animation:pulse 2.4s ease-in-out infinite;
}

h1{
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1.6rem,3vw,2.15rem);
  letter-spacing:-.03em;
  line-height:1;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:.85rem;
}
h1::before{
  content:'';
  display:inline-block;
  width:36px;height:36px;
  flex-shrink:0;
  border-radius:9px;
  background:
    linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.1) inset,
    0 1px 0 rgba(255,255,255,.2) inset,
    0 8px 20px -6px var(--accent);
  position:relative;
}
h1::after{
  content:'';
  position:absolute;
  top:50%;left:9px;
  width:18px;height:18px;
  transform:translateY(-50%);
  background:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), transparent 55%),
    radial-gradient(circle at 70% 70%, rgba(0,0,0,.4), transparent 60%);
  border-radius:4px;
  pointer-events:none;
}
.subtitle{
  font-family:var(--font-mono);
  font-size:.72rem;
  color:var(--tdim);
  letter-spacing:.02em;
  display:flex;align-items:center;gap:.5rem;
}
.subtitle::before{
  content:'//';
  color:var(--accent);
  font-weight:600;
  letter-spacing:0;
}

/* ВКЛАДКИ */
.tabs{
  display:flex;gap:.2rem;
  padding:.32rem;
  background:var(--s2);
  border:1px solid var(--line);
  border-radius:var(--r);
  margin-bottom:1.75rem;
  overflow-x:auto;
  scrollbar-width:none;
  box-shadow:
    0 1px 0 rgba(255,255,255,.03) inset,
    0 4px 16px -12px rgba(0,0,0,.6);
  width:fit-content;max-width:100%;
  animation:fadeUp .55s var(--ease-out);
}
.tabs::-webkit-scrollbar{ display:none; }
.tab{
  background:transparent;
  border:none;
  color:var(--tdim);
  padding:.55rem .95rem;
  border-radius:var(--r-xs);
  font-family:var(--font-body);
  font-size:.82rem;
  font-weight:500;
  white-space:nowrap;
  cursor:pointer;
  transition:all var(--tf) var(--ease);
  position:relative;
  letter-spacing:-.005em;
}
.tab:hover{
  background:color-mix(in oklab, var(--s3), var(--s0) 20%);
  color:var(--text);
}
.tab.active{
  background:var(--s4);
  color:var(--text);
  font-weight:600;
  box-shadow:
    0 1px 0 rgba(255,255,255,.06) inset,
    0 2px 8px -2px rgba(0,0,0,.5);
}
.tab.active::after{
  content:'';position:absolute;
  bottom:-1px;left:14px;right:14px;height:1.5px;
  background:var(--accent);
  border-radius:1px;
  box-shadow:0 0 10px var(--accent);
}

/* ============================================================
   ПОИСК
   ============================================================ */
.search-container{
  background:var(--s2);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:1.35rem 1.5rem;
  margin-bottom:1.75rem;
  position:relative;
  overflow:hidden;
  box-shadow:
    0 1px 0 rgba(255,255,255,.03) inset,
    0 24px 48px -32px rgba(0,0,0,.8);
  animation:fadeUp .6s var(--ease-out);
}
.search-container::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent, var(--line-strong), transparent);
}
.search-container::after{
  content:'';
  position:absolute;inset:0;
  pointer-events:none;
  background-image:var(--grain);
  opacity:.02;
  mix-blend-mode:overlay;
}
.search-row{
  display:flex;gap:.65rem;
  flex-wrap:wrap;align-items:center;
  margin-bottom:.85rem;
  position:relative;z-index:1;
}
.search-input,
.filter-select{
  background:var(--s0);
  border:1px solid var(--line);
  color:var(--text);
  padding:.7rem 1rem;
  border-radius:var(--r-sm);
  font-family:var(--font-body);
  font-size:.88rem;
  transition:all var(--tn) var(--ease);
  letter-spacing:-.005em;
}
.search-input{
  flex:1;min-width:220px;
}
.search-input::placeholder{ color:var(--tdim2); }
.search-input:focus,
.filter-select:focus{
  outline:none;
  border-color:color-mix(in oklab, var(--accent), transparent 30%);
  background:var(--s2);
  box-shadow:
    0 0 0 3px color-mix(in oklab, var(--accent), transparent 88%),
    0 1px 0 rgba(255,255,255,.04) inset;
}
.filter-select{
  padding:.55rem .85rem;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
  padding-right:2rem;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%238892A3' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;
  background-position:right .75rem center;
}
.filters{
  display:flex;gap:.85rem;
  flex-wrap:wrap;align-items:center;
  padding-top:.85rem;
  border-top:1px dashed var(--line);
  position:relative;z-index:1;
}
.filters label{
  font-family:var(--font-mono);
  font-size:.66rem;
  color:var(--tdim);
  text-transform:uppercase;
  letter-spacing:.09em;
  font-weight:500;
}
.hidden{ display:none!important; }

/* ============================================================
   КНОПКИ
   ============================================================ */
.btn,
.search-btn{
  background:linear-gradient(180deg,
    color-mix(in oklab, var(--accent), white 6%) 0%,
    var(--accent) 100%);
  color:#04060A;
  padding:.7rem 1.35rem;
  border:none;
  border-radius:var(--r-sm);
  font-family:var(--font-body);
  font-size:.85rem;
  font-weight:600;
  cursor:pointer;
  transition:all var(--tf) var(--ease);
  text-align:center;
  letter-spacing:-.005em;
  box-shadow:
    0 1px 0 rgba(255,255,255,.35) inset,
    0 0 0 1px color-mix(in oklab, var(--accent), black 15%),
    0 2px 8px -2px rgba(0,0,0,.4);
  position:relative;
}
.btn{ width:100%; display:inline-block; }
.btn:hover,
.search-btn:hover{
  transform:translateY(-1px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.4) inset,
    0 0 0 1px color-mix(in oklab, var(--accent), black 15%),
    0 8px 20px -6px color-mix(in oklab, var(--accent), transparent 40%);
}
.btn:active,
.search-btn:active{
  transform:translateY(0);
  box-shadow:
    0 1px 0 rgba(255,255,255,.2) inset,
    0 0 0 1px color-mix(in oklab, var(--accent), black 20%),
    0 1px 3px rgba(0,0,0,.3);
}
.btn-secondary{
  background:var(--s3);
  color:var(--text);
  box-shadow:
    0 1px 0 rgba(255,255,255,.04) inset,
    0 0 0 1px var(--line-strong),
    0 2px 6px -2px rgba(0,0,0,.3);
}
.btn-secondary:hover{
  background:var(--s4);
  box-shadow:
    0 1px 0 rgba(255,255,255,.06) inset,
    0 0 0 1px color-mix(in oklab, var(--line-strong), var(--accent) 30%),
    0 6px 16px -6px rgba(0,0,0,.5);
}
.btn-danger{
  background:linear-gradient(180deg,
    color-mix(in oklab, var(--error), white 6%) 0%,
    var(--error) 100%);
  color:#fff;
  box-shadow:
    0 1px 0 rgba(255,255,255,.25) inset,
    0 0 0 1px color-mix(in oklab, var(--error), black 20%),
    0 2px 8px -2px color-mix(in oklab, var(--error), transparent 60%);
}
.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}

#editorBtn{
  background:linear-gradient(180deg,
    color-mix(in oklab, var(--accent-2), white 6%) 0%,
    var(--accent-2) 100%);
  color:#04060A;
  border:none;
  border-radius:var(--r-sm);
  padding:.7rem 1.2rem;
  font-family:var(--font-body);
  font-size:.85rem;
  font-weight:600;
  cursor:pointer;
  display:none;
  align-items:center;
  gap:.5rem;
  letter-spacing:-.005em;
  transition:all var(--tf) var(--ease);
  white-space:nowrap;
  box-shadow:
    0 1px 0 rgba(255,255,255,.35) inset,
    0 0 0 1px color-mix(in oklab, var(--accent-2), black 15%),
    0 2px 8px -2px rgba(0,0,0,.4);
}
#editorBtn:hover{
  transform:translateY(-1px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.4) inset,
    0 0 0 1px color-mix(in oklab, var(--accent-2), black 15%),
    0 8px 20px -6px color-mix(in oklab, var(--accent-2), transparent 40%);
}
#randomBtn{
  background:var(--s3);
  color:var(--text);
  border:none;
  border-radius:var(--r-sm);
  padding:.7rem 1.2rem;
  font-family:var(--font-body);
  font-size:.85rem;
  font-weight:600;
  cursor:pointer;
  display:none;
  align-items:center;
  gap:.5rem;
  letter-spacing:-.005em;
  transition:all var(--tf) var(--ease);
  white-space:nowrap;
  box-shadow:
    0 1px 0 rgba(255,255,255,.04) inset,
    0 0 0 1px var(--line-strong),
    0 2px 6px -2px rgba(0,0,0,.3);
}
#randomBtn:hover{
  background:var(--s4);
  transform:translateY(-1px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.06) inset,
    0 0 0 1px color-mix(in oklab, var(--line-strong), var(--accent) 30%),
    0 6px 16px -6px rgba(0,0,0,.5);
}

/* ============================================================
   СЕТКА КАРТОЧЕК
   ============================================================ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(268px, 1fr));
  gap:1rem;
  margin-bottom:2rem;
}
.card{
  background:linear-gradient(180deg,
    var(--s2) 0%,
    color-mix(in oklab, var(--s2), var(--s0) 45%) 100%);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  overflow:hidden;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  position:relative;
  transition:
    transform var(--tn) var(--ease),
    border-color var(--tn) var(--ease),
    box-shadow var(--tn) var(--ease);
  box-shadow:
    0 1px 0 rgba(255,255,255,.03) inset,
    0 8px 24px -18px rgba(0,0,0,.7);
  animation:fadeUp .45s var(--ease-out) both;
  will-change:transform;
}
.card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
  z-index:3;pointer-events:none;
}
.card::after{
  content:'';
  position:absolute;inset:0;
  pointer-events:none;
  background-image:var(--grain);
  opacity:.02;
  mix-blend-mode:overlay;
  border-radius:inherit;
}
.card:hover{
  transform:translateY(-3px);
  border-color:color-mix(in oklab, var(--line-strong), var(--accent) 25%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.06) inset,
    0 20px 44px -22px rgba(0,0,0,.85),
    0 0 0 1px color-mix(in oklab, var(--accent), transparent 84%);
}
.card:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
.card-image{
  width:100%;
  height:170px;
  object-fit:cover;
  background:var(--s4);
  border-bottom:1px solid var(--line);
  display:block;
}
.card-image.skin{
  object-fit:contain;
  padding:1rem .5rem;
  background:
    radial-gradient(ellipse at center, var(--s3) 0%, var(--s4) 100%);
}
.card-content{
  padding:.95rem 1.1rem 1.15rem;
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
}
.card-title{
  font-family:var(--font-display);
  font-size:.98rem;
  font-weight:600;
  letter-spacing:-.015em;
  line-height:1.3;
  margin-bottom:.4rem;
  word-break:break-word;
  padding-right:1.5rem;
  color:var(--text);
}
.card:hover .card-title::after{
  content:'→';
  position:absolute;
  top:.95rem;right:1.1rem;
  font-family:var(--font-mono);
  font-size:.9rem;
  color:var(--accent);
  animation:arrowIn .25s var(--ease-out);
}
@keyframes arrowIn{
  from{opacity:0;transform:translateX(-4px)}
  to{opacity:1;transform:translateX(0)}
}
.card-description{
  color:var(--tdim);
  font-size:.82rem;
  line-height:1.5;
  margin-bottom:.9rem;
  flex:1;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.tag{
  display:inline-flex;
  align-items:center;
  align-self:flex-start;
  gap:.4rem;
  background:color-mix(in oklab, var(--s0), var(--s2) 30%);
  color:var(--tdim);
  border:1px solid var(--line);
  font-family:var(--font-mono);
  font-size:.62rem;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:.09em;
  padding:.25rem .55rem;
  border-radius:var(--r-xs);
  margin-bottom:.85rem;
}
.tag::before{
  content:'';
  width:5px;height:5px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 6px var(--accent);
  flex-shrink:0;
}
.card-stats{
  display:flex;
  justify-content:space-between;
  gap:.5rem;
  font-family:var(--font-mono);
  font-size:.68rem;
  color:var(--tdim2);
  padding-top:.7rem;
  border-top:1px dashed var(--line);
  letter-spacing:.01em;
}
.card-stats span{
  display:inline-flex;
  align-items:center;
  gap:.35rem;
}

/* Скелетоны */
.skeleton-card{
  cursor:default!important;
  pointer-events:none;
}
.skeleton-card:hover{
  transform:none!important;
  box-shadow:0 8px 24px -18px rgba(0,0,0,.7)!important;
  border-color:var(--line)!important;
}
.skeleton-shimmer{
  background:linear-gradient(90deg,
    var(--s3) 0%,
    var(--s4) 50%,
    var(--s3) 100%);
  background-size:200% 100%;
  animation:shimmer 1.6s linear infinite;
}
.skeleton-line{
  height:.8rem;
  border-radius:4px;
  margin-bottom:.55rem;
}
.skeleton-line.big{ height:1.05rem; width:68%; }
.skeleton-line:last-child{ margin-bottom:0; }

/* ============================================================
   МОДАЛЬНЫЕ ОКНА
   ============================================================ */
.modal{
  display:none;
  position:fixed;inset:0;
  background:rgba(2,3,6,.78);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  backdrop-filter:blur(14px) saturate(140%);
  z-index:1000;
  overflow-y:auto;
  animation:fadeIn .18s var(--ease);
}
.modal.active{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem;
}
.modal-content{
  background:var(--s2);
  border:1px solid var(--line-strong);
  border-radius:var(--r-xl);
  max-width:880px;
  width:100%;
  max-height:90vh;
  overflow-y:auto;
  position:relative;
  animation:fadeUp .28s var(--ease-out);
  box-shadow:
    0 1px 0 rgba(255,255,255,.05) inset,
    0 48px 96px -32px rgba(0,0,0,.9),
    0 0 0 1px rgba(0,0,0,.3);
}
.modal-content::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
  pointer-events:none;
}
.modal-content.small{ max-width:480px; }
.modal-header{
  padding:1.15rem 1.6rem;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:1rem;
  align-items:center;
  background:color-mix(in oklab, var(--s2), var(--s0) 25%);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
}
.modal-title{
  font-family:var(--font-display);
  font-size:1.28rem;
  font-weight:600;
  letter-spacing:-.02em;
  line-height:1.3;
  word-break:break-word;
  color:var(--text);
}
.modal-close{
  background:transparent;
  border:1px solid transparent;
  color:var(--tdim);
  font-size:1.3rem;
  cursor:pointer;
  width:36px;height:36px;
  border-radius:var(--r-xs);
  flex-shrink:0;
  transition:all var(--tf) var(--ease);
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
}
.modal-close:hover{
  background:var(--s3);
  border-color:var(--line);
  color:var(--text);
}
.modal-body{ padding:1.65rem; }

.modal-3d-viewport{
  width:100%;
  height:380px;
  background:radial-gradient(ellipse at center, var(--s3) 0%, var(--s4) 100%);
  border:1px solid var(--line);
  border-radius:var(--r);
  margin-bottom:1.35rem;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}
.modal-3d-viewport::after{
  content:'';
  position:absolute;inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:32px 32px;
  opacity:.4;
  border-radius:inherit;
}
.modal-3d-viewport canvas{
  display:block;
  cursor:grab;
  position:relative;
  z-index:1;
}
.modal-3d-viewport canvas:active{ cursor:grabbing; }
.modal-3d-viewport img{
  max-height:100%;
  max-width:100%;
  object-fit:contain;
  position:relative;
  z-index:1;
}
.modal-description{
  color:var(--tdim);
  line-height:1.65;
  margin-bottom:1.35rem;
  white-space:pre-line;
  font-size:.88rem;
}
.modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:.75rem;
}
.version-picker{
  background:var(--s0);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:.9rem 1.1rem;
  margin-bottom:1.35rem;
  display:flex;
  flex-direction:column;
  gap:.65rem;
}
.version-picker-title{
  font-family:var(--font-mono);
  font-size:.66rem;
  color:var(--tdim);
  text-transform:uppercase;
  letter-spacing:.1em;
  font-weight:500;
}
.version-picker-row{
  display:flex;
  gap:.6rem;
  flex-wrap:wrap;
}
.version-picker select{
  flex:1;
  min-width:140px;
}
#toggleVersionMode{
  background:var(--s3)!important;
  border:1px solid var(--line-strong)!important;
  color:var(--text)!important;
  font-family:var(--font-mono)!important;
  font-size:.68rem!important;
  text-transform:uppercase!important;
  letter-spacing:.05em!important;
  padding:.35rem .7rem!important;
  border-radius:var(--r-xs)!important;
  cursor:pointer;
  transition:all var(--tf) var(--ease);
  white-space:nowrap;
}
#toggleVersionMode:hover{
  background:var(--s4)!important;
  border-color:color-mix(in oklab, var(--line-strong), var(--accent) 40%)!important;
}

/* ============================================================
   СООБЩЕНИЯ
   ============================================================ */
.error{
  text-align:center;
  padding:2rem;
  font-size:.95rem;
  color:var(--error);
  background:color-mix(in oklab, var(--s2), var(--error) 5%);
  border:1px solid color-mix(in oklab, var(--error), transparent 70%);
  border-radius:var(--r);
  font-family:var(--font-mono);
}
.error-detail{
  color:var(--tdim);
  font-size:.78rem;
  margin-top:.5rem;
  word-break:break-word;
}
#sentinel{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--tdim2);
  font-family:var(--font-mono);
  font-size:.72rem;
  letter-spacing:.05em;
  text-transform:uppercase;
}
#toasts{
  position:fixed;
  bottom:1.25rem;
  right:1.25rem;
  display:flex;
  flex-direction:column;
  gap:.55rem;
  z-index:2000;
  max-width:min(380px, calc(100vw - 2.5rem));
}
.toast{
  background:color-mix(in oklab, var(--s3), var(--s0) 20%);
  color:var(--text);
  padding:.75rem 1rem;
  border-radius:var(--r-sm);
  font-family:var(--font-mono);
  font-size:.76rem;
  border:1px solid var(--line-strong);
  border-left:3px solid var(--accent);
  animation:slideIn .22s var(--ease-out);
  box-shadow:0 12px 28px -12px rgba(0,0,0,.75);
  line-height:1.45;
  display:flex;
  gap:.5rem;
}
.toast::before{
  content:'›';
  color:var(--accent);
  font-weight:700;
  flex-shrink:0;
}
.toast.error{
  border-left-color:var(--error);
  background:color-mix(in oklab, var(--s3), var(--error) 8%);
}
.toast.error::before{ color:var(--error); }
.toast.ok{
  border-left-color:var(--ok);
  background:color-mix(in oklab, var(--s3), var(--ok) 6%);
}
.toast.ok::before{ color:var(--ok); }

.sr-only{
  position:absolute;
  width:1px;height:1px;
  padding:0;margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

/* ============================================================
   НАСТРОЙКИ
   ============================================================ */
.settings-panel{
  position:fixed;
  bottom:1.25rem;
  left:1.25rem;
  z-index:3000;
  display:flex;
  flex-direction:column;
  gap:.4rem;
  align-items:flex-start;
}
.settings-toggle{
  width:46px;height:46px;
  border-radius:var(--r);
  border:1px solid var(--line-strong);
  cursor:pointer;
  background:var(--s2);
  color:var(--text);
  font-size:1.1rem;
  transition:all var(--tn) var(--ease);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 1px 0 rgba(255,255,255,.05) inset,
    0 8px 20px -8px rgba(0,0,0,.6);
}
.settings-toggle:hover{
  background:var(--s3);
  border-color:color-mix(in oklab, var(--line-strong), var(--accent) 40%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.06) inset,
    0 0 0 3px color-mix(in oklab, var(--accent), transparent 88%),
    0 8px 20px -8px rgba(0,0,0,.6);
}
.settings-menu{
  background:var(--s2);
  padding:1.05rem;
  border-radius:var(--r-lg);
  border:1px solid var(--line-strong);
  opacity:0;
  transform:translateY(8px) scale(.97);
  pointer-events:none;
  transition:all var(--tn) var(--ease);
  min-width:320px;
  max-width:90vw;
  box-shadow:
    0 1px 0 rgba(255,255,255,.05) inset,
    0 24px 56px -20px rgba(0,0,0,.85);
}
.settings-panel.open .settings-menu{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}
.settings-section{ margin-bottom:.95rem; }
.settings-section:last-child{ margin-bottom:0; }
.settings-label{
  font-family:var(--font-mono);
  font-size:.62rem;
  color:var(--tdim);
  text-transform:uppercase;
  letter-spacing:.1em;
  font-weight:500;
  margin-bottom:.55rem;
  display:flex;
  align-items:center;
  gap:.4rem;
}
.settings-label::before{
  content:'//';
  color:var(--accent);
  font-weight:600;
}
.theme-grid{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:.4rem;
  margin-bottom:.65rem;
}
.theme-opt{
  width:100%;
  aspect-ratio:1;
  border-radius:var(--r-sm);
  border:1px solid var(--line);
  cursor:pointer;
  transition:all var(--tf) var(--ease);
  position:relative;
  overflow:hidden;
}
.theme-opt:hover{
  transform:translateY(-1px);
  border-color:var(--line-strong);
}
.theme-opt.active{
  border-color:var(--accent);
  box-shadow:
    0 0 0 1px var(--s2) inset,
    0 0 0 2px var(--accent);
}
.theme-opt .del-badge{
  position:absolute;
  top:2px;right:2px;
  width:16px;height:16px;
  background:var(--error);
  border-radius:50%;
  color:#fff;
  font-size:.68rem;
  line-height:15px;
  text-align:center;
  display:none;
  cursor:pointer;
  font-family:var(--font-mono);
  font-weight:700;
}
.theme-opt.custom .del-badge{ display:block; }
.theme-opt[data-theme="dark"]{ background:linear-gradient(135deg,#04060A 50%,#38BDF8); }
.theme-opt[data-theme="midnight"]{ background:linear-gradient(135deg,#02030A 50%,#818CF8); }
.theme-opt[data-theme="light"]{ background:linear-gradient(135deg,#F5F7FA 50%,#0284C7); }
.theme-opt[data-theme="ocean"]{ background:linear-gradient(135deg,#03101C 50%,#06B6D4); }
.theme-opt[data-theme="sunset"]{ background:linear-gradient(135deg,#0F0510 50%,#FB7185); }
.theme-opt[data-theme="forest"]{ background:linear-gradient(135deg,#051208 50%,#10B981); }
.theme-opt[data-theme="cyber"]{ background:linear-gradient(135deg,#08030F 50%,#D946EF); }
.theme-opt[data-theme="nord"]{ background:linear-gradient(135deg,#20252E 50%,#88C0D0); }
.theme-opt[data-theme="rose"]{ background:linear-gradient(135deg,#150710 50%,#F472B6); }
.add-theme-btn{
  width:100%;
  background:var(--s0);
  color:var(--tdim);
  border:1px dashed var(--line-strong);
  border-radius:var(--r-sm);
  padding:.55rem;
  cursor:pointer;
  font-family:var(--font-mono);
  font-size:.68rem;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:.08em;
  transition:all var(--tf) var(--ease);
}
.add-theme-btn:hover{
  background:var(--s3);
  border-color:var(--accent);
  color:var(--accent);
  border-style:solid;
}
.settings-toggle-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.5rem 0;
  color:var(--text);
  font-size:.82rem;
  cursor:pointer;
  user-select:none;
}
.switch{
  position:relative;
  width:38px;height:22px;
  background:var(--s4);
  border-radius:var(--r-xs);
  transition:background var(--tn) var(--ease);
  flex-shrink:0;
  border:1px solid var(--line);
}
.switch::after{
  content:'';
  position:absolute;
  top:2px;left:2px;
  width:16px;height:16px;
  background:var(--tdim);
  border-radius:4px;
  transition:all var(--tn) var(--ease);
}
.switch.on{ background:var(--accent); }
.switch.on::after{
  transform:translateX(16px);
  background:var(--s0);
}
.color-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:.75rem;
  margin-bottom:.4rem;
}
.color-row label{
  color:var(--tdim);
  font-size:.78rem;
  flex:1;
}
.color-row input[type="color"]{
  width:42px;height:28px;
  border:1px solid var(--line);
  border-radius:var(--r-xs);
  cursor:pointer;
  background:transparent;
  padding:0;
}
.color-row input[type="text"]{
  width:78px;
  background:var(--s0);
  border:1px solid var(--line);
  color:var(--text);
  padding:.3rem .5rem;
  border-radius:var(--r-xs);
  font-size:.7rem;
  font-family:var(--font-mono);
}
.bg-upload-row{
  display:flex;
  align-items:center;
  gap:.4rem;
  margin-top:.5rem;
}
.bg-upload-btn{
  flex:1;
  background:var(--s0);
  color:var(--tdim);
  border:1px dashed var(--line-strong);
  border-radius:var(--r-sm);
  padding:.5rem;
  cursor:pointer;
  font-family:var(--font-mono);
  font-size:.66rem;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:.05em;
  transition:all var(--tf) var(--ease);
}
.bg-upload-btn:hover{
  background:var(--s3);
  border-color:var(--accent);
  color:var(--accent);
  border-style:solid;
}

/* ============================================================
   CONFIRM
   ============================================================ */
.confirm-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(2,3,6,.82);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  z-index:4000;
  align-items:center;
  justify-content:center;
  padding:2rem;
}
.confirm-modal.active{ display:flex; }
.confirm-box{
  background:var(--s2);
  border:1px solid var(--line-strong);
  border-radius:var(--r-lg);
  padding:1.75rem;
  max-width:380px;
  width:100%;
  text-align:center;
  animation:fadeUp .25s var(--ease-out);
  box-shadow:
    0 1px 0 rgba(255,255,255,.05) inset,
    0 32px 64px -20px rgba(0,0,0,.9);
}
.confirm-box h3{
  font-family:var(--font-display);
  font-size:1.15rem;
  font-weight:600;
  letter-spacing:-.015em;
  margin-bottom:.6rem;
}
.confirm-box p{
  color:var(--tdim);
  margin-bottom:1.35rem;
  font-size:.85rem;
  line-height:1.5;
}
.confirm-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:.6rem;
}

/* ============================================================
   РЕДАКТОР СКИНОВ
   ============================================================ */
.editor-wrap{
  background:var(--s2);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:1.5rem;
  animation:fadeUp .4s var(--ease-out);
  box-shadow:0 24px 48px -32px rgba(0,0,0,.7);
  position:relative;
}
.editor-wrap::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent, var(--line-strong), transparent);
  border-radius:var(--r-lg) var(--r-lg) 0 0;
}
.editor-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:1.35rem;
  flex-wrap:wrap;
  gap:1rem;
  padding-bottom:1rem;
  border-bottom:1px solid var(--line);
}
.editor-header h2{
  font-family:var(--font-display);
  font-size:1.3rem;
  font-weight:600;
  letter-spacing:-.02em;
  display:flex;
  align-items:center;
  gap:.55rem;
}
.editor-header-actions{
  display:flex;
  gap:.5rem;
  flex-wrap:wrap;
}
.editor-header-actions .btn,
.editor-header-actions .btn-secondary{
  padding:.55rem .9rem;
  font-size:.82rem;
  width:auto;
}
.editor-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 320px;
  gap:1.5rem;
  align-items:start;
}
@media(max-width:1000px){
  .editor-layout{ grid-template-columns:1fr; }
}

.editor-canvas-area{
  position:relative;
  border-radius:var(--r);
  min-height:560px;
  overflow:hidden;
  display:flex;
  align-items:center;

/* HELPERS */
const $ = id => document.getElementById(id);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeUrl(u){try{const x=new URL(u);return x.protocol==='https:'?x.href:''}catch{return ''}}
const safeId = v => /^[\w-]{1,64}$/.test(String(v)) ? String(v) : '';
const isValidNick = n => /^[A-Za-z0-9_]{3,16}$/.test(n);

const isValidHex = c => /^#[0-9a-fA-F]{6}$/.test(c);

function safeSetLocalStorage(key, val){
  try{
    let str = typeof val==='string' ? val : JSON.stringify(val);
    if(str.length>500000) str = str.slice(0,500000);
    localStorage.setItem(key,str);
    return true;
  }catch(e){
    try{localStorage.removeItem(key)}catch{}
    return false;

}
function safeGetLocalStorage(key){try{return localStorage.getItem(key)}catch{return null}}

/* CACHE */
const pageCache = new Map();
const CACHE_TTL = 5 * 60 * 1000;
function cacheGet(k){
  const e = pageCache.get(k);
  if(!e) return null;
  if(Date.now() - e.ts > CACHE_TTL){ pageCache.delete(k); return null; }
  return e.data;
}
function cacheSet(k,v){
  if(pageCache.size >= 120){ pageCache.delete(pageCache.keys().next().value); }
  pageCache.set(k,{data:v,ts:Date.now()});
}

/* FETCH */
async function fetchJson(url){
  let lastError;
  for(let i=0;i<2;i++){
    try{
      const ctrl = new AbortController();
      const tm = setTimeout(() => ctrl.abort(), 15000);
      const r = await fetch(url, {signal: ctrl.signal});
      clearTimeout(tm);
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){
      lastError = e;
      if(i===0) await new Promise(res => setTimeout(res, 300));
    }
  }
  throw lastError || new Error('fetch failed');
}

/* CORS PROXIES */
const CORS_PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://api.cors.lol/?url=${encodeURIComponent(u)}`,
  u => `https://cors.eu.org/${u}`,
  u => `https://proxy.cors.sh/${u}`
];

async function fetchViaProxy(url){
  const attempts = CORS_PROXIES.map(wrap => {
    return (async () => {
      const ctrl = new AbortController();
      const tm = setTimeout(() => ctrl.abort(), 6000);
      try{
        const r = await fetch(wrap(url), {signal: ctrl.signal});
        clearTimeout(tm);
        if(!r.ok) throw new Error('HTTP ' + r.status);
        const t = await r.text();
        if(t && t.length > 100) return t;
        throw new Error('empty');
      }catch(e){
        clearTimeout(tm);
        throw e;
      }
    })();
  });
  try{
    return await Promise.any(attempts);
  }catch{
    throw new Error('all proxies failed');
  }
}

/* TOAST */
function toast(msg, kind='info', ms=4000){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind==='error'?'error':kind==='ok'?'ok':'');
  el.textContent = msg;
  const container = $('toasts');
  if(!container) return;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity .3s';
    setTimeout(() => el.remove(), 300);
  }, ms);
}

/* TRANSLATE */
const trCache = new Map();
try{
  const raw = safeGetLocalStorage('trCache');
  if(raw) Object.entries(JSON.parse(raw)).forEach(([k,v]) => trCache.set(k,v));
}catch{}

let cacheSaveTimer = null;
function scheduleCacheSave(){
  if(cacheSaveTimer) return;
  cacheSaveTimer = setTimeout(() => {
    try{
      const entries = [...trCache].slice(-300);
      safeSetLocalStorage('trCache', JSON.stringify(Object.fromEntries(entries)));
    }catch{}
    cacheSaveTimer = null;
  }, 2000);
}

const needsTranslation = t => t && t.length > 2 && (t.match(/[а-яё]/gi)||[]).length < t.length * 0.2;

async function translate(text){
  if(!needsTranslation(text)) return text;
  const cut = text.slice(0, 450);
  if(trCache.has(cut)) return trCache.get(cut);
  try{
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q=' + encodeURIComponent(cut));
    if(r.status === 429){
      await new Promise(res => setTimeout(res, 1500));
      throw new Error('rate limited');
    }
    if(!r.ok) throw new Error('translate http ' + r.status);
    const d = await r.json();
    const out = d[0].map(p => p[0]).join('');
    trCache.set(cut, out);
    scheduleCacheSave();
    return out;
  }catch{return text}
}

async function translateQueue(elements, token){
  let idx = 0;
  const worker = async () => {
    while(idx < elements.length && token === reqId){
      const el = elements[idx++];
      if(!el || !el.dataset || !el.dataset.orig) continue;
      const ru = await translate(el.dataset.orig);
      if(token === reqId && document.contains(el)) el.textContent = ru;
      await new Promise(res => setTimeout(res, 80));
    }
  };
  await Promise.all([worker(), worker()]);
}

function hexToRgb(hex){
  const h = hex.replace('#','');
  return {r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16)};
}

function applyTheme(themeId){
  document.documentElement.setAttribute('data-theme', themeId);
  const custom = customThemes.find(t => t.id === themeId);
  if(custom){
    for(const [k,v] of Object.entries(custom.colors)){
      if(isValidHex(v)) document.documentElement.style.setProperty('--' + k, v);
    }
    if(custom.colors.accent){
      const rgb = hexToRgb(custom.colors.accent);
      document.documentElement.style.setProperty('--glow', `rgba(${rgb.r},${rgb.g},${rgb.b},.18)`);
      document.documentElement.style.setProperty('--a1', `rgba(${rgb.r},${rgb.g},${rgb.b},.35)`);
    }
    if(custom.colors['accent-2']){
      const rgb = hexToRgb(custom.colors['accent-2']);
      document.documentElement.style.setProperty('--a2', `rgba(${rgb.r},${rgb.g},${rgb.b},.28)`);
    }
  }else{
    THEME_COLORS.forEach(c => document.documentElement.style.removeProperty('--' + c.key));
    document.documentElement.style.removeProperty('--glow');
    document.documentElement.style.removeProperty('--a1');
    document.documentElement.style.removeProperty('--a2');
  }
}

/* THEME EDITOR */
let themeEditState = null;

function openThemeEditor(existingId){
  const existing = existingId ? customThemes.find(t => t.id === existingId) : null;
  const defaults = existing ? existing.colors : {
    's0':'#04060A','s2':'#0C1018','s3':'#131924','s4':'#1A2130',
    'accent':'#38BDF8','accent-2':'#6EE7B7','text':'#E8EDF4','tdim':'#8892A3','dim':'#1E3A5F'
  };
  themeEditState = {id: existing ? existing.id : null, colors: {...defaults}, name: existing ? existing.name : ''};
  $('themeModalTitle').textContent = existing ? 'Редактировать тему' : 'Своя тема';
  $('ct-name').value = themeEditState.name;
  const colorsEl = $('ct-colors');
  colorsEl.innerHTML = THEME_COLORS.map(c => `
    <div class="color-row">
      <label for="ct-${c.key}">${c.label}</label>
      <input type="text" id="ct-txt-${c.key}" value="${esc(themeEditState.colors[c.key])}" maxlength="7">
      <input type="color" id="ct-${c.key}" value="${esc(themeEditState.colors[c.key])}">
    </div>
  `).join('');
  THEME_COLORS.forEach(c => {
    $('ct-' + c.key).addEventListener('input', e => {
      const v = e.target.value;
      themeEditState.colors[c.key] = v;
      $('ct-txt-' + c.key).value = v;
      previewCustomTheme();
    });
    $('ct-txt-' + c.key).addEventListener('input', e => {
      const v = e.target.value.trim();
      if(isValidHex(v)){
        themeEditState.colors[c.key] = v;
        $('ct-' + c.key).value = v;
        previewCustomTheme();
      }
    });
  });
  $('themeModal').classList.add('active');
}

function previewCustomTheme(){
  for(const [k,v] of Object.entries(themeEditState.colors)){
    if(isValidHex(v)) document.documentElement.style.setProperty('--' + k, v);
  }
  if(themeEditState.colors.accent){
    const rgb = hexToRgb(themeEditState.colors.accent);
    document.documentElement.style.setProperty('--glow', `rgba(${rgb.r},${rgb.g},${rgb.b},.18)`);
    document.documentElement.style.setProperty('--a1', `rgba(${rgb.r},${rgb.g},${rgb.b},.35)`);
  }
}

function closeThemeEditor(revert){
  if(revert) applyTheme(safeGetLocalStorage('mch-theme') || 'dark');
  $('themeModal').classList.remove('active');
  if(!document.querySelector('.modal.active') && !document.body.classList.contains('editor-lock')){
    document.body.classList.remove('lock');
  }
  themeEditState = null;
}

function saveCustomTheme(){
  if(!themeEditState) return;
  const name = ($('ct-name').value || '').trim().slice(0, 24);
  if(!name){ toast('Введи название темы','error'); return; }
  if(!/^[\w\s\-А-Яа-яЁё]{1,24}$/.test(name)){ toast('Только буквы, цифры, пробелы, дефис','error'); return; }
  const id = themeEditState.id || ('custom_' + Math.random().toString(36).slice(2,10));
  if(customThemes.some(t => t.id !== id && t.name.toLowerCase() === name.toLowerCase())){
    toast('Такое имя уже есть','error'); return;
  }
  const colors = {};
  for(const [k,v] of Object.entries(themeEditState.colors)){
    if(isValidHex(v)) colors[k] = v;
  }
  if(Object.keys(colors).length < THEME_COLORS.length){
    toast('Некорректные цвета','error'); return;
  }
  if(themeEditState.id){
    const idx = customThemes.findIndex(t => t.id === id);
    if(idx >= 0) customThemes[idx] = {id, name, colors};
    else customThemes.push({id, name, colors});
  }else{
    customThemes.push({id, name, colors});
  }
  saveCustomThemes();
  renderThemeGrid();
  applyTheme(id);
  safeSetLocalStorage('mch-theme', id);
  toast('Тема сохранена: ' + name,'ok');
  closeThemeEditor(false);
}

/* QUERIES */
function buildModrinthQuery(){
  const cfg = TAB_CONFIG[currentTab];
  const sort = $('sortSelect').value;
  const mc = $('mcVersion').value.trim();
  const loader = $('loaderSelect').value;
  const facets = [['project_type:' + cfg.type]];
  if(mc && isValidVersion(mc)) facets.push(['versions:' + mc]);
  if(loader) facets.push(['categories:' + loader]);
  const qs = new URLSearchParams({query:currentQuery, facets:JSON.stringify(facets), limit:LIMIT, offset, index:sort});
  return {qs, key:['mr',currentTab,currentQuery,sort,mc,loader,offset].join('|')};
}
function buildCurseForgeQuery(){
  const cfg = TAB_CONFIG[currentTab];
  const sort = $('sortSelect').value;
  const sortField = sort === 'downloads' ? '6' : sort === 'updated' ? '3' : sort === 'newest' ? '11' : '2';
  const qs = new URLSearchParams({gameId:'432', classId:cfg.cf, searchFilter:currentQuery, pageSize:LIMIT, index:offset, sortField, sortOrder:'desc'});
  return {qs, key:['cf',currentTab,currentQuery,sort,offset].join('|')};
}

async function fetchModrinthPage(){
  const {qs, key} = buildModrinthQuery();
  const cached = cacheGet(key);
  if(cached) return cached;
  const endpoints = [`${MR_API}/search?${qs}`, `${MCIM_MR}/search?${qs}`];
  for(const url of endpoints){
    try{
      const data = await fetchJson(url);
      if(data && data.hits){
        const result = {list:data.hits.map(i => ({source:'modrinth', ...i})), total:data.total_hits ?? 0};
        cacheSet(key, result);
        return result;
      }
    }catch(e){ console.warn('MR mirror failed:', url.split('/')[2], e.message); }
  }
  return {list: [], total: 0};
}
async function fetchCurseForgePage(){
  const {qs, key} = buildCurseForgeQuery();
  const cached = cacheGet(key);
  if(cached) return cached;
  const endpoints = [
    `${MCIM_API}/mods/search?${qs}`,
    `${CURSE_TOOLS}/mods/search?${qs}`,
    `${CFPROXY}/v1/mods/search?${qs}`
  ];
  for(const url of endpoints){
    try{
      const data = await fetchJson(url);
      if(data && data.data && data.data.length){
        const result = {
          list: data.data.map(i => ({source:'curseforge', ...i})),
          total: data.pagination?.totalCount ?? data.data.length
        };
        cacheSet(key, result);
        return result;
      }
    }catch(e){ console.warn('CF mirror failed:', url.split('/')[2], e.message); }
  }
  return {list: [], total: 0};
}

/* LOAD MORE */
async function loadMore(){
  if(isLoading || !hasMore) return;
  isLoading = true;
  const token = reqId;
  try{
    if(currentTab === 'skins'){
      showSkeletons(8);
      let list = [];
      if(currentQuery && isValidNick(currentQuery)){
        let names = [currentQuery];
        try{ names = await fetchNamemcSearch(currentQuery); }catch{}
        list = names.slice(0, SKIN_LIMIT).map(n => ({source:'skin', name:n}));
        hasMore = false;
      }else if(randomMode){
        const adjectives = ['Epic','Dark','Fire','Ice','Shadow','Light','Red','Blue','Green','Gold','Diamond','Nether','Ender','Void','Storm','Frost','Blaze','Pixel','Retro','Craft'];
        const nouns = ['Warrior','Mage','Knight','Archer','Ninja','Pirate','King','Dragon','Wolf','Tiger','Phoenix','Golem','Slime','Creeper','Zombie','Skeleton','Wizard','Steve','Alex'];
        list = Array.from({length:SKIN_LIMIT}, () => ({source:'skin', name:adjectives[Math.floor(Math.random()*adjectives.length)] + nouns[Math.floor(Math.random()*nouns.length)] + Math.floor(Math.random()*100)}));
        hasMore = false;
      }else{
        if(namemcNames === null){
          namemcNames = NICK_POOL;

          if(!namemcFetching){
            namemcFetching = true;
            fetchNamemcTrending(1).then(trending => {
              if(trending && trending.length > 20){
                const existing = new Set(namemcNames.map(n => n.toLowerCase()));
                const fresh = trending.filter(n => !existing.has(n.toLowerCase()));
                if(fresh.length){
                  namemcNames = [...namemcNames, ...fresh];
                  hasMore = true;
                  console.log('[Skins] NameMC added', fresh.length, 'new nicks');
                }
              }
            }).catch(() => {}).finally(() => { namemcFetching = false; });
          }
        }
        const start = offset;
        list = namemcNames.slice(start, start + SKIN_LIMIT).map(n => ({source:'skin', name:n}));
        hasMore = (offset + SKIN_LIMIT) < namemcNames.length;
      }
      removeSkeletons();
      if(token !== reqId) return;
      if(!list.length){ hasMore = false; setSentinel('end'); return; }
      appendCards(list, token);
      offset += list.length;
      setSentinel(hasMore ? 'idle' : 'end');

      if(hasMore && !isLoading){
        requestAnimationFrame(() => {
          const content = $('content');
          if(content && (content.scrollHeight - window.innerHeight) < 100){
            setTimeout(() => loadMore(), 50);
          }
        });
      }
      return;
    }

    showSkeletons(8);
    setSentinel('loading');
    let mrResult = null, cfResult = null, rendered = false;

    const handleMr = async () => {
      try{
        const r = await fetchModrinthPage();
        if(token !== reqId) return null;
        mrResult = r;
        if(r.list.length){
          if(!rendered){ removeSkeletons(); rendered = true; }
          appendCards(r.list, token);
        }
        return r;
      }catch(e){ console.warn('Modrinth:', e.message); return null; }
    };
    const handleCf = async () => {
      try{
        const r = await fetchCurseForgePage();
        if(token !== reqId) return null;
        cfResult = r;
        if(r.list.length){
          if(!rendered){ removeSkeletons(); rendered = true; }
          appendCards(r.list, token);
        }
        return r;
      }catch(e){ console.warn('CurseForge:', e.message); return null; }
    };

    await Promise.all([handleMr(), handleCf()]);
    if(token !== reqId) return;

    if(offset === 0 && mrResult && mrResult.list.length === 0 && !$('mcVersion').value.trim() && !$('loaderSelect').value){
      try{
        const fuzzyQs = new URLSearchParams({query: currentQuery, limit: LIMIT, offset: 0});
        const fuzzyData = await fetchJson(`${MR_API}/search?${fuzzyQs}`);
        if(fuzzyData.hits && fuzzyData.hits.length){
          mrResult = {list: fuzzyData.hits.map(i => ({source:'modrinth', ...i})), total: fuzzyData.total_hits ?? 0};
          removeSkeletons();
          appendCards(mrResult.list, token);
        }
      }catch(e){ console.warn('fuzzy retry failed:', e.message); }
    }

    removeSkeletons();
    if(!mrResult && !cfResult) throw new Error('Оба источника недоступны');
    const mrTotal = mrResult?.total ?? 0;
    const cfTotal = cfResult?.total ?? 0;
    hasMore = (offset + LIMIT) < Math.max(mrTotal, cfTotal);
    offset += LIMIT;
    setSentinel(hasMore ? 'idle' : 'end');
  }catch(e){
    if(token !== reqId) return;
    console.error(e);
    removeSkeletons();
    hasMore = false;
    const errEl = document.createElement('div');
    errEl.className = 'error';
    errEl.innerHTML = `Не удалось загрузить.<div class="error-detail">${esc(e.message||'')}</div>`;
    $('content').appendChild(errEl);
    setSentinel('');
  }finally{
    if(token === reqId) isLoading = false;
  }
}

/* SKIN URLS */
const SKIN_SOURCES = [
  n => `https://minotar.net/armor/body/${encodeURIComponent(n)}/180`,
  n => `https://crafatar.com/renders/body/${encodeURIComponent(n)}?scale=6&overlay`,
  n => `https://mc-heads.net/body/${encodeURIComponent(n)}/180`,
  n => `https://minotar.net/skin/${encodeURIComponent(n)}`
];
function skinRenderUrl(name, step = 0){
  return SKIN_SOURCES[Math.min(Math.max(0, step|0), SKIN_SOURCES.length - 1)](name);
}
function skinTextureUrl(name){ return `https://minotar.net/skin/${encodeURIComponent(name)}`; }
function skinDownloadUrl(name){ return `https://minotar.net/download/${encodeURIComponent(name)}`; }

function appendCards(list, token){
  let grid = $('content').querySelector('.grid');
  if(!grid){
    grid = document.createElement('div');

    $('content').appendChild(grid);
  }
  const startIdx = items.length;
  grid.insertAdjacentHTML('beforeend', list.map((it,i) => buildCardHTML(it, startIdx + i)).join(''));
  items.push(...list);
  if(currentTab !== 'skins'){
    const cards = [...grid.children].slice(startIdx);
    const queue = cards.map(c => c.querySelector('.card-description[data-orig]')).filter(Boolean);
    translateQueue(queue, token);

/* IMG ERRORS */
document.addEventListener('error', e => {
  const img = e.target;
  if(!img || img.tagName !== 'IMG') return;
  if(img.hasAttribute('data-skin-fallback')){
    const step = +img.dataset.skinStep + 1;
    if(step < SKIN_SOURCES.length){
      img.dataset.skinStep = step;
      img.src = skinRenderUrl(img.dataset.skinName, step);
      return;
    }
    img.src = NO_IMG;
    return;
  }
  if(img.hasAttribute('data-fallback') && img.src !== NO_IMG) img.src = NO_IMG;
}, true);

let lastFocused = null;

function trapFocus(e){
  if(e.key !== 'Tab') return;
  const activeModal = $$('.modal.active').pop();
  if(!activeModal) return;
  const focusables = [...activeModal.querySelectorAll('button:not([disabled]), [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(el => el.offsetParent !== null);
  if(!focusables.length) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}

function createSkinViewer(container, skinUrl, opts = {}){
  if(typeof skinview3d === 'undefined' || typeof THREE === 'undefined'){
    const img = document.createElement('img');
    img.src = skinRenderUrl(skinUrl.split('/').pop(), 0);
    img.alt = 'Skin preview';
    img.onerror = () => { img.src = NO_IMG; };
    container.appendChild(img);
    return null;
  }
  try{
    const viewer = new skinview3d.SkinViewer({
      canvas: document.createElement('canvas'),
      width: container.clientWidth || 400,
      height: container.clientHeight || 400,
      skin: skinUrl
    });
    viewer.controls.enableZoom = opts.zoom !== false;
    viewer.controls.enableRotate = true;
    viewer.controls.enablePan = false;
    viewer.camera.position.z = 60;
    if(opts.animation){
      viewer.animation = new skinview3d.WalkingAnimation();
      viewer.animation.speed = 1;
    }
    try{
      viewer.renderer.setClearColor(0x000000, 0);
      viewer.renderer.setClearAlpha(0);
    }catch{}
    viewer.canvas.style.background = 'transparent';
    container.appendChild(viewer.canvas);
    viewer.renderer.setAnimationLoop(() => {
      if(typeof viewer.draw === 'function') viewer.draw();
      else viewer.renderer.render(viewer.scene, viewer.camera);
    });
    return viewer;
  }catch(e){
    console.warn('skinview3d failed:', e);
    const img = document.createElement('img');
    img.src = skinRenderUrl(skinUrl.split('/').pop(), 0);
    img.alt = 'Skin preview';
    img.onerror = () => { img.src = NO_IMG; };
    container.appendChild(img);
    return null;
  }
}

/* VERSION PICKER */
let versionMode = 'mod';

async function loadVersions(item){
  const vSel = $('modalVersion');
  const lSel = $('modalLoader');
  if(!vSel) return;
  const id = safeId(item.source === 'modrinth' ? (item.project_id || item.slug) : item.id);
  if(!id) return;
  try{
    let versions = [];

    if(item.source === 'modrinth'){
      const v = await fetchJson(`${MR_API}/project/${id}/version`);
      versions = (v || []).map(x => ({
        id: x.id,
        name: x.version_number || x.name || 'unknown',
        type: x.version_type || 'release',
        date: x.date_published || '',
        mc: x.game_versions || [],
        loaders: x.loaders || []
      }));
    }else{
      const bases = [MCIM_API, CURSE_TOOLS, CFPROXY];
      for(const base of bases){
        try{
          let idx = 0;
          let guard = 0;
          const collected = [];
          while(guard++ < 20){
            const f = await fetchJson(`${base}/mods/${id}/files?pageSize=50&index=${idx}`);
            const chunk = f.data || [];
            if(!chunk.length) break;
            collected.push(...chunk.map(x => ({
              id: x.id,
              name: x.displayName || x.fileName || 'unknown',
              type: (x.releaseType === 1 ? 'release' : x.releaseType === 2 ? 'beta' : 'alpha'),
              date: x.fileDate || '',
              mc: (x.gameVersions || []).filter(g => /^\d/.test(g)),
              loaders: x.modLoader ? [x.modLoader] : []
            })));
            if(chunk.length < 50 || collected.length >= VERSIONS_MAX) break;
            idx += 50;
          }
          if(collected.length){ versions = collected; break; }
        }catch(e){
          console.warn('CF versions mirror failed:', base, e.message);
        }
      }
    }

    versions.sort((a,b) => (b.date || '').localeCompare(a.date || ''));

    if(!versions.length){
      vSel.innerHTML = '<option value="">Нет версий</option>';
      lSel.innerHTML = '<option value="">—</option>';
      return;
    }

    const mcSet = new Set();
    const loaderSet = new Set();
    versions.forEach(v => {
      v.mc.forEach(m => mcSet.add(m));
      v.loaders.forEach(l => loaderSet.add(l));
    });
    const mcs = [...mcSet].sort((a,b) => compareVersions(b, a));
    const loaders = [...loaderSet].sort();

    renderVersionOptions(versions, mcs, loaders);

    const toggleBtn = $('toggleVersionMode');
    if(toggleBtn && !toggleBtn.__bound){
      toggleBtn.__bound = true;
      toggleBtn.addEventListener('click', () => {
        versionMode = versionMode === 'mod' ? 'game' : 'mod';
        toggleBtn.dataset.mode = versionMode;
        toggleBtn.textContent = versionMode === 'mod' ? 'версия мода' : 'версия игры';
        renderVersionOptions(versions, mcs, loaders);
      });
    }
  }catch(e){
    console.warn('loadVersions failed:', e);
    vSel.innerHTML = '<option value="">Ошибка</option>';
    lSel.innerHTML = '<option value="">—</option>';
  }
}

function renderVersionOptions(versions, mcs, loaders){
  const vSel = $('modalVersion');
  const lSel = $('modalLoader');
  if(!vSel) return;

  if(versionMode === 'mod'){
    vSel.innerHTML = versions.map(v => {
      const tag = v.type === 'release' ? '' : v.type === 'beta' ? ' (beta)' : ' (alpha)';
      return `<option value="${esc(v.id)}">${esc(v.name)}${tag}</option>`;
    }).join('');
    const updateMcList = () => {
      const picked = versions.find(v => String(v.id) === String(vSel.value)) || versions[0];
      if(picked && picked.mc.length){
        lSel.innerHTML = picked.mc.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
      }else{
        lSel.innerHTML = '<option value="">—</option>';
      }
    };
    updateMcList();
    vSel.onchange = updateMcList;
  }else{
    vSel.innerHTML = mcs.length ? mcs.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('') : '<option value="">—</option>';
    lSel.innerHTML = '<option value="">Любой</option>' + loaders.map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join('');
    vSel.onchange = null;
  }
}

function compareVersions(a, b){
  const pa = String(a).split('.').map(Number);
  const pb = String(b).split('.').map(Number);
  for(let i = 0; i < Math.max(pa.length, pb.length); i++){
    const d = (pa[i] || 0) - (pb[i] || 0);
    if(d) return d;
  }
  return 0;
}

async function downloadDirect(source, id, btn){
  if(!id){ toast('Некорректный ID','error'); return; }
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Подготовка...';
  try{
    let url = '', filename = 'download';
    if(source === 'skin'){
      url = skinDownloadUrl(id);
      filename = id + '.png';
    }else if(source === 'modrinth'){
      const v = await fetchJson(`${MR_API}/project/${id}/version`);
      if(!v?.length){ toast('Файлы не найдены','error'); return; }
      let pick = null;
      if(versionMode === 'mod'){
        const wantId = $('modalVersion')?.value || '';
        pick = v.find(x => String(x.id) === String(wantId));
      }else{
        const wantMc = $('modalVersion')?.value || '';
        const wantLoader = $('modalLoader')?.value || '';
        pick = v.find(x => (!wantMc || (x.game_versions || []).includes(wantMc)) && (!wantLoader || (x.loaders || []).includes(wantLoader)));
      }
      if(!pick){ toast('Беру последнюю версию','info'); pick = v[0]; }
      const file = (pick.files || []).find(x => x.primary) || (pick.files || [])[0];
      if(!file){ toast('Файл не найден','error'); return; }
      url = file.url;
      filename = file.filename || 'mod.jar';
    }else{
      let pick = null;
      const bases = [MCIM_API, CURSE_TOOLS, CFPROXY];

      if(versionMode === 'mod'){
        const wantId = $('modalVersion')?.value || '';
        for(const base of bases){
          try{
            const f = await fetchJson(`${base}/mods/${id}/files/${wantId}`);
            if(f && f.data){ pick = f.data; break; }
          }catch{}
        }
      }

      if(!pick){
        const wantMc = versionMode === 'game' ? ($('modalVersion')?.value || '') : '';
        const wantLoader = versionMode === 'game' ? ($('modalLoader')?.value || '') : '';
        for(const base of bases){
          try{
            let idx = 0, guard = 0;
            while(guard++ < 20){
              const f = await fetchJson(`${base}/mods/${id}/files?pageSize=50&index=${idx}`);
              const chunk = f.data || [];
              if(!chunk.length) break;
              const found = chunk.find(x => {
                const mcOk = !wantMc || (x.gameVersions || []).includes(wantMc);
                const ldOk = !wantLoader || x.modLoader === wantLoader;
                return mcOk && ldOk;
              });
              if(found){ pick = found; break; }
              if(chunk.length < 50) break;
              idx += 50;
            }
            if(pick) break;
          }catch{}
        }
      }

      if(!pick){
        for(const base of bases){
          try{
            const f0 = await fetchJson(`${base}/mods/${id}/files?pageSize=1&index=0`);
            pick = (f0.data || [])[0];
            if(pick) break;
          }catch{}
        }
      }
      if(!pick){ toast('Файлы не найдены','error'); return; }

      const fid = safeId(pick.id);
      if(!fid){ toast('Некорректный ID','error'); return; }
      filename = pick.fileName || 'mod.jar';
      let dlData = null;
      for(const base of bases){
        try{
          const dl = await fetchJson(`${base}/mods/${id}/files/${fid}/download-url`);
          if(dl && dl.data){ dlData = dl.data; break; }
        }catch(e){ console.warn('download-url failed:', base, e.message); }
      }
      if(!dlData){ toast('Автор запретил скачивание','error'); return; }
      url = dlData;
    }
    const safe = safeUrl(url);
    if(!safe){ toast('Некорректная ссылка','error'); return; }
    const a = document.createElement('a');
    a.href = safe;
    a.download = filename;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('Скачивание: ' + filename,'ok');
  }catch(e){
    console.error(e);
    toast('Ошибка: ' + (e.message || 'не удалось'),'error');
  }finally{
    btn.disabled = false;
    btn.textContent = old;
  }
}

/* FORMAT NUMBER */
function formatNumber(n){
  n = Number(n) || 0;
  if(n >= 1e6){
    const v = n / 1e6;
    return (v >= 100 ? Math.round(v) : (Math.round(v*10)/10).toString().replace(/\.0$/,'')) + 'M';
  }
  if(n >= 1000){
    const v = n / 1000;
    return (v >= 999.5 ? (Math.round(n/1e5)/10).toString().replace(/\.0$/,'') + 'M' : (Math.round(v*10)/10).toString().replace(/\.0$/,'') + 'K');
  }
  return String(n);
}

/* NAMEMC */
async function fetchNamemcTrending(page = 1){
  const html = await fetchViaProxy(`https://namemc.com/skins/trending?page=${page}`);
  const names = [...html.matchAll(/data-player-name="([^"]+)"/g)].map(m => m[1]);
  return [...new Set(names)].filter(n => isValidNick(n)).slice(0, 60);
}
async function fetchNamemcSearch(query){
  const html = await fetchViaProxy(`https://namemc.com/search?q=${encodeURIComponent(query)}`);
  const matches = [...html.matchAll(/data-player-name="([^"]+)"/g)].map(m => m[1]);
  const uniq = [...new Set(matches)].filter(n => isValidNick(n));
  return uniq.length ? uniq : [query];
}

    if(editorState.tool === 'fill'){

      }
      return;
    }
    const S = SKIN_PIXEL;
    const isBase = editorState.activeLayer === 'base';
    const flatBg = ((px + py) % 2 === 0) ? '#1a1f2b' : '#252b38';

    if(editorState.tool === 'eraser'){
      ctx.clearRect(px, py, 1, 1);
      if(editorState.flatCtx){
        editorState.flatCtx.fillStyle = flatBg;
        editorState.flatCtx.fillRect(px*S, py*S, S, S);

    }else{

        editorState.flatCtx.globalAlpha = isBase ? 1 : 0.75;
