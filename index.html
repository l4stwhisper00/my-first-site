        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {

            --surface-1: #0A0D12;
            --surface-2: #0F131C;
            --surface-3: #161D2B;
            --surface-4: #1E2636;
            --accent: #38BDF8;
            --accent-dim: #1E3A5F;
            --text: #E8EDF4;
            --text-dim: #9CA3AF;
            --success: #10B981;
            --error: #EF4444;
            --radius-full: 999px;
            --radius-lg: 1.5rem;
            --spacing-xs: 0.5rem;

            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        }

        body {
            background: var(--surface-0);
            color: var(--text);
            font-family: var(--font-body);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--spacing-xl);
        }

        header {
            margin-bottom: var(--spacing-xl);
            text-align: center;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: var(--spacing-md);
            background: linear-gradient(135deg, var(--accent), #6EE7B7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        .tabs {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
            overflow-x: auto;
            padding-bottom: var(--spacing-sm);
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab {
            background: var(--surface-2);
            color: var(--text-dim);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab:hover {
            background: var(--surface-3);
            color: var(--text);
        }

        .tab.active {
            background: var(--accent);
            color: var(--surface-0);
        }

        .search-container {
            background: var(--surface-2);
            padding: var(--spacing-xl);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-xl);
        }

        .search-row {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            background: var(--surface-3);
            border: 2px solid transparent;
            color: var(--text);
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-full);
            font-size: 1rem;
            transition: border 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

            color: var(--text-dim);
        }
