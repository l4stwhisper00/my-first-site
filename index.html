<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Hub — Моды, Модпаки, Ресурспаки, Шейдеры, Скины</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --surface-0: #05070C;
            --surface-1: #0A0D12;
            --surface-2: #0F131C;
            --surface-3: #161D2B;
            --surface-4: #1E2636;
            --accent: #38BDF8;
            --accent-dim: #1E3A5F;
            --text: #E8EDF4;
            --text-dim: #9CA3AF;
            --success: #10B981;
            --error: #EF4444;
            --radius-full: 999px;
            --radius-lg: 1.5rem;
            --spacing-xs: 0.5rem;
            --spacing-sm: 0.75rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        }

        body {
            background: var(--surface-0);
            color: var(--text);
            font-family: var(--font-body);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--spacing-xl);
        }

        header {
            margin-bottom: var(--spacing-xl);
            text-align: center;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: var(--spacing-md);
            background: linear-gradient(135deg, var(--accent), #6EE7B7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
            overflow-x: auto;
            padding-bottom: var(--spacing-sm);
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab {
            background: var(--surface-2);
            color: var(--text-dim);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab:hover {
            background: var(--surface-3);
            color: var(--text);
        }

        .tab.active {
            background: var(--accent);
            color: var(--surface-0);
        }

        /* Search Bar */
        .search-container {
            background: var(--surface-2);
            padding: var(--spacing-xl);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-xl);
        }

        .search-row {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            background: var(--surface-3);
            border: 2px solid transparent;
            color: var(--text);
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-full);
            font-size: 1rem;
            transition: border 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-input::placeholder {
            color: var(--text-dim);
        }

        .search-btn {
            background: var(--accent);
            color: var(--surface-0);
            padding: 0.75rem 2rem;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
        }

        .search-btn:hover {
            background: #22A9E0;
            transform: scale(1.02);
        }

        .search-btn:active {
            transform: scale(0.98);
        }

        .filters {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .filter-select {
            background: var(--surface-3);
            border: 2px solid transparent;
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            cursor: pointer;
            transition: border 0.2s;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .filter-select option {
            background: var(--surface-3);
            color: var(--text);
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }

        .card {
            background: var(--surface-2);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.15);
        }

        .card-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: var(--surface-4);
        }

        .card-content {
            padding: var(--spacing-lg);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--text);
            line-height: 1.3;
        }

        .card-description {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: var(--spacing-md);
            line-height: 1.5;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
            margin-bottom: var(--spacing-md);
        }

        .tag {
            background: var(--accent-dim);
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .card-stats {
            display: flex;
            justify-content: space-between;
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: var(--spacing-md);
        }

        .btn {
            background: var(--accent);
            color: var(--surface-0);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #22A9E0;
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: var(--surface-3);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: var(--surface-4);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 12, 0.95);
            backdrop-filter: blur(8px);
            z-index: 1000;
            overflow-y: auto;
            animation: fadeIn 0.2s;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--surface-2);
            border-radius: var(--radius-lg);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: var(--spacing-xl);
            border-bottom: 1px solid var(--surface-3);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--spacing-md);
        }

        .modal-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .modal-close:hover {
            background: var(--surface-3);
            color: var(--text);
        }

        .modal-body {
            padding: var(--spacing-xl);
        }

        .modal-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-lg);
            background: var(--surface-4);
        }

        .modal-description {
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: var(--spacing-lg);
        }

        .modal-info {
            display: grid;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: var(--spacing-sm) 0;
            border-bottom: 1px solid var(--surface-3);
        }

        .info-label {
            color: var(--text-dim);
            font-weight: 500;
        }

        .info-value {
            color: var(--text);
            font-weight: 600;
            text-align: right;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }

        /* Loading */
        .loading {
            text-align: center;
            color: var(--text-dim);
            padding: var(--spacing-xl);
            font-size: 1.1rem;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            color: #FCA5A5;
            padding: var(--spacing-lg);
            border-radius: var(--radius-lg);
            text-align: center;
            margin: var(--spacing-xl) 0;
        }

        .empty {
            text-align: center;
            color: var(--text-dim);
            padding: var(--spacing-xl);
            font-size: 1.1rem;
        }

        .load-more {
            text-align: center;
            margin-top: var(--spacing-xl);
        }

        /* Skin specific */
        .skin-card .card-image {
            height: 250px;
            object-fit: contain;
            background: linear-gradient(135deg, var(--surface-3), var(--surface-4));
        }

        @media (max-width: 768px) {
            .container {
                padding: var(--spacing-md);
            }

            .modal-actions {
                grid-template-columns: 1fr;
            }

            .search-row {
                flex-direction: column;
            }

            .search-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Minecraft Hub</h1>
            <p class="subtitle">Моды, Модпаки, Ресурспаки, Шейдеры и Скины — всё в одном месте</p>
        </header>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" data-tab="mods">Моды</button>
            <button class="tab" data-tab="modpacks">Модпаки</button>
            <button class="tab" data-tab="resourcepacks">Ресурспаки</button>
            <button class="tab" data-tab="shaders">Шейдеры</button>
            <button class="tab" data-tab="skins">Скины</button>
        </div>

        <!-- Search Container -->
        <div class="search-container" id="searchContainer">
            <div class="search-row">
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск...">
                <button class="search-btn" id="searchBtn">Искать</button>
            </div>
            <div class="filters" id="filtersContainer">
                <!-- Filters will be injected here -->
            </div>
        </div>

        <!-- Content Grid -->
        <div id="contentArea">
            <div class="loading">Загрузка</div>
        </div>

        <!-- Load More Button -->
        <div class="load-more" id="loadMoreContainer" style="display: none;">
            <button class="btn" id="loadMoreBtn">Загрузить ещё</button>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle"></h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content will be injected here -->
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = 'https://minecraft-proxy.zxcdedinside944.workers.dev/';
        
        let currentTab = 'mods';
        let currentPage = 0;
        let currentQuery = '';
        let currentVersion = '';
        let isLoading = false;

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                currentPage = 0;
                currentQuery = '';
                document.getElementById('searchInput').value = '';
                loadContent();
            });
        });

        // Search
        document.getElementById('searchBtn').addEventListener('click', () => {
            currentQuery = document.getElementById('searchInput').value;
            currentPage = 0;
            loadContent();
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                currentQuery = document.getElementById('searchInput').value;
                currentPage = 0;
                loadContent();
            }
        });

        // Load More
        document.getElementById('loadMoreBtn').addEventListener('click', () => {
            currentPage++;
            loadContent(true);
        });

        // Modal
        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('modal').classList.remove('active');
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') {
                document.getElementById('modal').classList.remove('active');
            }
        });

        // Load content based on current tab
        async function loadContent(append = false) {
            if (isLoading) return;
            isLoading = true;

            const contentArea = document.getElementById('contentArea');
            const loadMoreContainer = document.getElementById('loadMoreContainer');

            if (!append) {
                contentArea.innerHTML = '<div class="loading">Загрузка</div>';
                loadMoreContainer.style.display = 'none';
            }

            try {
                let data;
                
                if (currentTab === 'skins') {
                    data = await loadSkins();
                } else {
                    data = await loadMods();
                }

                if (!append) {
                    contentArea.innerHTML = '';
                }

                if (data.items.length === 0 && !append) {
                    contentArea.innerHTML = '<div class="empty">Ничего не найдено</div>';
                } else {
                    renderContent(data.items, append);
                    
                    if (data.hasMore) {
                        loadMoreContainer.style.display = 'block';
                    } else {
                        loadMoreContainer.style.display = 'none';
                    }
                }
            } catch (error) {
                console.error('Error loading content:', error);
                contentArea.innerHTML = `<div class="error">Ошибка загрузки: ${error.message}</div>`;
            }

            isLoading = false;
        }

        // Load mods/modpacks/resourcepacks/shaders
        async function loadMods() {
            const categoryMap = {
                'mods': '6',
                'modpacks': '4471',
                'resourcepacks': '12',
                'shaders': '6552'
            };

            const facetsMap = {
                'mods': '["project_type:mod"]',
                'modpacks': '["project_type:modpack"]',
                'resourcepacks': '["project_type:resourcepack"]',
                'shaders': '["project_type:shader"]'
            };

            // Load from both CurseForge and Modrinth
            const [curseforgeData, modrinthData] = await Promise.all([
                fetch(`${WORKER_URL}/curseforge/search?query=${encodeURIComponent(currentQuery)}&category=${categoryMap[currentTab]}&pageSize=10&index=${currentPage * 10}`).then(r => r.json()),
                fetch(`${WORKER_URL}/modrinth/search?query=${encodeURIComponent(currentQuery)}&facets=${encodeURIComponent(facetsMap[currentTab])}&limit=10&offset=${currentPage * 10}`).then(r => r.json())
            ]);

            const items = [];

            // Process CurseForge data
            if (curseforgeData.data) {
                curseforgeData.data.forEach(mod => {
                    items.push({
                        source: 'curseforge',
                        id: mod.id,
                        name: mod.name,
                        description: mod.summary,
                        image: mod.logo?.url || 'https://via.placeholder.com/280x160?text=No+Image',
                        downloads: mod.downloadCount,
                        author: mod.authors?.[0]?.name || 'Unknown',
                        dateModified: mod.dateModified,
                        latestFiles: mod.latestFiles || []
                    });
                });
            }

            // Process Modrinth data
            if (modrinthData.hits) {
                modrinthData.hits.forEach(project => {
                    items.push({
                        source: 'modrinth',
                        id: project.project_id,
                        slug: project.slug,
                        name: project.title,
                        description: project.description,
                        image: project.icon_url || project.gallery?.[0] || 'https://via.placeholder.com/280x160?text=No+Image',
                        downloads: project.downloads,
                        author: project.author,
                        dateModified: project.date_modified,
                        versions: project.versions || []
                    });
                });
            }

            return {
                items,
                hasMore: (curseforgeData.data?.length === 10 || modrinthData.hits?.length === 10)
            };
        }

        // Load skins
        async function loadSkins() {
            if (currentQuery) {
                // Search by username
                const response = await fetch(`${WORKER_URL}/skins/search?username=${encodeURIComponent(currentQuery)}`);
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                return {
                    items: [data.skin],
                    hasMore: false
                };
            } else {
                // Load popular skins
                const response = await fetch(`${WORKER_URL}/skins/popular`);
                const data = await response.json();
                
                return {
                    items: data.skins,
                    hasMore: false
                };
            }
        }

        // Render content
        function renderContent(items, append) {
            const contentArea = document.getElementById('contentArea');
            
            if (!append) {
                contentArea.innerHTML = '<div class="grid"></div>';
            }

            const grid = contentArea.querySelector('.grid');

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = currentTab === 'skins' ? 'card skin-card' : 'card';
                
                if (currentTab === 'skins') {
                    card.innerHTML = `
                        <img src="${item.imageUrl}" alt="${item.name}" class="card-image" onerror="this.src='https://via.placeholder.com/280x250?text=No+Image'">
                        <div class="card-content">
                            <h3 class="card-title">${item.name}</h3>
                            <button class="btn" onclick="downloadSkin('${item.id}', '${item.name}')">Скачать скин</button>
                        </div>
                    `;
                } else {
                    const downloads = item.downloads ? item.downloads.toLocaleString() : '0';
                    const date = new Date(item.dateModified).toLocaleDateString('ru-RU');
                    
                    card.innerHTML = `
                        <img src="${item.image}" alt="${item.name}" class="card-image" onerror="this.src='https://via.placeholder.com/280x160?text=No+Image'">
                        <div class="card-content">
                            <h3 class="card-title">${item.name}</h3>
                            <p class="card-description">${item.description || 'Нет описания'}</p>
                            <div class="card-meta">
                                <span class="tag">${item.author}</span>
                                <span class="tag">${item.source === 'curseforge' ? 'CurseForge' : 'Modrinth'}</span>
                            </div>
                            <div class="card-stats">
                                <span>📥 ${downloads}</span>
                                <span>📅 ${date}</span>
                            </div>
                            <button class="btn" onclick="showDetails('${item.source}', '${item.id}', '${item.slug || ''}')">Подробнее</button>
                        </div>
                    `;
                }

                grid.appendChild(card);
            });
        }

        // Show details modal
        async function showDetails(source, id, slug) {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modal.classList.add('active');
            modalBody.innerHTML = '<div class="loading">Загрузка</div>';

            try {
                let data;
                let files = [];

                if (source === 'curseforge') {
                    const [modData, filesData] = await Promise.all([
                        fetch(`${WORKER_URL}/curseforge/mod/${id}`).then(r => r.json()),
                        fetch(`${WORKER_URL}/curseforge/files/?modId=${id}`).then(r => r.json())
                    ]);

                    data = modData.data;
                    files = filesData.data || [];
                } else {
                    const [projectData, versionsData] = await Promise.all([
                        fetch(`${WORKER_URL}/modrinth/project/${slug || id}`).then(r => r.json()),
                        fetch(`${WORKER_URL}/modrinth/versions/?projectId=${slug || id}`).then(r => r.json())
                    ]);

                    data = projectData;
                    files = versionsData;
                }

                modalTitle.textContent = data.name || data.title;

                let filesHtml = '';
                
                if (source === 'curseforge' && files.length > 0) {
                    const latestFile = files[0];
                    filesHtml = `
                        <button class="btn" onclick="downloadFile('curseforge', ${data.id}, ${latestFile.id}, '${latestFile.fileName}')">
                            Скачать ${latestFile.fileName}
                        </button>
                    `;
                } else if (source === 'modrinth' && files.length > 0) {
                    const latestFile = files[0];
                    const downloadUrl = latestFile.files?.[0]?.url;
                    if (downloadUrl) {
                        filesHtml = `
                            <button class="btn" onclick="downloadFile('modrinth', null, null, '${latestFile.name}', '${encodeURIComponent(downloadUrl)}')">
                                Скачать ${latestFile.name}
                            </button>
                        `;
                    }
                }

                modalBody.innerHTML = `
                    <img src="${data.logo?.url || data.icon_url || 'https://via.placeholder.com/900x300?text=No+Image'}" 
                         alt="${data.name || data.title}" 
                         class="modal-image"
                         onerror="this.src='https://via.placeholder.com/900x300?text=No+Image'">
                    <div class="modal-description">${data.summary || data.description || 'Нет описания'}</div>
                    <div class="modal-info">
                        <div class="info-row">
                            <span class="info-label">Автор</span>
                            <span class="info-value">${data.authors?.[0]?.name || data.team || 'Unknown'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Загрузок</span>
                            <span class="info-value">${(data.downloadCount || data.downloads || 0).toLocaleString()}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Обновлено</span>
                            <span class="info-value">${new Date(data.dateModified || data.updated).toLocaleDateString('ru-RU')}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Источник</span>
                            <span class="info-value">${source === 'curseforge' ? 'CurseForge' : 'Modrinth'}</span>
                        </div>
                    </div>
                    <div class="modal-actions">
                        ${filesHtml}
                    </div>
                `;
            } catch (error) {
                console.error('Error loading details:', error);
                modalBody.innerHTML = `<div class="error">Ошибка загрузки: ${error.message}</div>`;
            }
        }

        // Download file
        function downloadFile(source, modId, fileId, fileName, downloadUrl) {
            let url;
            
            if (source === 'curseforge') {
                url = `${WORKER_URL}/curseforge/download?modId=${modId}&fileId=${fileId}`;
            } else {
                url = `${WORKER_URL}/modrinth/download?url=${downloadUrl}`;
            }

            // Create temporary link and trigger download
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Download skin
        function downloadSkin(uuid, name) {
            const url = `${WORKER_URL}/skins/download?uuid=${uuid}`;
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Initial load
        loadContent();
    </script>
</body>
</html>
