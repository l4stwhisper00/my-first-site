let currentTab = 'mods', currentQuery = '';

function safeUrl(u) { try { const x = new URL(u); return x.protocol === 'https:' ? x.href : ''; } catch { return ''; } }
const safeId = v => /^[\w-]{1,64}$/.test(String(v)) ? String(v) : '';
const isValidNick = n => /^\w{3,16}$/.test(n);

function toast(msg, kind = 'info', ms = 4000) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind === 'error' ? 'error' : kind === 'ok' ? 'ok' : '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, ms);
}

const trCache = new Map();
try { Object.entries(JSON.parse(localStorage.getItem('trCache') || '{}')).forEach(([k, v]) => trCache.set(k, v)); } catch {}
let cacheSaveTimer = null;
function scheduleCacheSave() {
  if (cacheSaveTimer) return;
  cacheSaveTimer = setTimeout(() => {
    try { localStorage.setItem('trCache', JSON.stringify(Object.fromEntries([...trCache].slice(-300)))); } catch {}
    cacheSaveTimer = null;
  }, 1500);
}
const needsTranslation = t => t && t.length > 2 && (t.match(/[а-яё]/gi) || []).length < t.length * 0.2;
async function translate(text, signal) {
  if (!needsTranslation(text)) return text;
  const cut = text.slice(0, 450);
  if (trCache.has(cut)) return trCache.get(cut);
  try {
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q=' + encodeURIComponent(cut), { signal });
    if (!r.ok) throw 0;
    const d = await r.json();
    const out = d[0].map(p => p[0]).join('');
    trCache.set(cut, out); scheduleCacheSave();
    return out;
  } catch { return text; }
}

const sentinel = $('sentinel');
const io = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && !isLoading && hasMore && !isEditorTab(currentTab)) loadMore();
}, { rootMargin: '400px' });

function setSentinel(state) {
  if (state === 'loading') { sentinel.textContent = 'Загрузка...'; sentinel.classList.remove('end'); }
  else if (state === 'end') { sentinel.textContent = '— Конец списка —'; sentinel.classList.add('end'); }
  else { sentinel.textContent = ''; sentinel.classList.remove('end'); }
}

document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
  tab.classList.add('active'); tab.setAttribute('aria-selected', 'true');
  currentTab = tab.dataset.tab; currentQuery = '';
  $('searchInput').value = '';

  if (isEditorTab(currentTab)) {
    $('searchContainer').classList.add('hidden');
    $('sentinel').classList.add('hidden');
    if (currentTab === 'skineditor') initSkinEditor();
    else initPackEditor();
    return;
  }

  $('searchContainer').classList.remove('hidden');
  $('sentinel').classList.remove('hidden');
  const sk = currentTab === 'skins';
  $('filters').classList.toggle('hidden', sk);
  $('searchInput').placeholder = sk ? 'Ник игрока (3–16 символов: буквы, цифры, _)' : 'Поиск...';
  resetAndLoad();
}));
$('searchBtn').addEventListener('click', performSearch);
$('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') performSearch(); });
$('sortSelect').addEventListener('change', resetAndLoad);
$('mcVersion').addEventListener('change', resetAndLoad);
$('loaderSelect').addEventListener('change', resetAndLoad);

function performSearch() {
  const now = Date.now();
  if (now - lastSearch < 600) return;
  lastSearch = now;
  currentQuery = $('searchInput').value.trim().slice(0, 64);
  resetAndLoad();
}

function resetAndLoad() {
  if (isEditorTab(currentTab)) return;
  reqId++;
  items = [];
  offset = 0;
  hasMore = true;
  isLoading = false;
  skinCursor = 0;

  if (currentTab === 'skins') {
    if (currentQuery) {
      if (!isValidNick(currentQuery)) {
        $('content').innerHTML = '<div class="error">Ник должен быть 3–16 символов: буквы, цифры, _</div>';
        setSentinel('');
        return;
      }
      skinPool = [{ name: currentQuery, source: 'query' }];
    } else {
      skinPool = SKIN_NAMES.map(n => ({ name: n, source: 'local' }));
    }
  } else {
    skinPool = [];
  }
  $('content').innerHTML = '';
  setSentinel('idle');
  loadMore();
}

async function loadMore() {
  if (isLoading || !hasMore) return;
  isLoading = true;
  const token = reqId;
  setSentinel('loading');

  try {
    if (currentTab === 'skins') {
      const batch = skinPool.slice(skinCursor, skinCursor + LIMIT);
      skinCursor += batch.length;
      if (skinCursor >= skinPool.length) hasMore = false;
      if (token !== reqId) return;
      if (batch.length) appendCards(batch, token);
      setSentinel(hasMore ? 'idle' : 'end');
      return;
    }

    const { list, nextHasMore, note } = await fetchModsPage();
    if (token !== reqId) return;
    if (note) {
      const noteEl = document.createElement('div');
      noteEl.className = 'info-note';
      noteEl.textContent = note;
      $('content').prepend(noteEl);
    }
    appendCards(list, token);
    hasMore = nextHasMore;
    offset += LIMIT;
    setSentinel(hasMore ? 'idle' : 'end');
  } catch (e) {
    if (token !== reqId) return;
    console.error(e);
    hasMore = false;
    const errEl = document.createElement('div');
    errEl.className = 'error';
    errEl.innerHTML = `Не удалось загрузить данные.<div class="error-detail">${esc(e.message || '')}</div>`;
    $('content').appendChild(errEl);
    setSentinel('');
  } finally {
    if (token === reqId) isLoading = false;
  }
}

async function fetchModsPage() {
  const cfg = tabConfig[currentTab], sort = $('sortSelect').value;
  const q = currentQuery;
  const mc = $('mcVersion').value.trim();
  const loader = $('loaderSelect').value;

  // Modrinth params
  const facets = [['project_type:' + cfg.type]];
  if (mc && isValidVersion(mc)) facets.push(['versions:' + mc]);
  if (loader) facets.push(['categories:' + loader]);
  const mrQs = new URLSearchParams({
    query: q, facets: JSON.stringify(facets),
    limit: LIMIT, offset, index: sort
  });

  // CurseForge params (MCIM)
  const cfQs = new URLSearchParams({
    gameId: '432', classId: cfg.cf,
    searchFilter: q, pageSize: LIMIT, index: offset,
    sortField: sort === 'downloads' ? '6' : (sort === 'updated' ? '3' : (sort === 'newest' ? '11' : '2')),
    sortOrder: 'desc'
  });

  const [mr, cf] = await Promise.allSettled([
    tryFetchJson(
      `${MR_API}/search?${mrQs}`,
      `${WORKER_URL}/modrinth/search?${mrQs}`
    ),
    tryFetchJson(
      `${MCIM_API}/mods/search?${cfQs}`,
      `${WORKER_URL}/curseforge/search?${cfQs}`
    )
  ]);

  if (mr.status === 'rejected' && cf.status === 'rejected') {
    throw new Error(`Modrinth: ${mr.reason?.message || '?'} • CurseForge: ${cf.reason?.message || '?'}`);
  }

  const a = mr.status === 'fulfilled' ? (mr.value.hits || []).map(i => ({ source: 'modrinth', ...i })) : [];
  const b = cf.status === 'fulfilled' ? (cf.value.data || []).map(i => ({ source: 'curseforge', ...i })) : [];
  const totalMr = mr.status === 'fulfilled' ? (mr.value.total_hits ?? a.length) : 0;
  const totalCf = cf.status === 'fulfilled' ? (cf.value.pagination?.totalCount ?? b.length) : 0;

  let note = '';
  if (cf.status === 'rejected') note = 'CurseForge недоступен: ' + (cf.reason?.message || 'ошибка') + '. Показан только Modrinth.';
  if (mr.status === 'rejected') note = 'Modrinth недоступен: ' + (mr.reason?.message || 'ошибка') + '. Показан только CurseForge.';

  const nextOffset = offset + LIMIT;
  const nextHasMore = nextOffset < Math.max(totalMr, totalCf);
  return { list: [...a, ...b], nextHasMore, note };
}

async function translateNew(token, fromIdx) {
  const cards = [...$('content').querySelectorAll('.card')].slice(fromIdx);
  const queue = cards.map(c => c.querySelector('.card-description[data-orig]')).filter(Boolean);
  const worker = async () => {
    while (queue.length && token === reqId) {
      const el = queue.shift();
      const ru = await translate(el.dataset.orig);
      if (token === reqId) el.textContent = ru;
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
}

function trapFocus(e) {
  if (e.key !== 'Tab') return;
  const modal = $('detailModal');
  if (!modal.classList.contains('active')) return;
  const focusables = [...modal.querySelectorAll('button:not([disabled]), [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(el => el.offsetParent !== null);
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

async function loadVersions(item) {
  const vSel = $('modalVersion'), lSel = $('modalLoader');
  if (!vSel) return;
  const id = safeId(item.source === 'modrinth' ? (item.project_id || item.slug) : item.id);
  if (!id) return;
  try {
    let versions = [];
    if (item.source === 'modrinth') {
      const v = await tryFetchJson(
        `${MR_API}/project/${id}/version`,
        `${WORKER_URL}/modrinth/project/${id}/version`
      );
      versions = (v || []).map(x => ({ id: x.id, mc: x.game_versions || [], loaders: x.loaders || [] }));
    } else {
      const f = await tryFetchJson(
        `${MCIM_API}/mods/${id}/files?pageSize=20`,
        `${WORKER_URL}/curseforge/mod/${id}/files`
      );
      versions = (f.data || []).map(x => ({
        id: x.id, mc: (x.gameVersions || []).filter(g => /^\d/.test(g)),
        loaders: x.modLoader ? [x.modLoader] : []
      }));
    }
    const mcSet = new Set(), loaderSet = new Set();
    versions.forEach(v => { v.mc.forEach(m => mcSet.add(m)); v.loaders.forEach(l => loaderSet.add(l)); });
    const mcs = [...mcSet].sort((a, b) => compareVersions(b, a));
    const loaders = [...loaderSet].sort();
    vSel.innerHTML = mcs.length ? mcs.map(m => `<option>${esc(m)}</option>`).join('') : '<option value="">—</option>';
    lSel.innerHTML = '<option value="">Любой</option>' + loaders.map(l => `<option>${esc(l)}</option>`).join('');
    const userMc = $('mcVersion').value.trim();
    if (userMc && mcs.includes(userMc)) vSel.value = userMc;
    const userLoader = $('loaderSelect').value;
    if (userLoader && loaders.includes(userLoader)) lSel.value = userLoader;
  } catch (e) {
    console.warn('loadVersions failed:', e);
    vSel.innerHTML = '<option value="">Ошибка</option>';
    lSel.innerHTML = '<option value="">—</option>';
  }
}

function compareVersions(a, b) {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const d = (pa[i] || 0) - (pb[i] || 0);
    if (d) return d;
  }
  return 0;
}

async function downloadDirect(source, id, btn) {
  if (!id) { toast('Некорректный идентификатор', 'error'); return; }
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = 'Подготовка...';

  try {
    let url = '', filename = 'download';

    if (source === 'skin') {
      url = `https://minotar.net/download/${encodeURIComponent(id)}`;
      filename = id + '.png';
    } else if (source === 'modrinth') {
      const v = await tryFetchJson(
        `${MR_API}/project/${id}/version`,
        `${WORKER_URL}/modrinth/project/${id}/version`
      );
      if (!v?.length) { toast('Файлы не найдены', 'error'); return; }
      const wantMc = $('modalVersion')?.value || '';
      const wantLoader = $('modalLoader')?.value || '';
      let pick = v.find(x =>
        (!wantMc || (x.game_versions || []).includes(wantMc)) &&
        (!wantLoader || (x.loaders || []).includes(wantLoader))
      );
      if (!pick) { toast('Под выбранную версию нет — беру последнюю', 'info'); pick = v[0]; }
      const file = (pick.files || []).find(x => x.primary) || (pick.files || [])[0];
      if (!file) { toast('Файл не найден', 'error'); return; }
      url = file.url;
      filename = file.filename || 'mod.jar';
    } else {
      // CurseForge
      const f = await tryFetchJson(
        `${MCIM_API}/mods/${id}/files?pageSize=20`,
        `${WORKER_URL}/curseforge/mod/${id}/files`
      );
      if (!f.data?.length) { toast('Файлы не найдены', 'error'); return; }
      const wantMc = $('modalVersion')?.value || '';
      const wantLoader = $('modalLoader')?.value || '';
      let pick = f.data.find(x => {
        const mcOk = !wantMc || (x.gameVersions || []).includes(wantMc);
        const ldOk = !wantLoader || x.modLoader === wantLoader;
        return mcOk && ldOk;
      });
      if (!pick) { toast('Под выбранную версию нет — беру последнюю', 'info'); pick = f.data[0]; }
      const fid = safeId(pick.id);
      if (!fid) { toast('Некорректный ID файла', 'error'); return; }
      filename = pick.fileName || 'mod.jar';
      const dl = await tryFetchJson(
        `${MCIM_API}/mods/${id}/files/${fid}/download-url`,
        `${WORKER_URL}/curseforge/download-url/${id}/${fid}`
      );
      if (!dl.data) { toast('Автор запретил скачивание', 'error'); return; }
      url = dl.data;
    }

    const safe = safeUrl(url);
    if (!safe) { toast('Некорректная ссылка', 'error'); return; }

    // Просто открываем в новой вкладке — браузер сам скачает, CORS не нужен
    const a = document.createElement('a');
    a.href = safe;
    a.download = filename;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('Скачивание началось: ' + filename, 'ok');
  } catch (e) {
    console.error(e);
    toast('Не удалось скачать: ' + (e.message || 'ошибка'), 'error');
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

function formatNumber(n) {
  n = Number(n) || 0;
  if (n >= 1e6) { const v = n / 1e6; return (v >= 100 ? Math.round(v) : (Math.round(v * 10) / 10).toString().replace(/\.0$/, '')) + 'M'; }
  if (n >= 1000) { const v = n / 1000; return (v >= 999.5 ? (Math.round(n / 1e5) / 10).toString().replace(/\.0$/, '') + 'M' : (Math.round(v * 10) / 10).toString().replace(/\.0$/, '') + 'K'); }
  return String(n);
}

function loadSkinTemplate(name) {
  const { canvas, ctx } = skinEditorState;
  const img = new Image();

  img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); pushHistory(); updatePreview(); };
  img.onerror = () => { pushHistory(); updatePreview(); };
  img.src = `https://minotar.net/skin/${encodeURIComponent(name)}`;
}

function handleDraw(clientX, clientY) {
  const s = skinEditorState; if (!s) return;
  const rect = s.canvas.getBoundingClientRect();
  const px = Math.floor((clientX - rect.left) * (s.canvas.width / rect.width) / SKIN_PIXEL);
  const py = Math.floor((clientY - rect.top) * (s.canvas.height / rect.height) / SKIN_PIXEL);
  if (px < 0 || py < 0 || px >= SKIN_SIZE || py >= SKIN_SIZE) return;

  if (s.tool === 'fill') { floodFillSkin(px, py, s.color); updatePreview(); return; }
  if (s.tool === 'picker') {
    const data = s.ctx.getImageData(px * SKIN_PIXEL, py * SKIN_PIXEL, 1, 1).data;
    const hex = '#' + [data[0], data[1], data[2]].map(v => v.toString(16).padStart(2, '0')).join('');
    s.color = hex; $('sk-color').value = hex;
    document.querySelectorAll('#sk-palette button').forEach(b => b.classList.remove('active'));
    return;
  }
  if (s.tool === 'eraser') s.ctx.clearRect(px * SKIN_PIXEL, py * SKIN_PIXEL, SKIN_PIXEL, SKIN_PIXEL);
  else { s.ctx.fillStyle = s.color; s.ctx.fillRect(px * SKIN_PIXEL, py * SKIN_PIXEL, SKIN_PIXEL, SKIN_PIXEL); }
}

function floodFillSkin(startX, startY, fillColor) {
  const s = skinEditorState;
  const { ctx, canvas } = s; const w = canvas.width;
  const imgData = ctx.getImageData(0, 0, w, canvas.height);
  const data = imgData.data;
  const startCX = startX * SKIN_PIXEL, startCY = startY * SKIN_PIXEL;
  const startIdx = (startCY * w + startCX) * 4;
  const target = [data[startIdx], data[startIdx + 1], data[startIdx + 2], data[startIdx + 3]];
  const fill = hexToRgbA(fillColor);
  if (target[0] === fill[0] && target[1] === fill[1] && target[2] === fill[2] && target[3] === fill[3]) return;
  const stack = [[startX, startY]], visited = new Set();
  while (stack.length) {
    const [x, y] = stack.pop();
    if (x < 0 || y < 0 || x >= SKIN_SIZE || y >= SKIN_SIZE) continue;
    const key = x + ',' + y;
    if (visited.has(key)) continue;
    visited.add(key);
    const cx = x * SKIN_PIXEL, cy = y * SKIN_PIXEL;
    const idx = (cy * w + cx) * 4;
    if (data[idx] !== target[0] || data[idx + 1] !== target[1] || data[idx + 2] !== target[2] || data[idx + 3] !== target[3]) continue;
    for (let dy = 0; dy < SKIN_PIXEL; dy++) for (let dx = 0; dx < SKIN_PIXEL; dx++) {
      const i = ((cy + dy) * w + (cx + dx)) * 4;
      data[i] = fill[0]; data[i+1] = fill[1]; data[i+2] = fill[2]; data[i+3] = fill[3];
    }
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ctx.putImageData(imgData, 0, 0);
}

function hexToRgbA(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16), 255];
}

function pushHistory() {
  const s = skinEditorState; if (!s) return;
  s.history = s.history.slice(0, s.historyIdx + 1);
  s.history.push(s.canvas.toDataURL());
  s.historyIdx++;
  if (s.history.length > 40) { s.history.shift(); s.historyIdx--; }
}

function updatePreview() {
  const s = skinEditorState; if (!s) return;
  const tmp = document.createElement('canvas');
  tmp.width = SKIN_SIZE; tmp.height = SKIN_SIZE;
  const tctx = tmp.getContext('2d'); tctx.imageSmoothingEnabled = false;
  tctx.drawImage(s.canvas, 0, 0, SKIN_SIZE, SKIN_SIZE);
  const img = $('sk-preview-img'); if (img) img.src = tmp.toDataURL();
}

/* ============================================================
   РЕДАКТОР РЕСУРСПАКОВ
   ============================================================ */
let packState = null;

function initPackEditor() {
  $('content').innerHTML = `
    <div class="editor-wrap">
      <h2>📦 Редактор ресурспаков</h2>
      <p style="color:var(--tdim);margin-bottom:1.5rem">Загрузи .zip ресурспака, просмотри содержимое, замени текстуры, скачай обратно.</p>
      <div class="editor-tools">
        <button class="btn" id="rp-upload">📁 Загрузить .zip</button>
        <button class="btn btn-secondary" id="rp-download" disabled>💾 Скачать .zip</button>
        <button class="btn btn-secondary" id="rp-new" disabled>✏️ Заменить выбранную текстуру</button>
      </div>
      <input type="file" id="rp-file" accept=".zip,application/zip" hidden>
      <input type="file" id="rp-imgfile" accept="image/png" hidden>
      <div class="editor-layout" style="margin-top:1.5rem">
        <div><span class="editor-label">Файлы в паке:</span><div id="rp-tree"><p style="color:var(--tdim)">Пак не загружен</p></div></div>
        <div><span class="editor-label">Предпросмотр:</span><div id="rp-preview"><p style="color:var(--tdim)">Выбери файл слева</p></div></div>
      </div>
    </div>`;

  packState = { zip: null, selectedPath: null };

  $('rp-upload').addEventListener('click', () => $('rp-file').click());
  $('rp-file').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    if (typeof JSZip === 'undefined') { toast('JSZip не загрузился', 'error'); return; }
    try {
      const zip = await JSZip.loadAsync(file);
      packState.zip = zip;
      renderPackTree(zip);
      $('rp-download').disabled = false;
      toast('Пак загружен: ' + file.name, 'ok');
    } catch (err) { toast('Не удалось открыть .zip: ' + err.message, 'error'); }
  });

  $('rp-download').addEventListener('click', async () => {
    if (!packState.zip) return;
    const blob = await packState.zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    const a = document.createElement('a');
    a.download = 'modified-pack.zip';
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Пак скачан', 'ok');
  });

  $('rp-new').addEventListener('click', () => {
    if (!packState.selectedPath) { toast('Сначала выбери файл', 'error'); return; }
    $('rp-imgfile').click();
  });

  $('rp-imgfile').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file || !packState.selectedPath) return;
    try {
      packState.zip.file(packState.selectedPath, file);
      const blob = await file.arrayBuffer();
      showPackPreview(blob, packState.selectedPath);
      toast('Файл заменён: ' + packState.selectedPath, 'ok');
    } catch (err) { toast('Ошибка замены: ' + err.message, 'error'); }
  });
}

function renderPackTree(zip) {
  const tree = $('rp-tree');
  const files = Object.keys(zip.files).filter(p => !zip.files[p].dir).sort();
  if (!files.length) { tree.innerHTML = '<p style="color:var(--tdim)">В паке нет файлов</p>'; return; }
  tree.innerHTML = '<ul>' + files.map(f => `<li data-path="${esc(f)}">${esc(f)}</li>`).join('') + '</ul>';
  tree.querySelectorAll('li').forEach(li => {
    li.addEventListener('click', async () => {
      const path = li.dataset.path;
      packState.selectedPath = path;
      tree.querySelectorAll('li').forEach(x => x.classList.remove('active'));
      li.classList.add('active');
      $('rp-new').disabled = false;
      try {
        const blob = await zip.file(path).async('arraybuffer');
        showPackPreview(blob, path);
      } catch { $('rp-preview').innerHTML = '<p style="color:var(--error)">Не удалось прочитать файл</p>'; }
    });
  });
}

function showPackPreview(arrayBuffer, path) {
  const ext = path.split('.').pop().toLowerCase();
  const prev = $('rp-preview');
  if (!['png','jpg','jpeg','gif','webp'].includes(ext)) {
    let text;
    try { text = new TextDecoder().decode(arrayBuffer).slice(0, 2000); } catch { text = '[бинарный файл]'; }
    prev.innerHTML = `<h4 style="margin-bottom:.5rem">${esc(path)}</h4><pre style="background:var(--s3);padding:1rem;border-radius:1rem;text-align:left;font-size:.8rem;overflow:auto;max-height:400px">${esc(text)}</pre>`;
    return;
  }
  const blob = new Blob([arrayBuffer], { type: 'image/' + ext });
  const url = URL.createObjectURL(blob);
  prev.innerHTML = `<h4 style="margin-bottom:.5rem">${esc(path)}</h4><img src="${url}" alt="preview">`;
}

/* СТАРТ */
io.observe(sentinel);
resetAndLoad();
</script>
