<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--s0:#05070C;--s2:#0F131C;--s3:#161D2B;--s4:#1E2636;--accent:#38BDF8;--dim:#1E3A5F;--text:#E8EDF4;--tdim:#9CA3AF;--error:#EF4444;--ok:#10B981;--r:999px;--rl:1.5rem}
body{background:var(--s0);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;line-height:1.6;min-height:100vh}
body.lock{overflow:hidden}
.container{max-width:1400px;margin:0 auto;padding:2rem}
header{margin-bottom:2rem;text-align:center}
h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:700;letter-spacing:-.02em;margin-bottom:1rem;background:linear-gradient(135deg,var(--accent),#6EE7B7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{color:var(--tdim);font-size:1.1rem}
.tabs{display:flex;gap:.75rem;margin-bottom:2rem;justify-content:center;flex-wrap:wrap}
.tab,.page-btn{background:var(--s2);color:var(--tdim);padding:.75rem 1.5rem;border:none;border-radius:var(--r);font-weight:600;cursor:pointer;font-size:1rem;transition:all .2s;white-space:nowrap}
.tab:hover,.page-btn:hover{background:var(--s3);color:var(--text)}
.tab.active,.page-btn.active{background:var(--accent);color:var(--s0)}
.search-container{background:var(--s2);padding:2rem;border-radius:var(--rl);margin-bottom:2rem}
.search-row{display:flex;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.search-input,.filter-select{background:var(--s3);border:2px solid transparent;color:var(--text);padding:.75rem 1.25rem;border-radius:var(--r);font-size:1rem}
.search-input{flex:1;min-width:250px}
.filter-select{padding:.5rem 1rem;cursor:pointer}
.search-input:focus,.filter-select:focus{outline:none;border-color:var(--accent)}
.filters{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.filters label{color:var(--tdim);font-size:.9rem}
.hidden{display:none!important}
.btn,.search-btn{background:var(--accent);color:var(--s0);padding:.75rem 2rem;border:none;border-radius:var(--r);font-weight:600;cursor:pointer;font-size:1rem;transition:background .2s,transform .1s;text-align:center}
.btn{width:100%;display:inline-block}
.btn:hover,.search-btn:hover{background:#22A9E0;transform:scale(1.02)}
.btn-secondary{background:var(--s3);color:var(--text)}
.btn-secondary:hover{background:var(--s4)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;margin-bottom:2rem}
.card{background:var(--s2);border-radius:var(--rl);overflow:hidden;transition:transform .2s,box-shadow .2s;cursor:pointer;display:flex;flex-direction:column}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 8px 24px rgba(56,189,248,.15);outline:none}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card-image{width:100%;height:160px;object-fit:cover;background:var(--s4)}
.card-image.skin{object-fit:contain;padding:.5rem}
.card-content{padding:1.5rem;flex:1;display:flex;flex-direction:column}
.card-title{font-size:1.15rem;font-weight:600;margin-bottom:.75rem;line-height:1.3;word-break:break-word}
.card-description{color:var(--tdim);font-size:.9rem;margin-bottom:1rem;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;background:var(--dim);color:var(--accent);padding:.25rem .75rem;border-radius:var(--r);font-size:.85rem;font-weight:500;margin-bottom:1rem;align-self:flex-start}
.card-stats{display:flex;justify-content:space-between;gap:.5rem;color:var(--tdim);font-size:.85rem}
.modal{display:none;position:fixed;inset:0;background:rgba(5,7,12,.95);backdrop-filter:blur(8px);z-index:1000;overflow-y:auto}
.modal.active{display:flex;align-items:center;justify-content:center;padding:2rem}
.modal-content{background:var(--s2);border-radius:var(--rl);max-width:900px;width:100%;max-height:90vh;overflow-y:auto}
.modal-header{padding:2rem;border-bottom:1px solid var(--s3);display:flex;justify-content:space-between;gap:1rem}
.modal-title{font-size:1.75rem;font-weight:700;line-height:1.3;word-break:break-word}
.modal-close{background:none;border:none;color:var(--tdim);font-size:2rem;cursor:pointer;width:40px;height:40px;border-radius:50%;flex-shrink:0}
.modal-close:hover{background:var(--s3);color:var(--text)}
.modal-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modal-body{padding:2rem}
.modal-image{width:100%;height:300px;object-fit:cover;border-radius:var(--rl);margin-bottom:1.5rem;background:var(--s4)}
.modal-image.skin{object-fit:contain}
.modal-description{color:var(--tdim);line-height:1.7;margin-bottom:1.5rem;white-space:pre-line}
.modal-info{margin-bottom:2rem}
.info-row{display:flex;justify-content:space-between;padding:.75rem 0;border-bottom:1px solid var(--s3)}
.info-label{color:var(--tdim)}
.info-value{font-weight:600;text-align:right}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.version-picker{background:var(--s3);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:1.5rem;display:flex;flex-direction:column;gap:.75rem}
.version-picker-title{font-size:.9rem;color:var(--tdim)}
.version-picker-row{display:flex;gap:.75rem;flex-wrap:wrap}
.version-picker select{flex:1;min-width:140px}
.loading,.error{text-align:center;padding:2rem;font-size:1.1rem}
.loading{color:var(--tdim)}
.error{color:var(--error);background:var(--s2);border-radius:var(--rl)}
.error-detail{color:var(--tdim);font-size:.85rem;margin-top:.5rem;word-break:break-word}
.info-note{color:var(--accent);background:var(--s2);border-radius:var(--rl);text-align:center;padding:1rem;margin-bottom:1.5rem;font-size:.95rem}
#sentinel{height:40px;display:flex;align-items:center;justify-content:center;color:var(--tdim);font-size:.9rem}
#sentinel.end{color:var(--tdim)}
.progress-overlay{position:fixed;inset:0;background:rgba(5,7,12,.85);z-index:1500;display:flex;align-items:center;justify-content:center;padding:2rem}
.progress-box{background:var(--s2);border-radius:var(--rl);padding:2rem;max-width:480px;width:100%;text-align:center}
.progress-box h3{margin-bottom:1rem;font-size:1.1rem}
.progress-bar{background:var(--s3);border-radius:var(--r);height:12px;overflow:hidden;margin:1rem 0}
.progress-fill{background:var(--accent);height:100%;width:0%;transition:width .2s;border-radius:var(--r)}
.progress-text{color:var(--tdim);font-size:.9rem}
#toasts{position:fixed;bottom:1.5rem;right:1.5rem;display:flex;flex-direction:column;gap:.75rem;z-index:2000;max-width:min(360px,calc(100vw - 3rem))}
.toast{background:var(--s3);color:var(--text);padding:1rem 1.25rem;border-radius:1rem;box-shadow:0 8px 24px rgba(0,0,0,.4);border-left:4px solid var(--accent);animation:slideIn .25s ease-out;font-size:.95rem}
.toast.error{border-left-color:var(--error)}
.toast.ok{border-left-color:var(--ok)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:768px){.container{padding:1rem}.tabs{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}.search-row{flex-direction:column}.modal-actions{grid-template-columns:1fr}.grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}#toasts{right:1rem;left:1rem;max-width:none}}
</style>

<body>
<div class="container">
  <header>
    <h1>Minecraft Hub</h1>
    <p class="subtitle">Все для Minecraft в одном месте</p>
  </header>
  <div class="tabs" role="tablist" aria-label="Категории">
    <button class="tab active" role="tab" aria-selected="true" data-tab="mods">Моды</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="modpacks">Модпаки</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="resourcepacks">Ресурспаки</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="shaders">Шейдеры</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="skins">Скины</button>
  </div>
  <div class="search-container">
    <div class="search-row">
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск..." maxlength="64" autocomplete="off">
      <button class="search-btn" id="searchBtn">Искать</button>
    </div>
    <div class="filters" id="filters">
      <select class="filter-select" id="sortSelect" aria-label="Сортировка">
        <option value="relevance">По релевантности</option>
        <option value="downloads">По загрузкам</option>
        <option value="updated">По обновлению</option>
        <option value="newest">Новые</option>
      </select>
      <label for="mcVersion">Версия MC:</label>
      <input type="text" class="filter-select" id="mcVersion" placeholder="напр. 1.20.1" maxlength="12" autocomplete="off" style="width:130px">
      <label for="loaderSelect">Загрузчик:</label>
      <select class="filter-select" id="loaderSelect" aria-label="Загрузчик">
        <option value="">Любой</option>
        <option value="forge">Forge</option>
        <option value="fabric">Fabric</option>
        <option value="quilt">Quilt</option>
        <option value="neoforge">NeoForge</option>
      </select>
    </div>
  </div>
  <div id="content"></div>
  <div id="sentinel"></div>
</div>

<div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Детали</h2>
      <button class="modal-close" id="modalClose" aria-label="Закрыть">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div id="toasts" aria-live="polite" aria-atomic="false"></div>
<div class="sr-only" id="liveStatus" aria-live="polite"></div>
<script>
'use strict';
const WORKER_URL = 'https://minecraft-proxy.zxcdedinside944.workers.dev';
const LIMIT = 20;
const MAX_DOWNLOAD_MB = 50;
const NO_IMG = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#1E2636"/><text x="150" y="155" fill="#9CA3AF" font-size="20" text-anchor="middle" font-family="sans-serif">Нет фото</text></svg>');

const SKIN_NAMES = [
  'Notch','jeb_','Dinnerbone','Grumm','_Grum','Herobrine','Steve',
  'Technoblade','Dream','GeorgeNotFound','Sapnap','TommyInnit','Tubbo_','WilburSoot','Ph1LzA','Quackity',
  'Grian','MumboJumbo','GoodTimesWithScar','Renthedog','impulseSV','TangoTek','Zedaph','BdoubleO100',
  'Docm77','Keralis','EthosLab','VintageBeef','iskall85','Xisumavoid','Welsknight','Cubfan135',
  'FalseSymmetry','Stressmonster101','ZombieCleo','JoeHills','Hypnotizd','xBCrafted','TinfoilChef',
  'Skeppy','BadBoyHalo','a6d','CaptainSparklez','DanTDM','PopularMMOs','SkyDoesMinecraft',
  'Stampylonghead','iBallisticSquid','LDShadowLady','Smallishbeans','SolidarityGaming','Smajor1995',
  'Fwhip','GeminiTay','Shubble','PearlescentMoon','Jimmy','Pixlriffs','MythicalSausage',
  'AntVenom','SethBling','Noxcrew','Illumina','Fruitberries','Punz','Hbomb94','TapL'
];

const tabConfig = {
  mods:          {type: 'mod',          cf: '6'},
  modpacks:      {type: 'modpack',      cf: '4471'},
  resourcepacks: {type: 'resourcepack', cf: '12'},
  shaders:       {type: 'shader',       cf: '6552'}
};

let currentTab = 'mods', currentQuery = '';
let items = [];
let offset = 0;
let hasMore = true;
let isLoading = false;
let reqId = 0;
let lastSearch = 0;
let skinPool = [];
let skinCursor = 0;
const $ = id => document.getElementById(id);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeUrl(u) { try { const x = new URL(u); return x.protocol === 'https:' ? x.href : ''; } catch { return ''; } }
const safeId = v => /^[\w-]{1,64}$/.test(String(v)) ? String(v) : '';
const isValidNick = n => /^\w{3,16}$/.test(n);
const isValidVersion = v => /^\d{1,2}(\.\d{1,2}){1,2}$/.test(v);

function toast(msg, kind = 'info', ms = 4000) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind === 'error' ? 'error' : kind === 'ok' ? 'ok' : '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, ms);
}

const trCache = new Map();
try { Object.entries(JSON.parse(localStorage.getItem('trCache') || '{}')).forEach(([k, v]) => trCache.set(k, v)); } catch {}
let cacheSaveTimer = null;
function scheduleCacheSave() {
  if (cacheSaveTimer) return;
  cacheSaveTimer = setTimeout(() => {
    try { localStorage.setItem('trCache', JSON.stringify(Object.fromEntries([...trCache].slice(-300)))); } catch {}
    cacheSaveTimer = null;
  }, 1500);
}
const needsTranslation = t => t && t.length > 2 && (t.match(/[а-яё]/gi) || []).length < t.length * 0.2;
async function translate(text, signal) {
  if (!needsTranslation(text)) return text;
  const cut = text.slice(0, 450);
  if (trCache.has(cut)) return trCache.get(cut);
  try {
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q=' + encodeURIComponent(cut), { signal });
    if (!r.ok) throw 0;
    const d = await r.json();
    const out = d[0].map(p => p[0]).join('');
    trCache.set(cut, out); scheduleCacheSave();
    return out;
  } catch { return text; }
}

const sentinel = $('sentinel');
const io = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && !isLoading && hasMore) loadMore();
}, { rootMargin: '400px' });

function setSentinel(state) {
  if (state === 'loading') { sentinel.textContent = 'Загрузка...'; sentinel.classList.remove('end'); }
  else if (state === 'end') { sentinel.textContent = '— Конец списка —'; sentinel.classList.add('end'); }
  else { sentinel.textContent = ''; sentinel.classList.remove('end'); }
}

document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
  tab.classList.add('active'); tab.setAttribute('aria-selected', 'true');
  currentTab = tab.dataset.tab; currentQuery = '';
  $('searchInput').value = '';
  const sk = currentTab === 'skins';
  $('filters').classList.toggle('hidden', sk);
  $('searchInput').placeholder = sk ? 'Ник игрока (3–16 символов: буквы, цифры, _)' : 'Поиск...';
  resetAndLoad();
}));
$('searchBtn').addEventListener('click', performSearch);
$('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') performSearch(); });
$('sortSelect').addEventListener('change', resetAndLoad);
$('mcVersion').addEventListener('change', resetAndLoad);
$('loaderSelect').addEventListener('change', resetAndLoad);

function performSearch() {
  const now = Date.now();
  if (now - lastSearch < 600) return;
  lastSearch = now;
  currentQuery = $('searchInput').value.trim().slice(0, 64);
  resetAndLoad();
}

function resetAndLoad() {
  reqId++;
  items = [];
  offset = 0;
  hasMore = true;
  isLoading = false;
  skinCursor = 0;
  skinPool = currentTab === 'skins'
    ? (currentQuery ? (isValidNick(currentQuery) ? [currentQuery] : []) : SKIN_NAMES)
    : [];
  if (currentTab === 'skins' && currentQuery && !isValidNick(currentQuery)) {
    $('content').innerHTML = '<div class="error">Ник должен быть 3–16 символов: буквы, цифры, _</div>';
    setSentinel('');
    return;
  }
  $('content').innerHTML = '';
  setSentinel('idle');
  loadMore();
}

async function loadMore() {
  if (isLoading || !hasMore) return;
  isLoading = true;
  const token = reqId;
  setSentinel('loading');

  try {
    if (currentTab === 'skins') {
      const batch = skinPool.slice(skinCursor, skinCursor + LIMIT).map(n => ({ source: 'skin', name: n }));
      skinCursor += batch.length;
      if (skinCursor >= skinPool.length) hasMore = false;
      if (token !== reqId) return;
      if (batch.length) appendCards(batch, token);
      setSentinel(hasMore ? 'idle' : 'end');
      return;
    }

    const { list, nextHasMore, note } = await fetchModsPage(token);
    if (token !== reqId) return;
    if (note) {
      const noteEl = document.createElement('div');
      noteEl.className = 'info-note';
      noteEl.textContent = note;
      $('content').prepend(noteEl);
    }
    appendCards(list, token);
    hasMore = nextHasMore;
    offset += LIMIT;
    setSentinel(hasMore ? 'idle' : 'end');
  } catch (e) {
    if (token !== reqId) return;
    console.error(e);
    hasMore = false;
    const errEl = document.createElement('div');
    errEl.className = 'error';
    errEl.innerHTML = `Не удалось загрузить данные.<div class="error-detail">${esc(e.message || '')}</div>`;
    $('content').appendChild(errEl);
    setSentinel('');
  } finally {
    if (token === reqId) isLoading = false;
  }
}

async function getJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function fetchModsPage() {
  const cfg = tabConfig[currentTab], sort = $('sortSelect').value;
  const q = encodeURIComponent(currentQuery);
  const mc = $('mcVersion').value.trim();
  const loader = $('loaderSelect').value;
  const facets = [['project_type:' + cfg.type]];
  if (mc && isValidVersion(mc)) facets.push(['versions:' + mc]);
  if (loader) facets.push(['categories:' + loader]);
  const facetsEnc = encodeURIComponent(JSON.stringify(facets));

  const mrUrl = `${WORKER_URL}/modrinth/search?query=${q}&facets=${facetsEnc}&limit=${LIMIT}&offset=${offset}` + (sort !== 'relevance' ? `&index=${sort}` : '');
  const cfUrl = `${WORKER_URL}/curseforge/search?query=${q}&category=${cfg.cf}&pageSize=${LIMIT}&index=${offset}`;
  const mrDirect = `https://api.modrinth.com/v2/search?query=${q}&facets=${facetsEnc}&limit=${LIMIT}&offset=${offset}&index=${sort}`;

  const [mr, cf] = await Promise.allSettled([getJson(mrUrl).catch(() => getJson(mrDirect)), getJson(cfUrl)]);

  if (mr.status === 'rejected' && cf.status === 'rejected') {
    console.error('Modrinth:', mr.reason, 'CurseForge:', cf.reason);
    const cfErr = cf.reason?.message || '?';
    const mrErr = mr.reason?.message || '?';
    throw new Error(`Modrinth: ${mrErr} • CurseForge: ${cfErr}. Проверьте Worker.`);
  }

  const a = mr.status === 'fulfilled' ? (mr.value.hits || []).map(i => ({ source: 'modrinth', ...i })) : [];
  const b = cf.status === 'fulfilled' ? (cf.value.data || []).map(i => ({ source: 'curseforge', ...i })) : [];
  const totalMr = mr.status === 'fulfilled' ? (mr.value.total_hits ?? a.length) : 0;
  const totalCf = cf.status === 'fulfilled' ? (cf.value.pagination?.totalCount ?? b.length) : 0;

  let note = '';
  if (cf.status === 'rejected') {
    note = 'CurseForge недоступен: ' + (cf.reason?.message || 'неизвестная ошибка') + '. Показан только Modrinth.';
  }

  const nextOffset = offset + LIMIT;
  const nextHasMore = nextOffset < Math.max(totalMr, totalCf);

  return { list: [...a, ...b], nextHasMore, note };
}

const norm = it => it.source === 'modrinth' ? {
  title: it.title, desc: it.description, icon: it.icon_url, downloads: it.downloads, author: it.author,
  updated: it.date_modified, id: it.project_id || it.slug,
  web: `https://modrinth.com/${tabConfig[currentTab].type}/${encodeURIComponent(it.slug)}`
} : {
  title: it.name, desc: it.summary, icon: it.logo?.url, downloads: it.downloadCount, author: it.authors?.[0]?.name || 'Неизвестно',
  updated: it.dateModified, id: it.id, web: it.links?.websiteUrl
};
const SKIN_SRC = [
  n => `https://minotar.net/skin/${n}`,
  n => `https://mc-heads.net/body/${n}/300`,
  n => `https://api.mineatar.io/body/full/${n}?scale=8`,
  n => `https://starlightskins.lunareclipse.studio/render/default/${n}/full`
];
const skinImg = (n, i = 0) => SKIN_SRC[i](encodeURIComponent(n));

function buildCardHTML(it, globalIndex) {
  if (it.source === 'skin') {
    return `<article class="card" data-i="${globalIndex}" tabindex="0">
      <img src="${skinImg(it.name)}" alt="${esc(it.name)}" class="card-image skin" loading="lazy" data-n="${esc(it.name)}" data-step="0" data-fallback>
      <div class="card-content"><h3 class="card-title">${esc(it.name)}</h3><p class="card-description">Нажмите для просмотра и скачивания</p></div></article>`;
  }
  const n = norm(it);
  return `<article class="card" data-i="${globalIndex}" tabindex="0">
    <img src="${esc(safeUrl(n.icon) || NO_IMG)}" alt="${esc(n.title)}" class="card-image" loading="lazy" referrerpolicy="no-referrer" data-fallback>
    <div class="card-content"><h3 class="card-title">${esc(n.title)}</h3>
    <p class="card-description" data-orig="${esc(n.desc || '')}">${esc(n.desc || 'Описание отсутствует')}</p>
    <span class="tag">${it.source === 'modrinth' ? 'Modrinth' : 'CurseForge'}</span>
    <div class="card-stats"><span>📥 ${formatNumber(n.downloads)}</span><span>👤 ${esc(n.author)}</span></div></div></article>`;
}

function appendCards(list, token) {
  let grid = $('content').querySelector('.grid');
  if (!grid) {
    grid = document.createElement('div');
    grid.className = 'grid';
    $('content').appendChild(grid);
  }
  const startIdx = items.length;
  const html = list.map((it, i) => buildCardHTML(it, startIdx + i)).join('');
  grid.insertAdjacentHTML('beforeend', html);
  items.push(...list);
  if (currentTab !== 'skins') translateNew(token, startIdx);
}
  async function translateNew(token, fromIdx) {
  const cards = [...$('content').querySelectorAll('.card')].slice(fromIdx);
  const queue = cards.map(c => c.querySelector('.card-description[data-orig]')).filter(Boolean);
  const worker = async () => {
    while (queue.length && token === reqId) {
      const el = queue.shift();
      const ru = await translate(el.dataset.orig);
      if (token === reqId) el.textContent = ru;
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
}

document.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName !== 'IMG' || !img.hasAttribute('data-fallback') || img.src === NO_IMG) return;
  if (img.dataset.n) {
    const step = +img.dataset.step + 1;
    if (step < SKIN_SRC.length) { img.dataset.step = step; img.src = skinImg(img.dataset.n, step); return; }
  }
  img.src = NO_IMG;
}, true);

$('content').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) showDetails(items[+card.dataset.i]);
});
$('content').addEventListener('keydown', e => {
  const card = e.target.closest('.card');
  if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); showDetails(items[+card.dataset.i]); }
});

let lastFocused = null;

function trapFocus(e) {
  if (e.key !== 'Tab') return;
  const modal = $('detailModal');
  if (!modal.classList.contains('active')) return;
  const focusables = [...modal.querySelectorAll('button:not([disabled]), [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetParent !== null);
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

async function showDetails(item) {
  if (!item) return;
  let html;
  if (item.source === 'skin') {
    $('modalTitle').textContent = item.name;
    html = `<img src="${skinImg(item.name)}" alt="${esc(item.name)}" class="modal-image skin" data-n="${esc(item.name)}" data-step="0" data-fallback>
      <div class="modal-actions">
        <button class="btn" id="dlBtn" data-source="skin" data-id="${esc(item.name)}">Скачать скин</button>
        <a class="btn btn-secondary" href="https://minotar.net/skin/${encodeURIComponent(item.name)}" target="_blank" rel="noopener noreferrer">Открыть PNG</a>
      </div>`;
  } else {
    const n = norm(item);
    const date = n.updated ? new Date(n.updated).toLocaleDateString('ru-RU') : '—';
    const web = safeUrl(n.web);
    $('modalTitle').textContent = n.title;
    html = `<img src="${esc(safeUrl(n.icon) || NO_IMG)}" alt="${esc(n.title)}" class="modal-image" referrerpolicy="no-referrer" data-fallback>
      <div class="version-picker" id="versionPicker">
        <div class="version-picker-title">Выберите версию для скачивания:</div>
        <div class="version-picker-row">
          <select class="filter-select" id="modalVersion"><option>Загрузка...</option></select>
          <select class="filter-select" id="modalLoader"><option>Загрузка...</option></select>
        </div>
      </div>
      <p class="modal-description" id="modalDesc">${esc(n.desc || 'Описание отсутствует')}</p>
      <div class="modal-info">
        <div class="info-row"><span class="info-label">Автор</span><span class="info-value">${esc(n.author)}</span></div>
        <div class="info-row"><span class="info-label">Загрузок</span><span class="info-value">${formatNumber(n.downloads)}</span></div>
        <div class="info-row"><span class="info-label">Обновлено</span><span class="info-value">${esc(date)}</span></div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="dlBtn" data-source="${item.source}" data-id="${esc(safeId(n.id))}">Скачать</button>
        ${web ? `<a class="btn btn-secondary" href="${esc(web)}" target="_blank" rel="noopener noreferrer">Открыть на сайте</a>` : ''}
      </div>`;
  }
  $('modalBody').innerHTML = html;
  lastFocused = document.activeElement;
  $('detailModal').classList.add('active');
  document.body.classList.add('lock');
  $('modalClose').focus();

  if (item.source !== 'skin') {
    const d = item.source === 'modrinth' ? item.description : item.summary;
    const ru = await translate(d || '');
    const el = $('modalDesc');
    if (el && d) el.textContent = ru;
    loadVersions(item).catch(err => console.warn('versions:', err));
  }
}

async function loadVersions(item) {
  const vSel = $('modalVersion'), lSel = $('modalLoader');
  if (!vSel) return;
  const id = safeId(item.source === 'modrinth' ? (item.project_id || item.slug) : item.id);
  if (!id) return;
  try {
    let versions = [];
    if (item.source === 'modrinth') {
      let v;
      try { v = await getJson(`${WORKER_URL}/modrinth/project/${id}/version`); }
      catch { v = await getJson(`https://api.modrinth.com/v2/project/${id}/version`); }
      versions = (v || []).map(x => ({ id: x.id, mc: x.game_versions || [], loaders: x.loaders || [], files: x.files || [] }));
    } else {
      const f = await getJson(`${WORKER_URL}/curseforge/mod/${id}/files`);
      versions = (f.data || []).map(x => ({
        id: x.id, mc: (x.gameVersions || []).filter(g => /^\d/.test(g)),
        loaders: x.modLoader ? [x.modLoader] : [], fileName: x.fileName, fileLength: x.fileLength
      }));
    }
    const mcSet = new Set(), loaderSet = new Set();
    versions.forEach(v => { v.mc.forEach(m => mcSet.add(m)); v.loaders.forEach(l => loaderSet.add(l)); });
    const mcs = [...mcSet].sort((a, b) => compareVersions(b, a));
    const loaders = [...loaderSet].sort();
    vSel.innerHTML = mcs.length ? mcs.map(m => `<option>${esc(m)}</option>`).join('') : '<option value="">—</option>';
    lSel.innerHTML = '<option value="">Любой</option>' + loaders.map(l => `<option>${esc(l)}</option>`).join('');
    const userMc = $('mcVersion').value.trim();
    if (userMc && mcs.includes(userMc)) vSel.value = userMc;
    const userLoader = $('loaderSelect').value;
    if (userLoader && loaders.includes(userLoader)) lSel.value = userLoader;
  } catch (e) {
    vSel.innerHTML = '<option value="">Ошибка</option>';
    lSel.innerHTML = '<option value="">—</option>';
  }
}

function compareVersions(a, b) {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const d = (pa[i] || 0) - (pb[i] || 0);
    if (d) return d;
  }
  return 0;
}

function closeModal() {
  $('detailModal').classList.remove('active');
  document.body.classList.remove('lock');
  if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
  lastFocused = null;
}
$('modalClose').addEventListener('click', closeModal);
$('detailModal').addEventListener('click', e => { if (e.target.id === 'detailModal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  trapFocus(e);
});
$('modalBody').addEventListener('click', e => {
  const b = e.target.closest('#dlBtn');
  if (b) downloadDirect(b.dataset.source, b.dataset.id, b);
});

async function downloadDirect(source, id, btn) {
  if (!id) { toast('Некорректный идентификатор', 'error'); return; }
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = 'Подготовка...';
  $('liveStatus').textContent = 'Подготовка загрузки';

  try {
    let url = '', filename = 'download', sizeHint = 0;

    if (source === 'skin') {
      url = `https://minotar.net/download/${encodeURIComponent(id)}`;
      filename = id + '.png';
    } else if (source === 'modrinth') {
      let v, viaWorker = true;
      try { v = await getJson(`${WORKER_URL}/modrinth/project/${id}/version`); }
      catch { viaWorker = false; v = await getJson(`https://api.modrinth.com/v2/project/${id}/version`); }
      if (!v?.length) { toast('Файлы не найдены', 'error'); return; }
      const wantMc = $('modalVersion')?.value || '';
      const wantLoader = $('modalLoader')?.value || '';
      let pick = v.find(x =>
        (!wantMc || (x.game_versions || []).includes(wantMc)) &&
        (!wantLoader || (x.loaders || []).includes(wantLoader))
      );
      if (!pick) { toast('Под выбранную версию нет — беру последнюю', 'info'); pick = v[0]; }
      const vid = safeId(pick.id);
      if (!vid) { toast('Некорректный ID версии', 'error'); return; }
      const file = (pick.files || []).find(x => x.primary) || (pick.files || [])[0];
      filename = file?.filename || 'mod.jar';
      sizeHint = file?.size || 0;
      if (viaWorker) url = `${WORKER_URL}/modrinth/download/${vid}`;
      else url = file && safeUrl(file.url);
      if (!url) { toast('Файл не найден', 'error'); return; }
    } else {
      const f = await getJson(`${WORKER_URL}/curseforge/mod/${id}/files`);
      if (!f.data?.length) { toast('Файлы не найдены', 'error'); return; }
      const wantMc = $('modalVersion')?.value || '';
      const wantLoader = $('modalLoader')?.value || '';
      let pick = f.data.find(x => {
        const mcOk = !wantMc || (x.gameVersions || []).includes(wantMc);
        const ldOk = !wantLoader || x.modLoader === wantLoader;
        return mcOk && ldOk;
      });
      if (!pick) { toast('Под выбранную версию нет — беру последнюю', 'info'); pick = f.data[0]; }
      const fid = safeId(pick.id);
      if (!fid) { toast('Некорректный ID файла', 'error'); return; }
      filename = pick.fileName || 'mod.jar';
      sizeHint = pick.fileLength || 0;
      url = `${WORKER_URL}/curseforge/download/${id}/${fid}`;
    }

    const safe = safeUrl(url);
    if (!safe) { toast('Некорректная ссылка', 'error'); return; }

    if (sizeHint > MAX_DOWNLOAD_MB * 1024 * 1024) {
      const ok = confirm(`Файл ~${(sizeHint / 1024 / 1024).toFixed(1)} МБ. Загрузка в память может занять время. Продолжить?`);
      if (!ok) return;
    }

    const overlay = document.createElement('div');
    overlay.className = 'progress-overlay';
    overlay.innerHTML = `<div class="progress-box">
      <h3>Скачивание: ${esc(filename)}</h3>
      <div class="progress-bar"><div class="progress-fill" id="pgFill"></div></div>
      <div class="progress-text" id="pgText">0%</div>
    </div>`;
    document.body.appendChild(overlay);

    const r = await fetch(safe);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const total = +r.headers.get('content-length') || sizeHint || 0;

    const chunks = [];
    let received = 0;
    const reader = r.body.getReader();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      if (total) {
        const pct = Math.min(100, Math.round(received / total * 100));
        const fill = $('pgFill'), txt = $('pgText');
        if (fill) fill.style.width = pct + '%';
        if (txt) txt.textContent = pct + '% • ' + (received / 1024 / 1024).toFixed(1) + ' / ' + (total / 1024 / 1024).toFixed(1) + ' МБ';
      } else {
        const txt = $('pgText');
        if (txt) txt.textContent = (received / 1024 / 1024).toFixed(1) + ' МБ';
      }
    }

    const blob = new Blob(chunks);
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl;
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(objUrl), 5000);
    overlay.remove();
    toast('Файл скачан: ' + filename, 'ok');
  } catch (e) {
    console.error(e);
    const ov = document.querySelector('.progress-overlay');
    if (ov) ov.remove();
    toast('Не удалось скачать файл. Попробуйте позже.', 'error');
  } finally {
    btn.disabled = false; btn.textContent = old;
    $('liveStatus').textContent = '';
  }
}

function formatNumber(n) {
  n = Number(n) || 0;
  if (n >= 1e6) {
    const v = n / 1e6;
    if (v >= 100) return Math.round(v) + 'M';
    return (Math.round(v * 10) / 10).toString().replace(/\.0$/, '') + 'M';
  }
  if (n >= 1000) {
    const v = n / 1000;
    if (v >= 999.5) return (Math.round(n / 1e5) / 10).toString().replace(/\.0$/, '') + 'M';
    return (Math.round(v * 10) / 10).toString().replace(/\.0$/, '') + 'K';
  }
  return String(n);
}

io.observe(sentinel);
resetAndLoad();
</script>
