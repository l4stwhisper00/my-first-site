<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --s0:#05070C;--s2:#0F131C;--s3:#161D2B;--s4:#1E2636;
  --accent:#38BDF8;--accent-2:#6EE7B7;--dim:#1E3A5F;
  --text:#E8EDF4;--tdim:#9CA3AF;
  --error:#EF4444;--ok:#10B981;
  --r:999px;--rl:1.5rem;
  --blur:8px;
  --tr-fast:.14s;--tr-norm:.28s;--tr-slow:.45s;
  --ease:cubic-bezier(.25,.46,.45,.94);
  --card-glow:rgba(56,189,248,.15);
  --aurora-1:rgba(56,189,248,.35);
  --aurora-2:rgba(110,231,183,.28);
}
[data-theme="midnight"]{
  --s0:#02040A;--s2:#0A0E18;--s3:#111624;--s4:#1A2132;
  --accent:#818CF8;--accent-2:#A78BFA;--dim:#1E1B4B;
  --text:#E0E7FF;--tdim:#8B95B8;
  --card-glow:rgba(129,140,248,.2);
  --aurora-1:rgba(129,140,248,.35);--aurora-2:rgba(167,139,250,.28);
}
[data-theme="light"]{
  --s0:#F0F4FA;--s2:#FFFFFF;--s3:#E8EDF5;--s4:#DDE4EE;
  --accent:#0284C7;--accent-2:#10B981;--dim:#DBEAFE;
  --text:#0F172A;--tdim:#64748B;
  --card-glow:rgba(2,132,199,.15);
  --aurora-1:rgba(2,132,199,.2);--aurora-2:rgba(16,185,129,.15);
}
[data-theme="ocean"]{
  --s0:#041220;--s2:#081A2B;--s3:#0D2438;--s4:#133049;
  --accent:#06B6D4;--accent-2:#22D3EE;--dim:#0E4D64;
  --text:#DBEEF7;--tdim:#7BA3B8;
  --card-glow:rgba(6,182,212,.2);
  --aurora-1:rgba(6,182,212,.4);--aurora-2:rgba(34,211,238,.3);
}
[data-theme="sunset"]{
  --s0:#14070F;--s2:#1E0A18;--s3:#2A0F22;--s4:#38152C;
  --accent:#FB7185;--accent-2:#FBBF24;--dim:#5B1F3A;
  --text:#FDE4EC;--tdim:#C99AAB;
  --card-glow:rgba(251,113,133,.22);
  --aurora-1:rgba(251,113,133,.4);--aurora-2:rgba(251,191,36,.3);
}
[data-theme="forest"]{
  --s0:#071510;--s2:#0C1E17;--s3:#122A20;--s4:#1A3629;
  --accent:#10B981;--accent-2:#84CC16;--dim:#14532D;
  --text:#DCFCE7;--tdim:#7FA089;
  --card-glow:rgba(16,185,129,.22);
  --aurora-1:rgba(16,185,129,.4);--aurora-2:rgba(132,204,22,.28);
}
[data-theme="cyber"]{
  --s0:#0A0512;--s2:#100820;--s3:#180D2E;--s4:#211340;
  --accent:#D946EF;--accent-2:#22D3EE;--dim:#4A1060;
  --text:#F5E4FF;--tdim:#B096C5;
  --card-glow:rgba(217,70,239,.25);
  --aurora-1:rgba(217,70,239,.45);--aurora-2:rgba(34,211,238,.35);
}
[data-theme="nord"]{
  --s0:#242933;--s2:#2E3440;--s3:#3B4252;--s4:#434C5E;
  --accent:#88C0D0;--accent-2:#A3BE8C;--dim:#4C566A;
  --text:#ECEFF4;--tdim:#9099A8;
  --card-glow:rgba(136,192,208,.2);
  --aurora-1:rgba(136,192,208,.3);--aurora-2:rgba(163,190,140,.25);
}
[data-theme="rose"]{
  --s0:#1A0A15;--s2:#280F20;--s3:#37162C;--s4:#471C39;
  --accent:#F472B6;--accent-2:#FCD34D;--dim:#5E1F41;
  --text:#FFE4F1;--tdim:#C493AD;
  --card-glow:rgba(244,114,182,.22);
  --aurora-1:rgba(244,114,182,.4);--aurora-2:rgba(252,211,77,.3);
}

html,body{min-height:100vh}
html{background:var(--s0);transition:background var(--tr-slow) var(--ease)}
body{
  background:transparent;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  line-height:1.6;
  transition:color var(--tr-slow) var(--ease);
  overflow-x:hidden;
}
body.lock{overflow:hidden}

/* === ФОН: AURORA === */
.bg-aurora{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  opacity:.9;transition:opacity var(--tr-slow) var(--ease);
}
.bg-aurora::before,.bg-aurora::after{
  content:'';position:absolute;width:70vmax;height:70vmax;border-radius:50%;
  filter:blur(90px);will-change:transform;
}
.bg-aurora::before{
  background:radial-gradient(circle,var(--aurora-1) 0%,transparent 65%);
  top:-25vmax;left:-20vmax;
  animation:auroraA 28s ease-in-out infinite;
}
.bg-aurora::after{
  background:radial-gradient(circle,var(--aurora-2) 0%,transparent 65%);
  bottom:-25vmax;right:-20vmax;
  animation:auroraB 34s ease-in-out infinite;
}
@keyframes auroraA{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(15vmax,8vmax) scale(1.15)}
  66%{transform:translate(5vmax,20vmax) scale(.95)}
}
@keyframes auroraB{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(-12vmax,-10vmax) scale(1.1)}
  66%{transform:translate(-20vmax,5vmax) scale(1.05)}
}
body.no-bg .bg-aurora{opacity:0}

.container{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:2rem}

header{margin-bottom:2rem;text-align:center;animation:fadeInUp .5s var(--ease)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

h1{
  font-size:clamp(2rem,5vw,3.5rem);font-weight:700;letter-spacing:-.02em;margin-bottom:1rem;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  transition:background var(--tr-slow) var(--ease);
  background-size:200% 200%;
  animation:gradientShift 8s ease infinite;
}
@keyframes gradientShift{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.subtitle{color:var(--tdim);font-size:1.1rem}

.tabs{display:flex;gap:.75rem;margin-bottom:2rem;justify-content:center;flex-wrap:wrap}
.tab{
  background:var(--s2);color:var(--tdim);padding:.75rem 1.5rem;
  border:none;border-radius:var(--r);font-weight:600;cursor:pointer;
  font-size:1rem;white-space:nowrap;
  transition:all var(--tr-norm) var(--ease);
  backdrop-filter:blur(10px);
  border:1px solid transparent;
}
.tab:hover{background:var(--s3);color:var(--text);transform:translateY(-2px);box-shadow:0 6px 18px var(--card-glow)}
.tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--s0);
  box-shadow:0 4px 16px var(--card-glow);
}

.search-container{
  background:var(--s2);padding:2rem;border-radius:var(--rl);margin-bottom:2rem;
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.05);
  box-shadow:0 8px 32px rgba(0,0,0,.15);
  transition:background var(--tr-slow) var(--ease),border-color var(--tr-slow) var(--ease);
}
.search-row{display:flex;gap:1rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.search-input,.filter-select{
  background:var(--s3);border:2px solid transparent;color:var(--text);
  padding:.75rem 1.25rem;border-radius:var(--r);font-size:1rem;
  transition:border-color var(--tr-norm) var(--ease),background var(--tr-slow) var(--ease);
}
.search-input{flex:1;min-width:250px}
.filter-select{padding:.5rem 1rem;cursor:pointer}
.search-input:focus,.filter-select:focus{outline:none;border-color:var(--accent)}

/* === КНОПКА РЕДАКТОРА === */
#editorBtn{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:var(--s0);border:none;border-radius:var(--r);
  padding:.85rem 1.5rem;font-weight:700;font-size:.95rem;
  cursor:pointer;display:none;align-items:center;gap:.55rem;
  box-shadow:0 4px 16px var(--card-glow);
  transition:all var(--tr-norm) var(--ease);
  white-space:nowrap;position:relative;overflow:hidden;
}
#editorBtn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);
  transform:translateX(-100%);transition:transform .6s var(--ease);
}
#editorBtn:hover::before{transform:translateX(100%)}
#editorBtn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 28px var(--card-glow)}
#editorBtn .ico{font-size:1.15rem;line-height:1;display:inline-block;transition:transform var(--tr-norm) var(--ease)}
#editorBtn:hover .ico{transform:rotate(-15deg) scale(1.15)}

.filters{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.filters label{color:var(--tdim);font-size:.9rem}
.hidden{display:none!important}

.btn,.search-btn{
  background:var(--accent);color:var(--s0);padding:.75rem 2rem;border:none;
  border-radius:var(--r);font-weight:600;cursor:pointer;font-size:1rem;
  transition:all var(--tr-norm) var(--ease);text-align:center;
}
.btn{width:100%;display:inline-block}
.btn:hover,.search-btn:hover{filter:brightness(1.1);transform:scale(1.02);box-shadow:0 6px 20px var(--card-glow)}
.btn-secondary{background:var(--s3);color:var(--text)}
.btn-secondary:hover{background:var(--s4)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem;margin-bottom:2rem}
.card{
  background:var(--s2);border-radius:var(--rl);overflow:hidden;
  cursor:pointer;display:flex;flex-direction:column;
  animation:fadeInUp .45s var(--ease) both;
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.05);
  transition:transform var(--tr-norm) var(--ease),box-shadow var(--tr-norm) var(--ease),background var(--tr-slow) var(--ease),border-color var(--tr-slow) var(--ease);
  position:relative;
}
.card::after{
  content:'';position:absolute;inset:0;border-radius:var(--rl);
  background:linear-gradient(135deg,var(--accent),transparent 60%);
  opacity:0;transition:opacity var(--tr-norm) var(--ease);
  pointer-events:none;mix-blend-mode:overlay;
}
.card:hover::after,.card:focus-visible::after{opacity:.06}
.card:hover,.card:focus-visible{
  transform:translateY(-6px) scale(1.01);
  box-shadow:0 12px 32px var(--card-glow);
  outline:none;
  border-color:rgba(255,255,255,.1);
}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card-image{width:100%;height:180px;object-fit:cover;background:var(--s4);transition:background var(--tr-slow) var(--ease)}
.card-image.skin{object-fit:contain;padding:.5rem;background:linear-gradient(135deg,var(--s3),var(--s4))}
.card-content{padding:1.25rem;flex:1;display:flex;flex-direction:column}
.card-title{font-size:1.05rem;font-weight:600;margin-bottom:.5rem;line-height:1.3;word-break:break-word}
.card-description{color:var(--tdim);font-size:.9rem;margin-bottom:1rem;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;background:var(--dim);color:var(--accent);padding:.25rem .75rem;border-radius:var(--r);font-size:.8rem;font-weight:500;margin-bottom:1rem;align-self:flex-start}
.card-stats{display:flex;justify-content:space-between;gap:.5rem;color:var(--tdim);font-size:.85rem}

.skeleton-card{cursor:default!important;pointer-events:none}
.skeleton-card:hover{transform:none!important;box-shadow:none!important}
.skeleton-card:hover::after{opacity:0}
.skeleton-shimmer{background:linear-gradient(90deg,var(--s3) 25%,var(--s4) 50%,var(--s3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.skeleton-line{height:.85rem;border-radius:.4rem;margin-bottom:.6rem}
.skeleton-line.big{height:1.2rem;width:70%}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(var(--blur));z-index:1000;overflow-y:auto;animation:fadeIn .2s var(--ease)}
.modal.active{display:flex;align-items:center;justify-content:center;padding:2rem}
.modal-content{
  background:var(--s2);border-radius:var(--rl);max-width:900px;width:100%;
  max-height:90vh;overflow-y:auto;backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);
  animation:fadeInUp .3s var(--ease);
  transition:background var(--tr-slow) var(--ease);
}
.modal-header{padding:1.5rem 2rem;border-bottom:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between;gap:1rem;align-items:center}
.modal-title{font-size:1.5rem;font-weight:700;line-height:1.3;word-break:break-word}
.modal-close{background:none;border:none;color:var(--tdim);font-size:2rem;cursor:pointer;width:40px;height:40px;border-radius:50%;flex-shrink:0;transition:all var(--tr-fast) var(--ease);display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--s3);color:var(--text);transform:rotate(90deg)}
.modal-body{padding:2rem}
.modal-3d-viewport{
  width:100%;height:400px;background:linear-gradient(135deg,var(--s3),var(--s4));
  border-radius:var(--rl);margin-bottom:1.5rem;
  display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
}
.modal-3d-viewport canvas{display:block;cursor:grab}
.modal-3d-viewport canvas:active{cursor:grabbing}
.modal-3d-viewport img{max-height:100%;object-fit:contain}
.modal-description{color:var(--tdim);line-height:1.7;margin-bottom:1.5rem;white-space:pre-line}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.version-picker{background:var(--s3);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:1.5rem;display:flex;flex-direction:column;gap:.75rem}
.version-picker-title{font-size:.9rem;color:var(--tdim)}
.version-picker-row{display:flex;gap:.75rem;flex-wrap:wrap}
.version-picker select{flex:1;min-width:140px}
.error{text-align:center;padding:2rem;font-size:1.1rem;color:var(--error);background:var(--s2);border-radius:var(--rl)}
.error-detail{color:var(--tdim);font-size:.85rem;margin-top:.5rem;word-break:break-word}
.info-note{color:var(--accent);background:var(--s2);border-radius:var(--rl);text-align:center;padding:1rem;margin-bottom:1.5rem;font-size:.95rem}
#sentinel{height:40px;display:flex;align-items:center;justify-content:center;color:var(--tdim);font-size:.9rem}
#toasts{position:fixed;bottom:1.5rem;right:1.5rem;display:flex;flex-direction:column;gap:.75rem;z-index:2000;max-width:min(360px,calc(100vw - 3rem))}
.toast{background:var(--s3);color:var(--text);padding:1rem 1.25rem;border-radius:1rem;box-shadow:0 8px 24px rgba(0,0,0,.4);border-left:4px solid var(--accent);animation:slideIn .25s var(--ease);font-size:.95rem;backdrop-filter:blur(12px)}
.toast.error{border-left-color:var(--error)}
.toast.ok{border-left-color:var(--ok)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* === ПАНЕЛЬ НАСТРОЕК === */
.settings-panel{position:fixed;bottom:1.5rem;left:1.5rem;z-index:3000;display:flex;flex-direction:column;gap:.5rem;align-items:flex-start}
.settings-toggle{
  width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
  background:var(--s2);color:var(--text);font-size:1.4rem;
  box-shadow:0 8px 24px rgba(0,0,0,.4);backdrop-filter:blur(12px);
  transition:all var(--tr-norm) var(--ease);
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.08);
}
.settings-toggle:hover{transform:scale(1.1) rotate(20deg);background:var(--s3)}
.settings-menu{
  background:var(--s2);padding:1.25rem;border-radius:var(--rl);
  box-shadow:0 12px 40px rgba(0,0,0,.5);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);
  opacity:0;transform:translateY(10px) scale(.95);pointer-events:none;
  transition:all var(--tr-norm) var(--ease);
  min-width:280px;
}
.settings-panel.open .settings-menu{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.settings-section{margin-bottom:1rem}
.settings-section:last-child{margin-bottom:0}
.settings-label{font-size:.75rem;color:var(--tdim);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:.6rem}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.theme-opt{
  width:100%;aspect-ratio:1;border-radius:.75rem;border:2px solid transparent;
  cursor:pointer;transition:all var(--tr-fast) var(--ease);
  position:relative;overflow:hidden;
}
.theme-opt:hover{transform:scale(1.08)}
.theme-opt.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--s0) inset,0 0 12px var(--accent)}
.theme-opt[data-theme="dark"]{background:linear-gradient(135deg,#05070C 50%,#38BDF8)}
.theme-opt[data-theme="midnight"]{background:linear-gradient(135deg,#02040A 50%,#818CF8)}
.theme-opt[data-theme="light"]{background:linear-gradient(135deg,#F0F4FA 50%,#0284C7)}
.theme-opt[data-theme="ocean"]{background:linear-gradient(135deg,#041220 50%,#06B6D4)}
.theme-opt[data-theme="sunset"]{background:linear-gradient(135deg,#14070F 50%,#FB7185)}
.theme-opt[data-theme="forest"]{background:linear-gradient(135deg,#071510 50%,#10B981)}
.theme-opt[data-theme="cyber"]{background:linear-gradient(135deg,#0A0512 50%,#D946EF)}
.theme-opt[data-theme="nord"]{background:linear-gradient(135deg,#2E3440 50%,#88C0D0)}
.theme-opt[data-theme="rose"]{background:linear-gradient(135deg,#1A0A15 50%,#F472B6)}
.settings-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:.5rem 0;color:var(--text);font-size:.9rem;cursor:pointer;user-select:none}
.switch{
  position:relative;width:42px;height:24px;background:var(--s4);border-radius:999px;
  transition:background var(--tr-norm) var(--ease);flex-shrink:0;
}
.switch::after{
  content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;
  background:var(--text);border-radius:50%;
  transition:transform var(--tr-norm) var(--ease);
}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px);background:var(--s0)}

/* === РЕДАКТОР === */
.editor-wrap{background:var(--s2);border-radius:var(--rl);padding:2rem;animation:fadeInUp .4s var(--ease);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.05)}
.editor-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.editor-header h2{font-size:1.5rem}
.editor-header-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.editor-header-actions .btn,.editor-header-actions .btn-secondary{padding:.6rem 1rem;font-size:.9rem;width:auto}
.editor-layout{display:grid;grid-template-columns:1fr 340px;gap:2rem;align-items:start}
@media(max-width:1000px){.editor-layout{grid-template-columns:1fr}}
.editor-canvas-area{position:relative;background:linear-gradient(135deg,var(--s3),var(--s4));border-radius:var(--rl);min-height:520px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.editor-canvas-area canvas{display:block;cursor:crosshair}
.editor-mode-toggle{position:absolute;top:1rem;right:1rem;z-index:10;display:flex;gap:.25rem;background:var(--s2);padding:.25rem;border-radius:var(--r);border:1px solid rgba(255,255,255,.08)}
.editor-mode-toggle button{background:transparent;color:var(--tdim);border:none;padding:.5rem 1rem;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:.85rem;transition:all var(--tr-fast) var(--ease)}

<script>
'use strict';

const WORKER_URL = 'https://minecraft-proxy.zxcdedinside944.workers.dev';
const MR_API = 'https://api.modrinth.com/v2';
const MCIM_API = 'https://mod.mcimirror.top/curseforge/v1';

const LIMIT = 20;
const SKIN_LIMIT = 24;
const NO_IMG = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#1E2636"/><text x="150" y="155" fill="#9CA3AF" font-size="20" text-anchor="middle" font-family="sans-serif">Нет фото</text></svg>');

const pageCache = new Map();
const CACHE_TTL = 5 * 60 * 1000;
function cacheGet(k){const e=pageCache.get(k);return e&&Date.now()-e.ts<CACHE_TTL?e.data:null}
function cacheSet(k,v){pageCache.set(k,{data:v,ts:Date.now()});if(pageCache.size>120)pageCache.delete(pageCache.keys().next().value)}

async function raceJson(...urls){
  const controllers = urls.map(() => new AbortController());
  const promises = urls.map((u,i) =>
    fetch(u,{signal:controllers[i].signal})
      .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
      .then(d=>{controllers.forEach((c,j)=>{if(j!==i)c.abort()});return d})
  );
  try{return await Promise.any(promises)}catch{throw new Error('Все источники недоступны')}
}

const SKIN_NAMES = [
  'Notch','jeb_','Dinnerbone','Grumm','_Grum','Herobrine','Steve',
  'Technoblade','Dream','GeorgeNotFound','Sapnap','TommyInnit','Tubbo_','WilburSoot','Ph1LzA','Quackity',
  'Grian','MumboJumbo','GoodTimesWithScar','Renthedog','impulseSV','TangoTek','Zedaph','BdoubleO100',

  'FalseSymmetry','Stressmonster101','ZombieCleo','JoeHills','Hypnotizd','xBCrafted','TinfoilChef',
  'Skeppy','BadBoyHalo','a6d','CaptainSparklez','DanTDM','PopularMMOs','SkyDoesMinecraft',
  'Stampylonghead','iBallisticSquid','LDShadowLady','Smallishbeans','SolidarityGaming','Smajor1995',
  'Fwhip','GeminiTay','Shubble','PearlescentMoon','Jimmy','Pixlriffs','MythicalSausage',
  'AntVenom','SethBling','Noxcrew','Illumina','Fruitberries','Punz','Hbomb94','TapL',
  'Purpled','Wallibear','Ranboo','KarlJacobs','CorpseHusband','Fundy','Eret','Nihachu',
  'JackManifoldTV','Niki','FoolishGamers','Ponk','Hannahxxrose','PurpledMC','Boosfer','Devon',
  'Krtzyy','PeteZahHutt','Quig','Mefs','Krinios','Michaelmcchill','KingBurren','KaraCorvus',
  'Wisp','ShubbleYT','Ldshadowlady','Seapeekay','InTheLittleWood','SB737','FWhip','Falsesymmetry'
];

const tabConfig = {
  mods:{type:'mod',cf:'6'},
  modpacks:{type:'modpack',cf:'4471'},
  resourcepacks:{type:'resourcepack',cf:'12'},
  shaders:{type:'shader',cf:'6552'}
};

let currentTab='mods', currentQuery='';
let items=[];
let offset=0, hasMore=true, isLoading=false, reqId=0, lastSearch=0;
let skinPage=1;
let editorActive=false;
const $=id=>document.getElementById(id);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeUrl(u){try{const x=new URL(u);return x.protocol==='https:'?x.href:''}catch{return ''}}
const safeId=v=>/^[\w-]{1,64}$/.test(String(v))?String(v):'';
const isValidNick=n=>/^\w{3,16}$/.test(n);
const isValidVersion=v=>/^\d{1,2}(\.\d{1,2}){1,2}$/.test(v);

function toast(msg,kind='info',ms=4000){
  const el=document.createElement('div');
  el.className='toast '+(kind==='error'?'error':kind==='ok'?'ok':'');
  el.textContent=msg;
  $('toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},ms);
}

const trCache=new Map();
try{Object.entries(JSON.parse(localStorage.getItem('trCache')||'{}')).forEach(([k,v])=>trCache.set(k,v))}catch{}
let cacheSaveTimer=null;
function scheduleCacheSave(){if(cacheSaveTimer)return;cacheSaveTimer=setTimeout(()=>{try{localStorage.setItem('trCache',JSON.stringify(Object.fromEntries([...trCache].slice(-300))))}catch{};cacheSaveTimer=null},1500)}
const needsTranslation=t=>t&&t.length>2&&(t.match(/[а-яё]/gi)||[]).length<t.length*0.2;
async function translate(text,signal){
  if(!needsTranslation(text))return text;
  const cut=text.slice(0,450);
  if(trCache.has(cut))return trCache.get(cut);
  try{
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q='+encodeURIComponent(cut),{signal});
    if(!r.ok)throw 0;
    const d=await r.json();
    const out=d[0].map(p=>p[0]).join('');
    trCache.set(cut,out);scheduleCacheSave();
    return out;
  }catch{return text}
}

/* === НАСТРОЙКИ === */
function initSettings(){
  const savedTheme = localStorage.getItem('mch-theme') || 'dark';
  const savedBg = localStorage.getItem('mch-bg') !== 'off';
  document.documentElement.setAttribute('data-theme', savedTheme);
  if(!savedBg) document.body.classList.add('no-bg');
  $('bgSwitch').classList.toggle('on', savedBg);
  document.querySelectorAll('.theme-opt').forEach(b=>b.classList.toggle('active', b.dataset.theme===savedTheme));

  $('settingsToggle').addEventListener('click', e=>{
    e.stopPropagation();
    $('settingsPanel').classList.toggle('open');
  });
  document.querySelectorAll('.theme-opt').forEach(b=>b.addEventListener('click', ()=>{
    const t=b.dataset.theme;
    document.documentElement.setAttribute('data-theme',t);
    localStorage.setItem('mch-theme',t);
    document.querySelectorAll('.theme-opt').forEach(x=>x.classList.toggle('active',x===b));
    toast('Тема: '+t,'ok',1500);
  }));
  $('bgToggleRow').addEventListener('click', ()=>{
    const on = !$('bgSwitch').classList.contains('on');
    $('bgSwitch').classList.toggle('on', on);
    document.body.classList.toggle('no-bg', !on);
    localStorage.setItem('mch-bg', on ? 'on' : 'off');
  });
  document.addEventListener('click',e=>{
    if(!e.target.closest('#settingsPanel'))$('settingsPanel').classList.remove('open');
  });
}

/* === СКИН-РЕНДЕРЫ (статика в списке) === */
const SKIN_3D_SOURCES = [
  n => `https://starlightskins.lunareclipse.studio/render/default/${encodeURIComponent(n)}/full`,
  n => `https://mc-heads.net/body/${encodeURIComponent(n)}/180`,
  n => `https://minotar.net/armor/body/${encodeURIComponent(n)}/180`,
  n => `https://crafatar.com/renders/body/${encodeURIComponent(n)}?scale=6&overlay`
];
const skin3DSrc = (n, i=0) => SKIN_3D_SOURCES[Math.min(i, SKIN_3D_SOURCES.length-1)](n);

/* === skinview3d только для модалки === */
function createSkinViewer(container, skinUrl, opts={}){
  if(typeof skinview3d === 'undefined' || typeof THREE === 'undefined'){
    // Фолбэк: статичная 3D-картинка
    const img = document.createElement('img');
    img.src = skinUrl.startsWith('http') ? skinUrl : `https://mc-heads.net/body/${encodeURIComponent(skinUrl)}/300`;
    img.style.cssText = 'max-height:100%;object-fit:contain';
    img.onerror = () => { img.src = NO_IMG; };
    container.appendChild(img);
    return null;
  }
  try{
    const viewer = new skinview3d.SkinViewer({
      canvas: document.createElement('canvas'),
      width: container.clientWidth || 400,
      height: container.clientHeight || 400,
      skin: skinUrl,
      background: 'transparent'
    });
    viewer.controls.enableZoom = opts.zoom !== false;
    viewer.controls.enableRotate = true;
    viewer.controls.enablePan = false;
    viewer.camera.position.z = 60;
    if(opts.animation){
      viewer.animation = new skinview3d.WalkingAnimation();
      viewer.animation.speed = 1;
    }
    // Прозрачный фон канваса
    try{viewer.renderer.setClearColor(0x000000, 0);viewer.renderer.setClearAlpha(0);}catch{}
    viewer.canvas.style.background = 'transparent';
    container.appendChild(viewer.canvas);
    // Запускаем цикл рендера
    viewer.renderer.setAnimationLoop(()=>{
      viewer.renderer.render(viewer.scene, viewer.camera);
    });
    return viewer;
  }catch(e){
    console.warn('skinview3d init failed:', e);
    // Фолбэк на картинку
    const img = document.createElement('img');
    img.src = `https://mc-heads.net/body/${encodeURIComponent(skinUrl.split('/').pop())}/300`;
    img.style.cssText = 'max-height:100%;object-fit:contain';
    img.onerror = () => { img.src = NO_IMG; };
    container.appendChild(img);
    return null;
  }
}

/* === ЗАГРУЗКА СКИНОВ === */
async function loadSkinsPage(page, query=''){
  const cacheKey = `skins|${page}|${query}`;
  const cached = cacheGet(cacheKey);
  if(cached)return cached;

  // MegaSkins
  try{
    const qs = new URLSearchParams({page:String(page), limit:String(SKIN_LIMIT)});
    if(query)qs.set('query',query);
    const r = await fetch(`${WORKER_URL}/skins/list?${qs}`);
    if(r.ok){
      const d = await r.json();
      if(d.skins && d.skins.length){
        const list = d.skins.map(s=>({
          source:'skin',
          name: s.name || s.username || s.id,
          skinUrl: s.skin_url || s.url || `https://minotar.net/skin/${encodeURIComponent(s.name||'Steve')}`
        }));
        cacheSet(cacheKey,list);
        return list;
      }
    }
  }catch(e){console.warn('megaskins:',e)}

  // NameMC trending
  try{
    const r = await fetch(`${WORKER_URL}/skins/trending?page=${page}`);
    if(r.ok){
      const d = await r.json();
      if(d.names && d.names.length){
        const list = d.names.map(n=>({source:'skin',name:n,skinUrl:`https://minotar.net/skin/${encodeURIComponent(n)}`}));
        cacheSet(cacheKey,list);
        return list;
      }
    }
  }catch(e){console.warn('namemc:',e)}

  // Локальный список (страница 1) — для старта
  if(page===1 && !query){
    return SKIN_NAMES.map(n=>({source:'skin',name:n,skinUrl:`https://minotar.net/skin/${encodeURIComponent(n)}`}));
  }
  return [];
}

/* === СКЕЛЕТОНЫ === */
function showSkeletons(n=8){
  let grid=$('content').querySelector('.grid');
  if(!grid){grid=document.createElement('div');grid.className='grid';$('content').appendChild(grid)}
  const html=Array.from({length:n},()=>`
    <article class="card skeleton-card" aria-hidden="true">
      <div class="card-image skeleton-shimmer"></div>
      <div class="card-content">
        <div class="skeleton-line big skeleton-shimmer"></div>
        <div class="skeleton-line skeleton-shimmer" style="width:90%"></div>
        <div class="skeleton-line skeleton-shimmer" style="width:60%"></div>
      </div>
    </article>`).join('');
  grid.insertAdjacentHTML('beforeend',html);
}
function removeSkeletons(){document.querySelectorAll('.skeleton-card').forEach(el=>el.remove())}

const sentinel=$('sentinel');
const io=new IntersectionObserver(entries=>{
  if(entries[0].isIntersecting && !isLoading && hasMore && !editorActive)loadMore();
},{rootMargin:'400px'});

function setSentinel(state){
  if(state==='loading'){sentinel.textContent='';sentinel.classList.remove('end')}
  else if(state==='end'){sentinel.textContent='— Конец списка —';sentinel.classList.add('end')}
  else{sentinel.textContent='';sentinel.classList.remove('end')}
}

/* === ВКЛАДКИ === */
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');t.setAttribute('aria-selected','false')});
  tab.classList.add('active');tab.setAttribute('aria-selected','true');
  currentTab=tab.dataset.tab;currentQuery='';
  $('searchInput').value='';
  editorActive=false;
  const sk=currentTab==='skins';
  $('filters').classList.toggle('hidden',sk);
  $('editorBtn').style.display=sk?'inline-flex':'none';
  $('searchInput').placeholder=sk?'Поиск скина по нику...':'Поиск...';
  resetAndLoad();
}));

$('searchBtn').addEventListener('click',performSearch);
$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')performSearch()});
$('sortSelect').addEventListener('change',resetAndLoad);
$('mcVersion').addEventListener('change',resetAndLoad);
$('loaderSelect').addEventListener('change',resetAndLoad);
$('editorBtn').addEventListener('click',()=>openEditor());

function performSearch(){
  const now=Date.now();if(now-lastSearch<600)return;lastSearch=now;
  currentQuery=$('searchInput').value.trim().slice(0,64);
  resetAndLoad();
}

function resetAndLoad(){
  reqId++;
  items=[];offset=0;hasMore=true;isLoading=false;
  skinPage=1;
  $('content').innerHTML='';
  setSentinel('idle');
  loadMore();
}

function buildModrinthQuery(){
  const cfg=tabConfig[currentTab],sort=$('sortSelect').value;
  const mc=$('mcVersion').value.trim(),loader=$('loaderSelect').value;
  const facets=[['project_type:'+cfg.type]];
  if(mc&&isValidVersion(mc))facets.push(['versions:'+mc]);
  if(loader)facets.push(['categories:'+loader]);
  const qs=new URLSearchParams({query:currentQuery,facets:JSON.stringify(facets),limit:LIMIT,offset,index:sort});
  return {qs,key:['mr',currentTab,currentQuery,sort,mc,loader,offset].join('|')};
}
function buildCurseForgeQuery(){
  const cfg=tabConfig[currentTab],sort=$('sortSelect').value;
  const sortField=sort==='downloads'?'6':sort==='updated'?'3':sort==='newest'?'11':'2';
  const qs=new URLSearchParams({gameId:'432',classId:cfg.cf,searchFilter:currentQuery,pageSize:LIMIT,index:offset,sortField,sortOrder:'desc'});
  return {qs,key:['cf',currentTab,currentQuery,sort,offset].join('|')};
}

async function fetchModrinthPage(){
  const {qs,key}=buildModrinthQuery();
  const c=cacheGet(key);if(c)return c;
  const data=await raceJson(`${MR_API}/search?${qs}`,`${WORKER_URL}/modrinth/search?${qs}`);
  const result={list:(data.hits||[]).map(i=>({source:'modrinth',...i})),total:data.total_hits??0};
  cacheSet(key,result);return result;
}
async function fetchCurseForgePage(){
  const {qs,key}=buildCurseForgeQuery();
  const c=cacheGet(key);if(c)return c;
  const data=await raceJson(`${MCIM_API}/mods/search?${qs}`,`${WORKER_URL}/curseforge/search?${qs}`);
  const result={list:(data.data||[]).map(i=>({source:'curseforge',...i})),total:data.pagination?.totalCount??0};
  cacheSet(key,result);return result;
}

async function loadMore(){
  if(isLoading||!hasMore)return;
  isLoading=true;
  const token=reqId;

  try{
    if(currentTab==='skins'){
      const page=skinPage;
      let list;
      if(page===1 && currentQuery && isValidNick(currentQuery)){
        list=[{source:'skin',name:currentQuery,skinUrl:`https://minotar.net/skin/${encodeURIComponent(currentQuery)}`}];
      } else {
        showSkeletons(8);
        list=await loadSkinsPage(page,currentQuery);
        removeSkeletons();
      }
      if(token!==reqId)return;
      if(!list.length){hasMore=false;setSentinel('end');return}
      appendCards(list,token);
      skinPage++;
      hasMore = list.length >= SKIN_LIMIT;
      setSentinel(hasMore?'idle':'end');
      return;
    }

    showSkeletons(8);
    setSentinel('loading');

    let mrResult=null,cfResult=null,rendered=false;
    const handleMr=async()=>{try{const r=await fetchModrinthPage();if(token!==reqId)return null;mrResult=r;if(r.list.length){if(!rendered){removeSkeletons();rendered=true}appendCards(r.list,token)}return r}catch(e){console.warn('MR:',e.message);return null}};
    const handleCf=async()=>{try{const r=await fetchCurseForgePage();if(token!==reqId)return null;cfResult=r;if(r.list.length){if(!rendered){removeSkeletons();rendered=true}appendCards(r.list,token)}return r}catch(e){console.warn('CF:',e.message);return null}};

    await Promise.all([handleMr(),handleCf()]);
    if(token!==reqId)return;
    removeSkeletons();
    if(!mrResult&&!cfResult)throw new Error('Оба источника недоступны');
    const mrTotal=mrResult?.total??0,cfTotal=cfResult?.total??0;
    hasMore=(offset+LIMIT)<Math.max(mrTotal,cfTotal);
    offset+=LIMIT;
    setSentinel(hasMore?'idle':'end');
  }catch(e){
    if(token!==reqId)return;
    console.error(e);removeSkeletons();hasMore=false;
    const errEl=document.createElement('div');errEl.className='error';
    errEl.innerHTML=`Не удалось загрузить данные.<div class="error-detail">${esc(e.message||'')}</div>`;
    $('content').appendChild(errEl);
    setSentinel('');
  }finally{if(token===reqId)isLoading=false}
}

async function translateNew(token,fromIdx){

  const worker=async()=>{while(queue.length&&token===reqId){const el=queue.shift();const ru=await translate(el.dataset.orig);if(token===reqId)el.textContent=ru}};

document.addEventListener('error',e=>{
  const img=e.target;
  if(img.tagName!=='IMG')return;
  // Скины: пройтись по цепочке фолбэков
  if(img.hasAttribute('data-skin-fallback')){
    const step = +img.dataset.skinStep + 1;
    if(step < SKIN_3D_SOURCES.length){
      img.dataset.skinStep = step;
      img.src = skin3DSrc(img.dataset.skinName, step);
      return;
    }
    img.src = NO_IMG;
    return;
  }
  // Обычные картинки
  if(img.hasAttribute('data-fallback') && img.src !== NO_IMG){
    img.src = NO_IMG;
  }
},true);

function trapFocus(e){
  if(e.key!=='Tab')return;
  const modal=$('detailModal');
  if(!modal.classList.contains('active'))return;
  const focusables=[...modal.querySelectorAll('button:not([disabled]),[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null);
  if(!focusables.length)return;
  const first=focusables[0],last=focusables[focusables.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
}

async function loadVersions(item){
  const vSel=$('modalVersion'),lSel=$('modalLoader');
  if(!vSel)return;
  const id=safeId(item.source==='modrinth'?(item.project_id||item.slug):item.id);
  if(!id)return;
  try{
    let versions=[];
    if(item.source==='modrinth'){
      const v=await raceJson(`${MR_API}/project/${id}/version`,`${WORKER_URL}/modrinth/project/${id}/version`);
      versions=(v||[]).map(x=>({id:x.id,mc:x.game_versions||[],loaders:x.loaders||[]}));
    } else {
      const f=await raceJson(`${MCIM_API}/mods/${id}/files?pageSize=20`,`${WORKER_URL}/curseforge/mod/${id}/files`);
      versions=(f.data||[]).map(x=>({id:x.id,mc:(x.gameVersions||[]).filter(g=>/^\d/.test(g)),loaders:x.modLoader?[x.modLoader]:[]}));
    }
    const mcSet=new Set(),loaderSet=new Set();
    versions.forEach(v=>{v.mc.forEach(m=>mcSet.add(m));v.loaders.forEach(l=>loaderSet.add(l))});
    const mcs=[...mcSet].sort((a,b)=>compareVersions(b,a));
    const loaders=[...loaderSet].sort();
    vSel.innerHTML=mcs.length?mcs.map(m=>`<option>${esc(m)}</option>`).join(''):'<option value="">—</option>';
    lSel.innerHTML='<option value="">Любой</option>'+loaders.map(l=>`<option>${esc(l)}</option>`).join('');
    const userMc=$('mcVersion').value.trim();if(userMc&&mcs.includes(userMc))vSel.value=userMc;
    const userLoader=$('loaderSelect').value;if(userLoader&&loaders.includes(userLoader))lSel.value=userLoader;
  }catch(e){
    vSel.innerHTML='<option value="">Ошибка</option>';lSel.innerHTML='<option value="">—</option>';
  }
}

function compareVersions(a,b){const pa=String(a).split('.').map(Number),pb=String(b).split('.').map(Number);for(let i=0;i<Math.max(pa.length,pb.length);i++){const d=(pa[i]||0)-(pb[i]||0);if(d)return d}return 0}

async function downloadDirect(source,id,btn){
  if(!id){toast('Некорректный идентификатор','error');return}
  const old=btn.textContent;btn.disabled=true;btn.textContent='Подготовка...';
  try{
    let url='',filename='download';
    if(source==='skin'){
      url=`https://minotar.net/download/${encodeURIComponent(id)}`;
      filename=id+'.png';
    } else if(source==='modrinth'){
      const v=await raceJson(`${MR_API}/project/${id}/version`,`${WORKER_URL}/modrinth/project/${id}/version`);
      if(!v?.length){toast('Файлы не найдены','error');return}
      const wantMc=$('modalVersion')?.value||'';const wantLoader=$('modalLoader')?.value||'';
      let pick=v.find(x=>(!wantMc||(x.game_versions||[]).includes(wantMc))&&(!wantLoader||(x.loaders||[]).includes(wantLoader)));
      if(!pick){toast('Беру последнюю версию','info');pick=v[0]}
      const file=(pick.files||[]).find(x=>x.primary)||(pick.files||[])[0];
      if(!file){toast('Файл не найден','error');return}
      url=file.url;filename=file.filename||'mod.jar';
    } else {
      const f=await raceJson(`${MCIM_API}/mods/${id}/files?pageSize=20`,`${WORKER_URL}/curseforge/mod/${id}/files`);
      if(!f.data?.length){toast('Файлы не найдены','error');return}
      const wantMc=$('modalVersion')?.value||'';const wantLoader=$('modalLoader')?.value||'';
      let pick=f.data.find(x=>{const mcOk=!wantMc||(x.gameVersions||[]).includes(wantMc);const ldOk=!wantLoader||x.modLoader===wantLoader;return mcOk&&ldOk});
      if(!pick){toast('Беру последнюю версию','info');pick=f.data[0]}
      const fid=safeId(pick.id);if(!fid){toast('Некорректный ID','error');return}
      filename=pick.fileName||'mod.jar';
      const dl=await raceJson(`${MCIM_API}/mods/${id}/files/${fid}/download-url`,`${WORKER_URL}/curseforge/download-url/${id}/${fid}`);
      if(!dl.data){toast('Автор запретил скачивание','error');return}
      url=dl.data;
    }
    const safe=safeUrl(url);if(!safe){toast('Некорректная ссылка','error');return}
    const a=document.createElement('a');a.href=safe;a.download=filename;a.target='_blank';a.rel='noopener';
    document.body.appendChild(a);a.click();a.remove();
    toast('Скачивание: '+filename,'ok');
  }catch(e){console.error(e);toast('Не удалось: '+(e.message||'ошибка'),'error')}
  finally{btn.disabled=false;btn.textContent=old}
}

function formatNumber(n){
  n=Number(n)||0;
  if(n>=1e6){const v=n/1e6;return(v>=100?Math.round(v):(Math.round(v*10)/10).toString().replace(/\.0$/,''))+'M'}
  if(n>=1000){const v=n/1000;return(v>=999.5?(Math.round(n/1e5)/10).toString().replace(/\.0$/,'')+'M':(Math.round(v*10)/10).toString().replace(/\.0$/,'')+'K')}
  return String(n);
}

    canvas.addEventListener('mouseup', ()=>{if(editorState.drawing){editorState.drawing=false;pushHistory();refresh3D()}});
    canvas.addEventListener('mouseleave', ()=>{if(editorState.drawing){editorState.drawing=false;pushHistory();refresh3D()}});
  }

  function handleFlatDraw(clientX, clientY){
    const canvas = editorState.flatCanvas;
    if(!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const px = Math.floor((clientX - rect.left) * (SKIN_SIZE / rect.width));
    const py = Math.floor((clientY - rect.top) * (SKIN_SIZE / rect.height));
    if(px < 0 || py < 0 || px >= SKIN_SIZE || py >= SKIN_SIZE) return;
    paintTexel(px, py);
    renderFlat();
  }

  // Raycast на 3D
  let raycaster = null, mouseVec = null;
  if(typeof THREE !== 'undefined'){
    raycaster = new THREE.Raycaster();
    mouseVec = new THREE.Vector2();
  }

  if(viewer && raycaster){
    viewer.canvas.addEventListener('mousedown', e=>{editorState.drawing = true; handle3DDraw(e)});
    viewer.canvas.addEventListener('mousemove', e=>{if(editorState.drawing) handle3DDraw(e)});
    viewer.canvas.addEventListener('mouseup', ()=>{if(editorState.drawing){editorState.drawing=false;pushHistory();refresh3D()}});
    viewer.canvas.addEventListener('mouseleave', ()=>{if(editorState.drawing){editorState.drawing=false;pushHistory();refresh3D()}});
  }

  function handle3DDraw(e){
    const canvas = viewer.canvas;
    const rect = canvas.getBoundingClientRect();
    mouseVec.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouseVec.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseVec, viewer.camera);
    const hits = raycaster.intersectObject(viewer.playerObject, true);
    if(!hits.length) return;
    const hit = hits[0];
    if(!hit.uv) return;
    const px = Math.floor(hit.uv.x * SKIN_SIZE);
    const py = Math.floor((1 - hit.uv.y) * SKIN_SIZE);
    if(px < 0 || py < 0 || px >= SKIN_SIZE || py >= SKIN_SIZE) return;
    paintTexel(px, py);
    refresh3D();

  function refresh3D(){
    if(!editorState.viewer) return;
    const merged = document.createElement('canvas');
    merged.width = SKIN_SIZE; merged.height = SKIN_SIZE;
    const mctx = merged.getContext('2d');
    mctx.imageSmoothingEnabled = false;
    mctx.drawImage(editorState.baseCanvas, 0, 0);
    mctx.drawImage(editorState.overlayCanvas, 0, 0);
    const dataUrl = merged.toDataURL('image/png');
    try{editorState.viewer.loadSkin(dataUrl).catch(()=>{})}catch{}
  }

  function paintTexel(px, py){
    const isBase = editorState.activeLayer === 'base';
    const ctx = isBase ? editorState.baseCtx : editorState.overlayCtx;
    const canvas = isBase ? editorState.baseCanvas : editorState.overlayCanvas;
    if(editorState.tool === 'fill'){
      floodFill(canvas, ctx, px, py, editorState.color);
    } else if(editorState.tool === 'picker'){

      const hex = '#' + [data[0],data[1],data[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
      setColor(hex);
    } else if(editorState.tool === 'eraser'){
      ctx.clearRect(px, py, 1, 1);
    } else {
      ctx.fillStyle = editorState.color;
      ctx.fillRect(px, py, 1, 1);
    }
  }

  function floodFill(canvas, ctx, sx, sy, color){
    const img = ctx.getImageData(0, 0, SKIN_SIZE, SKIN_SIZE);
    const data = img.data;
    const idx = (sy * SKIN_SIZE + sx) * 4;
    const target = [data[idx], data[idx+1], data[idx+2], data[idx+3]];
    const fill = hexToRgbA(color);
    if(target[0]===fill[0] && target[1]===fill[1] && target[2]===fill[2] && target[3]===fill[3]) return;
    const stack = [[sx,sy]], visited = new Set();
    while(stack.length){
      const [x,y] = stack.pop();
      if(x<0||y<0||x>=SKIN_SIZE||y>=SKIN_SIZE) continue;
      const k = x+','+y;
      if(visited.has(k)) continue;
      visited.add(k);
      const i = (y * SKIN_SIZE + x) * 4;
      if(data[i]!==target[0]||data[i+1]!==target[1]||data[i+2]!==target[2]||data[i+3]!==target[3]) continue;
      data[i]=fill[0]; data[i+1]=fill[1]; data[i+2]=fill[2]; data[i+3]=fill[3];
      stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
    ctx.putImageData(img, 0, 0);
  }

  function hexToRgbA(hex){return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16),255]}
