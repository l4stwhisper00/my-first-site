<style>
/* ============================================================
   RESET
   ============================================================ */
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ============================================================
   ТЕМЫ — CSS-ПЕРЕМЕННЫЕ
   ============================================================ */
:root {
  --s0: #05070C;
  --s2: #0F131C;
  --s3: #161D2B;
  --s4: #1E2636;
  --accent: #38BDF8;
  --accent-2: #6EE7B7;
  --dim: #1E3A5F;
  --text: #E8EDF4;
  --tdim: #9CA3AF;
  --error: #EF4444;
  --ok: #10B981;
  --r: 999px;
  --rl: 1.5rem;
  --tr-fast: 0.14s;
  --tr-norm: 0.28s;
  --tr-slow: 0.45s;
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --card-glow: rgba(56, 189, 248, 0.15);
  --aurora-1: rgba(56, 189, 248, 0.35);
  --aurora-2: rgba(110, 231, 183, 0.28);
}

[data-theme="midnight"] {
  --s0: #02040A;
  --s2: #0A0E18;
  --s3: #111624;
  --s4: #1A2132;
  --accent: #818CF8;
  --accent-2: #A78BFA;
  --dim: #1E1B4B;
  --text: #E0E7FF;
  --tdim: #8B95B8;
  --card-glow: rgba(129, 140, 248, 0.2);
  --aurora-1: rgba(129, 140, 248, 0.35);
  --aurora-2: rgba(167, 139, 250, 0.28);
}

[data-theme="light"] {
  --s0: #F0F4FA;
  --s2: #FFFFFF;
  --s3: #E8EDF5;
  --s4: #DDE4EE;
  --accent: #0284C7;
  --accent-2: #10B981;
  --dim: #DBEAFE;
  --text: #0F172A;
  --tdim: #64748B;
  --card-glow: rgba(2, 132, 199, 0.15);
  --aurora-1: rgba(2, 132, 199, 0.2);
  --aurora-2: rgba(16, 185, 129, 0.15);
}

[data-theme="ocean"] {
  --s0: #041220;
  --s2: #081A2B;
  --s3: #0D2438;
  --s4: #133049;
  --accent: #06B6D4;
  --accent-2: #22D3EE;
  --dim: #0E4D64;
  --text: #DBEEF7;
  --tdim: #7BA3B8;
  --card-glow: rgba(6, 182, 212, 0.2);
  --aurora-1: rgba(6, 182, 212, 0.4);
  --aurora-2: rgba(34, 211, 238, 0.3);
}

[data-theme="sunset"] {
  --s0: #14070F;
  --s2: #1E0A18;
  --s3: #2A0F22;
  --s4: #38152C;
  --accent: #FB7185;
  --accent-2: #FBBF24;
  --dim: #5B1F3A;
  --text: #FDE4EC;
  --tdim: #C99AAB;
  --card-glow: rgba(251, 113, 133, 0.22);
  --aurora-1: rgba(251, 113, 133, 0.4);
  --aurora-2: rgba(251, 191, 36, 0.3);
}

[data-theme="forest"] {
  --s0: #071510;
  --s2: #0C1E17;
  --s3: #122A20;
  --s4: #1A3629;
  --accent: #10B981;
  --accent-2: #84CC16;
  --dim: #14532D;
  --text: #DCFCE7;
  --tdim: #7FA089;
  --card-glow: rgba(16, 185, 129, 0.22);
  --aurora-1: rgba(16, 185, 129, 0.4);
  --aurora-2: rgba(132, 204, 22, 0.28);
}

[data-theme="cyber"] {
  --s0: #0A0512;
  --s2: #100820;
  --s3: #180D2E;
  --s4: #211340;
  --accent: #D946EF;
  --accent-2: #22D3EE;
  --dim: #4A1060;
  --text: #F5E4FF;
  --tdim: #B096C5;
  --card-glow: rgba(217, 70, 239, 0.25);
  --aurora-1: rgba(217, 70, 239, 0.45);
  --aurora-2: rgba(34, 211, 238, 0.35);
}

[data-theme="nord"] {
  --s0: #242933;
  --s2: #2E3440;
  --s3: #3B4252;
  --s4: #434C5E;
  --accent: #88C0D0;
  --accent-2: #A3BE8C;
  --dim: #4C566A;
  --text: #ECEFF4;
  --tdim: #9099A8;
  --card-glow: rgba(136, 192, 208, 0.2);
  --aurora-1: rgba(136, 192, 208, 0.3);
  --aurora-2: rgba(163, 190, 140, 0.25);
}

[data-theme="rose"] {
  --s0: #1A0A15;
  --s2: #280F20;
  --s3: #37162C;
  --s4: #471C39;
  --accent: #F472B6;
  --accent-2: #FCD34D;
  --dim: #5E1F41;
  --text: #FFE4F1;
  --tdim: #C493AD;
  --card-glow: rgba(244, 114, 182, 0.22);
  --aurora-1: rgba(244, 114, 182, 0.4);
  --aurora-2: rgba(252, 211, 77, 0.3);
}

/* ============================================================
   БАЗА
   ============================================================ */
html,
body {
  min-height: 100vh;
}

html {
  background: var(--s0);
  transition: background var(--tr-slow) var(--ease);
}

body {
  background: transparent;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  line-height: 1.6;
  transition: color var(--tr-slow) var(--ease);
  overflow-x: hidden;
}

body.lock {
  overflow: hidden;
}

body.no-bg .aurora {
  opacity: 0;
}

/* ============================================================
   АВРОРА-ФОН
   ============================================================ */
.aurora {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  opacity: 0.9;
  transition: opacity var(--tr-slow) var(--ease);
}

.aurora::before,
.aurora::after {
  content: "";
  position: absolute;
  width: 70vmax;
  height: 70vmax;
  border-radius: 50%;
  filter: blur(90px);
  will-change: transform;
}

.aurora::before {
  background: radial-gradient(circle, var(--aurora-1) 0%, transparent 65%);
  top: -25vmax;
  left: -20vmax;
  animation: auroraA 28s ease-in-out infinite;
}

.aurora::after {
  background: radial-gradient(circle, var(--aurora-2) 0%, transparent 65%);
  bottom: -25vmax;
  right: -20vmax;
  animation: auroraB 34s ease-in-out infinite;
}

@keyframes auroraA {
  0%,
  100% {
    transform: translate(0, 0) scale(1);
  }
  33% {
    transform: translate(15vmax, 8vmax) scale(1.15);
  }
  66% {
    transform: translate(5vmax, 20vmax) scale(0.95);
  }
}

@keyframes auroraB {
  0%,
  100% {
    transform: translate(0, 0) scale(1);
  }
  33% {
    transform: translate(-12vmax, -10vmax) scale(1.1);
  }
  66% {
    transform: translate(-20vmax, 5vmax) scale(1.05);
  }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes shimmer {
  0% {
    background-position: 200% 0;
  }
  100% {
    background-position: -200% 0;
  }
}

@keyframes slideIn {
  from {
    transform: translateX(120%);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

@keyframes gradientShift {
  0%,
  100% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
}

/* ============================================================
   КОНТЕЙНЕР И ШАПКА
   ============================================================ */
.wrap {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem;
}

header {
  margin-bottom: 2rem;
  text-align: center;
  animation: fadeInUp 0.5s var(--ease);
}

h1 {
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 1rem;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  background-size: 200% 200%;
  animation: gradientShift 8s ease infinite;
}

.subtitle {
  color: var(--tdim);
  font-size: 1.1rem;
}

/* ============================================================
   ВКЛАДКИ
   ============================================================ */
.tabs {
  display: flex;
  gap: 0.75rem;
  margin-bottom: 2rem;
  justify-content: center;
  flex-wrap: wrap;
}

.tab {
  background: var(--s2);
  color: var(--tdim);
  padding: 0.75rem 1.5rem;
  border: 1px solid transparent;
  border-radius: var(--r);
  font-weight: 600;
  cursor: pointer;
  font-size: 1rem;
  white-space: nowrap;
  transition: all var(--tr-norm) var(--ease);
  backdrop-filter: blur(10px);
}

.tab:hover {
  background: var(--s3);
  color: var(--text);
  transform: translateY(-2px);
}

.tab.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--s0);
  box-shadow: 0 4px 16px var(--card-glow);
}

/* ============================================================
   ПОИСК
   ============================================================ */
.search-container {
  background: var(--s2);
  padding: 2rem;
  border-radius: var(--rl);
  margin-bottom: 2rem;
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.05);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
}

.search-row {
  display: flex;
  gap: 1rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
  align-items: center;
}

.search-input,
.filter-select {
  background: var(--s3);
  border: 2px solid transparent;
  color: var(--text);
  padding: 0.75rem 1.25rem;
  border-radius: var(--r);
  font-size: 1rem;
  transition: border-color var(--tr-norm) var(--ease);
}

.search-input {
  flex: 1;
  min-width: 200px;
}

.filter-select {
  padding: 0.5rem 1rem;
  cursor: pointer;
}

.search-input:focus,
.filter-select:focus {
  outline: none;
  border-color: var(--accent);
}

.filters {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  align-items: center;
}

.filters label {
  color: var(--tdim);
  font-size: 0.9rem;
}

.hidden {
  display: none !important;
}

/* ============================================================
   КНОПКИ
   ============================================================ */
.btn,
.search-btn {
  background: var(--accent);
  color: var(--s0);
  padding: 0.75rem 2rem;
  border: none;
  border-radius: var(--r);
  font-weight: 600;
  cursor: pointer;
  font-size: 1rem;
  transition: all var(--tr-norm) var(--ease);
  text-align: center;
}

.btn {
  width: 100%;
  display: inline-block;
}

.btn:hover,
.search-btn:hover {
  filter: brightness(1.1);
  transform: scale(1.02);
  box-shadow: 0 6px 20px var(--card-glow);
}

.btn-secondary {
  background: var(--s3);
  color: var(--text);
}

.btn-secondary:hover {
  background: var(--s4);
}

.btn-danger {
  background: var(--error);
  color: #fff;
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

#editorBtn {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--s0);
  border: none;
  border-radius: var(--r);
  padding: 0.85rem 1.5rem;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 0.55rem;
  box-shadow: 0 4px 16px var(--card-glow);
  transition: all var(--tr-norm) var(--ease);
  white-space: nowrap;
}

#editorBtn:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 10px 28px var(--card-glow);
}

#randomBtn {
  background: var(--s3);
  color: var(--text);
  border: none;
  border-radius: var(--r);
  padding: 0.85rem 1.5rem;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 0.55rem;
  transition: all var(--tr-norm) var(--ease);
  white-space: nowrap;
}

#randomBtn:hover {
  background: var(--s4);
  transform: translateY(-2px);
}

/* ============================================================
   СЕТКА КАРТОЧЕК
   ============================================================ */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1.5rem;
  margin-bottom: 2rem;
}

.card {
  background: var(--s2);
  border-radius: var(--rl);
  overflow: hidden;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  animation: fadeInUp 0.45s var(--ease) both;
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.05);
  transition: transform var(--tr-norm) var(--ease), box-shadow var(--tr-norm) var(--ease), border-color var(--tr-slow) var(--ease);
}

.card:hover,
.card:focus-visible {
  transform: translateY(-6px) scale(1.01);
  box-shadow: 0 12px 32px var(--card-glow);
  outline: none;
  border-color: rgba(255, 255, 255, 0.1);
}

.card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.card-image {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: var(--s4);
}

.card-image.skin {
  object-fit: contain;
  padding: 0.5rem;
  background: linear-gradient(135deg, var(--s3) 0%, var(--s4) 100%);
}

.card-content {
  padding: 1.25rem;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.card-title {
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
  line-height: 1.3;
  word-break: break-word;
}

.card-description {
  color: var(--tdim);
  font-size: 0.9rem;
  margin-bottom: 1rem;
  flex: 1;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.tag {
  display: inline-block;
  background: var(--dim);
  color: var(--accent);
  padding: 0.25rem 0.75rem;
  border-radius: var(--r);
  font-size: 0.8rem;
  font-weight: 500;
  margin-bottom: 1rem;
  align-self: flex-start;
}

.card-stats {
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
  color: var(--tdim);
  font-size: 0.85rem;
}

/* Скелетоны */
.skeleton-card {
  cursor: default !important;
  pointer-events: none;
}

.skeleton-card:hover {
  transform: none !important;
  box-shadow: none !important;
}

.skeleton-shimmer {
  background: linear-gradient(90deg, var(--s3) 25%, var(--s4) 50%, var(--s3) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}

.skeleton-line {
  height: 0.85rem;
  border-radius: 0.4rem;
  margin-bottom: 0.6rem;
}

.skeleton-line.big {
  height: 1.2rem;
  width: 70%;
}

/* ============================================================
   МОДАЛЬНЫЕ ОКНА
   ============================================================ */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(8px);
  z-index: 1000;
  overflow-y: auto;
  animation: fadeIn 0.2s var(--ease);
}

.modal.active {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.modal-content {
  background: var(--s2);
  border-radius: var(--rl);
  max-width: 900px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  animation: fadeInUp 0.3s var(--ease);
}

.modal-content.small {
  max-width: 520px;
}

.modal-header {
  padding: 1.5rem 2rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  align-items: center;
}

.modal-title {
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.3;
  word-break: break-word;
}

.modal-close {
  background: none;
  border: none;
  color: var(--tdim);
  font-size: 2rem;
  cursor: pointer;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: all var(--tr-fast) var(--ease);
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-close:hover {
  background: var(--s3);
  color: var(--text);
  transform: rotate(90deg);
}

.modal-body {
  padding: 2rem;
}

.modal-3d-viewport {
  width: 100%;
  height: 400px;
  background: linear-gradient(135deg, var(--s3), var(--s4));
  border-radius: var(--rl);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.modal-3d-viewport canvas {
  display: block;
  cursor: grab;
}

.modal-3d-viewport canvas:active {
  cursor: grabbing;
}

.modal-3d-viewport img {
  max-height: 100%;
  max-width: 100%;
  object-fit: contain;
}

.modal-description {
  color: var(--tdim);
  line-height: 1.7;
  margin-bottom: 1.5rem;
  white-space: pre-line;
}

.modal-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.version-picker {
  background: var(--s3);
  border-radius: var(--rl);
  padding: 1rem 1.25rem;
  margin-bottom: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.version-picker-title {
  font-size: 0.9rem;
  color: var(--tdim);
}

.version-picker-row {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.version-picker select {
  flex: 1;
  min-width: 140px;
}

/* ============================================================
   СООБЩЕНИЯ
   ============================================================ */
.error {
  text-align: center;
  padding: 2rem;
  font-size: 1.1rem;
  color: var(--error);
  background: var(--s2);
  border-radius: var(--rl);
}

.error-detail {
  color: var(--tdim);
  font-size: 0.85rem;
  margin-top: 0.5rem;
  word-break: break-word;
}

#sentinel {
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--tdim);
  font-size: 0.9rem;
}

#toasts {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  z-index: 2000;
  max-width: min(360px, calc(100vw - 3rem));
}

.toast {
  background: var(--s3);
  color: var(--text);
  padding: 1rem 1.25rem;
  border-radius: 1rem;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  border-left: 4px solid var(--accent);
  animation: slideIn 0.25s var(--ease);
  font-size: 0.95rem;
}

.toast.error {
  border-left-color: var(--error);
}

.toast.ok {
  border-left-color: var(--ok);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ============================================================
   ПАНЕЛЬ НАСТРОЕК
   ============================================================ */
.settings-panel {
  position: fixed;
  bottom: 1.5rem;
  left: 1.5rem;
  z-index: 3000;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  align-items: flex-start;
}

.settings-toggle {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.08);
  cursor: pointer;
  background: var(--s2);
  color: var(--text);
  font-size: 1.4rem;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  transition: all var(--tr-norm) var(--ease);
  display: flex;
  align-items: center;
  justify-content: center;

  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;',
  "'": '&#39;'
}[c]));

function safeUrl(u) {
  try {
    const x = new URL(u);
    return x.protocol === 'https:' ? x.href : '';
  } catch {
    return '';
  }
}

const safeId = v => /^[\w-]{1,64}$/.test(String(v)) ? String(v) : '';
const isValidNick = n => /^[A-Za-z0-9_]{3,16}$/.test(n);

const isValidHex = c => /^#[0-9a-fA-F]{6}$/.test(c);

function safeSetLocalStorage(key, val) {
  try {
    let str = typeof val === 'string' ? val : JSON.stringify(val);
    if (str.length > 500000) str = str.slice(0, 500000);
    localStorage.setItem(key, str);
    return true;
  } catch (e) {
    try { localStorage.removeItem(key); } catch {}
    return false;

function safeGetLocalStorage(key) {

const CACHE_TTL = 5 * 60 * 1000;

function cacheGet(key) {
  const entry = pageCache.get(key);
  if (!entry) return null;
  if (Date.now() - entry.ts > CACHE_TTL) {
    pageCache.delete(key);
    return null;
  }
  return entry.data;
}

function cacheSet(key, value) {
  if (pageCache.size >= 120) {
    const first = pageCache.keys().next().value;
    pageCache.delete(first);
  }
  pageCache.set(key, { data: value, ts: Date.now() });
}

/* ============================================================
   FETCH С РЕТРАЯМИ
   ============================================================ */
async function fetchJson(url) {
  let lastError;
  for (let i = 0; i < 2; i++) {
    try {
      const ctrl = new AbortController();
      const tm = setTimeout(() => ctrl.abort(), 15000);
      const r = await fetch(url, { signal: ctrl.signal });
      clearTimeout(tm);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) {
      lastError = e;
      if (i === 0) await new Promise(res => setTimeout(res, 300));
    }
  }
  throw lastError || new Error('fetch failed');
}

const CORS_PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
];

async function fetchViaProxy(url) {
  for (const wrap of CORS_PROXIES) {
    try {
      const ctrl = new AbortController();
      const tm = setTimeout(() => ctrl.abort(), 10000);
      const r = await fetch(wrap(url), { signal: ctrl.signal });
      clearTimeout(tm);
      if (r.ok) {
        const text = await r.text();
        if (text && text.length > 100) return text;
      }
    } catch (e) { continue; }
  }
  throw new Error('all proxies failed');
}

function toast(msg, kind = 'info', ms = 4000) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind === 'error' ? 'error' : kind === 'ok' ? 'ok' : '');
  el.textContent = msg;
  const container = $('toasts');
  if (!container) return;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity .3s';
    setTimeout(() => el.remove(), 300);
  }, ms);
}

const trCache = new Map();
try {
  const raw = safeGetLocalStorage('trCache');
  if (raw) Object.entries(JSON.parse(raw)).forEach(([k, v]) => trCache.set(k, v));
} catch {}

let cacheSaveTimer = null;
function scheduleCacheSave() {
  if (cacheSaveTimer) return;
  cacheSaveTimer = setTimeout(() => {
    try {
      const entries = [...trCache].slice(-300);
      safeSetLocalStorage('trCache', JSON.stringify(Object.fromEntries(entries)));
    } catch {}
    cacheSaveTimer = null;
  }, 2000);
}

const needsTranslation = t =>
  t && t.length > 2 && (t.match(/[а-яё]/gi) || []).length < t.length * 0.2;

async function translate(text) {
  if (!needsTranslation(text)) return text;
  const cut = text.slice(0, 450);
  if (trCache.has(cut)) return trCache.get(cut);
  try {
    const r = await fetch(
      'https://translate.googleapis.com/translate_a/single?' +
      'client=gtx&sl=auto&tl=ru&dt=t&q=' + encodeURIComponent(cut)
    );
    if (r.status === 429) {
      await new Promise(res => setTimeout(res, 1500));
      throw new Error('rate limited');
    }
    if (!r.ok) throw new Error('translate http ' + r.status);
    const d = await r.json();
    const out = d[0].map(p => p[0]).join('');
    trCache.set(cut, out);
    scheduleCacheSave();
    return out;
  } catch {
    return text;
  }
}

async function translateQueue(elements, token) {
  let idx = 0;
  const worker = async () => {
    while (idx < elements.length && token === reqId) {
      const el = elements[idx++];
      if (!el || !el.dataset || !el.dataset.orig) continue;
      const ru = await translate(el.dataset.orig);
      if (token === reqId && document.contains(el)) el.textContent = ru;
      await new Promise(res => setTimeout(res, 80));
    }
  };
  await Promise.all([worker(), worker()]);
}

        t.colors && typeof t.colors === 'object'
      );

  }
} catch { customThemes = []; }

function saveCustomThemes() {
  safeSetLocalStorage('mch-custom-themes', customThemes);
}

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return {
    r: parseInt(h.slice(0, 2), 16),
    g: parseInt(h.slice(2, 4), 16),
    b: parseInt(h.slice(4, 6), 16)
  };
}

function applyTheme(themeId) {
  document.documentElement.setAttribute('data-theme', themeId);
  const custom = customThemes.find(t => t.id === themeId);
  if (custom) {
    for (const [k, v] of Object.entries(custom.colors)) {
      if (isValidHex(v)) {
        document.documentElement.style.setProperty('--' + k, v);
      }
    }
    if (custom.colors.accent) {
      const rgb = hexToRgb(custom.colors.accent);
      document.documentElement.style.setProperty('--card-glow', `rgba(${rgb.r},${rgb.g},${rgb.b},.18)`);
      document.documentElement.style.setProperty('--aurora-1', `rgba(${rgb.r},${rgb.g},${rgb.b},.35)`);
    }
    if (custom.colors['accent-2']) {
      const rgb = hexToRgb(custom.colors['accent-2']);
      document.documentElement.style.setProperty('--aurora-2', `rgba(${rgb.r},${rgb.g},${rgb.b},.28)`);
    }
  } else {
    THEME_COLORS.forEach(c =>
      document.documentElement.style.removeProperty('--' + c.key)
    );
    document.documentElement.style.removeProperty('--card-glow');
    document.documentElement.style.removeProperty('--aurora-1');
    document.documentElement.style.removeProperty('--aurora-2');
  }
}

function renderThemeGrid() {
  const grid = $('themeGrid');
  if (!grid) return;
  let html = BUILTIN_THEMES.map(t =>
    `<button class="theme-opt" data-theme="${t.id}" title="${esc(t.name)}"></button>`
  ).join('');
  html += customThemes.map(t => {
    const c = t.colors;
    const bg = `background:linear-gradient(135deg,${esc(c.s0 || '#000')} 50%,${esc(c.accent || '#fff')})`;
    return `<button class="theme-opt custom" data-theme="${t.id}" title="${esc(t.name)}" style="${bg}">
      <span class="del-badge" data-del="${t.id}" title="Удалить">×</span>
    </button>`;
  }).join('');
  grid.innerHTML = html;
}

  renderThemeGrid();
  const savedTheme = safeGetLocalStorage('mch-theme') || 'dark';
  const savedBg = safeGetLocalStorage('mch-bg') !== 'off';
  applyTheme(savedTheme);
  if (!savedBg) document.body.classList.add('no-bg');
  $('bgSwitch').classList.toggle('on', savedBg);

  const markActive = () => {
    $$('.theme-opt').forEach(b =>
      b.classList.toggle('active', b.dataset.theme === (safeGetLocalStorage('mch-theme') || 'dark'))
    );
  };
  markActive();

  $('settingsToggle').addEventListener('click', e => {
    e.stopPropagation();
    $('settingsPanel').classList.toggle('open');
  });

  $('themeGrid').addEventListener('click', e => {
    const delBtn = e.target.closest('[data-del]');
    if (delBtn) {
      e.stopPropagation();
      const id = delBtn.dataset.del;
      const theme = customThemes.find(t => t.id === id);
      if (!theme) return;
      showConfirm(`Удалить тему «${theme.name}»?`, () => {
        customThemes = customThemes.filter(t => t.id !== id);
        saveCustomThemes();
        if (safeGetLocalStorage('mch-theme') === id) {
          applyTheme('dark');
          safeSetLocalStorage('mch-theme', 'dark');
        }
        renderThemeGrid();
        markActive();
      });
      return;
    }
    const btn = e.target.closest('.theme-opt');
    if (!btn) return;
    const th = btn.dataset.theme;
    if (!th) return;
    applyTheme(th);
    safeSetLocalStorage('mch-theme', th);
    markActive();
  });

  $('bgToggleRow').addEventListener('click', () => {
    const on = !$('bgSwitch').classList.contains('on');
    $('bgSwitch').classList.toggle('on', on);
    document.body.classList.toggle('no-bg', !on);
    safeSetLocalStorage('mch-bg', on ? 'on' : 'off');
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('#settingsPanel')) {
      $('settingsPanel').classList.remove('open');
    }
  });

  $('addThemeBtn').addEventListener('click', () => openThemeEditor());

  // Custom background upload
  $('bgUploadBtn').addEventListener('click', () => $('bgFile').click());
  $('bgFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      if (typeof dataUrl === 'string' && dataUrl.startsWith('data:image/')) {
        try {
          localStorage.setItem('mch-custom-bg', dataUrl);
        } catch {
          toast('Фон слишком большой, не сохранится после перезагрузки', 'error');
        }
        document.body.style.backgroundImage = `url(${dataUrl})`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundAttachment = 'fixed';
        document.body.style.backgroundPosition = 'center';
        document.body.classList.add('no-bg');
      }
    };
    reader.readAsDataURL(file);
  });
  $('bgResetBtn').addEventListener('click', () => {
    localStorage.removeItem('mch-custom-bg');
    document.body.style.backgroundImage = '';
    document.body.style.backgroundSize = '';
    document.body.style.backgroundAttachment = '';
    document.body.style.backgroundPosition = '';
    document.body.classList.remove('no-bg');
    toast('Фон сброшен', 'ok');
  });

  const savedCustomBg = safeGetLocalStorage('mch-custom-bg');
  if (savedCustomBg) {
    document.body.style.backgroundImage = `url(${savedCustomBg})`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundAttachment = 'fixed';
    document.body.style.backgroundPosition = 'center';
    document.body.classList.add('no-bg');
  }
}

let themeEditState = null;

function openThemeEditor(existingId) {
  const existing = existingId ? customThemes.find(t => t.id === existingId) : null;
  const defaults = existing ? existing.colors : {
    's0': '#05070C',
    's2': '#0F131C',
    's3': '#161D2B',
    's4': '#1E2636',
    'accent': '#38BDF8',
    'accent-2': '#6EE7B7',
    'text': '#E8EDF4',
    'tdim': '#9CA3AF',
    'dim': '#1E3A5F'
  };
  themeEditState = {
    id: existing ? existing.id : null,
    colors: { ...defaults },
    name: existing ? existing.name : ''
  };

  $('themeModalTitle').textContent = existing ? 'Редактировать тему' : 'Своя тема';
  $('ct-name').value = themeEditState.name;

  const colorsEl = $('ct-colors');
  colorsEl.innerHTML = THEME_COLORS.map(c => `
    <div class="color-row">
      <label for="ct-${c.key}">${c.label}</label>
      <input type="text" id="ct-txt-${c.key}" value="${esc(themeEditState.colors[c.key])}" maxlength="7">
      <input type="color" id="ct-${c.key}" value="${esc(themeEditState.colors[c.key])}">
    </div>
  `).join('');

  THEME_COLORS.forEach(c => {
    $('ct-' + c.key).addEventListener('input', e => {
      const v = e.target.value;
      themeEditState.colors[c.key] = v;
      $('ct-txt-' + c.key).value = v;
      previewCustomTheme();
    });
    $('ct-txt-' + c.key).addEventListener('input', e => {
      const v = e.target.value.trim();
      if (isValidHex(v)) {
        themeEditState.colors[c.key] = v;
        $('ct-' + c.key).value = v;
        previewCustomTheme();
      }
    });
  });

  $('themeModal').classList.add('active');
}

function previewCustomTheme() {
  for (const [k, v] of Object.entries(themeEditState.colors)) {
    if (isValidHex(v)) {
      document.documentElement.style.setProperty('--' + k, v);
    }
  }
  if (themeEditState.colors.accent) {
    const rgb = hexToRgb(themeEditState.colors.accent);
    document.documentElement.style.setProperty('--card-glow', `rgba(${rgb.r},${rgb.g},${rgb.b},.18)`);
    document.documentElement.style.setProperty('--aurora-1', `rgba(${rgb.r},${rgb.g},${rgb.b},.35)`);
  }
}

function closeThemeEditor(revert) {
  if (revert) {
    applyTheme(safeGetLocalStorage('mch-theme') || 'dark');
  }
  $('themeModal').classList.remove('active');
  themeEditState = null;
}

function saveCustomTheme() {
  if (!themeEditState) return;
  const name = ($('ct-name').value || '').trim().slice(0, 24);
  if (!name) {
    toast('Введи название темы', 'error');
    return;
  }
  if (!/^[\w\s\-А-Яа-яЁё]{1,24}$/.test(name)) {
    toast('Только буквы, цифры, пробелы, дефис', 'error');
    return;
  }
  const id = themeEditState.id || ('custom_' + Math.random().toString(36).slice(2, 10));
  if (customThemes.some(t => t.id !== id && t.name.toLowerCase() === name.toLowerCase())) {
    toast('Такое имя уже есть', 'error');
    return;
  }
  const colors = {};
  for (const [k, v] of Object.entries(themeEditState.colors)) {
    if (isValidHex(v)) colors[k] = v;
  }
  if (Object.keys(colors).length < THEME_COLORS.length) {
    toast('Некорректные цвета', 'error');
    return;
  }
  if (themeEditState.id) {
    const idx = customThemes.findIndex(t => t.id === id);
    if (idx >= 0) customThemes[idx] = { id, name, colors };
    else customThemes.push({ id, name, colors });
  } else {
    customThemes.push({ id, name, colors });
  }
  saveCustomThemes();
  renderThemeGrid();
  applyTheme(id);
  safeSetLocalStorage('mch-theme', id);
  toast('Тема сохранена: ' + name, 'ok');
  closeThemeEditor(false);
}

  currentQuery = '';
  $('searchInput').value = '';
  resetAndLoad();
});

function performSearch() {
  const now = Date.now();
  if (now - lastSearch < 600) return;
  lastSearch = now;
  currentQuery = $('searchInput').value.trim().slice(0, 64);
  randomMode = false;
  resetAndLoad();
}

function resetAndLoad() {
  reqId++;
  items = [];
  offset = 0;
  hasMore = true;
  isLoading = false;
  $('content').innerHTML = '';
  setSentinel('idle');
  loadMore();
}

/* ============================================================
   MODRINTH + CURSEFORGE
   ============================================================ */
function buildModrinthQuery() {
  const cfg = TAB_CONFIG[currentTab];
  const sort = $('sortSelect').value;
  const mc = $('mcVersion').value.trim();
  const loader = $('loaderSelect').value;
  const facets = [['project_type:' + cfg.type]];
  if (mc && isValidVersion(mc)) facets.push(['versions:' + mc]);
  if (loader) facets.push(['categories:' + loader]);
  const qs = new URLSearchParams({
    query: currentQuery,
    facets: JSON.stringify(facets),
    limit: LIMIT,
    offset,
    index: sort
  });
  return { qs, key: ['mr', currentTab, currentQuery, sort, mc, loader, offset].join('|') };
}

function buildCurseForgeQuery() {
  const cfg = TAB_CONFIG[currentTab];
  const sort = $('sortSelect').value;
  const sortField = sort === 'downloads' ? '6' :
                    sort === 'updated' ? '3' :
                    sort === 'newest' ? '11' : '2';
  const qs = new URLSearchParams({
    gameId: '432',
    classId: cfg.cf,
    searchFilter: currentQuery,
    pageSize: LIMIT,
    index: offset,
    sortField,
    sortOrder: 'desc'
  });
  return { qs, key: ['cf', currentTab, currentQuery, sort, offset].join('|') };
}

async function fetchModrinthPage() {
  const { qs, key } = buildModrinthQuery();
  const cached = cacheGet(key);
  if (cached) return cached;
  const data = await fetchJson(`${MR_API}/search?${qs}`);
  const result = {
    list: (data.hits || []).map(i => ({ source: 'modrinth', ...i })),
    total: data.total_hits ?? 0
  };
  cacheSet(key, result);
  return result;
}

async function fetchCurseForgePage() {
  const { qs, key } = buildCurseForgeQuery();
  const cached = cacheGet(key);
  if (cached) return cached;
  const data = await fetchJson(`${MCIM_API}/mods/search?${qs}`);
  const result = {
    list: (data.data || []).map(i => ({ source: 'curseforge', ...i })),
    total: data.pagination?.totalCount ?? 0
  };
  cacheSet(key, result);
  return result;
}

async function loadMore() {
  if (isLoading || !hasMore) return;
  isLoading = true;
  const token = reqId;

  try {
    if (currentTab === 'skins') {
      showSkeletons(8);
      let list = [];

      if (currentQuery && isValidNick(currentQuery)) {
        // Поиск конкретного ника
        let names = [currentQuery];
        try {
          names = await fetchNamemcSearch(currentQuery);
        } catch {}
        list = names.slice(0, SKIN_LIMIT).map(n => ({ source: 'skin', name: n }));
        hasMore = false;
      } else if (randomMode) {
        const adjectives = ['Epic', 'Dark', 'Fire', 'Ice', 'Shadow', 'Light', 'Red', 'Blue',
                            'Green', 'Gold', 'Diamond', 'Nether', 'Ender', 'Void', 'Storm',
                            'Frost', 'Blaze', 'Pixel', 'Retro', 'Craft'];
        const nouns = ['Warrior', 'Mage', 'Knight', 'Archer', 'Ninja', 'Pirate', 'King',
                       'Dragon', 'Wolf', 'Tiger', 'Phoenix', 'Golem', 'Slime', 'Creeper',
                       'Zombie', 'Skeleton', 'Wizard', 'Steve', 'Alex'];
        list = Array.from({ length: SKIN_LIMIT }, () => ({
          source: 'skin',
          name: adjectives[Math.floor(Math.random() * adjectives.length)] +
                nouns[Math.floor(Math.random() * nouns.length)] +
                Math.floor(Math.random() * 100)
        }));
        hasMore = false;
      } else {
        if (namemcNames === null) {
          try {
            const trending = await fetchNamemcTrending(1);
            namemcNames = trending.length > 20 ? trending : NICK_POOL;
          } catch {
            namemcNames = NICK_POOL;
          }
        }
        const start = offset;
        list = namemcNames.slice(start, start + SKIN_LIMIT).map(n => ({
          source: 'skin',
          name: n
        }));
        hasMore = (offset + SKIN_LIMIT) < namemcNames.length;
      }

      removeSkeletons();
      if (token !== reqId) return;
      if (!list.length) {
        hasMore = false;
        setSentinel('end');
        return;
      }
      appendCards(list, token);
      offset += list.length;
      setSentinel(hasMore ? 'idle' : 'end');
      return;
    }

    showSkeletons(8);
    setSentinel('loading');

    let mrResult = null, cfResult = null, rendered = false;

    const handleMr = async () => {
      try {
        const r = await fetchModrinthPage();
        if (token !== reqId) return null;
        mrResult = r;
        if (r.list.length) {
          if (!rendered) { removeSkeletons(); rendered = true; }
          appendCards(r.list, token);
        }
        return r;
      } catch (e) {
        console.warn('Modrinth:', e.message);
        return null;
      }
    };

    const handleCf = async () => {
      try {
        const r = await fetchCurseForgePage();
        if (token !== reqId) return null;
        cfResult = r;
        if (r.list.length) {
          if (!rendered) { removeSkeletons(); rendered = true; }
          appendCards(r.list, token);
        }
        return r;
      } catch (e) {
        console.warn('CurseForge:', e.message);
        return null;
      }
    };

    await Promise.all([handleMr(), handleCf()]);
    if (token !== reqId) return;
    removeSkeletons();

    if (!mrResult && !cfResult) throw new Error('Оба источника недоступны');

    const mrTotal = mrResult?.total ?? 0;
    const cfTotal = cfResult?.total ?? 0;
    hasMore = (offset + LIMIT) < Math.max(mrTotal, cfTotal);
    offset += LIMIT;
    setSentinel(hasMore ? 'idle' : 'end');
  } catch (e) {
    if (token !== reqId) return;
    console.error(e);
    removeSkeletons();
    hasMore = false;
    const errEl = document.createElement('div');
    errEl.className = 'error';
    errEl.innerHTML = `Не удалось загрузить.<div class="error-detail">${esc(e.message || '')}</div>`;
    $('content').appendChild(errEl);
    setSentinel('');
  } finally {
    if (token === reqId) isLoading = false;
  }
}

/* ============================================================
   НОРМАЛИЗАЦИЯ + КАРТОЧКИ
   ============================================================ */
const normalizeItem = item => item.source === 'modrinth' ? {
  title: item.title,
  desc: item.description,
  icon: item.icon_url,
  downloads: item.downloads,
  author: item.author,
  updated: item.date_modified,
  id: item.project_id || item.slug,
  web: `https://modrinth.com/${TAB_CONFIG[currentTab]?.type || 'mod'}/${encodeURIComponent(item.slug)}`
} : {
  title: item.name,
  desc: item.summary,
  icon: item.logo?.url,
  downloads: item.downloadCount,
  author: item.authors?.[0]?.name || 'Неизвестно',
  updated: item.dateModified,
  id: item.id,
  web: item.links?.websiteUrl
};

const SKIN_SOURCES = [
  n => `https://minotar.net/armor/body/${encodeURIComponent(n)}/180`,
  n => `https://crafatar.com/renders/body/${encodeURIComponent(n)}?scale=6&overlay`,
  n => `https://mc-heads.net/body/${encodeURIComponent(n)}/180`,
  n => `https://minotar.net/skin/${encodeURIComponent(n)}`
];

function skinRenderUrl(name, step = 0) {
  return SKIN_SOURCES[Math.min(Math.max(0, step | 0), SKIN_SOURCES.length - 1)](name);
}

function skinTextureUrl(name) {
  return `https://minotar.net/skin/${encodeURIComponent(name)}`;
}

function skinDownloadUrl(name) {
  return `https://minotar.net/download/${encodeURIComponent(name)}`;
}

function buildCardHTML(item, globalIndex) {
  if (item.source === 'skin') {
    const src = skinRenderUrl(item.name, 0);
    return `<article class="card" data-i="${globalIndex}" tabindex="0">
      <img src="${esc(src)}" alt="${esc(item.name)}"
           class="card-image skin" loading="lazy"
           data-skin-name="${esc(item.name)}" data-skin-step="0" data-skin-fallback>
      <div class="card-content">
        <h3 class="card-title">${esc(item.name)}</h3>
        <p class="card-description">Клик — 3D-просмотр и скачивание</p>
      </div>
    </article>`;
  }
  const n = normalizeItem(item);
  return `<article class="card" data-i="${globalIndex}" tabindex="0">
    <img src="${esc(safeUrl(n.icon) || NO_IMG)}" alt="${esc(n.title)}"
         class="card-image" loading="lazy" referrerpolicy="no-referrer" data-fallback>
    <div class="card-content">
      <h3 class="card-title">${esc(n.title)}</h3>
      <p class="card-description" data-orig="${esc(n.desc || '')}">${esc(n.desc || 'Описание отсутствует')}</p>
      <span class="tag">${item.source === 'modrinth' ? 'Modrinth' : 'CurseForge'}</span>
      <div class="card-stats">
        <span>📥 ${formatNumber(n.downloads)}</span>
        <span>👤 ${esc(n.author)}</span>
      </div>
    </div>
  </article>`;
}

function appendCards(list, token) {
  let grid = $('content').querySelector('.grid');
  if (!grid) {
    grid = document.createElement('div');
    grid.className = 'grid';
    $('content').appendChild(grid);
  }
  const startIdx = items.length;
  grid.insertAdjacentHTML('beforeend',
    list.map((it, i) => buildCardHTML(it, startIdx + i)).join(''));
  items.push(...list);
  if (currentTab !== 'skins') {
    const cards = [...grid.children].slice(startIdx);
    const queue = cards
      .map(c => c.querySelector('.card-description[data-orig]'))
      .filter(Boolean);
    translateQueue(queue, token);
  }
}

/* ============================================================
   IMAGE ERROR HANDLER
   ============================================================ */
document.addEventListener('error', e => {
  const img = e.target;
  if (!img || img.tagName !== 'IMG') return;
  if (img.hasAttribute('data-skin-fallback')) {
    const step = +img.dataset.skinStep + 1;
    if (step < 4) {
      img.dataset.skinStep = step;
      img.src = skinRenderUrl(img.dataset.skinName, step);
      return;
    }
    img.src = NO_IMG;
    return;
  }
  if (img.hasAttribute('data-fallback') && img.src !== NO_IMG) {
    img.src = NO_IMG;
  }
}, true);

$('content').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card && !card.classList.contains('skeleton-card')) {
    showDetails(items[+card.dataset.i]);
  }
});

$('content').addEventListener('keydown', e => {
  const card = e.target.closest('.card');
  if (card && !card.classList.contains('skeleton-card') &&
      (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    showDetails(items[+card.dataset.i]);
  }
});

/* ============================================================
   МОДАЛЬНОЕ ОКНО ДЕТАЛЕЙ

let lastFocused = null;
let modalViewer = null;

function trapFocus(e) {
  if (e.key !== 'Tab') return;
  const activeModal = $$('.modal.active').pop();
  if (!activeModal) return;
  const focusables = [...activeModal.querySelectorAll(
    'button:not([disabled]), [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
  )].filter(el => el.offsetParent !== null);
  if (!focusables.length) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
}

function createSkinViewer(container, skinUrl, opts = {}) {
  if (typeof skinview3d === 'undefined' || typeof THREE === 'undefined') {
    const img = document.createElement('img');
    img.src = skinRenderUrl(skinUrl.split('/').pop(), 0);
    img.alt = 'Skin preview';
    img.onerror = () => { img.src = NO_IMG; };
    container.appendChild(img);
    return null;
  }
  try {
    const viewer = new skinview3d.SkinViewer({
      canvas: document.createElement('canvas'),
      width: container.clientWidth || 400,
      height: container.clientHeight || 400,
      skin: skinUrl,
      background: 'transparent'
    });
    viewer.controls.enableZoom = opts.zoom !== false;
    viewer.controls.enableRotate = true;
    viewer.controls.enablePan = false;
    viewer.camera.position.z = 60;
    if (opts.animation) {
      viewer.animation = new skinview3d.WalkingAnimation();
      viewer.animation.speed = 1;
    }
    try {
      viewer.renderer.setClearColor(0x000000, 0);
      viewer.renderer.setClearAlpha(0);
    } catch {}
    viewer.canvas.style.background = 'transparent';
    container.appendChild(viewer.canvas);
    viewer.renderer.setAnimationLoop(() => {
      viewer.renderer.render(viewer.scene, viewer.camera);
    });
    return viewer;
  } catch (e) {
    console.warn('skinview3d failed:', e);
    const img = document.createElement('img');
    img.src = skinRenderUrl(skinUrl.split('/').pop(), 0);
    img.alt = 'Skin preview';
    img.onerror = () => { img.src = NO_IMG; };
    container.appendChild(img);
    return null;
  }
}

async function loadVersions(item) {
  const vSel = $('modalVersion');
  const lSel = $('modalLoader');
  if (!vSel) return;
  const id = safeId(item.source === 'modrinth'
    ? (item.project_id || item.slug)
    : item.id);
  if (!id) return;
  try {
    let versions = [];
    if (item.source === 'modrinth') {
      const v = await fetchJson(`${MR_API}/project/${id}/version`);
      versions = (v || []).map(x => ({
        id: x.id,
        mc: x.game_versions || [],
        loaders: x.loaders || []
      }));
    } else {
      const f = await fetchJson(`${MCIM_API}/mods/${id}/files?pageSize=20`);
      versions = (f.data || []).map(x => ({
        id: x.id,
        mc: (x.gameVersions || []).filter(g => /^\d/.test(g)),
        loaders: x.modLoader ? [x.modLoader] : []
      }));
    }
    const mcSet = new Set();
    const loaderSet = new Set();
    versions.forEach(v => {
      v.mc.forEach(m => mcSet.add(m));
      v.loaders.forEach(l => loaderSet.add(l));
    });
    const mcs = [...mcSet].sort((a, b) => compareVersions(b, a));
    const loaders = [...loaderSet].sort();

    vSel.innerHTML = mcs.length
      ? mcs.map(m => `<option>${esc(m)}</option>`).join('')
      : '<option value="">—</option>';
    lSel.innerHTML = '<option value="">Любой</option>' +
      loaders.map(l => `<option>${esc(l)}</option>`).join('');

    const userMc = $('mcVersion').value.trim();
    if (userMc && mcs.includes(userMc)) vSel.value = userMc;
    const userLoader = $('loaderSelect').value;
    if (userLoader && loaders.includes(userLoader)) lSel.value = userLoader;
  } catch (e) {
    vSel.innerHTML = '<option value="">Ошибка</option>';
    lSel.innerHTML = '<option value="">—</option>';
  }
}

function compareVersions(a, b) {
  const pa = String(a).split('.').map(Number);
  const pb = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const d = (pa[i] || 0) - (pb[i] || 0);
    if (d) return d;
  }
  return 0;
}

function closeModal() {
  $('detailModal').classList.remove('active');
  document.body.classList.remove('lock');
  if (modalViewer) {
    try {
      modalViewer.renderer.setAnimationLoop(null);
      modalViewer.dispose();
    } catch {}
    modalViewer = null;
  }
  $('modalBody').innerHTML = '';
  if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
  lastFocused = null;
}

/* ============================================================
   СКАЧИВАНИЕ
   ============================================================ */
async function downloadDirect(source, id, btn) {
  if (!id) {
    toast('Некорректный ID', 'error');
    return;
  }
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Подготовка...';
  try {
    let url = '';
    let filename = 'download';

    if (source === 'skin') {
      url = skinDownloadUrl(id);
      filename = id + '.png';
    } else if (source === 'modrinth') {
      const v = await fetchJson(`${MR_API}/project/${id}/version`);
      if (!v?.length) {
        toast('Файлы не найдены', 'error');
        return;
      }
      const wantMc = $('modalVersion')?.value || '';
      const wantLoader = $('modalLoader')?.value || '';
      let pick = v.find(x =>
        (!wantMc || (x.game_versions || []).includes(wantMc)) &&
        (!wantLoader || (x.loaders || []).includes(wantLoader))
      );
      if (!pick) {
        toast('Беру последнюю версию', 'info');
        pick = v[0];
      }
      const file = (pick.files || []).find(x => x.primary) || (pick.files || [])[0];
      if (!file) {
        toast('Файл не найден', 'error');
        return;
      }
      url = file.url;
      filename = file.filename || 'mod.jar';
    } else {
      const f = await fetchJson(`${MCIM_API}/mods/${id}/files?pageSize=20`);
      if (!f.data?.length) {
        toast('Файлы не найдены', 'error');
        return;
      }
      const wantMc = $('modalVersion')?.value || '';
      const wantLoader = $('modalLoader')?.value || '';
      let pick = f.data.find(x => {
        const mcOk = !wantMc || (x.gameVersions || []).includes(wantMc);
        const ldOk = !wantLoader || x.modLoader === wantLoader;
        return mcOk && ldOk;
      });
      if (!pick) {
        toast('Беру последнюю версию', 'info');
        pick = f.data[0];
      }
      const fid = safeId(pick.id);
      if (!fid) {
        toast('Некорректный ID', 'error');
        return;
      }
      filename = pick.fileName || 'mod.jar';
      const dl = await fetchJson(`${MCIM_API}/mods/${id}/files/${fid}/download-url`);
      if (!dl.data) {
        toast('Автор запретил скачивание', 'error');
        return;
      }
      url = dl.data;
    }

    const safe = safeUrl(url);
    if (!safe) {
      toast('Некорректная ссылка', 'error');
      return;
    }
    const a = document.createElement('a');
    a.href = safe;
    a.download = filename;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('Скачивание: ' + filename, 'ok');
  } catch (e) {
    console.error(e);
    toast('Ошибка: ' + (e.message || 'не удалось'), 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = old;
  }
}

/* ============================================================
   ФОРМАТИРОВАНИЕ ЧИСЕЛ
   ============================================================ */
function formatNumber(n) {
  n = Number(n) || 0;
  if (n >= 1e6) {
    const v = n / 1e6;
    return (v >= 100 ? Math.round(v) : (Math.round(v * 10) / 10).toString().replace(/\.0$/, '')) + 'M';
  }
  if (n >= 1000) {
    const v = n / 1000;
    return (v >= 999.5
      ? (Math.round(n / 1e5) / 10).toString().replace(/\.0$/, '') + 'M'
      : (Math.round(v * 10) / 10).toString().replace(/\.0$/, '') + 'K');
  }
  return String(n);
}

   СКИНЫ — ИСТОЧНИКИ
   ============================================================ */

// Minecraft Inside даёт PNG по прямому URL для любого ника
function minecraftInsideSkinUrl(nickname) {
  return `https://minecraft-inside.ru/skins/nick/${encodeURIComponent(nickname)}.png`;
}

async function fetchNamemcTrending(page = 1) {
  const html = await fetchViaProxy(`https://namemc.com/skins/trending?page=${page}`);
  const names = [...html.matchAll(/data-player-name="([^"]+)"/g)].map(m => m[1]);
  return [...new Set(names)].filter(n => isValidNick(n)).slice(0, 60);
}

async function fetchNamemcSearch(query) {
  const html = await fetchViaProxy(`https://namemc.com/search?q=${encodeURIComponent(query)}`);
  const matches = [...html.matchAll(/data-player-name="([^"]+)"/g)].map(m => m[1]);
  const uniq = [...new Set(matches)].filter(n => isValidNick(n));
  return uniq.length ? uniq : [query];
}

/* ============================================================
   РЕДАКТОР СКИНОВ — 3D РИСОВАНИЕ + РАЗДЕЛЕНИЕ СЛОЁВ
   ============================================================ */
const SKIN_SIZE = 64;
const SKIN_PIXEL = 8;

let editorState = null;

function makeSkinCanvas() {
  const c = document.createElement('canvas');
  c.width = SKIN_SIZE;
  c.height = SKIN_SIZE;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  return { canvas: c, ctx: x };
}

async function openEditor(skinName) {
  editorActive = true;

              <button class="editor-tool" data-tool="picker" title="Пипетка">🎯</button>
            </div>
          </div>
          <div class="editor-section">

              </button>
            </div>
            <p style="color:var(--tdim);font-size:.75rem;margin-top:.5rem;line-height:1.4">
              Базовый — тело. Оверлей — шапка и куртка поверх тела.
            </p>
          </div>
          <div class="editor-section">
            <div class="editor-section-title">История</div>
            <div class="editor-action-row">
              <button class="btn btn-secondary" id="ed-undo">↶ Отмена</button>
              <button class="btn btn-secondary" id="ed-redo">↷ Повтор</button>
            </div>
          </div>
          <div class="editor-section">
            <div class="editor-section-title">Файл</div>
            <div class="editor-action-row" style="flex-direction:column">
              <button class="btn btn-secondary" id="ed-upload">📁 Загрузить PNG</button>
              <button class="btn btn-secondary" id="ed-blank">⬜ Чистое тело</button>
              <button class="btn btn-secondary" id="ed-steve">👕 Steve</button>
            </div>
          </div>
        </div>
      </div>
      <input type="file" id="ed-file" accept="image/png" hidden>
    </div>`;

  // Два независимых буфера
  const base = makeSkinCanvas();
  const overlay = makeSkinCanvas();

  editorState = {
    baseCanvas: base.canvas,
    baseCtx: base.ctx,
    overlayCanvas: overlay.canvas,
    overlayCtx: overlay.ctx,
    activeLayer: 'base',
    tool: 'pencil',
    color: '#38BDF8',
    drawing: false,
    lastPx: null,
    lastPy: null,
    history: [],
    historyIdx: -1,
    viewer: null,
    flatCanvas: null,
    flatCtx: null,
    refreshTimer: null
  };

  // Палитра
  const palette = [
    '#000000', '#3F3F3F', '#7F7F7F', '#BFBFBF', '#FFFFFF',
    '#7F0000', '#FF0000', '#FF7F00', '#FFBF00', '#FFFF00',
    '#007F00', '#00FF00', '#00FF7F', '#00FFFF', '#007FFF',
    '#0000FF', '#7F00FF', '#FF00FF', '#FF007F', '#7F3F00',
    '#D2B48C', '#8B4513', '#F5DEB3', '#FFE4B5', '#FFD700',
    '#38BDF8', '#6EE7B7', '#A78BFA', '#F472B6', '#FB923C',
    '#1E3A5F', '#0F131C', '#161D2B', '#1E2636', '#05070C',
    '#10B981', '#EF4444', '#F59E0B', '#8B5CF6', '#EC4899'
  ];
  const palEl = $('ed-palette');
  palette.forEach(c => {
    const b = document.createElement('button');
    b.style.background = c;
    b.type = 'button';
    b.setAttribute('aria-label', 'Color ' + c);
    b.addEventListener('click', () => {
      setColor(c);
      palEl.querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
    palEl.appendChild(b);
  });

  function setColor(c) {
    editorState.color = c;
    $('ed-color').value = c;
    $('ed-color-label').textContent = c;
  }

  $('ed-color').addEventListener('input', e => {
    setColor(e.target.value);
    palEl.querySelectorAll('button').forEach(x => x.classList.remove('active'));
  });

  $$('[data-tool]').forEach(b => b.addEventListener('click', () => {
    editorState.tool = b.dataset.tool;
    $$('[data-tool]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  }));

  // === 3D VIEWER ===
  const ed3d = $('ed-3d');
  let viewer = null;

  if (typeof skinview3d !== 'undefined' && typeof THREE !== 'undefined') {
    try {
      const skinUrl = skinName ? skinTextureUrl(skinName) : skinTextureUrl('Steve');
      viewer = new skinview3d.SkinViewer({
        canvas: document.createElement('canvas'),
        width: 460,
        height: 520,
        skin: skinUrl,
        background: 'transparent'
      });
      viewer.controls.enableZoom = true;
      viewer.controls.enableRotate = true;
      viewer.controls.enablePan = false;
      viewer.camera.position.z = 70;
      try {
        viewer.renderer.setClearColor(0x000000, 0);
        viewer.renderer.setClearAlpha(0);
      } catch {}
      viewer.canvas.style.background = 'transparent';
      viewer.canvas.style.cursor = 'crosshair';
      ed3d.appendChild(viewer.canvas);
      viewer.renderer.setAnimationLoop(() => {
        viewer.renderer.render(viewer.scene, viewer.camera);
      });
      editorState.viewer = viewer;
    } catch (e) {
      console.warn('editor viewer failed:', e);
      ed3d.innerHTML = '<p style="color:var(--tdim);padding:2rem;text-align:center">3D-превью недоступно. Работай в режиме «Сетка».</p>';
    }
  } else {
    ed3d.innerHTML = '<p style="color:var(--tdim);padding:2rem;text-align:center">3D-превью недоступно. Работай в режиме «Сетка».</p>';
  }

  // === УПРАВЛЕНИЕ СЛОЯМИ на 3D ===
  // Скрываем outer-слой когда рисуем на базовом, чтобы клик попадал правильно
  function setOuterVisible(visible) {
    if (!viewer) return;
    const skin = viewer.playerObject?.skin;
    if (!skin) return;
    const parts = ['head', 'body', 'rightArm', 'leftArm', 'rightLeg', 'leftLeg'];
    parts.forEach(part => {
      const mesh = skin[part];
      if (!mesh) return;
      const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
      // Индекс 1 — outer слой (шапка/куртка)
      for (let i = 1; i < materials.length; i++) {
        if (materials[i]) materials[i].visible = visible;
      }
    });
  }

  function applyLayerVisibility() {
    // Базовый слой редактируем — скрываем outer, чтобы клик не промахивался
    // Оверлей редактируем — оставляем оба видимыми (outer сверху)
    if (editorState.activeLayer === 'base') {
      setOuterVisible(false);
    } else {
      setOuterVisible(true);
    }
  }

  $$('[data-layer]').forEach(b => b.addEventListener('click', () => {
    editorState.activeLayer = b.dataset.layer;
    $$('[data-layer]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    applyLayerVisibility();
    refresh3D();
  }));

  // === 2D FLAT ===
  function initFlatCanvas() {
    const wrap = $('ed-2d');
    wrap.innerHTML = '';
    const cv = document.createElement('canvas');
    cv.width = SKIN_SIZE * SKIN_PIXEL;
    cv.height = SKIN_SIZE * SKIN_PIXEL;
    cv.className = 'editor-flat-canvas';
    const cx = cv.getContext('2d');
    cx.imageSmoothingEnabled = false;
    wrap.appendChild(cv);
    editorState.flatCanvas = cv;
    editorState.flatCtx = cx;
    redrawFlat();

    // Mouse
    cv.addEventListener('mousedown', e => {
      editorState.drawing = true;
      editorState.lastPx = null;
      handleFlatDraw(e.clientX, e.clientY);
    });
    cv.addEventListener('mousemove', e => {
      if (editorState.drawing) handleFlatDraw(e.clientX, e.clientY);
    });
    const stopDraw = () => {
      if (editorState.drawing) {
        editorState.drawing = false;
        editorState.lastPx = null;
        pushHistory();
        schedule3DRefresh();
      }
    };
    cv.addEventListener('mouseup', stopDraw);
    cv.addEventListener('mouseleave', stopDraw);

    // Touch
    cv.addEventListener('touchstart', e => {
      e.preventDefault();
      editorState.drawing = true;
      editorState.lastPx = null;
      const t = e.touches[0];
      handleFlatDraw(t.clientX, t.clientY);
    }, { passive: false });
    cv.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!editorState.drawing) return;
      const t = e.touches[0];
      handleFlatDraw(t.clientX, t.clientY);
    }, { passive: false });
    cv.addEventListener('touchend', stopDraw);
    cv.addEventListener('touchcancel', stopDraw);
  }

  function drawCheckerboard(ctx, w, h, size) {
    for (let y = 0; y < h; y += size) {
      for (let x = 0; x < w; x += size) {
        ctx.fillStyle = ((x / size + y / size) % 2 === 0) ? '#1a1f2b' : '#252b38';
        ctx.fillRect(x, y, size, size);
      }
    }
  }

  function redrawFlat() {
    const cv = editorState.flatCanvas;
    const cx = editorState.flatCtx;
    if (!cv || !cx) return;
    cx.clearRect(0, 0, cv.width, cv.height);
    drawCheckerboard(cx, cv.width, cv.height, 8);
    cx.drawImage(editorState.baseCanvas, 0, 0, cv.width, cv.height);
    cx.globalAlpha = 0.75;
    cx.drawImage(editorState.overlayCanvas, 0, 0, cv.width, cv.height);
    cx.globalAlpha = 1;
  }

  function handleFlatDraw(clientX, clientY) {
    const cv = editorState.flatCanvas;
    if (!cv) return;
    const r = cv.getBoundingClientRect();
    const px = Math.floor((clientX - r.left) * (SKIN_SIZE / r.width));
    const py = Math.floor((clientY - r.top) * (SKIN_SIZE / r.height));
    if (px < 0 || py < 0 || px >= SKIN_SIZE || py >= SKIN_SIZE) return;

    if (editorState.lastPx !== null && editorState.lastPy !== null) {
      bresenham(editorState.lastPx, editorState.lastPy, px, py);
    } else {
      paintPx(px, py);
    }
    editorState.lastPx = px;
    editorState.lastPy = py;
    redrawFlat();
    schedule3DRefresh();
  }

  // === ЯДРО РИСОВАНИЯ ===
  function bresenham(x0, y0, x1, y1) {
    const dx = Math.abs(x1 - x0);
    const dy = Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1;
    const sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;
    let x = x0, y = y0;
    let safety = 0;
    while (safety++ < 200) {
      paintPx(x, y);
      if (x === x1 && y === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x += sx; }
      if (e2 < dx) { err += dx; y += sy; }
    }
  }

  function paintPx(px, py) {
    const isBase = editorState.activeLayer === 'base';
    const ctx = isBase ? editorState.baseCtx : editorState.overlayCtx;

    if (editorState.tool === 'fill') {
      floodFill(ctx, px, py, editorState.color);
      return;
    }
    if (editorState.tool === 'picker') {
      const d = ctx.getImageData(px, py, 1, 1).data;
      if (d[3] > 0) {
        setColor('#' + [d[0], d[1], d[2]]
          .map(v => v.toString(16).padStart(2, '0')).join(''));
      }
      return;
    }
    if (editorState.tool === 'eraser') {
      ctx.clearRect(px, py, 1, 1);
    } else {
      ctx.fillStyle = editorState.color;
      ctx.fillRect(px, py, 1, 1);
    }
  }

  function floodFill(ctx, sx, sy, color) {
    const img = ctx.getImageData(0, 0, SKIN_SIZE, SKIN_SIZE);
    const d = img.data;
    const idx = (sy * SKIN_SIZE + sx) * 4;
    const tgt = [d[idx], d[idx + 1], d[idx + 2], d[idx + 3]];
    const fill = [
      parseInt(color.slice(1, 3), 16),
      parseInt(color.slice(3, 5), 16),
      parseInt(color.slice(5, 7), 16),
      255
    ];
    if (tgt[0] === fill[0] && tgt[1] === fill[1] && tgt[2] === fill[2] && tgt[3] === fill[3]) return;

    const stack = [[sx, sy]];
    const visited = new Set();
    while (stack.length) {
      const [x, y] = stack.pop();
      if (x < 0 || y < 0 || x >= SKIN_SIZE || y >= SKIN_SIZE) continue;
      const k = x + ',' + y;
      if (visited.has(k)) continue;
      visited.add(k);
      const i = (y * SKIN_SIZE + x) * 4;
      if (d[i] !== tgt[0] || d[i + 1] !== tgt[1] ||
          d[i + 2] !== tgt[2] || d[i + 3] !== tgt[3]) continue;
      d[i] = fill[0]; d[i + 1] = fill[1]; d[i + 2] = fill[2]; d[i + 3] = fill[3];
      stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
    }
    ctx.putImageData(img, 0, 0);
  }

  // === 3D РИСОВАНИЕ через UV raycasting ===
  let raycaster = null;
  let mouseVec = null;
  if (typeof THREE !== 'undefined') {
    raycaster = new THREE.Raycaster();
    mouseVec = new THREE.Vector2();
  }

  function handle3DDraw(e) {
    if (!viewer || !raycaster || !mouseVec) return;
    const canvas = viewer.canvas;
    const rect = canvas.getBoundingClientRect();
    mouseVec.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouseVec.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseVec, viewer.camera);
    const hits = raycaster.intersectObject(viewer.playerObject, true);
    if (!hits.length) {
      editorState.lastPx = null;
      return;
    }
    const hit = hits[0];
    if (!hit.uv) {
      editorState.lastPx = null;
      return;
    }
    // UV (0..1) → пиксель (0..63)
    let px = Math.floor(hit.uv.x * SKIN_SIZE);
    let py = Math.floor((1 - hit.uv.y) * SKIN_SIZE);
    if (px < 0) px = 0;
    if (px >= SKIN_SIZE) px = SKIN_SIZE - 1;
    if (py < 0) py = 0;
    if (py >= SKIN_SIZE) py = SKIN_SIZE - 1;

    if (editorState.lastPx !== null && editorState.lastPy !== null) {
      bresenham(editorState.lastPx, editorState.lastPy, px, py);
    } else {
      paintPx(px, py);
    }
    editorState.lastPx = px;
    editorState.lastPy = py;
    schedule3DRefresh();
  }

  if (viewer && raycaster) {
    viewer.canvas.addEventListener('mousedown', e => {
      editorState.drawing = true;
      editorState.lastPx = null;
      handle3DDraw(e);
    });
    viewer.canvas.addEventListener('mousemove', e => {
      if (editorState.drawing) handle3DDraw(e);
    });
    const stop3D = () => {
      if (editorState.drawing) {
        editorState.drawing = false;
        editorState.lastPx = null;
        pushHistory();
        schedule3DRefresh();
      }
    };
    viewer.canvas.addEventListener('mouseup', stop3D);
    viewer.canvas.addEventListener('mouseleave', stop3D);

    viewer.canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      editorState.drawing = true;
      editorState.lastPx = null;
      const t = e.touches[0];
      handle3DDraw(t);
    }, { passive: false });
    viewer.canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!editorState.drawing) return;
      const t = e.touches[0];
      handle3DDraw(t);
    }, { passive: false });
    viewer.canvas.addEventListener('touchend', stop3D);
  }

  // === ОБНОВЛЕНИЕ 3D ===
  function schedule3DRefresh() {
    if (editorState.refreshTimer) return;
    editorState.refreshTimer = setTimeout(() => {
      editorState.refreshTimer = null;
      refresh3D();
    }, 120);
  }

  function refresh3D() {
    if (!editorState.viewer) return;
    const merged = document.createElement('canvas');
    merged.width = SKIN_SIZE;
    merged.height = SKIN_SIZE;
    const mx = merged.getContext('2d');
    mx.imageSmoothingEnabled = false;
    mx.drawImage(editorState.baseCanvas, 0, 0);
    mx.drawImage(editorState.overlayCanvas, 0, 0);
    const dataUrl = merged.toDataURL('image/png');
    try {
      editorState.viewer.loadSkin(dataUrl).catch(() => {});
    } catch {}
  }

  // === ЗАГРУЗКА СТАРТОВОГО СКИНА ===
  async function loadStarterSkin(url) {
    return new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        editorState.baseCtx.clearRect(0, 0, SKIN_SIZE, SKIN_SIZE);
        editorState.overlayCtx.clearRect(0, 0, SKIN_SIZE, SKIN_SIZE);
        editorState.baseCtx.drawImage(img, 0, 0, SKIN_SIZE, SKIN_SIZE);
        pushHistory();
        redrawFlat();
        refresh3D();
        resolve();
      };
      img.onerror = () => {
        pushHistory();
        redrawFlat();
        refresh3D();
        resolve();
      };
      img.src = url;
    });
  }

  // === ИСТОРИЯ ===
  function pushHistory() {
    try {
      const snap = {
        base: editorState.baseCtx.getImageData(0, 0, SKIN_SIZE, SKIN_SIZE),
        overlay: editorState.overlayCtx.getImageData(0, 0, SKIN_SIZE, SKIN_SIZE)
      };
      editorState.history = editorState.history.slice(0, editorState.historyIdx + 1);
      editorState.history.push(snap);
      editorState.historyIdx++;
      if (editorState.history.length > 20) {
        editorState.history.shift();
        editorState.historyIdx--;
      }
    } catch (e) {
      console.warn('history push failed:', e);
    }
  }

  function restoreFromSnapshot(snap) {
    try {
      editorState.baseCtx.putImageData(snap.base, 0, 0);
      editorState.overlayCtx.putImageData(snap.overlay, 0, 0);
      redrawFlat();
      refresh3D();
    } catch (e) {
      console.warn('restore failed:', e);
    }
  }

  $('ed-undo').addEventListener('click', () => {
    if (editorState.historyIdx <= 0) return;
    editorState.historyIdx--;
    restoreFromSnapshot(editorState.history[editorState.historyIdx]);
  });
  $('ed-redo').addEventListener('click', () => {
    if (editorState.historyIdx >= editorState.history.length - 1) return;
    editorState.historyIdx++;
    restoreFromSnapshot(editorState.history[editorState.historyIdx]);
  });

  // === СОХРАНЕНИЕ ===
  $('ed-save').addEventListener('click', () => {
    const merged = document.createElement('canvas');
    merged.width = SKIN_SIZE;
    merged.height = SKIN_SIZE;
    const mx = merged.getContext('2d');
    mx.imageSmoothingEnabled = false;
    mx.drawImage(editorState.baseCanvas, 0, 0);
    mx.drawImage(editorState.overlayCanvas, 0, 0);
    const a = document.createElement('a');
    a.download = 'my-skin.png';
    a.href = merged.toDataURL('image/png');
    a.click();
    toast('Скин скачан', 'ok');
  });

  // === ЗАГРУЗКА ===
  $('ed-upload').addEventListener('click', () => $('ed-file').click());
  $('ed-file').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    await loadStarterSkin(url);
    URL.revokeObjectURL(url);
    toast('Загружен', 'ok');
  });

  $('ed-blank').addEventListener('click', () => {
    editorState.baseCtx.clearRect(0, 0, SKIN_SIZE, SKIN_SIZE);
    editorState.overlayCtx.clearRect(0, 0, SKIN_SIZE, SKIN_SIZE);
    pushHistory();
    redrawFlat();
    refresh3D();
    toast('Чистое тело', 'info');
  });

  $('ed-steve').addEventListener('click', async () => {
    await loadStarterSkin(skinTextureUrl('Steve'));
    toast('Steve загружен', 'ok');
  });

  // === ПЕРЕКЛЮЧЕНИЕ 2D/3D ===
  $$('[data-mode]').forEach(b => b.addEventListener('click', () => {
    const mode = b.dataset.mode;
    $$('[data-mode]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    $('ed-3d').style.display = mode === '3d' ? 'flex' : 'none';
    $('ed-2d').style.display = mode === '2d' ? 'flex' : 'none';
    $('ed-hint').textContent = mode === '3d'
      ? 'Рисуй прямо на 3D-модели. Клик по руке красит пиксель руки.'
      : 'Рисуй на сетке 64×64 — плоская развёртка скина.';
    if (mode === '2d') {
      if (!editorState.flatCanvas) initFlatCanvas();
      else redrawFlat();
    } else {
      refresh3D();
    }
  }));

  $('ed-close').addEventListener('click', () => {
    if (editorState?.refreshTimer) clearTimeout(editorState.refreshTimer);
    if (editorState?.viewer) {
      try {
        editorState.viewer.renderer.setAnimationLoop(null);
        editorState.viewer.dispose();
      } catch {}
    }
    editorState = null;
    editorActive = false;
    $$('.tab').forEach(t => {
      if (t.classList.contains('active')) t.click();
    });
  });

  // Инициализация
  initFlatCanvas();
  await loadStarterSkin(skinName ? skinTextureUrl(skinName) : skinTextureUrl('Steve'));
  applyLayerVisibility();
}

/* ============================================================
   РЕДАКТОР РЕСУРСПАКОВ
   ============================================================ */
let packEditorState = null;

function openPackEditor() {
  editorActive = true;
  $('searchContainer').classList.add('hidden');
  sentinel.classList.add('hidden');

  $('content').innerHTML = `
    <div class="editor-wrap">
      <div class="editor-header">
        <h2>📦 Редактор ресурспаков</h2>
        <div class="editor-header-actions">
          <button class="btn" id="rp-save" disabled>💾 Скачать ZIP</button>
          <button class="btn btn-secondary" id="rp-close">← К списку</button>
        </div>
      </div>
      <p style="color:var(--tdim);margin-bottom:1.5rem;font-size:.9rem">
        Загрузи .zip ресурспака, посмотри содержимое, замени текстуры, скачай обратно. Всё работает в браузере — файлы никуда не отправляются.
      </p>
      <div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1.5rem">
        <button class="btn" id="rp-upload">📁 Загрузить .zip</button>
        <button class="btn btn-secondary" id="rp-new-pack">🆕 Создать с нуля</button>
      </div>
      <input type="file" id="rp-file" accept=".zip,application/zip" hidden>
      <input type="file" id="rp-imgfile" accept="image/png" hidden>
      <div class="editor-layout">
        <div>
          <div class="editor-section-title">Файлы в паке</div>
          <div class="rp-file-list" id="rp-file-list">
            <p style="color:var(--tdim);text-align:center;padding:2rem">Пак не загружен</p>
          </div>
        </div>
        <div>
          <div class="editor-section-title">Предпросмотр</div>
          <div class="rp-preview-area" id="rp-preview">
            <p style="color:var(--tdim)">Выбери файл слева</p>
          </div>
          <div style="margin-top:.75rem">
            <button class="btn btn-secondary" id="rp-replace" disabled>✏️ Заменить выбранную текстуру</button>
          </div>
        </div>
      </div>
    </div>`;

  packEditorState = { zip: null, selectedPath: null };

  $('rp-upload').addEventListener('click', () => $('rp-file').click());
  $('rp-file').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    if (typeof JSZip === 'undefined') {
      toast('JSZip не загрузился', 'error');
      return;
    }
    try {
      const zip = await JSZip.loadAsync(file);
      packEditorState.zip = zip;
      const names = Object.keys(zip.files).filter(p => !zip.files[p].dir).sort();
      renderPackFiles(names);
      $('rp-save').disabled = false;
      toast('Пак загружен: ' + file.name, 'ok');
    } catch (err) {
      toast('Ошибка: ' + err.message, 'error');
    }
  });

  $('rp-new-pack').addEventListener('click', () => {
    packEditorState.zip = new JSZip();
    packEditorState.zip.file('pack.mcmeta', JSON.stringify({
      pack: { pack_format: 15, description: 'My Resource Pack' }
    }, null, 2));
    renderPackFiles(['pack.mcmeta']);
    $('rp-save').disabled = false;
    toast('Новый пак создан', 'ok');
  });

  $('rp-save').addEventListener('click', async () => {
    if (!packEditorState.zip) return;
    const blob = await packEditorState.zip.generateAsync({
      type: 'blob',
      compression: 'DEFLATE'
    });
    const a = document.createElement('a');
    a.download = 'my-resource-pack.zip';
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Пак скачан', 'ok');
  });

  $('rp-close').addEventListener('click', () => {
    editorActive = false;
    packEditorState = null;
    $$('.tab').forEach(t => {
      if (t.classList.contains('active')) t.click();
    });
  });

  $('rp-replace').addEventListener('click', () => {
    if (!packEditorState.selectedPath) {
      toast('Сначала выбери файл', 'error');
      return;
    }
    $('rp-imgfile').click();
  });

  $('rp-imgfile').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file || !packEditorState.selectedPath) return;
    try {
      packEditorState.zip.file(packEditorState.selectedPath, file);
      const buf = await file.arrayBuffer();
      showPackPreview(buf, packEditorState.selectedPath);
      toast('Файл заменён: ' + packEditorState.selectedPath, 'ok');
    } catch (err) {
      toast('Ошибка: ' + err.message, 'error');
    }
  });
}

function renderPackFiles(names) {
  const list = $('rp-file-list');
  if (!names.length) {
    list.innerHTML = '<p style="color:var(--tdim);text-align:center;padding:2rem">Пусто</p>';
    return;
  }
  list.innerHTML = names.map(f =>
    `<div class="file-item" data-path="${esc(f)}">${esc(f)}</div>`
  ).join('');
  list.querySelectorAll('.file-item').forEach(el => {
    el.addEventListener('click', async () => {
      const path = el.dataset.path;
      packEditorState.selectedPath = path;
      list.querySelectorAll('.file-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      $('rp-replace').disabled = false;
      try {
        const buf = await packEditorState.zip.file(path).async('arraybuffer');
        showPackPreview(buf, path);
      } catch {
        $('rp-preview').innerHTML = '<p style="color:var(--error)">Не удалось прочитать файл</p>';
      }
    });
  });
}

function showPackPreview(arrayBuffer, path) {
  const ext = path.split('.').pop().toLowerCase();
  const prev = $('rp-preview');
  if (!['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) {
    let text;
    try {
      text = new TextDecoder().decode(arrayBuffer).slice(0, 3000);
    } catch {
      text = '[бинарный файл]';
    }
    prev.innerHTML = `<pre>${esc(text)}</pre>`;
    return;
  }
  const blob = new Blob([arrayBuffer], { type: 'image/' + ext });
  const url = URL.createObjectURL(blob);
  prev.innerHTML = `<img src="${url}" alt="preview"><p style="color:var(--tdim);font-size:.8rem">${esc(path)}</p>`;
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
try {
  initThemes();
} catch (e) {
  console.error('initThemes failed:', e);
}

io.observe(sentinel);
resetAndLoad();
</script>
</body>
</html>
