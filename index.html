<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: data:; connect-src https:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Minecraft Hub — Моды, Модпаки, Ресурспаки, Шейдеры, Скины</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--s0:#05070C;--s2:#0F131C;--s3:#161D2B;--s4:#1E2636;--accent:#38BDF8;--dim:#1E3A5F;--text:#E8EDF4;--tdim:#9CA3AF;--error:#EF4444;--r:999px;--rl:1.5rem}
body{background:var(--s0);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;line-height:1.6;min-height:100vh}
body.lock{overflow:hidden}
.container{max-width:1400px;margin:0 auto;padding:2rem}
header{margin-bottom:2rem;text-align:center}
h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:700;letter-spacing:-.02em;margin-bottom:1rem;background:linear-gradient(135deg,var(--accent),#6EE7B7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{color:var(--tdim);font-size:1.1rem}
.tabs{display:flex;gap:.75rem;margin-bottom:2rem;justify-content:center;flex-wrap:wrap}
.tab,.page-btn{background:var(--s2);color:var(--tdim);padding:.75rem 1.5rem;border:none;border-radius:var(--r);font-weight:600;cursor:pointer;font-size:1rem;transition:all .2s;white-space:nowrap}
.tab:hover,.page-btn:hover{background:var(--s3);color:var(--text)}
.tab.active,.page-btn.active{background:var(--accent);color:var(--s0)}
.search-container{background:var(--s2);padding:2rem;border-radius:var(--rl);margin-bottom:2rem}
.search-row{display:flex;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.search-input,.filter-select{background:var(--s3);border:2px solid transparent;color:var(--text);padding:.75rem 1.25rem;border-radius:var(--r);font-size:1rem}
.search-input{flex:1;min-width:250px}
.filter-select{padding:.5rem 1rem;cursor:pointer}
.search-input:focus,.filter-select:focus{outline:none;border-color:var(--accent)}
.filters{display:flex;gap:1rem;flex-wrap:wrap}
.hidden{display:none!important}
.btn,.search-btn,.load-more-btn{background:var(--accent);color:var(--s0);padding:.75rem 2rem;border:none;border-radius:var(--r);font-weight:600;cursor:pointer;font-size:1rem;transition:background .2s,transform .1s;text-align:center}
.btn{width:100%;display:inline-block}
.btn:hover,.search-btn:hover,.load-more-btn:hover{background:#22A9E0;transform:scale(1.02)}
.load-more-btn{width:100%;max-width:400px;margin:2rem auto;display:block}
.load-more-btn:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:var(--s3);color:var(--text)}
.btn-secondary:hover{background:var(--s4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;margin-bottom:2rem}
.card{background:var(--s2);border-radius:var(--rl);overflow:hidden;transition:transform .2s,box-shadow .2s;cursor:pointer;display:flex;flex-direction:column}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 8px 24px rgba(56,189,248,.15);outline:none}
.card-image{width:100%;height:160px;object-fit:cover;background:var(--s4)}
.card-image.skin{object-fit:contain;padding:.5rem}
.card-content{padding:1.5rem;flex:1;display:flex;flex-direction:column}
.card-title{font-size:1.15rem;font-weight:600;margin-bottom:.75rem;line-height:1.3;word-break:break-word}
.card-description{color:var(--tdim);font-size:.9rem;margin-bottom:1rem;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;background:var(--dim);color:var(--accent);padding:.25rem .75rem;border-radius:var(--r);font-size:.85rem;font-weight:500;margin-bottom:1rem;align-self:flex-start}
.card-stats{display:flex;justify-content:space-between;gap:.5rem;color:var(--tdim);font-size:.85rem}
.modal{display:none;position:fixed;inset:0;background:rgba(5,7,12,.95);backdrop-filter:blur(8px);z-index:1000;overflow-y:auto}
.modal.active{display:flex;align-items:center;justify-content:center;padding:2rem}
.modal-content{background:var(--s2);border-radius:var(--rl);max-width:900px;width:100%;max-height:90vh;overflow-y:auto}
.modal-header{padding:2rem;border-bottom:1px solid var(--s3);display:flex;justify-content:space-between;gap:1rem}
.modal-title{font-size:1.75rem;font-weight:700;line-height:1.3;word-break:break-word}
.modal-close{background:none;border:none;color:var(--tdim);font-size:2rem;cursor:pointer;width:40px;height:40px;border-radius:50%;flex-shrink:0}
.modal-close:hover{background:var(--s3);color:var(--text)}
.modal-body{padding:2rem}
.modal-image{width:100%;height:300px;object-fit:cover;border-radius:var(--rl);margin-bottom:1.5rem;background:var(--s4)}
.modal-image.skin{object-fit:contain}
.modal-description{color:var(--tdim);line-height:1.7;margin-bottom:1.5rem;white-space:pre-line}
.modal-info{margin-bottom:2rem}
.info-row{display:flex;justify-content:space-between;padding:.75rem 0;border-bottom:1px solid var(--s3)}
.info-label{color:var(--tdim)}
.info-value{font-weight:600;text-align:right}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.loading,.error{text-align:center;padding:2rem;font-size:1.1rem}
.loading{color:var(--tdim)}
.error{color:var(--error);background:var(--s2);border-radius:var(--rl)}
.pagination{display:flex;justify-content:center;align-items:center;gap:.75rem;margin-top:2rem}
.page-btn:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:768px){.container{padding:1rem}.tabs{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}.search-row{flex-direction:column}.modal-actions{grid-template-columns:1fr}.grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Minecraft Hub</h1>
    <p class="subtitle">Все для Minecraft в одном месте</p>
  </header>
  <div class="tabs">
    <button class="tab active" data-tab="mods">Моды</button>
    <button class="tab" data-tab="modpacks">Модпаки</button>
    <button class="tab" data-tab="resourcepacks">Ресурспаки</button>
    <button class="tab" data-tab="shaders">Шейдеры</button>
    <button class="tab" data-tab="skins">Скины</button>
  </div>
  <div class="search-container">
    <div class="search-row">
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск..." maxlength="64" autocomplete="off">
      <button class="search-btn" id="searchBtn">Искать</button>
    </div>
    <div class="filters" id="filters">
      <select class="filter-select" id="sortSelect" aria-label="Сортировка">
        <option value="relevance">По релевантности</option>
        <option value="downloads">По загрузкам</option>
        <option value="updated">По обновлению</option>
        <option value="newest">Новые</option>
      </select>
    </div>
  </div>
  <div id="content"><div class="loading">Загрузка...</div></div>
</div>

<div class="modal" id="detailModal" role="dialog" aria-modal="true">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Детали</h2>
      <button class="modal-close" id="modalClose" aria-label="Закрыть">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
'use strict';
const WORKER_URL = 'https://minecraft-proxy.zxcdedinside944.workers.dev';
const LIMIT = 20;
const SKIN_LIMIT = 40;
const NO_IMG = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#1E2636"/><text x="150" y="155" fill="#9CA3AF" font-size="20" text-anchor="middle" font-family="sans-serif">Нет фото</text></svg>');
const SKIN_NAMES = ['Notch','jeb_','Dinnerbone','Technoblade','Dream','GeorgeNotFound','Sapnap','TommyInnit','Tubbo_','Ph1LzA','Grian','MumboJumbo','Skeppy','BadBoyHalo','CaptainSparklez','Dantdm','xQc','Pokimane','Ninja','Shroud','Valkyrae','Sykkuno','Corpse_Husband','Ranboo','Wilbur','Fundy','Niki','Quackity','Karl','Punz','Awesamdude','Eret','Foolish','Hannahxxrose','Antfrost','Puffy','Ponk','Callahan','Alyssa','ConnorEatsPants'];

const tabConfig = {
  mods:          {type: 'mod',          cf: '6'},
  modpacks:      {type: 'modpack',      cf: '4471'},
  resourcepacks: {type: 'resourcepack', cf: '12'},
  shaders:       {type: 'shader',       cf: '6552'}
};
const CF_SORT = {relevance: 2, downloads: 6, updated: 3, newest: 11};

let currentTab = 'mods', currentPage = 0, currentQuery = '', items = [], reqId = 0, lastSearch = 0;
let skinOffset = 0, allSkins = [], isLoadingSkins = false;
const $ = id => document.getElementById(id);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeUrl(u) {
  try { const x = new URL(u); return x.protocol === 'https:' ? x.href : ''; } catch { return ''; }
}
const safeId = v => /^[\w-]{1,64}$/.test(String(v)) ? String(v) : '';
const isValidNick = n => /^\w{3,16}$/.test(n);

const trCache = new Map();
try { Object.entries(JSON.parse(localStorage.getItem('trCache') || '{}')).forEach(([k, v]) => trCache.set(k, v)); } catch {}
function saveCache() {
  try { localStorage.setItem('trCache', JSON.stringify(Object.fromEntries([...trCache].slice(-300)))); } catch {}
}
const needsTranslation = t => t && t.length > 2 && (t.match(/[а-яё]/gi) || []).length < t.length * 0.2;
async function translate(text) {
  if (!needsTranslation(text)) return text;
  text = text.slice(0, 450);
  if (trCache.has(text)) return trCache.get(text);
  try {
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q=' + encodeURIComponent(text));
    if (!r.ok) throw 0;
    const d = await r.json();
    const out = d[0].map(p => p[0]).join('');
    trCache.set(text, out); saveCache();
    return out;
  } catch { return text; }
}
async function translateAll(token) {
  const els = [...document.querySelectorAll('.card-description[data-orig]')];
  const queue = els.slice();
  const worker = async () => {
    while (queue.length && token === reqId) {
      const el = queue.shift();
      const ru = await translate(el.dataset.orig);
      if (token === reqId) el.textContent = ru;
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
}

document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentTab = tab.dataset.tab; currentPage = 0; currentQuery = ''; skinOffset = 0; allSkins = [];
  $('searchInput').value = '';
  const sk = currentTab === 'skins';
  $('filters').classList.toggle('hidden', sk);
  $('searchInput').placeholder = sk ? 'Ник игрока (3–16 символов: буквы, цифры, _)' : 'Поиск...';
  loadContent();
}));
$('searchBtn').addEventListener('click', performSearch);
$('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') performSearch(); });
$('sortSelect').addEventListener('change', () => { currentPage = 0; loadContent(); });

function performSearch() {
  const now = Date.now();
  if (now - lastSearch < 600) return;
  lastSearch = now;
  currentQuery = $('searchInput').value.trim().slice(0, 64);
  currentPage = 0; skinOffset = 0; allSkins = [];
  loadContent();
}

async function loadContent() {
  const token = ++reqId;
  if (currentTab === 'skins' && skinOffset === 0) {
    $('content').innerHTML = '<div class="loading">Загрузка...</div>';
  }
  try {
    if (currentTab === 'skins') {
      await loadMoreSkins(token);
    } else {
      const list = await loadModsContent(token);
      if (token !== reqId) return;
      items = list.items;
      renderCards(list, token);
    }
  } catch (e) {
    if (token === reqId) $('content').innerHTML = `<div class="error">${esc(e.message || 'Ошибка загрузки')}</div>`;
  }
}

async function getJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function loadModsContent() {
  const cfg = tabConfig[currentTab], sort = $('sortSelect').value, offset = currentPage * LIMIT;
  const q = encodeURIComponent(currentQuery);
  const mrUrl = `${WORKER_URL}/modrinth/search?query=${q}&facets=${encodeURIComponent('["project_type:' + cfg.type + '"]')}&limit=${LIMIT}&offset=${offset}&index=${sort}`;
  
  const mrPromise = getJson(mrUrl).then(d => ({
    source: 'modrinth',
    items: (d.hits || []).map(h => ({
      source: 'modrinth', id: h.project_id, slug: h.slug, title: h.title,
      description: h.description || '', icon: safeUrl(h.icon_url) || NO_IMG,
      downloads: h.downloads || 0, author: h.author || '?',
      updated: h.date_modified ? new Date(h.date_modified).toLocaleDateString('ru') : '?'
    }))
  })).catch(() => ({source: 'modrinth', items: []}));

  const cfUrl = `${WORKER_URL}/curseforge/search?query=${q}&category=${cfg.cf}&pageSize=${LIMIT}&index=${offset}&sortField=${CF_SORT[sort] || 2}`;
  const cfPromise = getJson(cfUrl).then(d => ({
    source: 'curseforge',
    items: (d.data || []).map(m => ({
      source: 'curseforge', id: m.id, slug: m.slug, title: m.name,
      description: m.summary || '', icon: safeUrl(m.logo?.url) || NO_IMG,
      downloads: m.downloadCount || 0, author: m.authors?.[0]?.name || '?',
      updated: m.dateModified ? new Date(m.dateModified).toLocaleDateString('ru') : '?'
    }))
  })).catch(() => ({source: 'curseforge', items: []}));

  const [mr, cf] = await Promise.all([mrPromise, cfPromise]);
  const combined = [...mr.items, ...cf.items].sort((a, b) => {
    if (sort === 'downloads') return b.downloads - a.downloads;
    if (sort === 'updated') return new Date(b.updated) - new Date(a.updated);
    return 0;
  });

  return {items: combined, hasNext: mr.items.length === LIMIT || cf.items.length === LIMIT};
}

async function loadMoreSkins(token) {
  if (isLoadingSkins) return;
  isLoadingSkins = true;
  
  try {
    const names = currentQuery && isValidNick(currentQuery) 
      ? [currentQuery] 
      : SKIN_NAMES.slice(skinOffset, skinOffset + SKIN_LIMIT);
    
    if (names.length === 0) {
      if (skinOffset === 0) {
        $('content').innerHTML = '<div class="error">Нет доступных скинов</div>';
      }
      isLoadingSkins = false;
      return;
    }

    const newSkins = await Promise.all(names.map(async n => {
      try {
        const u = await getJson(`https://api.mojang.com/users/profiles/minecraft/${n}`);
        if (!u?.id) return null;
        return {
          id: u.id, name: u.name,
          head: `https://mc-heads.net/avatar/${u.id}/128`,
          body: `https://mc-heads.net/body/${u.id}/128`,
          full: `https://mc-heads.net/player/${u.id}/256`
        };
      } catch { return null; }
    }));

    const validSkins = newSkins.filter(s => s);
    allSkins.push(...validSkins);
    skinOffset += SKIN_LIMIT;

    if (token !== reqId) return;

    if (allSkins.length === 0 && skinOffset === SKIN_LIMIT) {
      $('content').innerHTML = '<div class="error">Скины не найдены</div>';
    } else {
      renderSkinCards(allSkins, !currentQuery || names.length === SKIN_LIMIT);
    }
  } finally {
    isLoadingSkins = false;
  }
}

function renderCards(list, token) {
  const grid = list.items.map(item => `
    <div class="card" tabindex="0" data-id="${esc(item.id)}" data-source="${esc(item.source)}">
      <img src="${esc(item.icon)}" alt="${esc(item.title)}" class="card-image" loading="lazy" onerror="this.src='${NO_IMG}'">
      <div class="card-content">
        <div class="tag">${esc(item.source === 'modrinth' ? 'Modrinth' : 'CurseForge')}</div>
        <h3 class="card-title">${esc(item.title)}</h3>
        <p class="card-description" data-orig="${esc(item.description)}">${esc(item.description.slice(0, 150))}</p>
        <div class="card-stats">
          <span>⬇ ${item.downloads.toLocaleString('ru')}</span>
          <span>👤 ${esc(item.author)}</span>
          <span>📅 ${esc(item.updated)}</span>
        </div>
      </div>
    </div>
  `).join('');

  const pagination = list.hasNext ? `
    <div class="pagination">
      <button class="page-btn" id="prevPage" ${currentPage === 0 ? 'disabled' : ''}>← Назад</button>
      <span style="color:var(--tdim)">Страница ${currentPage + 1}</span>
      <button class="page-btn" id="nextPage">Вперёд →</button>
    </div>
  ` : '';

  $('content').innerHTML = `<div class="grid">${grid}</div>${pagination}`;
  
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openDetail(card.dataset.id, card.dataset.source));
    card.addEventListener('keydown', e => { if (e.key === 'Enter') openDetail(card.dataset.id, card.dataset.source); });
  });

  if (list.hasNext) {
    const prev = $('prevPage'), next = $('nextPage');
    if (prev) prev.addEventListener('click', () => { currentPage--; loadContent(); });
    if (next) next.addEventListener('click', () => { currentPage++; loadContent(); });
  }

  translateAll(token);
}

function renderSkinCards(skins, showLoadMore) {
  const grid = skins.map(s => `
    <div class="card" tabindex="0" data-skin="${esc(s.name)}">
      <img src="${esc(s.head)}" alt="${esc(s.name)}" class="card-image skin" loading="lazy">
      <div class="card-content">
        <div class="tag">Скин</div>
        <h3 class="card-title">${esc(s.name)}</h3>
        <p class="card-description">UUID: ${esc(s.id)}</p>
      </div>
    </div>
  `).join('');

  const loadMoreBtn = showLoadMore ? `
    <button class="load-more-btn" id="loadMoreSkins" ${isLoadingSkins ? 'disabled' : ''}>
      ${isLoadingSkins ? 'Загрузка...' : 'Загрузить ещё'}
    </button>
  ` : '';

  $('content').innerHTML = `<div class="grid">${grid}</div>${loadMoreBtn}`;
  
  document.querySelectorAll('.card[data-skin]').forEach(card => {
    const name = card.dataset.skin;
    const skin = skins.find(s => s.name === name);
    card.addEventListener('click', () => openSkinDetail(skin));
    card.addEventListener('keydown', e => { if (e.key === 'Enter') openSkinDetail(skin); });
  });

  const btn = $('loadMoreSkins');
  if (btn) {
    btn.addEventListener('click', () => loadMoreSkins(reqId));
  }
}

// Auto-load при скролле для скинов
let scrollTimeout;
window.addEventListener('scroll', () => {
  if (currentTab !== 'skins' || isLoadingSkins) return;
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => {
    const btn = $('loadMoreSkins');
    if (btn && !btn.disabled) {
      const rect = btn.getBoundingClientRect();
      if (rect.top < window.innerHeight + 200) {
        btn.click();
      }
    }
  }, 100);
});

async function openDetail(id, source) {
  const modal = $('detailModal'), body = $('modalBody');
  modal.classList.add('active');
  document.body.classList.add('lock');
  body.innerHTML = '<div class="loading">Загрузка...</div>';

  try {
    const item = items.find(i => i.id == id && i.source === source);
    if (!item) throw new Error('Элемент не найден');

    let versions = [], downloadUrl = '';
    if (source === 'modrinth') {
      const vData = await getJson(`${WORKER_URL}/modrinth/project/${item.slug}/version`);
      versions = vData.slice(0, 5).map(v => `${v.name} (${v.game_versions?.join(', ') || '?'})`);
      downloadUrl = vData[0]?.id ? `${WORKER_URL}/modrinth/download/${vData[0].id}` : '';
    } else {
      const fData = await getJson(`${WORKER_URL}/curseforge/mod/${id}/files`);
      versions = (fData.data || []).slice(0, 5).map(f => `${f.displayName} (${f.gameVersions?.join(', ') || '?'})`);
      const latestFile = fData.data?.[0];
      downloadUrl = latestFile ? `${WORKER_URL}/curseforge/download/${id}/${latestFile.id}` : '';
    }

    const description = await translate(item.description);
    $('modalTitle').textContent = item.title;
    body.innerHTML = `
      <img src="${esc(item.icon)}" alt="${esc(item.title)}" class="modal-image" onerror="this.src='${NO_IMG}'">
      <p class="modal-description">${esc(description)}</p>
      <div class="modal-info">
        <div class="info-row"><span class="info-label">Источник</span><span class="info-value">${esc(source === 'modrinth' ? 'Modrinth' : 'CurseForge')}</span></div>
        <div class="info-row"><span class="info-label">Автор</span><span class="info-value">${esc(item.author)}</span></div>
        <div class="info-row"><span class="info-label">Загрузок</span><span class="info-value">${item.downloads.toLocaleString('ru')}</span></div>
        <div class="info-row"><span class="info-label">Обновлено</span><span class="info-value">${esc(item.updated)}</span></div>
        ${versions.length ? `<div class="info-row"><span class="info-label">Версии</span><span class="info-value">${esc(versions.join(', '))}</span></div>` : ''}
      </div>
      <div class="modal-actions">
        ${downloadUrl ? `<a href="${esc(downloadUrl)}" class="btn" download>Скачать</a>` : ''}
        <a href="${source === 'modrinth' ? `https://modrinth.com/mod/${item.slug}` : `https://www.curseforge.com/minecraft/mc-mods/${item.slug}`}" target="_blank" rel="noopener" class="btn btn-secondary">Открыть на сайте</a>
      </div>
    `;
  } catch (e) {
    body.innerHTML = `<div class="error">${esc(e.message || 'Ошибка загрузки')}</div>`;
  }
}

function openSkinDetail(skin) {
  const modal = $('detailModal'), body = $('modalBody');
  modal.classList.add('active');
  document.body.classList.add('lock');
  $('modalTitle').textContent = skin.name;
  body.innerHTML = `
    <img src="${esc(skin.full)}" alt="${esc(skin.name)}" class="modal-image skin">
    <div class="modal-info">
      <div class="info-row"><span class="info-label">Ник</span><span class="info-value">${esc(skin.name)}</span></div>
      <div class="info-row"><span class="info-label">UUID</span><span class="info-value">${esc(skin.id)}</span></div>
    </div>
    <div class="modal-actions">
      <a href="${esc(skin.full)}" download="${esc(skin.name)}.png" class="btn">Скачать скин</a>
      <a href="https://namemc.com/profile/${esc(skin.name)}" target="_blank" rel="noopener" class="btn btn-secondary">Открыть на NameMC</a>
    </div>
  `;
}

function closeModal() {
  $('detailModal').classList.remove('active');
  document.body.classList.remove('lock');
}
$('modalClose').addEventListener('click', closeModal);
$('detailModal').addEventListener('click', e => { if (e.target === $('detailModal')) closeModal(); });

loadContent();
</script>
</body>
</html>
