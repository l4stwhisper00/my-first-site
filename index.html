<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Hub — Моды, Модпаки, Ресурспаки, Шейдеры, Скины</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --surface-0: #05070C;
            --surface-1: #0A0D12;
            --surface-2: #0F131C;
            --surface-3: #161D2B;
            --surface-4: #1E2636;
            --accent: #38BDF8;
            --accent-dim: #1E3A5F;
            --text: #E8EDF4;
            --text-dim: #9CA3AF;
            --success: #10B981;
            --error: #EF4444;
            --radius-full: 999px;
            --radius-lg: 1.5rem;
            --spacing-xs: 0.5rem;
            --spacing-sm: 0.75rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        }

        body {
            background: var(--surface-0);
            color: var(--text);
            font-family: var(--font-body);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--spacing-xl);
        }

        header {
            margin-bottom: var(--spacing-xl);
            text-align: center;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: var(--spacing-md);
            background: linear-gradient(135deg, var(--accent), #6EE7B7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        .tabs {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
            overflow-x: auto;
            padding-bottom: var(--spacing-sm);
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab {
            background: var(--surface-2);
            color: var(--text-dim);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab:hover {
            background: var(--surface-3);
            color: var(--text);
        }

        .tab.active {
            background: var(--accent);
            color: var(--surface-0);
        }

        .search-container {
            background: var(--surface-2);
            padding: var(--spacing-xl);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-xl);
        }

        .search-row {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            background: var(--surface-3);
            border: 2px solid transparent;
            color: var(--text);
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-full);
            font-size: 1rem;
            transition: border 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-input::placeholder {
            color: var(--text-dim);
        }

        .search-btn {
            background: var(--accent);
            color: var(--surface-0);
            padding: 0.75rem 2rem;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
        }

        .search-btn:hover {
            background: #22A9E0;
            transform: scale(1.02);
        }

        .search-btn:active {
            transform: scale(0.98);
        }

        .filters {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .filter-select {
            background: var(--surface-3);
            border: 2px solid transparent;
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            cursor: pointer;
            transition: border 0.2s;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .filter-select option {
            background: var(--surface-3);
            color: var(--text);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }

        .card {
            background: var(--surface-2);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.15);
        }

        .card-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: var(--surface-4);
        }

        .card-content {
            padding: var(--spacing-lg);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--text);
            line-height: 1.3;
        }

        .card-description {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: var(--spacing-md);
            line-height: 1.5;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
            margin-bottom: var(--spacing-md);
        }

        .tag {
            background: var(--accent-dim);
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .card-stats {
            display: flex;
            justify-content: space-between;
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: var(--spacing-md);
        }

        .btn {
            background: var(--accent);
            color: var(--surface-0);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #22A9E0;
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: var(--surface-3);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: var(--surface-4);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 12, 0.95);
            backdrop-filter: blur(8px);
            z-index: 1000;
            overflow-y: auto;
            animation: fadeIn 0.2s;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--surface-2);
            border-radius: var(--radius-lg);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: var(--spacing-xl);
            border-bottom: 1px solid var(--surface-3);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--spacing-md);
        }

        .modal-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .modal-close:hover {
            background: var(--surface-3);
            color: var(--text);
        }

        .modal-body {
            padding: var(--spacing-xl);
        }

        .modal-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-lg);
            background: var(--surface-4);
        }

        .modal-description {
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: var(--spacing-lg);
        }

        .modal-info {
            display: grid;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: var(--spacing-sm) 0;
            border-bottom: 1px solid var(--surface-3);
        }

        .info-label {
            color: var(--text-dim);
            font-weight: 500;
        }

        .info-value {
            color: var(--text);
            font-weight: 600;
            text-align: right;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }

        .loading {
            text-align: center;
            color: var(--text-dim);
            padding: var(--spacing-xl);
            font-size: 1.1rem;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }

        .error {
            text-align: center;
            color: var(--error);
            padding: var(--spacing-xl);
            background: var(--surface-2);
            border-radius: var(--radius-lg);
            font-size: 1rem;
        }

        .empty {
            text-align: center;
            color: var(--text-dim);
            padding: var(--spacing-xl) * 2;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .modal-actions {
                grid-template-columns: 1fr;
            }
            
            .search-row {
                flex-direction: column;
            }
            
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⛏️ Minecraft Hub</h1>
            <p class="subtitle">Моды, модпаки, ресурспаки, шейдеры и скины для Minecraft</p>
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="mods">Моды</button>
            <button class="tab" data-tab="modpacks">Модпаки</button>
            <button class="tab" data-tab="resourcepacks">Ресурспаки</button>
            <button class="tab" data-tab="shaders">Шейдеры</button>
            <button class="tab" data-tab="skins">Скины</button>
        </div>

        <div class="search-container" id="searchContainer">
            <div class="search-row">
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск...">
                <button class="search-btn" id="searchBtn">Искать</button>
            </div>
            <div class="filters" id="filters"></div>
        </div>

        <div id="content" class="grid"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle"></h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        // WORKER URL БЕЗ СЛЭША В КОНЦЕ
        const WORKER_URL = 'https://minecraft-proxy.zxcdedinside944.workers.dev';

        let currentTab = 'mods';
        let currentSearch = '';
        let currentFilters = {};

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            setupTabs();
            setupSearch();
            setupModal();
            loadContent();
        });

        // Табы
        function setupTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentTab = tab.dataset.tab;
                    currentSearch = '';
                    currentFilters = {};
                    document.getElementById('searchInput').value = '';
                    updateFilters();
                    loadContent();
                });
            });
        }

        // Поиск
        function setupSearch() {
            const searchBtn = document.getElementById('searchBtn');
            const searchInput = document.getElementById('searchInput');

            searchBtn.addEventListener('click', () => {
                currentSearch = searchInput.value.trim();
                loadContent();
            });

            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    currentSearch = searchInput.value.trim();
                    loadContent();
                }
            });
        }

        // Фильтры
        function updateFilters() {
            const filtersContainer = document.getElementById('filters');
            filtersContainer.innerHTML = '';

            if (currentTab === 'mods' || currentTab === 'modpacks') {
                const versionSelect = document.createElement('select');
                versionSelect.className = 'filter-select';
                versionSelect.innerHTML = `
                    <option value="">Все версии</option>
                    <option value="1.20.1">1.20.1</option>
                    <option value="1.19.4">1.19.4</option>
                    <option value="1.18.2">1.18.2</option>
                    <option value="1.16.5">1.16.5</option>
                    <option value="1.12.2">1.12.2</option>
                `;
                versionSelect.addEventListener('change', (e) => {
                    currentFilters.version = e.target.value;
                    loadContent();
                });
                filtersContainer.appendChild(versionSelect);
            }

            if (currentTab === 'mods') {
                const loaderSelect = document.createElement('select');
                loaderSelect.className = 'filter-select';
                loaderSelect.innerHTML = `
                    <option value="">Все загрузчики</option>
                    <option value="forge">Forge</option>
                    <option value="fabric">Fabric</option>
                    <option value="quilt">Quilt</option>
                `;
                loaderSelect.addEventListener('change', (e) => {
                    currentFilters.loader = e.target.value;
                    loadContent();
                });
                filtersContainer.appendChild(loaderSelect);
            }
        }

        // Загрузка контента
        async function loadContent() {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '<div class="loading">Загрузка</div>';

            try {
                let data;
                switch (currentTab) {
                    case 'mods':
                        data = await loadMods();
                        break;
                    case 'modpacks':
                        data = await loadModpacks();
                        break;
                    case 'resourcepacks':
                        data = await loadResourcepacks();
                        break;
                    case 'shaders':
                        data = await loadShaders();
                        break;
                    case 'skins':
                        data = await loadSkins();
                        break;
                }

                if (!data || data.length === 0) {
                    contentDiv.innerHTML = '<div class="empty">Ничего не найдено</div>';
                    return;
                }

                renderContent(data);
            } catch (error) {
                console.error('Error loading content:', error);
                contentDiv.innerHTML = `<div class="error">Ошибка загрузки: ${error.message}</div>`;
            }
        }

        // Загрузка модов
        async function loadMods() {
            const modrinthPromise = fetch(`${WORKER_URL}/modrinth/search?query=${currentSearch}&facets=["project_type:mod"]&limit=10&offset=0`)
                .then(r => r.ok ? r.json() : null)
                .catch(() => null);

            const curseforgePromise = fetch(`${WORKER_URL}/curseforge/search?query=${currentSearch}&category=6&pageSize=10&index=0`)
                .then(r => r.ok ? r.json() : null)
                .catch(() => null);

            const [modrinthData, curseforgeData] = await Promise.all([modrinthPromise, curseforgePromise]);

            let mods = [];

            if (modrinthData && modrinthData.hits) {
                mods = mods.concat(modrinthData.hits.map(mod => ({
                    id: mod.project_id,
                    title: mod.title,
                    description: mod.description || 'Описание отсутствует',
                    icon: mod.icon_url || 'https://via.placeholder.com/160',
                    downloads: mod.downloads || 0,
                    author: mod.author || 'Неизвестно',
                    categories: mod.categories || [],
                    source: 'modrinth',
                    slug: mod.slug
                })));
            }

            if (curseforgeData && curseforgeData.data) {
                mods = mods.concat(curseforgeData.data.map(mod => ({
                    id: mod.id,
                    title: mod.name,
                    description: mod.summary || 'Описание отсутствует',
                    icon: mod.logo?.url || 'https://via.placeholder.com/160',
                    downloads: mod.downloadCount || 0,
                    author: mod.authors?.[0]?.name || 'Неизвестно',
                    categories: mod.categories?.map(c => c.name) || [],
                    source: 'curseforge',
                    slug: mod.slug
                })));
            }

            return mods;
        }

        // Загрузка модпаков
        async function loadModpacks() {

                .then(r => r.ok ? r.json() : null)

            const curseforgePromise = fetch(`${WORKER_URL}/curseforge/search?query=${currentSearch}&category=4471&pageSize=10&index=0`)

                    icon: pack.icon_url || 'https://via.placeholder.com/160',

                    author: pack.author || 'Неизвестно',
                    categories: pack.categories || [],
                    source: 'modrinth',
                    slug: pack.slug
                })));
            }

            if (curseforgeData && curseforgeData.data) {
                modpacks = modpacks.concat(curseforgeData.data.map(pack => ({
                    id: pack.id,
                    title: pack.name,
                    description: pack.summary || 'Описание отсутствует',
                    icon: pack.logo?.url || 'https://via.placeholder.com/160',
                    downloads: pack.downloadCount || 0,
                    author: pack.authors?.[0]?.name || 'Неизвестно',
                    categories: pack.categories?.map(c => c.name) || [],
                    source: 'curseforge',
                    slug: pack.slug
                })));
            }

            return modpacks;
        }

        // Загрузка ресурспаков
        async function loadResourcepacks() {
            const modrinthPromise = fetch(`${WORKER_URL}/modrinth/search?query=${currentSearch}&facets=["project_type:resourcepack"]&limit=10&offset=0`)
                .then(r => r.ok ? r.json() : null)

            const curseforgePromise = fetch(`${WORKER_URL}/curseforge/search?query=${currentSearch}&category=12&pageSize=10&index=0`)

                packs = packs.concat(modrinthData.hits.map(pack => ({

                    description: pack.description || 'Описание отсутствует',
                    icon: pack.icon_url || 'https://via.placeholder.com/160',
                    downloads: pack.downloads || 0,
                    author: pack.author || 'Неизвестно',
                    categories: pack.categories || [],
                    source: 'modrinth',
                    slug: pack.slug
                })));
            }

            if (curseforgeData && curseforgeData.data) {
                packs = packs.concat(curseforgeData.data.map(pack => ({
                    id: pack.id,
                    title: pack.name,
                    description: pack.summary || 'Описание отсутствует',
                    icon: pack.logo?.url || 'https://via.placeholder.com/160',
                    downloads: pack.downloadCount || 0,
                    author: pack.authors?.[0]?.name || 'Неизвестно',
                    categories: pack.categories?.map(c => c.name) || [],
                    source: 'curseforge',
                    slug: pack.slug
                })));
            }

            return packs;
        }

        // Загрузка шейдеров
        async function loadShaders() {
            const modrinthPromise = fetch(`${WORKER_URL}/modrinth/search?query=${currentSearch}&facets=["project_type:shader"]&limit=10&offset=0`)
                .then(r => r.ok ? r.json() : null)
                .catch(() => null);

            const curseforgePromise = fetch(`${WORKER_URL}/curseforge/search?query=${currentSearch}&category=6552&pageSize=10&index=0`)
                .then(r => r.ok ? r.json() : null)
                .catch(() => null);

            const [modrinthData, curseforgeData] = await Promise.all([modrinthPromise, curseforgePromise]);

            let shaders = [];

            if (modrinthData && modrinthData.hits) {
                shaders = shaders.concat(modrinthData.hits.map(shader => ({
                    id: shader.project_id,
                    title: shader.title,
                    description: shader.description || 'Описание отсутствует',
                    icon: shader.icon_url || 'https://via.placeholder.com/160',
                    downloads: shader.downloads || 0,

                })));
            }

            if (curseforgeData && curseforgeData.data) {
                shaders = shaders.concat(curseforgeData.data.map(shader => ({
                    id: shader.id,
                    title: shader.name,
                    description: shader.summary || 'Описание отсутствует',
                    icon: shader.logo?.url || 'https://via.placeholder.com/160',
                    downloads: shader.downloadCount || 0,
                    author: shader.authors?.[0]?.name || 'Неизвестно',

                    source: 'curseforge',
                    slug: shader.slug
                })));
            }

            return shaders;
        }

        // Загрузка скинов
        async function loadSkins() {
            const endpoint = currentSearch 
                ? `${WORKER_URL}/skins/search?query=${currentSearch}`
                : `${WORKER_URL}/skins/popular`;

            const response = await fetch(endpoint);
            if (!response.ok) throw new Error('Не удалось загрузить скины');
            
            const data = await response.json();
            return data.skins || [];
        }

        // Рендер контента
        function renderContent(items) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                if (currentTab === 'skins') {
                    card.innerHTML = `
                        <img src="${item.url || 'https://via.placeholder.com/160'}" alt="${item.name || 'Скин'}" class="card-image" onerror="this.src='https://via.placeholder.com/160'">
                        <div class="card-content">
                            <h3 class="card-title">${item.name || 'Безымянный скин'}</h3>
                            <p class="card-description">${item.model || 'Модель: стандартная'}</p>
                            <button class="btn" onclick="downloadSkin('${item.url}', '${item.name}')">Скачать скин</button>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <img src="${item.icon}" alt="${item.title}" class="card-image" onerror="this.src='https://via.placeholder.com/160'">
                        <div class="card-content">
                            <h3 class="card-title">${item.title}</h3>
                            <p class="card-description">${item.description}</p>
                            <div class="card-meta">
                                ${item.categories.slice(0, 3).map(cat => `<span class="tag">${cat}</span>`).join('')}
                            </div>
                            <div class="card-stats">
                                <span>📥 ${formatNumber(item.downloads)}</span>
                                <span>👤 ${item.author}</span>
                            </div>
                            <button class="btn" onclick="openModal('${item.id}', '${item.source}', '${item.slug}')">Подробнее</button>
                        </div>
                    `;
                }

                contentDiv.appendChild(card);
            });
        }

        // Модальное окно
        function setupModal() {
            const modal = document.getElementById('modal');
            const closeBtn = document.getElementById('modalClose');

            closeBtn.addEventListener('click', () => {
                modal.classList.remove('active');
            });

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        }

        async function openModal(id, source, slug) {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modal.classList.add('active');
            modalTitle.textContent = 'Загрузка...';
            modalBody.innerHTML = '<div class="loading">Загрузка</div>';

            try {
                const endpoint = source === 'modrinth' 
                    ? `${WORKER_URL}/modrinth/project/${id}`
                    : `${WORKER_URL}/curseforge/mod/${id}`;

                const response = await fetch(endpoint);
                if (!response.ok) throw new Error('Не удалось загрузить данные');
                
                const data = await response.json();

                modalTitle.textContent = data.title || data.name;
                modalBody.innerHTML = `
                    <img src="${data.icon_url || data.logo?.url || 'https://via.placeholder.com/900x300'}" alt="${data.title || data.name}" class="modal-image" onerror="this.src='https://via.placeholder.com/900x300'">
                    <p class="modal-description">${data.body || data.description || data.summary || 'Описание отсутствует'}</p>
                    <div class="modal-info">
                        <div class="info-row">
                            <span class="info-label">Автор:</span>
                            <span class="info-value">${data.team || data.authors?.[0]?.name || 'Неизвестно'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Загрузок:</span>
                            <span class="info-value">${formatNumber(data.downloads || data.downloadCount || 0)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Источник:</span>
                            <span class="info-value">${source === 'modrinth' ? 'Modrinth' : 'CurseForge'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">ID проекта:</span>
                            <span class="info-value">${id}</span>
                        </div>
                    </div>
                    <div class="modal-actions">
                        <a href="${source === 'modrinth' ? `https://modrinth.com/mod/${slug}` : `https://www.curseforge.com/minecraft/mc-mods/${slug}`}" target="_blank" class="btn">Открыть на сайте</a>
                        <button class="btn btn-secondary" onclick="document.getElementById('modal').classList.remove('active')">Закрыть</button>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading modal:', error);
                modalBody.innerHTML = `<div class="error">Ошибка загрузки: ${error.message}</div>`;
            }
        }

        // Скачивание скина
        function downloadSkin(url, name) {
            const link = document.createElement('a');
            link.href = url;
            link.download = `${name || 'skin'}.png`;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Форматирование чисел
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // Обновление фильтров при загрузке
        updateFilters();
    </script>
</body>
</html>
