<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Hub — Моды, Модпаки, Ресурспаки, Шейдеры, Скины</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --surface-0: #05070C;
            --surface-1: #0A0D12;
            --surface-2: #0F131C;
            --surface-3: #161D2B;
            --surface-4: #1E2636;
            --accent: #38BDF8;
            --accent-dim: #1E3A5F;
            --text: #E8EDF4;
            --text-dim: #9CA3AF;
            --success: #10B981;
            --error: #EF4444;
            --radius-full: 999px;
            --radius-lg: 1.5rem;
            --spacing-xs: 0.5rem;
            --spacing-sm: 0.75rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        }

        body {
            background: var(--surface-0);
            color: var(--text);
            font-family: var(--font-body);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--spacing-xl);
        }

        header {
            margin-bottom: var(--spacing-xl);
            text-align: center;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: var(--spacing-md);
            background: linear-gradient(135deg, var(--accent), #6EE7B7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        .tabs {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
            overflow-x: auto;
            padding-bottom: var(--spacing-sm);
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab {
            background: var(--surface-2);
            color: var(--text-dim);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab:hover {
            background: var(--surface-3);
            color: var(--text);
        }

        .tab.active {
            background: var(--accent);
            color: var(--surface-0);
        }

        .search-container {
            background: var(--surface-2);
            padding: var(--spacing-xl);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-xl);
        }

        .search-row {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            background: var(--surface-3);
            border: 2px solid transparent;
            color: var(--text);
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-full);
            font-size: 1rem;
            transition: border 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-input::placeholder {
            color: var(--text-dim);
        }

        .search-btn {
            background: var(--accent);
            color: var(--surface-0);
            padding: 0.75rem 2rem;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
        }

        .search-btn:hover {
            background: #22A9E0;
            transform: scale(1.02);
        }

        .search-btn:active {
            transform: scale(0.98);
        }

        .filters {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .filter-select {
            background: var(--surface-3);
            border: 2px solid transparent;
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            cursor: pointer;
            transition: border 0.2s;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .filter-select option {
            background: var(--surface-3);
            color: var(--text);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }

        .card {
            background: var(--surface-2);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.15);
        }

        .card-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: var(--surface-4);
        }

        .card-content {
            padding: var(--spacing-lg);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--text);
            line-height: 1.3;
        }

        .card-description {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: var(--spacing-md);
            line-height: 1.5;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
            margin-bottom: var(--spacing-md);
        }

        .tag {
            background: var(--accent-dim);
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .card-stats {
            display: flex;
            justify-content: space-between;
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: var(--spacing-md);
        }

        .btn {
            background: var(--accent);
            color: var(--surface-0);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #22A9E0;
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: var(--surface-3);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: var(--surface-4);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 12, 0.95);
            backdrop-filter: blur(8px);
            z-index: 1000;
            overflow-y: auto;
            animation: fadeIn 0.2s;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--surface-2);
            border-radius: var(--radius-lg);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: var(--spacing-xl);
            border-bottom: 1px solid var(--surface-3);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--spacing-md);
        }

        .modal-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .modal-close:hover {
            background: var(--surface-3);
            color: var(--text);
        }

        .modal-body {
            padding: var(--spacing-xl);
        }

        .modal-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-lg);
            background: var(--surface-4);
        }

        .modal-description {
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: var(--spacing-lg);
        }

        .modal-info {
            display: grid;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: var(--spacing-sm) 0;
            border-bottom: 1px solid var(--surface-3);
        }

        .info-label {
            color: var(--text-dim);
            font-weight: 500;
        }

        .info-value {
            color: var(--text);
            font-weight: 600;
            text-align: right;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }

        .loading {
            text-align: center;
            color: var(--text-dim);
            padding: var(--spacing-xl);
            font-size: 1.1rem;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            100% { content: ''; }
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-xl) var(--spacing-lg);
            color: var(--text-dim);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: var(--spacing-md);
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 1.1rem;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            padding: var(--spacing-lg);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-xl);
            text-align: center;
        }

        @media (max-width: 768px) {
            .container {
                padding: var(--spacing-md);
            }

            .tabs {
                justify-content: flex-start;
            }

            .search-row {
                flex-direction: column;
            }

            .search-input {
                min-width: 100%;
            }

            .modal-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Minecraft Hub</h1>
            <p class="subtitle">Лучшие моды, модпаки, ресурспаки, шейдеры и скины для Minecraft</p>
        </header>

        <div class="tabs">
            <button class="tab active" data-category="mods">🔧 Моды</button>
            <button class="tab" data-category="modpacks">📦 Модпаки</button>
            <button class="tab" data-category="resourcepacks">🎨 Ресурспаки</button>
            <button class="tab" data-category="shaders">✨ Шейдеры</button>
            <button class="tab" data-category="skins">👤 Скины</button>
        </div>

        <div class="search-container">
            <div class="search-row">
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск...">
                <button class="search-btn" id="searchBtn">Найти</button>
            </div>
            <div class="filters">
                <select class="filter-select" id="versionFilter">
                    <option value="">Все версии</option>
                    <option value="1.21">1.21</option>
                    <option value="1.20.6">1.20.6</option>
                    <option value="1.20.4">1.20.4</option>
                    <option value="1.20.1">1.20.1</option>
                    <option value="1.19.4">1.19.4</option>
                    <option value="1.19.2">1.19.2</option>
                    <option value="1.18.2">1.18.2</option>
                    <option value="1.16.5">1.16.5</option>
                    <option value="1.12.2">1.12.2</option>
                </select>
                <select class="filter-select" id="loaderFilter">
                    <option value="">Все лоадеры</option>
                    <option value="forge">Forge</option>
                    <option value="fabric">Fabric</option>
                    <option value="neoforge">NeoForge</option>
                    <option value="quilt">Quilt</option>
                </select>
                <select class="filter-select" id="sortFilter">
                    <option value="downloads">По загрузкам</option>
                    <option value="updated">По обновлению</option>
                    <option value="created">По дате создания</option>
                    <option value="relevance">По релевантности</option>
                </select>
            </div>
        </div>

        <div id="content" class="grid"></div>
        <div id="loadMoreContainer" style="text-align: center; margin-top: 2rem; display: none;">
            <button class="btn" id="loadMoreBtn" style="max-width: 300px; margin: 0 auto;">Загрузить ещё</button>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle"></h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <img class="modal-image" id="modalImage" src="" alt="">
                <p class="modal-description" id="modalDescription"></p>
                <div class="modal-info" id="modalInfo"></div>
                <div class="modal-actions">
                    <a class="btn" id="modalDownload" href="#" target="_blank">Скачать</a>
                    <a class="btn btn-secondary" id="modalSource" href="#" target="_blank">Подробнее</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // КОНФИГУРАЦИЯ
        // ============================================
        const WORKER_URL = 'https://minecraft-proxy.zxcdedinside944.workers.dev';
        
        let currentCategory = 'mods';
        let currentPage = 0;
        let isLoading = false;
        let hasMore = true;

        // ============================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================
        
        function formatNumber(num) {
            if (!num) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function formatDate(dateString) {
            if (!dateString) return 'Неизвестно';
            const date = new Date(dateString);
            return date.toLocaleDateString('ru-RU');
        }

        function stripHTML(html) {
            if (!html) return 'Описание отсутствует';
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || 'Описание отсутствует';
        }

        function showError(message) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="error-message" style="grid-column: 1 / -1;">
                    <strong>Ошибка загрузки:</strong> ${message}
                </div>
            `;
        }

        function showEmpty() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="empty-state" style="grid-column: 1 / -1;">
                    <div class="empty-state-icon">🔍</div>
                    <p class="empty-state-text">Ничего не найдено. Попробуйте изменить параметры поиска.</p>
                </div>
            `;
        }

        function showLoading() {
            if (currentPage === 0) {
                const content = document.getElementById('content');
                content.innerHTML = '<div class="loading" style="grid-column: 1 / -1;">Загрузка</div>';
            }
        }

        // ============================================
        // API ЗАПРОСЫ
        // ============================================

        async function loadMods() {
            const query = document.getElementById('searchInput').value;
            const version = document.getElementById('versionFilter').value;
            const loader = document.getElementById('loaderFilter').value;
            const sort = document.getElementById('sortFilter').value;

            const facets = ['project_type:mod'];
            if (version) facets.push(`versions:${version}`);
            if (loader) facets.push(`categories:${loader}`);

            const modrinthUrl = `${WORKER_URL}/modrinth/search?query=${encodeURIComponent(query)}&facets=${encodeURIComponent(JSON.stringify([facets]))}&limit=10&offset=${currentPage * 10}&index=${sort}`;
            const curseforgeUrl = `${WORKER_URL}/curseforge/search?query=${encodeURIComponent(query)}&category=6&pageSize=10&index=${currentPage}&sortField=${sort === 'downloads' ? '6' : '2'}`;

            const [modrinthRes, curseforgeRes] = await Promise.allSettled([
                fetch(modrinthUrl).then(r => r.ok ? r.json() : null),
                fetch(curseforgeUrl).then(r => r.ok ? r.json() : null)
            ]);

            const modrinthData = modrinthRes.status === 'fulfilled' && modrinthRes.value ? modrinthRes.value.hits || [] : [];
            const curseforgeData = curseforgeRes.status === 'fulfilled' && curseforgeRes.value ? curseforgeRes.value.data || [] : [];

            return [...modrinthData.map(normalizeModrinth), ...curseforgeData.map(normalizeCurseforge)];
        }

        async function loadModpacks() {
            const query = document.getElementById('searchInput').value;
            const sort = document.getElementById('sortFilter').value;

            const facets = ['project_type:modpack'];

            const modrinthUrl = `${WORKER_URL}/modrinth/search?query=${encodeURIComponent(query)}&facets=${encodeURIComponent(JSON.stringify([facets]))}&limit=10&offset=${currentPage * 10}&index=${sort}`;
            const curseforgeUrl = `${WORKER_URL}/curseforge/search?query=${encodeURIComponent(query)}&category=4471&pageSize=10&index=${currentPage}&sortField=${sort === 'downloads' ? '6' : '2'}`;

            const [modrinthRes, curseforgeRes] = await Promise.allSettled([
                fetch(modrinthUrl).then(r => r.ok ? r.json() : null),
                fetch(curseforgeUrl).then(r => r.ok ? r.json() : null)
            ]);

            const modrinthData = modrinthRes.status === 'fulfilled' && modrinthRes.value ? modrinthRes.value.hits || [] : [];
            const curseforgeData = curseforgeRes.status === 'fulfilled' && curseforgeRes.value ? curseforgeRes.value.data || [] : [];

            return [...modrinthData.map(normalizeModrinth), ...curseforgeData.map(normalizeCurseforge)];
        }

        async function loadResourcepacks() {
            const query = document.getElementById('searchInput').value;
            const sort = document.getElementById('sortFilter').value;

            const facets = ['project_type:resourcepack'];

            const modrinthUrl = `${WORKER_URL}/modrinth/search?query=${encodeURIComponent(query)}&facets=${encodeURIComponent(JSON.stringify([facets]))}&limit=10&offset=${currentPage * 10}&index=${sort}`;
            const curseforgeUrl = `${WORKER_URL}/curseforge/search?query=${encodeURIComponent(query)}&category=12&pageSize=10&index=${currentPage}&sortField=${sort === 'downloads' ? '6' : '2'}`;

            const [modrinthRes, curseforgeRes] = await Promise.allSettled([
                fetch(modrinthUrl).then(r => r.ok ? r.json() : null),
                fetch(curseforgeUrl).then(r => r.ok ? r.json() : null)
            ]);

            const modrinthData = modrinthRes.status === 'fulfilled' && modrinthRes.value ? modrinthRes.value.hits || [] : [];
            const curseforgeData = curseforgeRes.status === 'fulfilled' && curseforgeRes.value ? curseforgeRes.value.data || [] : [];

            return [...modrinthData.map(normalizeModrinth), ...curseforgeData.map(normalizeCurseforge)];
        }

        async function loadShaders() {
            const query = document.getElementById('searchInput').value;
            const sort = document.getElementById('sortFilter').value;

            const facets = ['project_type:shader'];

            const modrinthUrl = `${WORKER_URL}/modrinth/search?query=${encodeURIComponent(query)}&facets=${encodeURIComponent(JSON.stringify([facets]))}&limit=20&offset=${currentPage * 20}&index=${sort}`;

            const res = await fetch(modrinthUrl);
            if (!res.ok) return [];
            
            const data = await res.json();
            return (data.hits || []).map(normalizeModrinth);
        }

        async function loadSkins() {
            const sort = document.getElementById('sortFilter').value === 'updated' ? 'recent' : 'popular';
            const url = `${WORKER_URL}/skins/${sort}`;

            const res = await fetch(url);
            if (!res.ok) return [];
            
            const data = await res.json();
            return (data.skins || []).map(normalizeSkin);
        }

        // ============================================
        // НОРМАЛИЗАЦИЯ ДАННЫХ
        // ============================================

        function normalizeModrinth(item) {
            return {
                id: item.project_id || item.slug,
                title: item.title,
                description: item.description || 'Описание отсутствует',
                image: item.icon_url || item.gallery?.[0] || 'https://via.placeholder.com/280x160?text=No+Image',
                downloads: item.downloads || 0,
                author: item.author || 'Неизвестно',
                updated: item.date_modified || item.date_created,
                versions: item.versions || [],
                categories: item.categories || [],
                source: 'modrinth',
                url: `https://modrinth.com/${item.project_type}/${item.slug}`,
                downloadUrl: `https://modrinth.com/${item.project_type}/${item.slug}/versions`
            };
        }

        function normalizeCurseforge(item) {
            return {
                id: item.id,
                title: item.name,
                description: stripHTML(item.summary) || 'Описание отсутствует',
                image: item.logo?.url || 'https://via.placeholder.com/280x160?text=No+Image',
                downloads: item.downloadCount || 0,
                author: item.authors?.[0]?.name || 'Неизвестно',
                updated: item.dateModified || item.dateCreated,
                categories: item.categories?.map(c => c.name) || [],
                source: 'curseforge',
                url: item.links?.websiteUrl || '#',
                downloadUrl: item.links?.websiteUrl || '#'
            };
        }

        function normalizeSkin(item) {
            return {
                id: item.id,
                title: item.name || `Скин #${item.id}`,
                description: item.description || 'Крутой скин для Minecraft',
                image: item.image || `https://via.placeholder.com/280x160?text=Skin`,
                downloads: item.downloads || 0,
                author: item.author || 'Игрок',
                updated: item.created_at,
                source: 'skinsmc',
                url: item.url || '#',
                downloadUrl: item.download || '#'
            };
        }

        // ============================================
        // ОТОБРАЖЕНИЕ КОНТЕНТА
        // ============================================

        async function loadContent(append = false) {
            if (isLoading) return;
            
            isLoading = true;
            if (!append) {
                currentPage = 0;
                hasMore = true;
            }
            
            showLoading();

            try {
                let items = [];

                switch (currentCategory) {
                    case 'mods':
                        items = await loadMods();
                        break;
                    case 'modpacks':
                        items = await loadModpacks();
                        break;
                    case 'resourcepacks':
                        items = await loadResourcepacks();
                        break;
                    case 'shaders':
                        items = await loadShaders();
                        break;
                    case 'skins':
                        items = await loadSkins();
                        break;
                }

                if (!items || items.length === 0) {
                    if (!append) {
                        showEmpty();
                    }
                    hasMore = false;
                    document.getElementById('loadMoreContainer').style.display = 'none';
                } else {
                    renderItems(items, append);
                    hasMore = items.length >= 10;
                    document.getElementById('loadMoreContainer').style.display = hasMore ? 'block' : 'none';
                }
            } catch (error) {
                console.error('Error loading content:', error);
                showError(error.message || 'Не удалось загрузить данные');
                hasMore = false;
                document.getElementById('loadMoreContainer').style.display = 'none';
            } finally {
                isLoading = false;
            }
        }

        function renderItems(items, append = false) {
            const content = document.getElementById('content');
            
            if (!append) {
                content.innerHTML = '';
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img class="card-image" src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/280x160?text=No+Image'">
                    <div class="card-content">
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-description">${item.description}</p>
                        <div class="card-meta">
                            <span class="tag">${item.source}</span>
                            ${item.categories.slice(0, 2).map(cat => `<span class="tag">${cat}</span>`).join('')}
                        </div>
                        <div class="card-stats">
                            <span>📥 ${formatNumber(item.downloads)}</span>
                            <span>👤 ${item.author}</span>
                        </div>
                        <button class="btn" onclick="openModal('${item.id}', ${JSON.stringify(item).replace(/"/g, '&quot;')})">Подробнее</button>
                    </div>
                `;
                content.appendChild(card);
            });
        }

        function openModal(id, item) {
            const modal = document.getElementById('modal');
            document.getElementById('modalTitle').textContent = item.title;
            document.getElementById('modalImage').src = item.image;
            document.getElementById('modalDescription').textContent = item.description;
            
            const info = document.getElementById('modalInfo');
            info.innerHTML = `
                <div class="info-row">
                    <span class="info-label">Автор:</span>
                    <span class="info-value">${item.author}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Загрузок:</span>
                    <span class="info-value">${formatNumber(item.downloads)}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Обновлено:</span>
                    <span class="info-value">${formatDate(item.updated)}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Источник:</span>
                    <span class="info-value">${item.source}</span>
                </div>
            `;

            document.getElementById('modalDownload').href = item.downloadUrl;
            document.getElementById('modalSource').href = item.url;
            
            modal.classList.add('active');
        }

        // ============================================
        // ОБРАБОТЧИКИ СОБЫТИЙ
        // ============================================

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.category;
                loadContent();
            });
        });

        document.getElementById('searchBtn').addEventListener('click', () => {
            loadContent();
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadContent();
            }
        });

        document.getElementById('versionFilter').addEventListener('change', () => loadContent());
        document.getElementById('loaderFilter').addEventListener('change', () => loadContent());
        document.getElementById('sortFilter').addEventListener('change', () => loadContent());

        document.getElementById('loadMoreBtn').addEventListener('click', () => {
            currentPage++;
            loadContent(true);
        });

        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('modal').classList.remove('active');
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') {
                document.getElementById('modal').classList.remove('active');
            }
        });

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================
        
        loadContent();
    </script>
</body>
</html>
