<style>
/* === ТЕМЫ === */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --s0:#05070C;--s2:#0F131C;--s3:#161D2B;--s4:#1E2636;
  --accent:#38BDF8;--dim:#1E3A5F;--text:#E8EDF4;--tdim:#9CA3AF;
  --error:#EF4444;--ok:#10B981;
  --r:999px;--rl:1.5rem;
  --blur:8px;
  --tr-fast:.14s;--tr-norm:.28s;--tr-slow:.45s;
  --ease:cubic-bezier(.25,.46,.45,.94);
  --card-glow:rgba(56,189,248,.15);
}
[data-theme="midnight"]{
  --s0:#02040A;--s2:#0A0E18;--s3:#111624;--s4:#1A2132;
  --accent:#818CF8;--dim:#1E1B4B;--text:#E0E7FF;--tdim:#8B95B8;
  --card-glow:rgba(129,140,248,.2);
}
[data-theme="light"]{
  --s0:#F0F4FA;--s2:#FFFFFF;--s3:#E8EDF5;--s4:#DDE4EE;
  --accent:#0284C7;--dim:#DBEAFE;--text:#0F172A;--tdim:#64748B;
  --card-glow:rgba(2,132,199,.15);
}
body{
  background:var(--s0);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  line-height:1.6;min-height:100vh;
  transition:background var(--tr-slow) var(--ease),color var(--tr-slow) var(--ease);
}
body.lock{overflow:hidden}
.container{max-width:1400px;margin:0 auto;padding:2rem}
header{margin-bottom:2rem;text-align:center;position:relative;animation:fadeInUp .5s var(--ease)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
h1{
  font-size:clamp(2rem,5vw,3.5rem);font-weight:700;letter-spacing:-.02em;margin-bottom:1rem;
  background:linear-gradient(135deg,var(--accent),#6EE7B7);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  transition:background var(--tr-slow) var(--ease);
}
.subtitle{color:var(--tdim);font-size:1.1rem;transition:color var(--tr-slow) var(--ease)}
.tabs{display:flex;gap:.75rem;margin-bottom:2rem;justify-content:center;flex-wrap:wrap}
.tab,.page-btn{
  background:var(--s2);color:var(--tdim);padding:.75rem 1.5rem;
  border:none;border-radius:var(--r);font-weight:600;cursor:pointer;
  font-size:1rem;white-space:nowrap;
  transition:all var(--tr-norm) var(--ease);
}
.tab:hover,.page-btn:hover{
  background:var(--s3);color:var(--text);transform:translateY(-2px);
  box-shadow:0 6px 18px var(--card-glow);
}
.tab.active,.page-btn.active{
  background:var(--accent);color:var(--s0);
  box-shadow:0 4px 16px var(--card-glow);
}
.search-container{
  background:var(--s2);padding:2rem;border-radius:var(--rl);margin-bottom:2rem;
  transition:background var(--tr-slow) var(--ease);
}
.search-row{display:flex;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.search-input,.filter-select{
  background:var(--s3);border:2px solid transparent;color:var(--text);
  padding:.75rem 1.25rem;border-radius:var(--r);font-size:1rem;
  transition:border-color var(--tr-norm) var(--ease),background var(--tr-slow) var(--ease);
}
.search-input{flex:1;min-width:250px}
.filter-select{padding:.5rem 1rem;cursor:pointer}
.search-input:focus,.filter-select:focus{outline:none;border-color:var(--accent)}
.filters{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.filters label{color:var(--tdim);font-size:.9rem}
.hidden{display:none!important}
.btn,.search-btn{
  background:var(--accent);color:var(--s0);padding:.75rem 2rem;border:none;
  border-radius:var(--r);font-weight:600;cursor:pointer;font-size:1rem;
  transition:all var(--tr-norm) var(--ease);text-align:center;
}
.btn{width:100%;display:inline-block}
.btn:hover,.search-btn:hover{
  filter:brightness(1.15);transform:scale(1.02);
  box-shadow:0 6px 20px var(--card-glow);
}
.btn-secondary{background:var(--s3);color:var(--text)}
.btn-secondary:hover{background:var(--s4)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem;margin-bottom:2rem}
.card{
  background:var(--s2);border-radius:var(--rl);overflow:hidden;
  cursor:pointer;display:flex;flex-direction:column;
  animation:fadeInUp .45s var(--ease) both;
  transition:transform var(--tr-norm) var(--ease),box-shadow var(--tr-norm) var(--ease),background var(--tr-slow) var(--ease);
}
.card:hover,.card:focus-visible{
  transform:translateY(-6px) scale(1.01);
  box-shadow:0 12px 32px var(--card-glow);
  outline:none;
}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card-image{width:100%;height:180px;object-fit:cover;background:var(--s4);transition:background var(--tr-slow) var(--ease)}
.card-3d-container{
  width:100%;height:180px;background:linear-gradient(135deg,var(--s3),var(--s4));
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:background var(--tr-slow) var(--ease);
}
.card-3d-container canvas{display:block;max-width:100%;max-height:100%}
.card-content{padding:1.25rem;flex:1;display:flex;flex-direction:column}
.card-title{font-size:1.05rem;font-weight:600;margin-bottom:.5rem;line-height:1.3;word-break:break-word}
.card-description{color:var(--tdim);font-size:.9rem;margin-bottom:1rem;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{
  display:inline-block;background:var(--dim);color:var(--accent);
  padding:.25rem .75rem;border-radius:var(--r);font-size:.8rem;
  font-weight:500;margin-bottom:1rem;align-self:flex-start;
}
.card-stats{display:flex;justify-content:space-between;gap:.5rem;color:var(--tdim);font-size:.85rem}
.skeleton-card{cursor:default!important;pointer-events:none}
.skeleton-card:hover{transform:none!important;box-shadow:none!important}
.skeleton-shimmer{background:linear-gradient(90deg,var(--s3) 25%,var(--s4) 50%,var(--s3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.skeleton-line{height:.85rem;border-radius:.4rem;margin-bottom:.6rem}
.skeleton-line.big{height:1.2rem;width:70%}
.modal{
  display:none;position:fixed;inset:0;background:rgba(5,7,12,.9);
  backdrop-filter:blur(var(--blur));z-index:1000;overflow-y:auto;
  animation:fadeIn .2s var(--ease);
}
.modal.active{display:flex;align-items:center;justify-content:center;padding:2rem}
.modal-content{
  background:var(--s2);border-radius:var(--rl);max-width:900px;width:100%;
  max-height:90vh;overflow-y:auto;
  animation:fadeInUp .3s var(--ease);
  transition:background var(--tr-slow) var(--ease);
}
.modal-header{padding:1.5rem 2rem;border-bottom:1px solid var(--s3);display:flex;justify-content:space-between;gap:1rem}
.modal-title{font-size:1.5rem;font-weight:700;line-height:1.3;word-break:break-word}
.modal-close{background:none;border:none;color:var(--tdim);font-size:2rem;cursor:pointer;width:40px;height:40px;border-radius:50%;flex-shrink:0;transition:all var(--tr-fast) var(--ease)}
.modal-close:hover{background:var(--s3);color:var(--text);transform:rotate(90deg)}
.modal-body{padding:2rem}
.modal-3d-viewport{
  width:100%;height:360px;background:linear-gradient(135deg,var(--s3),var(--s4));
  border-radius:var(--rl);margin-bottom:1.5rem;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.modal-3d-viewport canvas{display:block;cursor:grab}
.modal-3d-viewport canvas:active{cursor:grabbing}
.modal-description{color:var(--tdim);line-height:1.7;margin-bottom:1.5rem;white-space:pre-line}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.version-picker{background:var(--s3);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:1.5rem;display:flex;flex-direction:column;gap:.75rem}
.version-picker-title{font-size:.9rem;color:var(--tdim)}
.version-picker-row{display:flex;gap:.75rem;flex-wrap:wrap}
.version-picker select{flex:1;min-width:140px}
.error{text-align:center;padding:2rem;font-size:1.1rem;color:var(--error);background:var(--s2);border-radius:var(--rl)}
.error-detail{color:var(--tdim);font-size:.85rem;margin-top:.5rem;word-break:break-word}
.info-note{color:var(--accent);background:var(--s2);border-radius:var(--rl);text-align:center;padding:1rem;margin-bottom:1.5rem;font-size:.95rem}
#sentinel{height:40px;display:flex;align-items:center;justify-content:center;color:var(--tdim);font-size:.9rem}
#toasts{position:fixed;bottom:1.5rem;right:1.5rem;display:flex;flex-direction:column;gap:.75rem;z-index:2000;max-width:min(360px,calc(100vw - 3rem))}
.toast{background:var(--s3);color:var(--text);padding:1rem 1.25rem;border-radius:1rem;box-shadow:0 8px 24px rgba(0,0,0,.4);border-left:4px solid var(--accent);animation:slideIn .25s var(--ease);font-size:.95rem}
.toast.error{border-left-color:var(--error)}
.toast.ok{border-left-color:var(--ok)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* === ПАНЕЛЬ ТЕМ === */
.theme-panel{
  position:fixed;bottom:1.5rem;left:1.5rem;z-index:3000;
  display:flex;flex-direction:column;gap:.5rem;align-items:flex-start;
}
.theme-toggle{
  width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
  background:var(--s2);color:var(--text);font-size:1.4rem;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  transition:all var(--tr-norm) var(--ease);
  display:flex;align-items:center;justify-content:center;
}
.theme-toggle:hover{transform:scale(1.1) rotate(15deg);background:var(--s3)}
.theme-options{
  display:flex;gap:.5rem;background:var(--s2);padding:.5rem;
  border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.4);
  opacity:0;transform:translateY(10px) scale(.9);pointer-events:none;
  transition:all var(--tr-norm) var(--ease);
}
.theme-panel.open .theme-options{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.theme-opt{
  width:36px;height:36px;border-radius:50%;border:2px solid transparent;
  cursor:pointer;transition:all var(--tr-fast) var(--ease);
}
.theme-opt[data-theme="dark"]{background:linear-gradient(135deg,#05070C,#0F131C)}
.theme-opt[data-theme="midnight"]{background:linear-gradient(135deg,#02040A,#818CF8)}
.theme-opt[data-theme="light"]{background:linear-gradient(135deg,#F0F4FA,#0284C7)}
.theme-opt:hover{transform:scale(1.15)}
.theme-opt.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--s0) inset}

/* === РЕДАКТОР === */
.editor-wrap{background:var(--s2);border-radius:var(--rl);padding:2rem;animation:fadeInUp .4s var(--ease)}
.editor-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.editor-header h2{font-size:1.5rem}
.editor-header-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.editor-header-actions .btn,.editor-header-actions .btn-secondary{padding:.6rem 1rem;font-size:.9rem;width:auto}
.editor-layout{display:grid;grid-template-columns:1fr 340px;gap:2rem;align-items:start}
@media(max-width:1000px){.editor-layout{grid-template-columns:1fr}}
.editor-canvas-area{
  position:relative;background:linear-gradient(135deg,var(--s3),var(--s4));
  border-radius:var(--rl);min-height:520px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.editor-canvas-area canvas{display:block;cursor:crosshair}
.editor-mode-toggle{
  position:absolute;top:1rem;right:1rem;z-index:10;
  display:flex;gap:.25rem;background:var(--s2);padding:.25rem;border-radius:var(--r);
}
.editor-mode-toggle button{
  background:transparent;color:var(--tdim);border:none;
  padding:.5rem 1rem;border-radius:var(--r);cursor:pointer;
  font-weight:600;font-size:.85rem;
  transition:all var(--tr-fast) var(--ease);
}
.editor-mode-toggle button.active{background:var(--accent);color:var(--s0)}
.editor-sidebar{display:flex;flex-direction:column;gap:1.25rem}
.editor-section{background:var(--s3);border-radius:var(--rl);padding:1rem 1.25rem}
.editor-section-title{font-size:.85rem;color:var(--tdim);margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.editor-tools{display:flex;gap:.5rem;flex-wrap:wrap}
.editor-tool{
  flex:1;min-width:0;background:var(--s2);color:var(--tdim);
  border:2px solid transparent;border-radius:1rem;
  padding:.6rem .5rem;cursor:pointer;font-size:1.2rem;
  transition:all var(--tr-fast) var(--ease);
  display:flex;align-items:center;justify-content:center;
}
.editor-tool:hover{background:var(--s4);color:var(--text)}
.editor-tool.active{background:var(--accent);color:var(--s0);border-color:var(--accent)}
.editor-color-row{display:flex;gap:.75rem;align-items:center}
.editor-color-row input[type="color"]{
  width:56px;height:44px;border:none;border-radius:.75rem;
  cursor:pointer;background:transparent;
}
.skin-palette{display:grid;grid-template-columns:repeat(8,1fr);gap:.4rem}
.skin-palette button{aspect-ratio:1;border:2px solid transparent;border-radius:6px;cursor:pointer;padding:0;transition:all var(--tr-fast) var(--ease)}
.skin-palette button:hover{transform:scale(1.15)}
.skin-palette button.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--s0) inset}
.editor-layer-row{display:flex;gap:.5rem}
.editor-layer-btn{
  flex:1;background:var(--s2);color:var(--tdim);border:2px solid transparent;
  border-radius:1rem;padding:.6rem;cursor:pointer;font-size:.85rem;font-weight:600;
  transition:all var(--tr-fast) var(--ease);
}
.editor-layer-btn.active{background:var(--accent);color:var(--s0);border-color:var(--accent)}
.editor-action-row{display:flex;gap:.5rem}
.editor-action-row .btn,.editor-action-row .btn-secondary{width:auto;flex:1;padding:.6rem .75rem;font-size:.85rem}

/* === 2D-развёртка === */
.editor-flat-canvas{image-rendering:pixelated;cursor:crosshair;background:var(--s3);border-radius:.5rem;max-width:100%;display:block}

@media(max-width:768px){
  .container{padding:1rem}
  .tabs{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
  .search-row{flex-direction:column}
  .modal-actions{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  #toasts{right:1rem;left:1rem;max-width:none}
  .editor-layout{grid-template-columns:1fr}
  .theme-panel{bottom:1rem;left:1rem}
}
</style>
</head>

const trCache=new Map();
try{Object.entries(JSON.parse(localStorage.getItem('trCache')||'{}')).forEach(([k,v])=>trCache.set(k,v))}catch{}
let cacheSaveTimer=null;
function scheduleCacheSave(){if(cacheSaveTimer)return;cacheSaveTimer=setTimeout(()=>{try{localStorage.setItem('trCache',JSON.stringify(Object.fromEntries([...trCache].slice(-300))))}catch{};cacheSaveTimer=null},1500)}
const needsTranslation=t=>t&&t.length>2&&(t.match(/[а-яё]/gi)||[]).length<t.length*0.2;
async function translate(text,signal){
  if(!needsTranslation(text))return text;
  const cut=text.slice(0,450);
  if(trCache.has(cut))return trCache.get(cut);
  try{
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q='+encodeURIComponent(cut),{signal});
    if(!r.ok)throw 0;
    const d=await r.json();
    const out=d[0].map(p=>p[0]).join('');
    trCache.set(cut,out);scheduleCacheSave();
    return out;
  }catch{return text}
}

const skinViewers = new Map();
const viewerObserver = new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    const id = en.target.dataset.skinView;
    const v = skinViewers.get(id);
    if(!v)return;
    if(en.isIntersecting){
      if(!v._started){v._started=true;v.renderer.setAnimationLoop(v._loop)}
    } else {
      if(v._started){v._started=false;v.renderer.setAnimationLoop(null)}
    }
  });
},{rootMargin:'200px'});

function createSkinViewer(container, skinUrl, opts={}){
  if(typeof skinview3d==='undefined')return null;
  const w = container.clientWidth || 240;
  const h = container.clientHeight || 180;
  try{
    const viewer = new skinview3d.SkinViewer({
      canvas: document.createElement('canvas'),
      width: w, height: h,
      skin: skinUrl,
      model: opts.model || 'auto-detect',
      background: 'transparent'
    });
    viewer.controls.enableZoom = false;
    viewer.controls.enableRotate = opts.interactive || false;
    viewer.controls.enablePan = false;
    viewer.controls.autoRotate = false;
    if(opts.pose){
      viewer.playerObject.rotation.y = opts.pose.ry || 0.5;
      viewer.playerObject.rotation.x = opts.pose.rx || 0;
    }
    viewer.autoRotate = false;
    if(opts.animation){
      viewer.animation = new skinview3d.WalkingAnimation();
      viewer.animation.speed = 1;
    }
    viewer.camera.position.z = 60;
    viewer.fov = 45;
    viewer.renderer.setClearColor(0x000000, 0);
    container.appendChild(viewer.canvas);
    const id = 'sv_'+Math.random().toString(36).slice(2,10);
    container.dataset.skinView = id;
    viewer._started = false;
    viewer._loop = ()=>{
      viewer.renderer.render(viewer.scene, viewer.camera);
    };
    if(!opts.lazy){viewer._started=true;viewer.renderer.setAnimationLoop(viewer._loop)}
    else viewerObserver.observe(container);
    skinViewers.set(id, viewer);
    return viewer;
  }catch(e){console.warn('skinview3d:',e);return null}
}

function destroySkinViewer(container){
  const id = container.dataset.skinView;
  if(!id)return;
  const v = skinViewers.get(id);
  if(v){
    try{v.renderer.setAnimationLoop(null);v.dispose();}catch{}
    skinViewers.delete(id);
  }
  delete container.dataset.skinView;
}

async function loadSkinsPage(page, query=''){
  const cacheKey = `skins|${page}|${query}`;
  const cached = cacheGet(cacheKey);
  if(cached)return cached;
  try{
    const qs = new URLSearchParams({page:String(page), limit:String(SKIN_LIMIT)});
    if(query)qs.set('query',query);
    const r = await fetch(`${WORKER_URL}/skins/list?${qs}`);
    if(r.ok){
      const d = await r.json();
      if(d.skins && d.skins.length){
        const list = d.skins.map(s=>({
          source:'skin',
          name: s.name || s.username || s.id,
          skinUrl: s.skin_url || s.url || `https://minotar.net/skin/${encodeURIComponent(s.name||'Steve')}`,
          uuid: s.uuid
        }));
        cacheSet(cacheKey,list);
        return list;
      }
    }
  }catch(e){console.warn('megaskins:',e)}
  // Резерв: NameMC trending
  try{
    const r = await fetch(`${WORKER_URL}/skins/trending?page=${page}`);
    if(r.ok){
      const d = await r.json();
      if(d.names && d.names.length){
        const list = d.names.map(n=>({source:'skin',name:n,skinUrl:`https://minotar.net/skin/${encodeURIComponent(n)}`}));
        cacheSet(cacheKey,list);
        return list;
      }
    }
  }catch(e){console.warn('namemc:',e)}
  // Последний резерв: локальный список
  if(page===1 && !query){
    return SKIN_NAMES.map(n=>({source:'skin',name:n,skinUrl:`https://minotar.net/skin/${encodeURIComponent(n)}`}));
  }
  return [];
}

function buildModrinthQuery(){
  const cfg=tabConfig[currentTab],sort=$('sortSelect').value;
  const mc=$('mcVersion').value.trim(),loader=$('loaderSelect').value;
  const facets=[['project_type:'+cfg.type]];
  if(mc&&isValidVersion(mc))facets.push(['versions:'+mc]);
  if(loader)facets.push(['categories:'+loader]);
  const qs=new URLSearchParams({query:currentQuery,facets:JSON.stringify(facets),limit:LIMIT,offset,index:sort});
  return {qs,key:['mr',currentTab,currentQuery,sort,mc,loader,offset].join('|')};
}
function buildCurseForgeQuery(){
  const cfg=tabConfig[currentTab],sort=$('sortSelect').value;
  const sortField=sort==='downloads'?'6':sort==='updated'?'3':sort==='newest'?'11':'2';
  const qs=new URLSearchParams({gameId:'432',classId:cfg.cf,searchFilter:currentQuery,pageSize:LIMIT,index:offset,sortField,sortOrder:'desc'});
  return {qs,key:['cf',currentTab,currentQuery,sort,offset].join('|')};
}

async function fetchModrinthPage(){

async function loadMore(){
  if(isLoading||!hasMore)return;
  isLoading=true;
  const token=reqId;

  try{
    if(currentTab==='skins'){
      const page=skinPage;
      let list;
      if(page===1 && currentQuery && isValidNick(currentQuery)){
        list=[{source:'skin',name:currentQuery,skinUrl:`https://minotar.net/skin/${encodeURIComponent(currentQuery)}`}];
        skinHasMore=false;
      } else {
        showSkeletons(8);
        list=await loadSkinsPage(page,currentQuery);
        removeSkeletons();
      }
      if(token!==reqId)return;
      if(!list.length){hasMore=false;setSentinel('end');return}
      appendCards(list,token);
      skinPage++;
      hasMore=skinHasMore;
      setSentinel(hasMore?'idle':'end');
      return;
    }

    showSkeletons(8);
    setSentinel('loading');

    let mrResult=null,cfResult=null,rendered=false;
    const handleMr=async()=>{try{const r=await fetchModrinthPage();if(token!==reqId)return null;mrResult=r;if(r.list.length){if(!rendered){removeSkeletons();rendered=true}appendCards(r.list,token)}return r}catch(e){console.warn('MR:',e.message);return null}};
    const handleCf=async()=>{try{const r=await fetchCurseForgePage();if(token!==reqId)return null;cfResult=r;if(r.list.length){if(!rendered){removeSkeletons();rendered=true}appendCards(r.list,token)}return r}catch(e){console.warn('CF:',e.message);return null}};

    await Promise.all([handleMr(),handleCf()]);
    if(token!==reqId)return;
    removeSkeletons();
    if(!mrResult&&!cfResult)throw new Error('Оба источника недоступны');
    const mrTotal=mrResult?.total??0,cfTotal=cfResult?.total??0;
    hasMore=(offset+LIMIT)<Math.max(mrTotal,cfTotal);
    offset+=LIMIT;
    setSentinel(hasMore?'idle':'end');
  }catch(e){
    if(token!==reqId)return;
    console.error(e);removeSkeletons();hasMore=false;
    const errEl=document.createElement('div');errEl.className='error';
    errEl.innerHTML=`Не удалось загрузить данные.<div class="error-detail">${esc(e.message||'')}</div>`;
    $('content').appendChild(errEl);
    setSentinel('');
  }finally{if(token===reqId)isLoading=false}
}

async function loadVersions(item){
  const vSel=$('modalVersion'),lSel=$('modalLoader');
  if(!vSel)return;
  const id=safeId(item.source==='modrinth'?(item.project_id||item.slug):item.id);
  if(!id)return;
  try{
    let versions=[];
    if(item.source==='modrinth'){
      const v=await raceJson(`${MR_API}/project/${id}/version`,`${WORKER_URL}/modrinth/project/${id}/version`);
      versions=(v||[]).map(x=>({id:x.id,mc:x.game_versions||[],loaders:x.loaders||[]}));
    } else {
      const f=await raceJson(`${MCIM_API}/mods/${id}/files?pageSize=20`,`${WORKER_URL}/curseforge/mod/${id}/files`);
      versions=(f.data||[]).map(x=>({id:x.id,mc:(x.gameVersions||[]).filter(g=>/^\d/.test(g)),loaders:x.modLoader?[x.modLoader]:[]}));
    }
    const mcSet=new Set(),loaderSet=new Set();
    versions.forEach(v=>{v.mc.forEach(m=>mcSet.add(m));v.loaders.forEach(l=>loaderSet.add(l))});
    const mcs=[...mcSet].sort((a,b)=>compareVersions(b,a));
    const loaders=[...loaderSet].sort();
    vSel.innerHTML=mcs.length?mcs.map(m=>`<option>${esc(m)}</option>`).join(''):'<option value="">—</option>';
    lSel.innerHTML='<option value="">Любой</option>'+loaders.map(l=>`<option>${esc(l)}</option>`).join('');
    const userMc=$('mcVersion').value.trim();if(userMc&&mcs.includes(userMc))vSel.value=userMc;
    const userLoader=$('loaderSelect').value;if(userLoader&&loaders.includes(userLoader))lSel.value=userLoader;
  }catch(e){
    vSel.innerHTML='<option value="">Ошибка</option>';lSel.innerHTML='<option value="">—</option>';
  }
}

function compareVersions(a,b){const pa=String(a).split('.').map(Number),pb=String(b).split('.').map(Number);for(let i=0;i<Math.max(pa.length,pb.length);i++){const d=(pa[i]||0)-(pb[i]||0);if(d)return d}return 0}

async function downloadDirect(source,id,btn){
  if(!id){toast('Некорректный идентификатор','error');return}
  const old=btn.textContent;btn.disabled=true;btn.textContent='Подготовка...';
  try{
    let url='',filename='download';
    if(source==='skin'){
      url=btn.dataset.skinUrl||`https://minotar.net/download/${encodeURIComponent(id)}`;
      filename=id+'.png';
    } else if(source==='modrinth'){
      const v=await raceJson(`${MR_API}/project/${id}/version`,`${WORKER_URL}/modrinth/project/${id}/version`);
      if(!v?.length){toast('Файлы не найдены','error');return}
      const wantMc=$('modalVersion')?.value||'';const wantLoader=$('modalLoader')?.value||'';
      let pick=v.find(x=>(!wantMc||(x.game_versions||[]).includes(wantMc))&&(!wantLoader||(x.loaders||[]).includes(wantLoader)));
      if(!pick){toast('Беру последнюю версию','info');pick=v[0]}
      const file=(pick.files||[]).find(x=>x.primary)||(pick.files||[])[0];
      if(!file){toast('Файл не найден','error');return}
      url=file.url;filename=file.filename||'mod.jar';
    } else {
      const f=await raceJson(`${MCIM_API}/mods/${id}/files?pageSize=20`,`${WORKER_URL}/curseforge/mod/${id}/files`);
      if(!f.data?.length){toast('Файлы не найдены','error');return}
      const wantMc=$('modalVersion')?.value||'';const wantLoader=$('modalLoader')?.value||'';
      let pick=f.data.find(x=>{const mcOk=!wantMc||(x.gameVersions||[]).includes(wantMc);const ldOk=!wantLoader||x.modLoader===wantLoader;return mcOk&&ldOk});
      if(!pick){toast('Беру последнюю версию','info');pick=f.data[0]}
      const fid=safeId(pick.id);if(!fid){toast('Некорректный ID','error');return}
      filename=pick.fileName||'mod.jar';
      const dl=await raceJson(`${MCIM_API}/mods/${id}/files/${fid}/download-url`,`${WORKER_URL}/curseforge/download-url/${id}/${fid}`);
      if(!dl.data){toast('Автор запретил скачивание','error');return}
      url=dl.data;
    }
    const safe=safeUrl(url);if(!safe){toast('Некорректная ссылка','error');return}
    const a=document.createElement('a');a.href=safe;a.download=filename;a.target='_blank';a.rel='noopener';
    document.body.appendChild(a);a.click();a.remove();
    toast('Скачивание: '+filename,'ok');
  }catch(e){console.error(e);toast('Не удалось: '+(e.message||'ошибка'),'error')}
  finally{btn.disabled=false;btn.textContent=old}
}

function formatNumber(n){
  n=Number(n)||0;
  if(n>=1e6){const v=n/1e6;return(v>=100?Math.round(v):(Math.round(v*10)/10).toString().replace(/\.0$/,''))+'M'}
  if(n>=1000){const v=n/1000;return(v>=999.5?(Math.round(n/1e5)/10).toString().replace(/\.0$/,'')+'M':(Math.round(v*10)/10).toString().replace(/\.0$/,'')+'K')}
  return String(n);
}

/* ============================================================
   РЕДАКТОР СКИНОВ (3D + 2D + UV-raycast)
   ============================================================ */
const SKIN_SIZE = 64;
let editorState = null;

async function openEditor(skinUrl, skinName){
  editorActive = true;
  $('searchContainer').classList.add('hidden');
  $('sentinel').classList.add('hidden');
  document.querySelectorAll('.card-3d-container').forEach(destroySkinViewer);

  $('content').innerHTML = `
    <div class="editor-wrap">
      <div class="editor-header">
        <h2>🎨 Редактор скинов ${skinName?`— ${esc(skinName)}`:''}</h2>
        <div class="editor-header-actions">
          <button class="btn" id="ed-save">💾 Скачать PNG</button>
          <button class="btn btn-secondary" id="ed-close">← Закрыть</button>
        </div>
      </div>
      <div class="editor-layout">
        <div class="editor-canvas-area">
          <div class="editor-mode-toggle">
            <button class="active" data-mode="3d">3D</button>
            <button data-mode="2d">Сетка</button>
          </div>
          <div id="ed-3d" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%"></div>
          <div id="ed-2d" style="display:none;padding:1rem;overflow:auto;max-height:520px;max-width:100%"></div>
        </div>
        <div class="editor-sidebar">
          <div class="editor-section">
            <div class="editor-section-title">Инструменты</div>
            <div class="editor-tools">
              <button class="editor-tool active" data-tool="pencil" title="Карандаш">✏️</button>
              <button class="editor-tool" data-tool="eraser" title="Ластик">🧹</button>
              <button class="editor-tool" data-tool="fill" title="Заливка">🪣</button>
              <button class="editor-tool" data-tool="picker" title="Пипетка">🎯</button>
            </div>
          </div>
          <div class="editor-section">
            <div class="editor-section-title">Цвет</div>
            <div class="editor-color-row">
              <input type="color" id="ed-color" value="#38BDF8">
              <span style="color:var(--tdim);font-size:.85rem" id="ed-color-label">#38BDF8</span>
            </div>
            <div class="skin-palette" id="ed-palette" style="margin-top:.75rem"></div>
          </div>
          <div class="editor-section">
            <div class="editor-section-title">Слой</div>
            <div class="editor-layer-row">
              <button class="editor-layer-btn active" data-layer="base">Базовый</button>
              <button class="editor-layer-btn" data-layer="overlay">Оверлей</button>
            </div>
          </div>
          <div class="editor-section">
            <div class="editor-section-title">История</div>
            <div class="editor-action-row">
              <button class="btn btn-secondary" id="ed-undo">↶ Отмена</button>
              <button class="btn btn-secondary" id="ed-redo">↷ Повтор</button>
            </div>
          </div>
          <div class="editor-section">
            <div class="editor-section-title">Действия</div>
            <div class="editor-action-row" style="flex-direction:column">
              <button class="btn btn-secondary" id="ed-upload">📁 Загрузить PNG</button>
              <button class="btn btn-secondary" id="ed-blank">⬜ Чистое тело</button>
              <button class="btn btn-secondary" id="ed-steve">👕 Steve</button>
            </div>
          </div>
          <p class="editor-hint" style="color:var(--tdim);font-size:.8rem;line-height:1.5">
            Рисуй прямо на 3D-модели — клик по руке красит пиксель руки.
            Переключись на «Сетку», чтобы редактировать плоскую развёртку 64×64.
          </p>
        </div>
      </div>
      <input type="file" id="ed-file" accept="image/png" hidden>
    </div>`;

  // === Состояние редактора ===
  const baseCanvas = document.createElement('canvas');
  baseCanvas.width = SKIN_SIZE; baseCanvas.height = SKIN_SIZE;
  const baseCtx = baseCanvas.getContext('2d');
  baseCtx.imageSmoothingEnabled = false;

  const overlayCanvas = document.createElement('canvas');
  overlayCanvas.width = SKIN_SIZE; overlayCanvas.height = SKIN_SIZE;
  const overlayCtx = overlayCanvas.getContext('2d');
  overlayCtx.imageSmoothingEnabled = false;

  editorState = {
    baseCanvas, baseCtx,
    overlayCanvas, overlayCtx,
    activeLayer: 'base',
    tool: 'pencil',
    color: '#38BDF8',
    drawing: false,
    history: [],
    historyIdx: -1,
    viewer: null,
    flatCanvas: null,
    flatCtx: null,
    lastTexel: null
  };

  // Палитра
  const palette = [
    '#000000','#3F3F3F','#7F7F7F','#BFBFBF','#FFFFFF',
    '#7F0000','#FF0000','#FF7F00','#FFBF00','#FFFF00',
    '#007F00','#00FF00','#00FF7F','#00FFFF','#007FFF',
    '#0000FF','#7F00FF','#FF00FF','#FF007F','#7F3F00',
    '#D2B48C','#8B4513','#F5DEB3','#FFE4B5','#FFD700',
    '#38BDF8','#6EE7B7','#A78BFA','#F472B6','#FB923C',
    '#1E3A5F','#0F131C','#161D2B','#1E2636','#05070C',
    '#10B981','#EF4444','#F59E0B','#8B5CF6','#EC4899'
  ];
  const palEl = $('ed-palette');
  palette.forEach(c=>{
    const b = document.createElement('button');
    b.style.background = c;
    b.type = 'button';
    b.addEventListener('click', ()=>{
      setColor(c);
      palEl.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    });
    palEl.appendChild(b);
  });

  function setColor(c){
    editorState.color = c;
    $('ed-color').value = c;
    $('ed-color-label').textContent = c;
  }

  $('ed-color').addEventListener('input', e=>{
    setColor(e.target.value);
    palEl.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
  });

  document.querySelectorAll('[data-tool]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editorState.tool = btn.dataset.tool;
      document.querySelectorAll('[data-tool]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  document.querySelectorAll('[data-layer]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editorState.activeLayer = btn.dataset.layer;
      document.querySelectorAll('[data-layer]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  // === Инициализация 3D-модели в редакторе ===
  const ed3d = $('ed-3d');
  const viewer = new skinview3d.SkinViewer({
    canvas: document.createElement('canvas'),
    width: 460, height: 520,
    skin: skinUrl || 'https://minotar.net/skin/Steve',
    background: 'transparent'
  });
  viewer.controls.enableZoom = true;
  viewer.controls.enableRotate = true;
  viewer.controls.autoRotate = false;
  viewer.animation = new skinview3d.WalkingAnimation();
  viewer.animation.paused = true;
  viewer.camera.position.z = 70;
  viewer.fov = 45;
  ed3d.appendChild(viewer.canvas);
  editorState.viewer = viewer;

  // Загружаем стартовый скин в оба канваса
  await loadStarterSkin(skinUrl || 'https://minotar.net/skin/Steve');

  // === 2D-развёртка ===
  function renderFlat(){
    const flat = $('ed-2d');
    flat.innerHTML = '';
    const canvas = document.createElement('canvas');
    canvas.width = SKIN_SIZE * 8;
    canvas.height = SKIN_SIZE * 8;
    canvas.className = 'editor-flat-canvas';
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(editorState.baseCanvas, 0, 0, canvas.width, canvas.height);
    // Оверлей полупрозрачно
    ctx.globalAlpha = 0.6;
    ctx.drawImage(editorState.overlayCanvas, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
    flat.appendChild(canvas);
    editorState.flatCanvas = canvas;
    editorState.flatCtx = ctx;

    canvas.addEventListener('mousedown', e=>{
      editorState.drawing = true;
      handleFlatDraw(e.clientX, e.clientY);
    });
    canvas.addEventListener('mousemove', e=>{
      if(editorState.drawing) handleFlatDraw(e.clientX, e.clientY);
    });
    canvas.addEventListener('mouseup', ()=>{if(editorState.drawing){editorState.drawing=false;pushHistory()}});
    canvas.addEventListener('mouseleave', ()=>{if(editorState.drawing){editorState.drawing=false;pushHistory()}});
  }

  function handleFlatDraw(clientX, clientY){
    const canvas = editorState.flatCanvas;
    const rect = canvas.getBoundingClientRect();
    const px = Math.floor((clientX - rect.left) * (SKIN_SIZE / rect.width));
    const py = Math.floor((clientY - rect.top) * (SKIN_SIZE / rect.height));
    if(px < 0 || py < 0 || px >= SKIN_SIZE || py >= SKIN_SIZE) return;
    paintTexel(px, py);
    renderFlat();
  }

  // === 3D-рисование через UV-raycast ===
  // Упрощённый подход: используем 2D-развёртку как основу,
  // а 3D-модель служит превью. Для клика по 3D — конвертируем
  // экранные координаты через Three.js Raycaster.
  let raycaster = null, mouseVec = null;
  if(typeof THREE !== 'undefined'){
    raycaster = new THREE.Raycaster();
    mouseVec = new THREE.Vector2();
  }

  viewer.canvas.addEventListener('mousedown', e=>{
    if(!raycaster || !mouseVec) return;
    editorState.drawing = true;
    handle3DDraw(e);
  });
  viewer.canvas.addEventListener('mousemove', e=>{
    if(editorState.drawing) handle3DDraw(e);
  });
  viewer.canvas.addEventListener('mouseup', ()=>{if(editorState.drawing){editorState.drawing=false;pushHistory();refresh3D()}});
  viewer.canvas.addEventListener('mouseleave', ()=>{if(editorState.drawing){editorState.drawing=false;pushHistory();refresh3D()}});

  function handle3DDraw(e){
    const canvas = viewer.canvas;
    const rect = canvas.getBoundingClientRect();
    mouseVec.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouseVec.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseVec, viewer.camera);
    const hits = raycaster.intersectObject(viewer.playerObject, true);
    if(!hits.length) return;
    const hit = hits[0];
    if(!hit.uv) return;
    const px = Math.floor(hit.uv.x * SKIN_SIZE);
    const py = Math.floor((1 - hit.uv.y) * SKIN_SIZE);
    if(px < 0 || py < 0 || px >= SKIN_SIZE || py >= SKIN_SIZE) return;
    paintTexel(px, py);
    refresh3D();
  }

  function refresh3D(){
    // Объединяем base + overlay в один PNG и загружаем в viewer
    const merged = document.createElement('canvas');
    merged.width = SKIN_SIZE; merged.height = SKIN_SIZE;
    const mctx = merged.getContext('2d');
    mctx.imageSmoothingEnabled = false;
    mctx.drawImage(editorState.baseCanvas, 0, 0);
    mctx.drawImage(editorState.overlayCanvas, 0, 0);
    const dataUrl = merged.toDataURL('image/png');
    viewer.loadSkin(dataUrl).catch(()=>{});
  }

  function paintTexel(px, py){
    const ctx = editorState.activeLayer === 'base' ? editorState.baseCtx : editorState.overlayCtx;
    const canvas = editorState.activeLayer === 'base' ? editorState.baseCanvas : editorState.overlayCanvas;
    if(editorState.tool === 'fill'){
      floodFill(canvas, ctx, px, py, editorState.color);
    } else if(editorState.tool === 'picker'){
      const data = ctx.getImageData(px, py, 1, 1).data;
      const hex = '#' + [data[0],data[1],data[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
      setColor(hex);
    } else if(editorState.tool === 'eraser'){
      ctx.clearRect(px, py, 1, 1);
    } else {
      ctx.fillStyle = editorState.color;
      ctx.fillRect(px, py, 1, 1);
    }
  }

  function floodFill(canvas, ctx, sx, sy, color){
    const img = ctx.getImageData(0, 0, SKIN_SIZE, SKIN_SIZE);
    const data = img.data;
    const idx = (sy * SKIN_SIZE + sx) * 4;
    const target = [data[idx], data[idx+1], data[idx+2], data[idx+3]];
    const fill = hexToRgbA(color);
    if(target[0]===fill[0] && target[1]===fill[1] && target[2]===fill[2] && target[3]===fill[3]) return;
    const stack = [[sx,sy]], visited = new Set();
    while(stack.length){
      const [x,y] = stack.pop();
      if(x<0||y<0||x>=SKIN_SIZE||y>=SKIN_SIZE) continue;
      const k = x+','+y;
      if(visited.has(k)) continue;
      visited.add(k);
      const i = (y * SKIN_SIZE + x) * 4;
      if(data[i]!==target[0]||data[i+1]!==target[1]||data[i+2]!==target[2]||data[i+3]!==target[3]) continue;
      data[i]=fill[0]; data[i+1]=fill[1]; data[i+2]=fill[2]; data[i+3]=fill[3];
      stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
    ctx.putImageData(img, 0, 0);
  }

  function hexToRgbA(hex){
    return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16),255];
  }

  async function loadStarterSkin(url){
    return new Promise((resolve)=>{
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = ()=>{
        // Сначала очищаем оба слоя
        baseCtx.clearRect(0, 0, SKIN_SIZE, SKIN_SIZE);
        overlayCtx.clearRect(0, 0, SKIN_SIZE, SKIN_SIZE);
        // Рисуем скин в base (для 64x64 всё что есть)
        baseCtx.drawImage(img, 0, 0, SKIN_SIZE, SKIN_SIZE);
        // Оверлей: копируем только прозрачные/вторые слои по стандарту
        // Упрощённо: всё после первого слоя оставляем в base, оверлей пустой.
        // Настоящий парсер скинов сложен, поэтому оверлей пользователь рисует сам.
        pushHistory();
        refresh3D();
        renderFlat();
        resolve();
      };
      img.onerror = ()=>{
        // Чистое тело: заливаем базовые цвета
        baseCtx.clearRect(0, 0, SKIN_SIZE, SKIN_SIZE);
        overlayCtx.clearRect(0, 0, SKIN_SIZE, SKIN_SIZE);
        pushHistory();
        refresh3D();
        renderFlat();
        resolve();
      };
      img.src = url;
    });
  }

  function pushHistory(){
    const s = editorState;
    const snapshot = {
      base: s.baseCanvas.toDataURL(),
      overlay: s.overlayCanvas.toDataURL()
    };
    s.history = s.history.slice(0, s.historyIdx + 1);
    s.history.push(snapshot);
    s.historyIdx++;
    if(s.history.length > 30){s.history.shift();s.historyIdx--}
  }

  function restoreFromSnapshot(snap){
    return new Promise(resolve=>{
      let loaded = 0;
      const done = ()=>{if(++loaded===2){refresh3D();renderFlat();resolve()}};
      const b = new Image(); b.onload = ()=>{baseCtx.clearRect(0,0,SKIN_SIZE,SKIN_SIZE);baseCtx.drawImage(b,0,0,SKIN_SIZE,SKIN_SIZE);done()};
      b.onerror = done;
      b.src = snap.base;
      const o = new Image(); o.onload = ()=>{overlayCtx.clearRect(0,0,SKIN_SIZE,SKIN_SIZE);overlayCtx.drawImage(o,0,0,SKIN_SIZE,SKIN_SIZE);done()};
      o.onerror = done;
      o.src = snap.overlay;
    });
  }

  // === Кнопки ===
  $('ed-undo').addEventListener('click', async ()=>{
    if(editorState.historyIdx <= 0) return;
    editorState.historyIdx--;
    await restoreFromSnapshot(editorState.history[editorState.historyIdx]);
  });
  $('ed-redo').addEventListener('click', async ()=>{
    if(editorState.historyIdx >= editorState.history.length - 1) return;
    editorState.historyIdx++;
    await restoreFromSnapshot(editorState.history[editorState.historyIdx]);
  });

  $('ed-save').addEventListener('click', ()=>{
    const merged = document.createElement('canvas');
    merged.width = SKIN_SIZE; merged.height = SKIN_SIZE;
    const mctx = merged.getContext('2d');
    mctx.imageSmoothingEnabled = false;
    mctx.drawImage(editorState.baseCanvas, 0, 0);
    mctx.drawImage(editorState.overlayCanvas, 0, 0);
    const a = document.createElement('a');
    a.download = 'my-skin.png';
    a.href = merged.toDataURL('image/png');
    a.click();
    toast('Скин скачан','ok');
  });

  $('ed-upload').addEventListener('click', ()=>$('ed-file').click());
  $('ed-file').addEventListener('change', async e=>{
    const file = e.target.files[0]; if(!file) return;
    const url = URL.createObjectURL(file);
    await loadStarterSkin(url);
    URL.revokeObjectURL(url);
    toast('Скин загружен','ok');
  });

  $('ed-blank').addEventListener('click', ()=>{
    baseCtx.clearRect(0, 0, SKIN_SIZE, SKIN_SIZE);
    overlayCtx.clearRect(0, 0, SKIN_SIZE, SKIN_SIZE);
    pushHistory();
    refresh3D();
    renderFlat();
    toast('Чистое тело','info');
  });

  $('ed-steve').addEventListener('click', async ()=>{
    await loadStarterSkin('https://minotar.net/skin/Steve');
    toast('Загружен Steve','ok');
  });

  // Переключение 3D/2D
  document.querySelectorAll('[data-mode]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const mode = btn.dataset.mode;
      document.querySelectorAll('[data-mode]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      $('ed-3d').style.display = mode === '3d' ? 'flex' : 'none';
      $('ed-2d').style.display = mode === '2d' ? 'block' : 'none';
      if(mode === '2d') renderFlat();
      else refresh3D();
    });
  });

  $('ed-close').addEventListener('click', ()=>{
    editorActive = false;
    if(editorState?.viewer){
      try{editorState.viewer.renderer.setAnimationLoop(null);editorState.viewer.dispose()}catch{}
    }
    editorState = null;
    document.querySelectorAll('.tab').forEach(t=>{
      if(t.classList.contains('active')) t.click();
    });
  });
}

/* === СТАРТ === */
initThemes();
io.observe(sentinel);
resetAndLoad();
