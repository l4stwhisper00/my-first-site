<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Каталог модов Minecraft</title> <style> :root { --bg-deep: #05070C; --bg-base: #0A0D12; --bg-raised: #0F131C; --bg-overlay: #161D2B; --bg-elevated: #1E2636; --accent: #38BDF8; --accent-hover: #0EA5E9; --accent-dim: #1E3A52; --text-primary: #E8EDF4; --text-secondary: #8B95A8; --border: #1E2636;
  --space-xs: 8px;
  --space-sm: 12px;
  --space-md: 20px;
  --space-lg: 32px;
  --space-xl: 48px;
  
  --radius-md: 12px;
  --radius-lg: 16px;
  
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font-sans);
  line-height: 1.6;
  padding: var(--space-lg) var(--space-md);
}

.container {
  max-width: 1600px;
  margin: 0 auto;
}

header {
  margin-bottom: var(--space-xl);
}

h1 {
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-bottom: var(--space-sm);
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.subtitle {
  font-size: clamp(1rem, 2vw, 1.125rem);
  color: var(--text-secondary);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: var(--space-md);
}

.card {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  aspect-ratio: 1;
  position: relative;
  overflow: hidden;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 0%, var(--accent-dim) 100%);
  opacity: 0;
  transition: opacity 0.25s;
}

.card:hover {
  border-color: var(--accent);
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(56, 189, 248, 0.15);
}

.card:hover::before {
  opacity: 0.1;
}

@media (min-width: 1400px) {
  .grid {
    grid-template-columns: repeat(6, 1fr);
  }
}

@media (max-width: 768px) {
  body {
    padding: var(--space-md) var(--space-sm);
  }
  
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: var(--space-sm);
  }
}
</style> </head> <body> <div class="container"> <header> <h1>Каталог модов Minecraft</h1> <p class="subtitle">Коллекция лучших модификаций для всех версий игры</p> </header>
